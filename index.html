<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>영상 퀴즈 — 실시간 진행 도구</title>
<style>
/* ══════════════════════════════════════════════════════════
   기본 / 토큰
   ══════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
:root {
  --bg:        #f4f5f8;
  --panel:     #ffffff;
  --line:      #e2e5ec;
  --line-2:    #cfd4de;
  --ink:       #1c2030;
  --ink-2:     #5a6276;
  --ink-3:     #8b93a5;
  --accent:    #4338ca;
  --accent-2:  #eef0ff;
  --ok:        #0f8a4d;
  --ok-bg:     #e6f6ed;
  --bad:       #c62828;
  --bad-bg:    #fdeaea;
  --warn:      #b26a00;
  --warn-bg:   #fff4e0;
  --radius:    12px;
  --shadow:    0 1px 2px rgba(20,25,45,.06), 0 6px 20px rgba(20,25,45,.07);
}
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI",
               "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -.02em; }
p { margin: 0 0 .6em; }
a { color: var(--accent); }

/* ══════════════════════════════════════════════════════════
   레이아웃
   ══════════════════════════════════════════════════════════ */
.wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 80px; }
.wrap.wide { max-width: 1400px; }
.wrap.editor-wide { max-width: 1680px; padding-left: 20px; padding-right: 20px; }
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; background: var(--panel);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 50;
}
.topbar .brand {
  font-weight: 800; font-size: 15px; letter-spacing: -.03em;
  color: var(--ink); text-decoration: none; white-space: nowrap;
}
.topbar .brand span { color: var(--accent); }
.topbar .spacer { flex: 1; }
.topbar .auth-user { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); font-size: 13px; }
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.overlay { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:12px; background:rgba(10,15,30,.48); }
.card > h2 { font-size: 17px; margin-bottom: 4px; }
.card > .sub { color: var(--ink-2); font-size: 13px; margin-bottom: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { min-width: 0; }
.col { flex: 1 1 220px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }

/* ══════════════════════════════════════════════════════════
   폼
   ══════════════════════════════════════════════════════════ */
label.f { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; }
input[type=text], input[type=number], input[type=password], input[type=date], select, textarea {
  width: 100%; padding: 10px 12px; font: inherit; font-size: 15px;
  border: 1px solid var(--line-2); border-radius: 9px;
  background: #fff; color: var(--ink); outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-2); }
textarea { resize: vertical; min-height: 62px; }
.field { margin-bottom: 14px; }
.hint { font-size: 12px; color: var(--ink-3); margin-top: 5px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 16px; font: inherit; font-size: 14px; font-weight: 600;
  border: 1px solid var(--line-2); border-radius: 9px;
  background: #fff; color: var(--ink); cursor: pointer;
  transition: background .12s, border-color .12s;
}
.btn:hover { background: #f7f8fb; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #372cb0; }
.btn.danger { color: var(--bad); border-color: #f0c5c5; }
.btn.danger:hover { background: var(--bad-bg); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: #eceef4; }
.btn.sm { padding: 6px 11px; font-size: 13px; }
.btn.lg { padding: 15px 28px; font-size: 17px; border-radius: 11px; }
.btn.block { width: 100%; }

/* ══════════════════════════════════════════════════════════
   공용 조각
   ══════════════════════════════════════════════════════════ */
.tag {
  display: inline-block; padding: 2px 9px; border-radius: 999px;
  font-size: 12px; font-weight: 700; background: var(--accent-2); color: var(--accent);
}
.tag.ok   { background: var(--ok-bg);   color: var(--ok); }
.tag.bad  { background: var(--bad-bg);  color: var(--bad); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.mute { background: #eceef4; color: var(--ink-2); }
.empty { text-align: center; color: var(--ink-3); padding: 36px 16px; font-size: 14px; }
.notice {
  background: var(--warn-bg); border: 1px solid #f0dcb4; color: #7a4a00;
  border-radius: 10px; padding: 12px 14px; font-size: 13px; margin-bottom: 16px;
}
.notice.info { background: var(--accent-2); border-color: #d4d8ff; color: #2f2a86; }
.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }

#toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
  background: #1c2030; color: #fff; padding: 11px 20px; border-radius: 999px;
  font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .18s; z-index: 9999; max-width: 90vw;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

#conn-banner {
  position: fixed; left: 0; right: 0; top: 0; z-index: 9998;
  background: #b3261e; color: #fff; padding: 10px 16px;
  font-size: 13.5px; line-height: 1.5; text-align: center;
}

/* ══════════════════════════════════════════════════════════
   홈
   ══════════════════════════════════════════════════════════ */
.home-hero { text-align: center; padding: 44px 0 30px; }
.home-hero h1 { font-size: 30px; margin-bottom: 8px; }
.home-hero p { color: var(--ink-2); font-size: 15px; }
.home-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1199px) {
  .home-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 700px) {
  .home-cards { grid-template-columns: 1fr; }
}
.home-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 22px; text-decoration: none; color: inherit; display: block;
  box-shadow: var(--shadow); transition: transform .12s, border-color .12s;
}
.home-card:hover { transform: translateY(-2px); border-color: var(--accent); }
.home-card .ico { font-size: 26px; margin-bottom: 10px; }
.home-card h3 { font-size: 16px; margin-bottom: 5px; }
.home-card p { font-size: 13px; color: var(--ink-2); margin: 0; }
.teacher-dashboard { margin-top: 20px; }
.teacher-dashboard h2 { margin-bottom: 4px; font-size: 20px; }
.teacher-dashboard .summary { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.teacher-dashboard .summary span { padding: 7px 10px; border-radius: 999px; background: var(--accent-2); color: var(--accent); font-size: 13px; font-weight: 750; }
.teacher-dashboard .summary .caution { background: #fff4cf; color: #885b00; }
.teacher-dashboard .summary .crowded { background: var(--bad-bg); color: var(--bad); }
.teacher-dashboard .plan-list { display: grid; gap: 8px; }
.teacher-dashboard .plan-row { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 9px; }
.teacher-dashboard .plan-row .time, .teacher-dashboard .plan-row .counts { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.teacher-dashboard .plan-row .name { min-width: 0; font-size: 14px; font-weight: 750; overflow-wrap: anywhere; }
.teacher-dashboard .plan-row .admin-identity { display: block; margin-top: 2px; color: var(--ink-2); font-size: 12px; font-weight: 500; }
@media (max-width: 560px) { .teacher-dashboard .plan-row { grid-template-columns: 1fr auto; } .teacher-dashboard .plan-row .time { grid-column: 1 / -1; } }

/* ══════════════════════════════════════════════════════════
   세트 제작
   ══════════════════════════════════════════════════════════ */
.q-card {
  border: 1px solid var(--line); border-radius: 11px; padding: 15px;
  margin-bottom: 12px; background: #fbfbfd;
}
.q-card .q-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.q-card .q-no {
  width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff;
  display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none;
}
.q-card .q-head .spacer { flex: 1; }
.choice-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.choice-row input[type=radio] { width: 20px; height: 20px; flex: none; accent-color: var(--accent); }
.choice-row .cno { width: 20px; text-align: center; color: var(--ink-3); font-size: 13px; font-weight: 700; flex: none; }
.choice-row .btn { flex: none; }
.choice-drag-handle[draggable="true"] { cursor: grab; }
.choice-drag-handle[draggable="true"]:active { cursor: grabbing; }
.choice-row.choice-drop-target { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.choice-drag-handle { color: var(--ink-3); font-weight: 800; cursor: grab; user-select: none; }
.time-input { width: 110px !important; }
.mk-explanation-time-grid { grid-template-columns: minmax(0, 1fr) 160px; }
.mk-explanation-time-grid > .field { margin-bottom: 0; display: flex; flex-direction: column; }
.mk-explanation-time-grid > .field > .f { min-height: 44px; display: flex; align-items: flex-end; }
.q-card .q-head > .time-input, .q-card .q-head > .btn { height: 42px; }
.q-card .q-head > .time-input { padding-top: 8px; padding-bottom: 8px; }
.mk-explanation-panel { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: #f8f8ff; }
.mk-explanation-panel .img-box img { max-height: 180px; }
@media (max-width: 700px) {
  .mk-explanation-time-grid { grid-template-columns: 1fr; }
}

/* 숫자 칸 옆에 단위를 붙여 초/분 헷갈리지 않게 */
.unit-wrap { display: flex; align-items: center; gap: 7px; }
.unit-wrap input { flex: 1; min-width: 0; }
.unit-wrap .unit { flex: none; font-size: 14px; font-weight: 700; color: var(--ink-2); }

/* 문항 이미지 */
.img-box { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.img-box img { max-width: 240px; max-height: 150px; border-radius: 8px; border: 1px solid var(--line); display: block; }
.img-box .img-bad { color: var(--bad); font-size: 13px; }
.q-img { max-width: 100%; max-height: 260px; border-radius: 10px; display: block; margin: 0 auto 14px; }
#overlay .q-img { max-height: 34vh; margin-bottom: 18px; }
.stu-q-img { max-width: 100%; max-height: 220px; border-radius: 10px; display: block; margin: 0 auto 14px; }

/* 학생 입력형 문항 */
.stu-text-input { width: 100%; font-size: 17px; padding: 14px; }
.stu-answer-box {
  background: var(--accent-2); border: 1px solid #d4d8ff; border-radius: 10px;
  padding: 12px 14px; font-size: 15px; margin-bottom: 12px; word-break: break-word; white-space: pre-wrap;
}
.txt-answer {
  background: #fbfbfd; border: 1px solid var(--line); border-radius: 9px;
  padding: 9px 12px; margin-bottom: 7px; font-size: 13.5px; white-space: pre-wrap; word-break: break-word;
}
.txt-answer .who { font-weight: 700; color: var(--ink-2); font-size: 12.5px; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
.txt-answer .who .spacer { flex: 1; }
.tag.qtype { background: #eef6ff; color: #1d4ed8; }

/* ── 실시간 순위표 ─────────────────────────────────────────────────── */
.rank-row {
  display: flex; align-items: center; gap: 9px; padding: 5px 7px;
  border-radius: 7px; font-size: 13px;
}
.rank-row + .rank-row { margin-top: 2px; }
.rank-row .rk {
  width: 22px; height: 22px; border-radius: 6px; background: #eceef4; color: var(--ink-2);
  display: grid; place-items: center; font-size: 11px; font-weight: 800; flex: none;
}
.rank-row.top1 .rk { background: #f5c518; color: #4a3600; }
.rank-row.top2 .rk { background: #cfd4de; color: #3a3f4c; }
.rank-row.top3 .rk { background: #e0a06a; color: #4a2a00; }
.rank-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-row .sc { font-weight: 800; color: var(--accent); flex: none; font-variant-numeric: tabular-nums; }
.rank-row .prog { flex: none; font-size: 11px; color: var(--ink-3); }

#board-overlay {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(64vw, 960px); max-height: calc(100% - 144px); box-sizing: border-box;
  background: rgba(18,22,42,.96); border: 1px solid rgba(255,255,255,.15); border-radius: 22px;
  box-shadow: 0 24px 80px rgba(0,0,0,.5); z-index: 200; padding: 28px; overflow-y: auto;
}
#board-overlay .bo-inner { width: 100%; margin: 0 auto; color: #fff; }
#board-overlay h2 { font-size: clamp(24px, 3.2vw, 40px); margin-bottom: 6px; }
#board-overlay .bo-sub { color: rgba(255,255,255,.6); font-size: 15px; margin-bottom: 22px; }
#board-overlay .bo-list { display: grid; gap: 8px; }
#board-overlay .bo-row {
  display: flex; align-items: center; gap: 16px;
  padding: 12px 18px; border-radius: 12px; background: rgba(255,255,255,.07);
  font-size: clamp(16px, 1.9vw, 24px); font-weight: 700;
}
#board-overlay .bo-row .rk {
  width: 44px; height: 44px; border-radius: 11px; background: rgba(255,255,255,.14);
  display: grid; place-items: center; font-size: 19px; font-weight: 800; flex: none;
}
#board-overlay .bo-row.top1 { background: rgba(245,197,24,.2); }
#board-overlay .bo-row.top1 .rk { background: #f5c518; color: #4a3600; }
#board-overlay .bo-row.top2 .rk { background: #cfd4de; color: #3a3f4c; }
#board-overlay .bo-row.top3 .rk { background: #e0a06a; color: #4a2a00; }
#board-overlay .bo-row .who { flex: 1; }
#board-overlay .bo-row .no { font-size: .7em; opacity: .6; font-weight: 600; margin-right: 8px; }
#board-overlay .bo-row .sc { flex: none; }
#board-overlay .bo-row .sc small { opacity: .55; font-size: .6em; font-weight: 600; }

/* 학생 개인 진행 현황 */
.stu-mystat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0 4px; }
.stu-mystat .box {
  background: #fff; border: 1px solid var(--line); border-radius: 11px; padding: 11px 8px; text-align: center;
}
.stu-mystat .box .k { font-size: 11.5px; color: var(--ink-2); font-weight: 600; }
.stu-mystat .box .v { font-size: 24px; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; }
.stu-mystat .box .v small { font-size: 13px; font-weight: 700; color: var(--ink-3); }
.stu-mystat .box.ok .v { color: var(--ok); }
.stu-mystat .box.rank .v { color: var(--accent); }

/* 제작 화면 — 영상별 카드가 위에서 아래로 이어진다. */
.mk-video-list { display: grid; gap: 18px; }
.mk-video-card { border: 2px solid transparent; }
.mk-video-card.active { border-color: var(--accent); }
.mk-video-head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.mk-video-head h2 { margin: 0; flex: 1 1 180px; }
.mk-video-body { display: grid; grid-template-columns: minmax(480px, 1fr) minmax(640px, 1.25fr); gap: 24px; align-items: start; }
.mk-video-left { position: sticky; top: 68px; max-height: calc(100vh - 88px); overflow: auto; min-width: 0; padding-right: 4px; }
.mk-video-preview { min-width: 0; }
.mk-question-navigator { position: static; max-height: none; overflow: visible; margin-top: 18px; padding: 14px; border: 1px solid var(--line); border-radius: 11px; background: #f8f8ff; }
.mk-question-navigator h3 { margin-bottom: 4px; }
.mk-question-editor { min-width: 0; }
.mk-question-editor .q-card { padding: 20px; margin-bottom: 16px; background: #fff; }
.mk-question-editor .q-head { flex-wrap: wrap; row-gap: 7px; }
.mk-question-editor textarea { min-height: 92px; font-size: 15px; line-height: 1.55; }
.mk-question-editor textarea.mk-question-text { min-height: 50px; height: 50px; max-height: 160px; }
.mk-question-editor .choice-row input[type="text"] { min-height: 44px; font-size: 15px; }
.mk-range-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mk-range-track { position: relative; height: 42px; margin: 4px 8px 10px; }
.mk-range-track::before { content: ''; position: absolute; left: 0; right: 0; top: 19px; height: 5px; border-radius: 4px; background: #dfe2ea; }
.mk-range-track input[type=range] { position: absolute; inset: 5px 0 auto; width: 100%; height: 30px; padding: 0; background: transparent; pointer-events: none; }
.mk-range-track input[type=range]::-webkit-slider-thumb { pointer-events: auto; }
.mk-range-track input[type=range]::-moz-range-thumb { pointer-events: auto; }
.mk-timeline { position: relative; height: 38px; margin: 0 8px 16px; border-radius: 8px; background: var(--accent-2); border: 1px solid #d4d8ff; }
.mk-timeline::before { content: ''; position: absolute; left: 8px; right: 8px; top: 18px; height: 2px; background: #b7bef7; }
.mk-q-dot { position: absolute; top: 8px; transform: translateX(-50%); width: 20px; height: 20px; border: 2px solid #fff; border-radius: 50%; background: var(--accent); color: #fff; padding: 0; font-size: 10px; font-weight: 800; cursor: ew-resize; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
.mk-question-bubbles { display: grid; gap: 6px; margin: 0 0 14px; }
.mk-question-bubble { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; padding: 7px 9px; border: 1px solid #d4d8ff; border-radius: 9px; background: #fff; color: var(--ink); cursor: grab; text-align: left; }
.mk-question-bubble:active { cursor: grabbing; }
.mk-question-bubble.drop-target { border-color: var(--accent); background: var(--accent-2); }
.mk-question-bubble b { display: grid; place-items: center; width: 22px; height: 22px; flex: none; border-radius: 50%; background: var(--accent); color: #fff; font-size: 11px; }
.mk-question-bubble span { overflow: hidden; flex: 1; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 650; }
.mk-question-bubble time { flex: none; color: var(--ink-2); font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; }
.mk-question-dropzone { width: 100%; min-height: 34px; padding: 6px 10px; border: 1px dashed #b7bef7; border-radius: 9px; background: #f8f8ff; color: var(--ink-2); font-size: 12px; cursor: copy; }
.mk-question-dropzone.drop-target { border-color: var(--accent); background: var(--accent-2); color: var(--accent); font-weight: 700; }
.mk-question-move-tools { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.mk-save-toast { position: fixed; z-index: 9999; right: 20px; bottom: 20px; max-width: min(360px, calc(100vw - 40px)); padding: 10px 14px; border-radius: 10px; background: #1c2030; color: #fff; box-shadow: 0 8px 28px rgba(20,25,45,.24); font-size: 13px; font-weight: 700; opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity .16s, transform .16s; }
.mk-save-toast.show { opacity: 1; transform: translateY(0); }
.mk-add-video { border: 2px dashed var(--line); background: transparent; padding: 18px; }

@media (max-width: 1180px) {
  .mk-video-body { grid-template-columns: 1fr; }
  .mk-video-left { position: static; max-height: none; overflow: visible; padding-right: 0; }
  .mk-question-navigator { position: static; max-height: none; overflow: visible; }
}
.mk-question-preview-card { width: min(1040px, 94vw); max-height: 92vh; overflow: auto; padding: clamp(20px, 2.2vw, 30px); border-radius: 18px; background: #11162d; color: #fff; box-shadow: 0 24px 80px rgba(0,0,0,.38); }
.mk-question-preview-card .preview-top { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
.mk-question-preview-card .preview-q { font-size: clamp(21px, 2.2vw, 32px); font-weight: 800; line-height: 1.4; margin-bottom: 20px; }
.mk-question-preview-card .preview-choices { display:grid; gap:10px; }
.mk-question-preview-card .preview-choice { display:flex; gap:12px; align-items:center; padding:13px 16px; border:2px solid rgba(255,255,255,.22); border-radius:12px; background:rgba(255,255,255,.04); font-size:15px; line-height:1.45; }
.mk-question-preview-card .preview-choice b { display:grid; place-items:center; width:34px; height:34px; flex:none; border-radius:9px; background:rgba(255,255,255,.16); }
.mk-question-preview-card button.preview-choice { width:100%; color:inherit; text-align:left; cursor:pointer; }
.mk-question-preview-card .preview-choice.selected { border-color:#8b83ff; background:rgba(99,91,255,.22); }
.mk-question-preview-card .preview-choice.correct { border-color:#34d17f; background:rgba(52,209,127,.16); }
.mk-question-preview-card .preview-choice.wrong { border-color:#ff6b78; background:rgba(255,107,120,.14); }
.mk-question-preview-card .preview-result { margin-top:18px; padding:14px 16px; border-radius:12px; font-weight:800; }
.mk-question-preview-card .preview-result.ok { background:rgba(52,209,127,.16); color:#8ff0bb; }
.mk-question-preview-card .preview-result.bad { background:rgba(255,107,120,.14); color:#ffadb5; }
.mk-question-preview-card .preview-result.manual { background:rgba(255,255,255,.1); }
.mk-question-preview-card .preview-explanation { margin-top:12px; padding:14px 16px; border:1px solid rgba(255,210,80,.55); border-radius:12px; background:rgba(255,210,80,.1); }
.mk-question-preview-card .preview-explanation-img { display:block; max-width:100%; max-height:300px; object-fit:contain; margin:12px auto 0; border-radius:10px; }
.mk-question-preview-card textarea { min-height:110px; background:#fff; color:#1c2030; }
.mk-question-preview-card .preview-actions { display:flex; justify-content:flex-end; margin-top:22px; }
.mk-preview-shell { width:min(1500px, 97vw); max-height:94vh; overflow:auto; padding:16px; }
.mk-preview-grid { display:grid; grid-template-columns:minmax(0, 1.7fr) 390px; gap:16px; align-items:start; }
.mk-preview-pane { min-width:0; }
.mk-preview-pane-title { margin:0 0 8px; color:#fff; font-size:13px; font-weight:800; text-align:left; }
.mk-question-preview-card.teacher { width:100%; max-width:none; }
.mk-question-preview-card.mobile { width:390px; max-width:94vw; padding:18px; border-radius:24px; background:#f4f5f8; color:var(--ink); border:8px solid #202434; }
.mk-question-preview-card.mobile .preview-q { font-size:22px; line-height:1.4; }
.mk-question-preview-card.mobile .preview-choice { border-color:var(--line-2); background:#fff; padding:13px; font-size:15px; }
.mk-question-preview-card.mobile .preview-choice b { background:#eceef4; color:var(--ink); }
.mk-question-preview-card.mobile .preview-choice.selected { border-color:var(--accent); background:var(--accent-2); }
.mk-question-preview-card.mobile .preview-choice.correct { border-color:var(--ok); background:var(--ok-bg); }
.mk-question-preview-card.mobile .preview-choice.wrong { border-color:var(--bad); background:var(--bad-bg); }
.mk-question-preview-card.mobile .preview-explanation { color:#6b4c00; background:#fff8df; }
.mk-question-preview-card.mobile .preview-actions { position:sticky; bottom:-18px; padding:12px 0 4px; background:#f4f5f8; }
.mk-preview-close { display:flex; justify-content:flex-end; margin-top:12px; }
@media (max-width: 980px) {
  .mk-preview-grid { grid-template-columns:1fr; justify-items:center; }
  .mk-preview-pane { width:100%; }
  .mk-preview-pane.mobile-pane { width:min(390px, 100%); }
}

@keyframes qflash { 0%,100% { box-shadow: 0 0 0 0 rgba(67,56,202,0); } 30% { box-shadow: 0 0 0 4px rgba(67,56,202,.35); } }
.q-card.flash { animation: qflash 1s ease; }

.player-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; }
.player-box > div, .player-box iframe { width: 100%; height: 100%; border: 0; }

#pl-stage {
  position: relative;
  --quiz-max-w: min(920px, calc(100% - 32px));
  --quiz-safe-bottom: 128px;
  --quiz-max-h: calc(100% - var(--quiz-safe-bottom));
  --quiz-center-y: 50%;
  --quiz-actions-min-h: 56px;
}
#pl-stage .pl-stage-tools { display: none; }
#pl-stage .pl-stage-status {
  display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
  margin-top: 10px; color: var(--ink-2); font-size: 13px;
}
#pl-stage:fullscreen,
#pl-stage.fullscreen-fallback {
  width: 100vw; height: 100vh; box-sizing: border-box; padding: 20px;
  background: #000; color: #fff; display: grid;
  grid-template-rows: minmax(0, 1fr) auto auto auto;
  align-items: center; justify-items: center; gap: 10px;
}
#pl-stage.fullscreen-fallback { position: fixed; inset: 0; z-index: 1000; }
body.stage-fallback-open { overflow: hidden; }
#pl-stage:fullscreen .player-box,
#pl-stage.fullscreen-fallback .player-box {
  width: var(--pl-player-width, min(92vw, calc((100vh - 176px) * 16 / 9)));
  height: var(--pl-player-height, min(calc(92vw * 9 / 16), calc(100vh - 176px)));
  aspect-ratio: 16 / 9; margin: 0 auto; max-height: none; border-radius: 0; flex: none;
}
#pl-stage.quiz-open .player-box { filter: brightness(.42); }
#pl-stage.rank-open .player-box { filter: brightness(.42); }
#pl-stage:fullscreen .pl-stage-tools,
#pl-stage.fullscreen-fallback .pl-stage-tools {
  display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px;
  opacity: .38; transition: opacity .18s ease;
}
#pl-stage:fullscreen .pl-stage-status,
#pl-stage.fullscreen-fallback .pl-stage-status {
  display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px;
  margin-top: 0; color: rgba(255,255,255,.78); font-size: 14px;
}
#pl-stage:fullscreen .pl-stage-tools:hover,
#pl-stage:fullscreen .pl-stage-tools:focus-within,
#pl-stage:fullscreen.controls-active .pl-stage-tools,
#pl-stage.fullscreen-fallback .pl-stage-tools:hover,
#pl-stage.fullscreen-fallback .pl-stage-tools:focus-within,
#pl-stage.fullscreen-fallback.controls-active .pl-stage-tools { opacity: 1; }
#pl-stage:fullscreen .pl-stage-tools .btn,
#pl-stage.fullscreen-fallback .pl-stage-tools .btn {
  border-color: rgba(255,255,255,.32); background: rgba(18,22,36,.72); color: #fff;
}
#pl-stage.quiz-open .pl-stage-tools {
  position: fixed; top: 16px; left: 16px; right: 16px; z-index: 202;
}
#pl-stage.rank-open .pl-stage-tools {
  position: fixed; top: 16px; left: 16px; right: 16px; z-index: 202;
}
#pl-stage #pl-qr-bubble {
  position: absolute; right: 20px; top: 20px; z-index: 203; width: 180px; padding: 14px;
  border-radius: 12px; background: rgba(255,255,255,.96); color: #171927; text-align: center;
  box-shadow: 0 12px 36px rgba(0,0,0,.35);
}
#pl-stage .pl-qr-head {
  display: flex; align-items: center; justify-content: space-between; margin: -6px -6px 6px;
  padding: 6px; font-size: 13px; font-weight: 800; cursor: move; touch-action: none; user-select: none;
}
#pl-stage .pl-qr-head button {
  border: 0; background: transparent; color: #626779; font-size: 21px; line-height: 1; cursor: pointer;
}
#pl-stage #pl-qr-code { margin: 8px auto; width: 132px; min-height: 132px; }
#pl-stage #pl-qr-code img,
#pl-stage #pl-qr-code canvas { max-width: 100%; height: auto; }
#pl-stage #pl-qr-bubble strong { display: block; font-size: 27px; letter-spacing: .08em; }
#pl-stage .pl-qr-url { margin-top: 5px; color: #626779; font-size: 11px; overflow-wrap: anywhere; }
#pl-stage #pl-qr-count { margin-top: 8px; color: #626779; font-size: 12px; }

#pl-quiz-timeline {
  position: relative; width: 100%; box-sizing: border-box; margin-top: 10px; padding: 8px 10px 6px;
  border-radius: 10px; background: #171927; color: rgba(255,255,255,.82); z-index: 12;
}
.pl-timeline-track { position: relative; height: 18px; margin: 0 7px; }
.pl-timeline-rail,
.pl-timeline-progress { position: absolute; left: 0; top: 8px; height: 4px; border-radius: 999px; }
.pl-timeline-rail { width: 100%; background: rgba(255,255,255,.2); }
.pl-timeline-progress { width: 0; background: #7c83ff; }
.pl-timeline-markers { position: absolute; inset: 0; }
.pl-timeline-marker {
  position: absolute; top: 3px; width: 14px; height: 14px; padding: 0; transform: translateX(-50%);
  border: 2px solid #171927; border-radius: 50%; background: #f5c518; box-shadow: 0 0 0 1px rgba(255,255,255,.55);
}
.pl-timeline-marker.completed { background: #34d17f; }
.pl-timeline-marker.current { background: #fff; box-shadow: 0 0 0 3px rgba(124,131,255,.8); }
.pl-timeline-marker.upcoming { background: #f5c518; }
.pl-timeline-next { display: block; min-height: 16px; margin-top: 2px; font-size: 12px; text-align: center; }
.pl-timeline-announcement {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
#pl-stage:fullscreen #pl-quiz-timeline,
#pl-stage.fullscreen-fallback #pl-quiz-timeline {
  width: min(92vw, calc(92vh * 16 / 9)); margin-left: auto; margin-right: auto; flex: none;
}

/* ══════════════════════════════════════════════════════════
   교사 재생
   ══════════════════════════════════════════════════════════ */
.play-layout { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .play-layout { grid-template-columns: 1fr; } }

.code-panel { background: var(--accent); color: #fff; border-radius: var(--radius); padding: 18px; text-align: center; }
.code-panel .lbl { font-size: 12px; opacity: .8; font-weight: 600; letter-spacing: .06em; }
.code-panel .code {
  font-size: 44px; font-weight: 800; letter-spacing: .12em; line-height: 1.15;
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace; margin: 4px 0 8px;
}
.code-panel .url { font-size: 12px; opacity: .9; word-break: break-all; }
.code-panel .qr { background: #fff; padding: 8px; border-radius: 8px; display: inline-block; margin-top: 10px; line-height: 0; }

.qlist-item {
  display: flex; align-items: center; gap: 9px; padding: 9px 10px;
  border-radius: 9px; cursor: pointer; font-size: 13px; border: 1px solid transparent;
}
.qlist-item:hover { background: #f2f3f8; }
.qlist-item.done { color: var(--ink-3); }
.qlist-item.active { background: var(--accent-2); border-color: var(--accent); }
.qlist-item .t { font-family: ui-monospace, Consolas, monospace; font-weight: 700; color: var(--accent); flex: none; }
.qlist-item .x { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 교사 퀴즈 오버레이 */
#overlay {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(64vw, 960px); max-height: calc(100% - 144px); box-sizing: border-box;
  background: rgba(18,22,42,.96); border: 1px solid rgba(255,255,255,.15); border-radius: 22px;
  box-shadow: 0 24px 80px rgba(0,0,0,.5); z-index: 200; padding: 26px 30px; overflow-y: auto;
}
#pl-stage.quiz-open #overlay {
  position: absolute; left: 50%; top: var(--quiz-center-y); transform: translate(-50%, -50%);
}
#pl-stage #overlay {
  width: var(--quiz-max-w); max-height: var(--quiz-max-h); overflow: auto;
  overscroll-behavior: contain;
  display: flex; flex-direction: column;
}
#pl-stage #overlay .ov-inner {
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  flex: 1 1 auto; min-height: 0; max-height: 100%;
}
#pl-stage #overlay .quiz-body {
  min-height: 0; overflow: auto; overscroll-behavior: contain; padding-right: 3px;
}
#pl-stage #overlay .ov-top,
#pl-stage #overlay .ov-actions { flex: none; }
#pl-stage #overlay .ov-actions {
  min-height: var(--quiz-actions-min-h); margin-bottom: 0; padding-top: 16px;
  background: rgba(18,22,42,.96); position: relative; z-index: 1;
}
#pl-stage #overlay .ov-q { font-size: clamp(20px, 3.4vw, 38px); }
#pl-stage #overlay .q-img { max-height: min(34vh, 260px); }
/* iframe을 옮기거나 다시 만들지 않고 같은 영상 위에 중앙 카드를 겹친다. */
@media (max-width: 900px) {
  #pl-stage:fullscreen .player-box,
  #pl-stage.fullscreen-fallback .player-box {
    width: var(--pl-player-width, min(92vw, calc((100vh - 252px) * 16 / 9)));
    height: var(--pl-player-height, min(calc(92vw * 9 / 16), calc(100vh - 252px)));
  }
  #pl-stage #overlay { border-radius: 16px; padding: 20px; }
  #pl-stage.rank-open #board-overlay { width: calc(100% - 32px); }
}
#pl-stage.pl-layout-ultra #overlay { overflow: auto; padding: 10px; }
#pl-stage.pl-layout-ultra #overlay .ov-top { gap: 7px; margin-bottom: 8px; font-size: 12px; }
#pl-stage.pl-layout-ultra #overlay .ov-q { font-size: 18px; margin-bottom: 10px; }
#pl-stage.pl-layout-ultra #overlay .ov-actions {
  position: sticky; bottom: 0; gap: 6px; padding-top: 8px;
}
#pl-stage.pl-layout-ultra #overlay .ov-actions .btn { padding: 8px 10px; font-size: 13px; }
#overlay .ov-inner { width: 100%; max-width: 960px; color: #fff; }
#overlay .ov-top { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
#overlay .ov-q { font-size: clamp(22px, 3.4vw, 38px); font-weight: 800; line-height: 1.35; margin-bottom: 22px; }
#overlay .ov-choices { display: grid; gap: 10px; }
#overlay .ov-choice {
  display: flex; align-items: center; gap: 14px; padding: 14px 18px;
  border: 2px solid rgba(255,255,255,.22); border-radius: 12px;
  font-size: clamp(16px, 2vw, 22px); font-weight: 600; position: relative; overflow: hidden;
}
#overlay .ov-choice .bar {
  position: absolute; inset: 0 auto 0 0; background: rgba(255,255,255,.13);
  width: 0; transition: width .4s ease;
}
#overlay .ov-choice > * { position: relative; }
#overlay .ov-choice .lt {
  width: 34px; height: 34px; border-radius: 8px; background: rgba(255,255,255,.16);
  display: grid; place-items: center; font-weight: 800; flex: none; font-size: 17px;
}
#overlay .ov-choice .cnt { margin-left: auto; font-size: 16px; font-weight: 700; opacity: .85; }
#overlay .ov-choice.correct { border-color: #34d17f; background: rgba(52,209,127,.16); }
#overlay .ov-choice.correct .lt { background: #34d17f; color: #04331d; }
#overlay .ov-explain {
  margin-top: 18px; padding: 14px 18px; border-radius: 11px;
  background: rgba(255,255,255,.1); font-size: 16px; line-height: 1.6;
}
/* 해설은 정답 공개의 핵심인데 맨 아래에 있으면 눈에 안 들어온다.
   공개되면 문항 바로 아래·보기 위에 크게 띄운다. */
#overlay .ov-explain-top {
  margin: 0 0 18px; padding: 16px 20px; border-radius: 12px;
  background: rgba(255,214,102,.16); border: 2px solid rgba(255,214,102,.55);
  color: #ffe9ad; font-size: clamp(17px, 1.9vw, 25px); font-weight: 700; line-height: 1.5;
}
.stu-explain-top {
  margin: 0 0 14px; padding: 14px 16px; border-radius: 12px;
  background: #fff8e6; border: 2px solid #f0c96b; color: #6b4b00;
  font-size: 17px; font-weight: 700; line-height: 1.55;
}
#overlay .ov-actions { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
#overlay .ov-actions .btn { padding: 13px 24px; font-size: 16px; }
#pl-transition, #pl-completion, #pl-player-error {
  position: absolute; inset: 0; z-index: 190; background: rgba(14,17,30,.94);
  display: flex; align-items: center; justify-content: center; padding: 24px;
  color: #fff; text-align: center;
}
#pl-completion, #pl-player-error { z-index: 210; }
.pl-playback-menu { width: min(680px, 100%); }
.pl-playback-menu h2 { font-size: clamp(26px, 4vw, 44px); margin-bottom: 12px; }
.pl-playback-menu p { color: rgba(255,255,255,.72); font-size: 17px; line-height: 1.6; }
.pl-playback-menu .ov-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
.pl-playback-menu .btn { padding: 13px 22px; font-size: 16px; }
.quiz-timer { display:flex; align-items:center; gap:12px; flex:1 1 240px; }
.quiz-timer-track { height:12px; flex:1; border-radius:999px; overflow:hidden; background:rgba(255,255,255,.2); }
.quiz-timer-track > i { display:block; height:100%; width:100%; border-radius:inherit; background:#34d17f; transition:width .25s linear,background .2s; }
.quiz-timer-number { min-width:54px; text-align:right; font-size:28px; font-variant-numeric:tabular-nums; }
.quiz-timer.warning .quiz-timer-track > i { background:#f0a23a; }
.quiz-timer.urgent .quiz-timer-track > i { background:#ff5a5a; }
.ov-count { font-size: 15px; font-weight: 700; background: rgba(255,255,255,.14); padding: 7px 15px; border-radius: 999px; }

/* ══════════════════════════════════════════════════════════
   학생
   ══════════════════════════════════════════════════════════ */
.stu-wrap { max-width: 560px; margin: 0 auto; padding: 18px 14px 60px; }
.stu-status {
  display: flex; align-items: center; gap: 10px; font-size: 13px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 13px; margin-bottom: 14px;
}
.stu-status .spacer { flex: 1; }
.stu-wait { text-align: center; padding: 60px 18px; }
.stu-wait .big { font-size: 46px; margin-bottom: 14px; }
.stu-wait h2 { font-size: 19px; margin-bottom: 6px; }
.stu-wait p { color: var(--ink-2); font-size: 14px; }
.stu-q { font-size: 20px; font-weight: 700; line-height: 1.45; margin-bottom: 18px; }
.stu-choice {
  display: flex; align-items: center; gap: 13px; width: 100%; text-align: left;
  padding: 15px 16px; margin-bottom: 10px; font: inherit; font-size: 16px; font-weight: 600;
  background: #fff; border: 2px solid var(--line-2); border-radius: 12px;
  color: var(--ink); cursor: pointer; transition: border-color .12s, background .12s;
}
.stu-choice:hover:not(:disabled) { border-color: var(--accent); }
.stu-choice .lt {
  width: 32px; height: 32px; border-radius: 8px; background: #eceef4; color: var(--ink-2);
  display: grid; place-items: center; font-weight: 800; flex: none;
}
.stu-choice.sel { border-color: var(--accent); background: var(--accent-2); }
.stu-choice.sel .lt { background: var(--accent); color: #fff; }
.stu-choice.correct { border-color: var(--ok); background: var(--ok-bg); }
.stu-choice.correct .lt { background: var(--ok); color: #fff; }
.stu-choice.wrong { border-color: var(--bad); background: var(--bad-bg); }
.stu-choice.wrong .lt { background: var(--bad); color: #fff; }
.stu-choice:disabled { cursor: default; opacity: 1; }
.stu-wrap .quiz-timer { margin-bottom:16px; }
.stu-wrap .quiz-timer-track { background:#e2e5ec; }
.stu-wrap .quiz-timer-number { color:var(--ink-2); }
@media (prefers-reduced-motion: reduce) {
  .quiz-timer-track > i { transition:none; }
}
.result-banner {
  border-radius: 12px; padding: 16px; text-align: center; font-size: 18px;
  font-weight: 800; margin-bottom: 14px;
}
.result-banner.ok  { background: var(--ok-bg);  color: var(--ok); }
.result-banner.bad { background: var(--bad-bg); color: var(--bad); }
.result-banner.mute{ background: #eceef4; color: var(--ink-2); }
.privacy-note {
  font-size: 11.5px; color: var(--ink-3); line-height: 1.5;
  border-top: 1px solid var(--line); padding-top: 12px; margin-top: 26px;
}

/* ══════════════════════════════════════════════════════════
   대시보드 / 관리자 표
   ══════════════════════════════════════════════════════════ */
.tbl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; white-space: nowrap; }
table.tbl th, table.tbl td { padding: 9px 11px; border-bottom: 1px solid var(--line); text-align: left; }
table.tbl th {
  background: #f7f8fb; font-size: 12px; font-weight: 700; color: var(--ink-2);
  position: sticky; top: 0; cursor: pointer; user-select: none;
}
table.tbl th.nosort { cursor: default; }
table.tbl tbody tr:hover { background: #f9fafc; }
table.tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.tbl td.ctr, table.tbl th.ctr { text-align: center; }
.ox-o { color: var(--ok); font-weight: 800; }
.ox-x { color: var(--bad); font-weight: 800; }
.ox-none { color: var(--ink-3); }

.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 16px; }
.stat {
  background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 13px 15px;
}
.stat .k { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.stat .v { font-size: 25px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }

.dist-row { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; font-size: 13px; }

function pendingAllocationRead() {
  try {
    const parsed = JSON.parse(localStorage.getItem(PENDING_ALLOCATION_KEY) || '[]');
    if (!Array.isArray(parsed)) return [];
    return parsed.filter(record => record &&
      typeof record.sessionId === 'string' && record.sessionId &&
      typeof record.ownerUid === 'string' && record.ownerUid &&
      typeof record.ownerEmail === 'string' &&
      typeof record.token === 'string' && record.token.length >= 16

function pendingAllocationWrite(records) {
  try {
    const serialized = JSON.stringify(Array.isArray(records) ? records : []);
    localStorage.setItem(PENDING_ALLOCATION_KEY, serialized);
    return localStorage.getItem(PENDING_ALLOCATION_KEY) === serialized;

function pendingAllocationsForOwner(owner) {
  if (!owner || !owner.uid) return [];

    record.ownerUid === owner.uid &&
    String(record.ownerEmail || '').trim().toLowerCase() === email
  );

function pendingAllocationRemember(record) {
  const records = pendingAllocationRead().filter(item => item.sessionId !== record.sessionId);
  records.push(Object.assign({}, record));
  return pendingAllocationWrite(records);
}

function pendingAllocationPatch(sessionId, patch) {
  const records = pendingAllocationRead();
  const index = records.findIndex(record => record.sessionId === sessionId);
  if (index < 0) return false;
  records[index] = Object.assign({}, records[index], patch || {});
  return pendingAllocationWrite(records);
}

function pendingAllocationRemove(sessionId, token) {
  const records = pendingAllocationRead();
  const next = records.filter(record =>
    record.sessionId !== sessionId || (token && record.token !== token)
  );

}

/* crypto.subtle 은 https(또는 file://)에서만 제공된다.

    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const bytes = Array.from(new TextEncoder().encode(str));
  const bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  bytes.push(0, 0, 0, 0, (bitLen >>> 24) & 255, (bitLen >>> 16) & 255, (bitLen >>> 8) & 255, bitLen & 255);

  const w = new Array(64);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let i = 0; i < bytes.length; i += 64) {
    for (let t = 0; t < 16; t++)
      w[t] = (bytes[i + t * 4] << 24) | (bytes[i + t * 4 + 1] << 16) | (bytes[i + t * 4 + 2] << 8) | bytes[i + t * 4 + 3];
    for (let t = 16; t < 64; t++) {
      const s0 = rotr(w[t - 15], 7) ^ rotr(w[t - 15], 18) ^ (w[t - 15] >>> 3);
      const s1 = rotr(w[t - 2], 17) ^ rotr(w[t - 2], 19) ^ (w[t - 2] >>> 10);
      w[t] = (w[t - 16] + s0 + w[t - 7] + s1) | 0;
    }
    let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
    for (let t = 0; t < 64; t++) {
      const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      const t1 = (h + S1 + ((e & f) ^ (~e & g)) + K[t] + w[t]) | 0;
      const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      const t2 = (S0 + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H = [(H[0] + a) | 0, (H[1] + b) | 0, (H[2] + c) | 0, (H[3] + d) | 0,
         (H[4] + e) | 0, (H[5] + f) | 0, (H[6] + g) | 0, (H[7] + h) | 0];
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

/** ref.on() 을 걸면서 화면을 떠날 때 자동으로 off 되도록 등록 */

let ytReady = false;
const ytWaiters = [];
function markYTReady() {
  ytReady = true;
  while (ytWaiters.length) {
    const waiter = ytWaiters.shift();
    if (typeof waiter === 'function') waiter();
    else if (waiter && !waiter.cancelled) waiter.callback();
  }
}
window.onYouTubeIframeAPIReady = markYTReady;
function whenYT(cb) {
  if (!ytReady && window.YT && typeof window.YT.Player === 'function') markYTReady();
  if (ytReady) {
    cb();
    return () => {};
  }
  const waiter = { callback: cb, cancelled: false };
  ytWaiters.push(waiter);
  return () => { waiter.cancelled = true; };
}

   끄는 것은 확실히 동작하지만, API로 특정 자막을 "켜는" 것은 영상에 따라 되지 않습니다.

   광고 재생 중에는 자막 API가 먹지 않으며, 본 영상이 시작되면 정상 적용됩니다. */
let captionsOn = lsGet('vq_captions') === '1';

function applyCaptions(player) {
  if (!player) return;
  // 'captions'는 구버전, 'cc'는 HTML5 플레이어의 모듈 이름 — 둘 다 시도한다
  ['captions', 'cc'].forEach(m => {
    try {
      if (captionsOn) {
        // 자막 차단만 해제한다. 어떤 자막을 켤지는 유튜브(와 교사)가 정한다.
        // setOption('track', ...) 으로 트랙을 강제하는 방법은 영상에 따라 먹지 않아
        // (자동 번역 트랙은 is_servable:false 라 지정해도 무시됨) 시도하지 않는다.
        player.loadModule(m);
      } else {
        player.unloadModule(m);
        player.setOption(m, 'track', {});
      }
    } catch (e) { /* 해당 모듈이 없는 플레이어면 무시 */ }
  });
}

  return {
    onReady: () => applyCaptions(getPlayer()),
    onStateChange: e => {
      if (e.data === YT.PlayerState.PLAYING || e.data === YT.PlayerState.BUFFERING) applyCaptions(getPlayer());
      if (handleStateChange) handleStateChange(e);
    },
    onError: e => { if (handleError) handleError(e); }
  };
}
function toggleCaptions(getPlayer) {
  captionsOn = !captionsOn;
  lsSet('vq_captions', captionsOn ? '1' : '0');
  applyCaptions(getPlayer());
  $$('.cc-btn').forEach(b => { b.textContent = ccLabel(); });
  toast(captionsOn
    ? '자막 차단을 풀었습니다. 자막이 안 보이면 플레이어 ⚙ → 자막에서 고르세요'
    : '자막을 껐습니다');
}

const DEFAULT_SETTINGS = {
  revealMode: 'timer',    // instant | timer | manual | never
  limitSec: 20,           // 문항당 응답 제한 시간 (0 = 무제한, 교사가 닫을 때까지)
  revealDelaySec: 5,      // revealMode='timer' 일 때 오픈 후 정답 공개까지
  autoPause: true         // 퀴즈가 뜰 때 영상 자동 일시정지
};
const REVEAL_LABEL = {
  instant: '제출 즉시 공개',
  timer:   '타이머 종료 후 자동 공개',
  manual:  '교사가 버튼을 누를 때 공개',
  never:   '학생에게 공개 안 함'
};

function normSettings(s) {
  const o = Object.assign({}, DEFAULT_SETTINGS, s || {});
  if (!REVEAL_LABEL[o.revealMode]) o.revealMode = DEFAULT_SETTINGS.revealMode;
  o.limitSec = Math.max(0, Math.min(600, Number(o.limitSec) || 0));
  o.revealDelaySec = Math.max(0, Math.min(600, Number(o.revealDelaySec) || 0));
  o.autoPause = o.autoPause !== false;
  return o;
}
/* ── 문항 유형 ──────────────────────────────────────────────────────── */
const QTYPES = {
  choice: '객관식 — 하나 고르기',
  multi:  '복수 정답 — 모두 고르기',
  ox:     'O · X (참·거짓)',
  short:  '단답형 — 직접 입력, 자동 채점',
  long:   '서술형 — 교사가 나중에 채점'
};
const OX_CHOICES = ['O (맞다)', 'X (아니다)'];

function qType(q) { return (q && QTYPES[q.type]) ? q.type : 'choice'; }
function isTextType(q) { const t = qType(q); return t === 'short' || t === 'long'; }
/** 서술형만 사람이 채점한다. 나머지는 학생이 제출하는 순간 채점된다. */
function isAutoGraded(q) { return qType(q) !== 'long'; }

/** 단답형 비교용 정규화 — 띄어쓰기·대소문자·흔한 문장부호를 무시한다 */
function normAnswerText(s) {
  return String(s == null ? '' : s)
    .trim().toLowerCase()
    .replace(/\s+/g, '')
    .replace(/[.,!?~·'"’”\-–—()[\]]/g, '');
}
function shortCorrect(q, txt) {
  const n = normAnswerText(txt);
  if (!n) return false;
  return (q.accept || []).some(a => normAnswerText(a) === n);
}
/** 복수 정답은 고른 것이 정답 집합과 정확히 같아야 맞다 */
function multiCorrect(q, arr) {
  const want = (q.answers || []).slice().sort((a, b) => a - b).join(',');
  const got = (arr || []).slice().sort((a, b) => a - b).join(',');
  return want !== '' && want === got;
}
/** 응답 하나를 유형에 맞게 채점. 서술형은 null(미채점)을 돌려준다. */
function gradeResponse(q, resp) {
  const t = qType(q);
  const answer = resp && Object.prototype.hasOwnProperty.call(resp, 'answer') ? resp.answer : undefined;
  if (t === 'long') return null;
  if (t === 'short') return shortCorrect(q, answer === undefined ? resp.txt : answer);
  if (t === 'multi') return multiCorrect(q, Array.isArray(answer) ? answer : parseMulti(resp.cs));
  return Number(answer === undefined ? resp.c : answer) === Number(q.answer);
}
/** 복수 정답은 "0,2" 문자열로 정규화해 저장한다. */
function parseMulti(cs) {
  return String(cs || '').split(',').filter(x => x !== '').map(Number).filter(n => !isNaN(n));
}
function fmtMulti(arr) { return (arr || []).slice().sort((a, b) => a - b).join(','); }

/** 응답을 사람이 읽을 수 있는 형태로 (표·CSV·명단에서 공용) */
function answerLabel(q, r) {
  if (!r) return '';
  const t = qType(q);
  const answer = Object.prototype.hasOwnProperty.call(r, 'answer') ? r.answer : undefined;
  if (t === 'short' || t === 'long') return answer === undefined ? (r.txt || '') : String(answer);
  if (t === 'multi') return (Array.isArray(answer) ? answer : parseMulti(r.cs))
    .map(j => LETTERS[j] || ('?' + j)).join(' ');
  const c = Number(answer === undefined ? r.c : answer);
  return (t === 'ox' ? ['O', 'X'][c] : LETTERS[c]) || '';
}

/** 이전 JSON이나 불완전한 문서에서는 questions가 없을 수 있다. */
function normQuestions(qs) {
  return (qs || []).filter(Boolean).map(q => {
    const type = QTYPES[q.type] ? q.type : 'choice';
    return {
      type: type,
      t: Number(q.t) || 0,
      text: q.text || '',
      // O·X 도 보기 문구는 교사가 고칠 수 있다. 저장된 게 없을 때만 기본 문구를 쓴다.
      choices: type === 'ox'
        ? (((q.choices || []).filter(c => c != null).length >= 2) ? q.choices.slice(0, 2) : OX_CHOICES.slice())
        : (q.choices || []).filter(c => c != null),
      answer: Number(q.answer) || 0,
      answers: (q.answers ? Object.keys(q.answers).map(k => Number(q.answers[k])) : []).filter(n => !isNaN(n)),
      accept: (q.accept ? Object.keys(q.accept).map(k => String(q.accept[k])) : []).filter(s => s.trim() !== ''),
      imgUrl: q.imgUrl || '',
      imgUp: !!q.imgUp,
      _img: '',                 // 업로드 이미지 원본 (images 하위 컬렉션에서 따로 불러온다)
      explain: q.explain || '',
      explainImgUrl: q.explainImgUrl || '',
      explainImgUp: !!q.explainImgUp,
      _explainImg: '',
      _explainOpen: !!(q.explain || q.explainImgUrl || q.explainImgUp),
      limitSec: (q.limitSec === undefined || q.limitSec === null || q.limitSec === '') ? null : Number(q.limitSec)
    };
  });
}
function normSet(raw) {
  if (!raw) return null;

    questions: normQuestions(video.questions)

    updatedAt: raw.updatedAt || 0,
    archived: !!raw.archived,
    trashedAt: raw.trashedAt || null,
    purgeStartedAt: raw.purgeStartedAt || null,
    lifecycleState: raw.lifecycleState || (raw.trashedAt ? 'trashed' : 'active'),
    collaboratorCount: Number.isInteger(raw.collaboratorCount) ? raw.collaboratorCount : 0,

function canEditSet(set, state) {

  if (set.ownerUid && set.ownerUid === state.uid) return true;

/* ── 문항 이미지 ────────────────────────────────────────────────────────
   Firebase Storage 는 유료 요금제라야 쓸 수 있어서, 브라우저에서 크기를 줄여
   데이터베이스에 넣습니다. 대신 이미지는 퀴즈 세트가 아니라 images/{세트}/q/{문항}
   에 따로 두고, 그 문항이 열릴 때만 내려받습니다. 학생 30명이 세트를 열 때마다
   모든 이미지를 받아가면 무료 전송량이 금방 동나기 때문입니다. */
const IMG_MAX_CHARS = 380000;   // 문항별 Firestore 문서 크기에 여유를 둔다 (대략 280KB 사진)

function compressImage(file, maxPx, quality) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error('이미지 파일이 아닙니다.'));
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('파일을 읽지 못했습니다.'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => reject(new Error('이미지를 열지 못했습니다.'));
      im.onload = () => {
        let w = im.naturalWidth, h = im.naturalHeight;
        const scale = Math.min(1, maxPx / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const cx = cv.getContext('2d');
        cx.fillStyle = '#fff';           // 투명 PNG가 검게 나오지 않도록
        cx.fillRect(0, 0, w, h);
        cx.drawImage(im, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/** 상한에 들어올 때까지 화질과 크기를 차례로 낮춘다 */
async function prepareImage(file) {
  let quality = 0.72, px = 1000;
  let out = await compressImage(file, px, quality);
  while (out.length > IMG_MAX_CHARS && (quality > 0.4 || px > 480)) {
    if (quality > 0.45) quality -= 0.12;
    else px = Math.round(px * 0.8);
    out = await compressImage(file, px, quality);
  }
  if (out.length > IMG_MAX_CHARS) throw new Error('이미지가 너무 큽니다. 더 작은 파일을 써 주세요.');
  return out;
}

/** 문항 이미지를 그때그때 받아 캐시한다 (교사 재생 화면과 학생 화면 공용) */
const imgCache = {};
function loadQuestionImage(setId, i, sessionId, snapshotVersion) {
  const key = (sessionId || setId) + '/' + i;
  if (imgCache[key] !== undefined) return Promise.resolve(imgCache[key]);
  const loading = sessionId && store.getSessionQuestionImage
    ? store.getSessionQuestionImage(
        snapshotVersion === undefined
          ? sessionId
          : { id: sessionId, setId: setId, snapshotVersion: snapshotVersion },
        snapshotVersion === undefined ? setId : i,
        snapshotVersion === undefined ? i : undefined
      )
    : store.getQuestionImage(setId, i);
  return loading
    .then(src => { imgCache[key] = src || ''; return imgCache[key]; })
    .catch(error => {
      if (snapshotVersion !== undefined) throw error;
      return '';
    });
}
/** 문항에 보여줄 그림이 있는지 (업로드 또는 주소) */
function hasImage(q) { return !!(q && (q.image || q.imgUp || q.imgUrl)); }

/** 문항별 제한시간 덮어쓰기가 있으면 그것을, 없으면 세트 기본값을 쓴다 */
function limitFor(set, i, questions) {
  const q = (questions || set.questions || [])[i];
  if (q && q.limitSec !== null && q.limitSec !== undefined && !isNaN(q.limitSec)) return Math.max(0, q.limitSec);
  return set.settings.limitSec;
}

let teacherUser = null;
let teacherAllowance = null;
let teacherState = AuthCore.teacherState(null, null);
let clockUserId = '';
let clockPromise = null;
let clockPromiseUid = '';
let teacherAuthVersion = 0;
let appliedTeacherState = AuthCore.teacherState(null, null);
let trashMaintenance = null;
let teacherRequestScreen = null;
let teacherRequestReroute = null;
let adminTeacherRequestScreen = null;
let teacherDashboard = null;
let classPlanningThresholds = ClassPlanningCore.normalizeThresholds();
let teacherDeletionScreen = null;

function teacherStateFromAllowance(user, allowance) {
  const state = AuthCore.teacherState(user, allowance);
  if (user && !user.isAnonymous && user.emailVerified && allowance &&

function maintenanceCanonicalEmail(value) {

    return CollaborationTrashCore.canonicalEmail(value);
  }
  return String(value == null ? '' : value).trim().toLowerCase();
}

function maintenanceIsCurrent(state) {
  return !!state && trashMaintenance === state && !state.stopped &&
    AuthCore.isTeacher(teacherState) && !!teacherUser &&
    teacherUser.uid === state.uid && teacherAuthVersion === state.authGeneration &&
    (!clockUserId || clockUserId === state.uid);
}

function stopTrashMaintenance() {
  const state = trashMaintenance;
  if (!state) return;
  state.stopped = true;
  if (state.retryTimer != null && typeof clearTimeout === 'function') clearTimeout(state.retryTimer);
  state.retryTimer = null;
  state.promise = null;
  trashMaintenance = null;
}

function runTrashMaintenancePage() {
  const state = trashMaintenance;
  if (!state || state.stopped) return false;
  if (state.promise) return state.promise;
  if (state.completed) return Promise.resolve(true);
  state.promise = (async () => {
    try {
      if (!maintenanceIsCurrent(state) || !store.listExpiredTrash || !store.beginSetPurge || !store.continueSetPurge) return false;
      if (state.role === 'admin' && typeof store.getCounterMigrationState === 'function') {
        const gate = await store.getCounterMigrationState();
        if (gate && gate.ready === false) return false;
      }
      const scope = state.role === 'admin'
        ? { role: 'admin' } : { ownerUid: state.uid, role: state.role };
      let pageCount = 0;
      let pageNumber = 0;
      while (true) {
        if (++pageNumber > 1000) throw new Error('휴지통 정리 페이지 한도를 넘어 다음 로그인에서 이어서 진행합니다.');
        const items = await store.listExpiredTrash(scope, 20);
        if (!maintenanceIsCurrent(state)) return false;
        pageCount = (items || []).length;
        state.lastPageCount = pageCount;
        for (const item of items || []) {
          if (!maintenanceIsCurrent(state)) return false;
          state.failedSetId = item.id;
          await store.beginSetPurge(item.id, 'expired', teacherState);
          let result = { done: false };
          let guard = 0;
          while (!result.done && guard++ < 1000) {
            if (!maintenanceIsCurrent(state)) return false;
            result = await store.continueSetPurge(item.id);
          }
          if (!result.done) throw new Error('정리 작업이 너무 오래 걸려 다음 로그인에서 이어서 진행합니다.');
        }
        if (pageCount < 20) break;
      }
      state.warning = '';
      state.failedSetId = '';
      state.retryCount = 0;
      state.completed = true;
      return true;
    } catch (error) {
      if (!maintenanceIsCurrent(state)) return false;
      state.warning = error && error.message ? error.message : String(error);
      state.retryCount = (Number(state.retryCount) || 0) + 1;
      if (typeof toast === 'function') toast('휴지통 자동 정리 실패 — 다음 로그인에서 재시도합니다: ' + state.warning);
      if (state.retryCount <= 1 && typeof setTimeout === 'function') {
        state.retryTimer = setTimeout(() => {
          state.retryTimer = null;
          if (maintenanceIsCurrent(state)) runTrashMaintenancePage();
        }, 1000);
      }
      return false;
    } finally {
      if (trashMaintenance === state) {
        if (state.completed) state.completedPromise = state.promise;
        state.promise = null;
      }
    }
  })();
  return state.promise;
}

function startTrashMaintenance(authGeneration) {
  if (trashMaintenance && !trashMaintenance.stopped &&
      trashMaintenance.uid === (teacherUser && teacherUser.uid) &&
      trashMaintenance.authGeneration === authGeneration) {
    return trashMaintenance.promise || (trashMaintenance.completed
      ? trashMaintenance.completedPromise
      : runTrashMaintenancePage());
  }
  stopTrashMaintenance();
  if (!AuthCore.isTeacher(teacherState) || !teacherUser ||
      !store.listExpiredTrash || !store.beginSetPurge || !store.continueSetPurge ||
      teacherAuthVersion !== authGeneration ||
      (clockUserId && clockUserId !== teacherUser.uid)) return Promise.resolve(false);
  const state = trashMaintenance = {
    uid: teacherUser.uid, role: teacherState.role, authGeneration,
    stopped: false, promise: null, retryTimer: null, retryCount: 0,
    warning: '', failedSetId: '', lastPageCount: 0, completed: false, completedPromise: null
  };
  return runTrashMaintenancePage();
}

function teacherAuthMarkup() {

  }

      pending.length + ')</button>'
    : '';
  return '<span class="auth-user" title="' + esc(teacherState.email) + '">' + esc(identity) + '</span>' +

}

function renderTeacherAuthArea() {

async function recoverPendingAllocationsForTeacher(owner) {
  if (!AuthCore.isTeacher(owner) || !store.recoverPendingSessionAllocation) return [];
  if (pendingAllocationRecoveryTimer !== null) {
    clearTimeout(pendingAllocationRecoveryTimer);
    pendingAllocationRecoveryTimer = null;
  }
  const version = teacherAuthVersion;
  const isCurrent = () => AuthCore.isTeacher(teacherState) &&
    teacherState.uid === owner.uid && teacherState.email === owner.email &&
    teacherAuthVersion === version;
  const now = Date.now();
  const records = pendingAllocationsForOwner(owner);
  const results = [];
  let nextRetryAt = 0;
  for (const record of records) {
    if (!isCurrent()) break;
    if (Number(record.recoverAfter) > now) {
      results.push({ complete: false, waiting: true });
      nextRetryAt = nextRetryAt
        ? Math.min(nextRetryAt, Number(record.recoverAfter))
        : Number(record.recoverAfter);
      continue;
    }
    try {
      const result = await store.recoverPendingSessionAllocation(record);
      if (!isCurrent()) break;
      results.push(result);
      if (result && result.complete) {
        pendingAllocationRemove(record.sessionId, record.token);
      } else {
        pendingAllocationPatch(record.sessionId, Object.assign(
          result && result.attached ? {
            attachStatus: 'attached', planRevision: result.planRevision
          } : {},
          {
            lastError: result && result.attached
              ? '연결된 수업계획 세션이 진행 중입니다. 이 기록은 자동 삭제하지 않습니다.'
              : result && result.active
                ? '다른 교사 화면에서 진행 중입니다. heartbeat가 끝난 뒤 다시 시도해 주세요.'
                : '세션 할당 identity가 달라 자동 정리를 건너뛰었습니다.'
          }
        ));
        if (result && result.active && !result.attached) {
          const activeRetryAt = Date.now() + PENDING_ALLOCATION_RECOVERY_DELAY_MS;
          nextRetryAt = nextRetryAt ? Math.min(nextRetryAt, activeRetryAt) : activeRetryAt;
        }
      }
    } catch (error) {
      if (!isCurrent()) break;
      const message = error && error.message ? error.message : String(error);
      pendingAllocationPatch(record.sessionId, { lastError: message });
      results.push({ complete: false, error: message });
    }
  }
  if (isCurrent() && nextRetryAt) {
    pendingAllocationRecoveryTimer = setTimeout(() => {
      pendingAllocationRecoveryTimer = null;
      return isCurrent() ? recoverPendingAllocationsForTeacher(owner) : [];
    }, Math.max(0, nextRetryAt - Date.now()));
  }
  if (isCurrent()) renderTeacherAuthArea();
  return results;
}

function retryPendingAllocations() {
  return recoverPendingAllocationsForTeacher(teacherState).then(results => {
    const failed = results.some(result => !result || !result.complete);
    toast(failed
      ? '아직 정리하지 못한 세션이 있습니다. 잠시 후 다시 시도해 주세요.'
      : '남은 세션 할당 정리를 완료했습니다.');
    return results;
  });
}

async function applyTeacherUser(user) {
  const previousState = typeof appliedTeacherState !== 'undefined' && appliedTeacherState
    ? appliedTeacherState : teacherState;
  const previousUid = previousState && previousState.uid || '';
  const heartbeatState = typeof pl !== 'undefined' && pl &&
    typeof pl.stopActivationHeartbeat === 'function' ? pl : null;
  const heartbeatOwner = heartbeatState && AuthCore.isTeacher(teacherState)
    ? { uid: teacherState.uid, email: teacherState.email } : null;
  if (heartbeatState) heartbeatState.stopActivationHeartbeat();
  if (typeof clearTeacherDashboard === 'function') clearTeacherDashboard();
  if (typeof stopTrashMaintenance === 'function') stopTrashMaintenance();
  const updateVersion = ++teacherAuthVersion;
  const requestRouteAtStart = typeof teacherRequestRouteIsCurrent === 'function'
    ? teacherRequestRouteIsCurrent()
    : (typeof location === 'undefined' || ['#/', '', '#'].includes(String(location.hash || '#/')));
  const observerUid = user && !user.isAnonymous ? String(user.uid || '') : '';
  const inheritedTeacherRequestReroute = typeof teacherRequestReroute !== 'undefined' && teacherRequestReroute;
  const clearedTeacherRequest = typeof clearTeacherRequestScreen === 'function'
    ? clearTeacherRequestScreen(true) : false;
  if (requestRouteAtStart && (clearedTeacherRequest || inheritedTeacherRequestReroute)) {
    teacherRequestReroute = { authGeneration: updateVersion, uid: observerUid };
  }
  if (typeof authReady !== 'undefined' && authReady && previousUid && (!user || user.uid !== previousUid)) {
    retractProtectedTeacherScreen();
  }
  teacherUser = null;
  teacherAllowance = null;
  teacherState = AuthCore.teacherState(null, null);
  clockUserId = '';
  clockPromise = null;
  clockPromiseUid = '';
  renderTeacherAuthArea();
  let tokenResult = null;
  if (user && !user.isAnonymous && typeof user.getIdTokenResult === 'function') {
    try { tokenResult = await user.getIdTokenResult(); } catch (error) { console.error(error); }
  }
  if (updateVersion !== teacherAuthVersion) return false;
  const nextUser = AuthCore.isGoogleSignIn(tokenResult) ? user : null;
  let nextAllowance = null;
  if (nextUser && nextUser.emailVerified) {
    const normalizedEmail = String(nextUser.email || '').trim().toLowerCase();
    if (normalizedEmail) {
      try {
        nextAllowance = await store.probeTeacherAllowance(normalizedEmail);
      } catch (error) {
        console.error(error);
      }
    }
    if (!nextAllowance && normalizedEmail && typeof store.getOwnTeacherAllowance === 'function') {
      try {
        const ownAllowance = await store.getOwnTeacherAllowance(nextUser.uid);
        if (ownAllowance && ownAllowance.uid === nextUser.uid &&
            ownAllowance.emailCanonical === normalizedEmail &&
            ['deletion_pending', 'suspended'].includes(ownAllowance.status)) {
          nextAllowance = ownAllowance;
        }
      } catch (error) {
        if (!error || String(error.code || '').indexOf('permission-denied') < 0) console.error(error);
      }
    }
  }
  if (updateVersion !== teacherAuthVersion) return false;
  teacherUser = nextUser;
  teacherAllowance = nextAllowance;
  teacherState = typeof teacherStateFromAllowance === 'function'
    ? teacherStateFromAllowance(teacherUser, teacherAllowance)
    : AuthCore.teacherState(teacherUser, teacherAllowance);
  if (AuthCore.isTeacher(teacherState) &&
      typeof recoverPendingAllocationsForTeacher === 'function') {
    await recoverPendingAllocationsForTeacher(teacherState);
    if (updateVersion !== teacherAuthVersion) return false;
  }
  if (AuthCore.isTeacher(teacherState) && typeof startTrashMaintenance === 'function' &&
      store && store.listExpiredTrash) {
    const maintenanceUser = teacherUser;
    const maintenanceGeneration = updateVersion;
    const maintenanceClock = typeof ensureClock === 'function' && store.syncClock
      ? ensureClock(maintenanceUser) : Promise.resolve();
    maintenanceClock.then(() => {
      if (teacherUser === maintenanceUser && teacherAuthVersion === maintenanceGeneration &&
          AuthCore.isTeacher(teacherState)) startTrashMaintenance(maintenanceGeneration);
    }).catch(error => console.error('휴지통 자동 정리 시각 동기화 실패', error));
  }
  if (heartbeatState && typeof pl !== 'undefined' && pl === heartbeatState &&
      heartbeatOwner && AuthCore.isTeacher(teacherState) &&
      heartbeatOwner.uid === teacherState.uid && heartbeatOwner.email === teacherState.email &&
      heartbeatState.sessionId && heartbeatState.code && heartbeatState.allocationToken &&
      typeof plStartSessionHeartbeat === 'function') {
    plStartSessionHeartbeat(
      heartbeatState, teacherState, updateVersion, heartbeatState.allocationToken
    );
  }
  renderTeacherAuthArea();
  if (typeof authReady !== 'undefined' && authReady) {
    const routeReconciled = reconcileTeacherRoute(previousState, teacherState);
    let requestRerouted = false;
    const reroute = typeof teacherRequestReroute !== 'undefined' ? teacherRequestReroute : null;
    if (reroute && reroute.authGeneration === updateVersion && reroute.uid === observerUid) {
      teacherRequestReroute = null;
      const requestRouteCurrent = typeof teacherRequestRouteIsCurrent === 'function'
        ? teacherRequestRouteIsCurrent()
        : (typeof location === 'undefined' || ['#/', '', '#'].includes(String(location.hash || '#/')));
      if (requestRouteCurrent) {
        router();
        requestRerouted = true;
      }
    }
    if (!routeReconciled && !requestRerouted && !teacherRequestReroute &&
        typeof rerenderEligibleTeacherHome === 'function') {
      rerenderEligibleTeacherHome(updateVersion, teacherState.uid);
    }
  }
  appliedTeacherState = teacherState;
  return true;
}

function ensureClock(user) {
  if (!user) return Promise.reject(new Error('인증 계정을 찾을 수 없습니다.'));
  if (clockUserId === user.uid) return Promise.resolve();
  if (clockPromise && clockPromiseUid === user.uid) return clockPromise;
  const pending = store.syncClock('clock/' + user.uid + '-' + rid(8))
    .then(() => {
      if (clockPromise === pending) clockUserId = user.uid;
    })
    .finally(() => {
      if (clockPromise === pending) {
        clockPromise = null;
        clockPromiseUid = '';
      }
    });
  clockPromise = pending;
  clockPromiseUid = user.uid;
  return clockPromise;
}

function ensureAnonymousStudent() {
  const auth = firebase.auth();
  const user = auth.currentUser;
  const signedIn = user && user.isAnonymous
    ? Promise.resolve(user)
    : auth.signInAnonymously().then(result => result.user);
  return signedIn.then(async pinned => {
    await ensureClock(pinned);
    const current = firebase.auth().currentUser;
    if (!current || !current.isAnonymous || current.uid !== pinned.uid) {
      throw new Error('학생 인증 계정이 준비 중 변경되었습니다. 다시 시도해 주세요.');
    }
    return pinned;
  });
}

function teacherRouteRequirement() {
  const name = location.hash.replace(/^#\/?/, '').split('/')[0] || 'home';
  if (name === 'admin') return 'admin';
  return ['sets', 'make', 'play', 'live'].includes(name) ? 'teacher' : '';

function retractProtectedTeacherScreen() {
  if (!authReady || !teacherRouteRequirement()) return false;

    '<div class="wrap"><div class="empty">인증 상태를 다시 확인하는 중…</div></div>';
  return true;
}

function reconcileTeacherRoute(previous, next) {
  if (!authReady) return false;
  const requirement = teacherRouteRequirement();
  if (!requirement) return false;
  const allowed = requirement === 'admin' ? AuthCore.isAdmin(next) : AuthCore.isTeacher(next);
  const identityChanged = String(previous && previous.uid || '') !== String(next && next.uid || '');
  if (!allowed) {
    runCleanups();
    go('home');
    return true;
  }
  if (identityChanged) {
    runCleanups();
    router();
    return true;
  }
  return false;
}

function parsePlayClassPlanRoute(queryString) {
  const query = String(queryString || '').replace(/^\?/, '');
  if (!query) return null;
  const params = new URLSearchParams(query);
  const planId = params.get('plan');
  const revisionValue = params.get('revision');
  const mode = params.get('mode');
  if (planId === null && revisionValue === null && mode === null) return null;
  const revision = Number(revisionValue);
  if (params.getAll('plan').length !== 1 || params.getAll('revision').length !== 1 ||
      params.getAll('mode').length !== 1 || typeof planId !== 'string' || !planId ||
      planId.length > 128 || planId.includes('/') || !Number.isSafeInteger(revision) ||
      revision < 1 || String(revision) !== revisionValue || !['edit', 'start'].includes(mode)) {
    return { invalid: true };
  }
  return { planId, revision, mode };
}

function router() {
  if (!authReady) return;
  mkCloseQuestionPreview();
  runCleanups();
  window.scrollTo(0, 0);
  const raw = location.hash.replace(/^#\/?/, '');
  const questionIndex = raw.indexOf('?');
  const routePath = questionIndex >= 0 ? raw.slice(0, questionIndex) : raw;
  const routeQuery = questionIndex >= 0 ? raw.slice(questionIndex + 1) : '';
  const parts = routePath.split('/').filter(x => x !== '');
  const name = parts[0] || 'home';
  const arg = parts[1] ? decodeURIComponent(parts[1]) : '';

  switch (name) {
    case 'home':  screenHome(); break;
    case 'sets':  requireTeacher(screenSetList); break;
    case 'trash': requireTeacher(screenTrash); break;
    case 'make':  requireTeacher(() => screenMake(arg)); break;
    case 'play':  requireTeacher(() => screenPlay(arg, parsePlayClassPlanRoute(routeQuery))); break;
    case 'join':  screenJoin(arg); break;
    case 'live':  requireTeacher(() => screenDashboard(arg)); break;
    case 'admin': requireAdmin(screenAdmin); break;
    default:      screenHome();
  }
}

function stopTeacherDashboard() {
  const state = teacherDashboard;

    try { if (typeof unsubscribe === 'function') unsubscribe(); } catch (error) { console.warn(error); }
  });
  if (teacherDashboard === state) teacherDashboard = null;
  return true;
}

function clearTeacherDashboard() {
  stopTeacherDashboard();
  const panel = document.getElementById('teacher-dashboard');
  if (panel && typeof panel.remove === 'function') panel.remove();
