const DEFAULT_ADMIN_HASH = 'ac9689e2272427085e35b9d3e3e8bed88cb3434828b43b86fc0596cad4c6e270';

let adm = null;

function screenAdmin() {
  adm = {
    sessions: {}, resp: {}, sets: {},
    from: '', to: '', setFilter: '', gradeFilter: '', klassFilter: '',
    tab: 'sessions', loading: false, detail: null
  };
  onCleanup(() => { adm = null; });

  if (ssGet('vq_admin') === '1') admRenderShell();
  else admRenderLogin('');
}

function admRenderLogin(err) {
  APP().innerHTML = topbar() + '<div class="wrap" style="max-width:420px">' +
    '<div class="card" style="margin-top:40px;text-align:center;padding:30px 24px">' +
      '<div style="font-size:38px;margin-bottom:6px">🔐</div>' +
      '<h2 style="font-size:19px;margin-bottom:4px">관리자 로그인</h2>' +
      '<p style="color:var(--ink-2);font-size:13.5px;margin-bottom:18px">학생 개인정보가 포함된 화면입니다.</p>' +
      '<input type="password" id="adm-pw" placeholder="비밀번호" style="text-align:center">' +
      (err ? '<div style="color:var(--bad);font-size:13px;margin-top:10px;font-weight:600">' + esc(err) + '</div>' : '') +
      '<button class="btn primary lg block" style="margin-top:14px" onclick="admLogin()">로그인</button>' +
    '</div></div>';
  const inp = $('#adm-pw');
  inp.onkeydown = e => { if (e.key === 'Enter') admLogin(); };
  inp.focus();
}

function admLogin() {
  const pw = $('#adm-pw').value;
  if (!pw) return;
  Promise.all([sha256(pw), R('config/adminHash').once('value')]).then(([h, snap]) => {
    const want = snap.val() || DEFAULT_ADMIN_HASH;
    if (h !== want) { admRenderLogin('비밀번호가 올바르지 않습니다.'); return; }
    ssSet('vq_admin', '1');
    admRenderShell();
  }).catch(e => { console.error(e); admRenderLogin('확인 실패: ' + e.message); });
}
function admLogout() {
  ssDel('vq_admin');
  go('home');
}

        '<div class="filters">' +

          '<div class="fc"><label class="f">종료일</label><input type="date" id="adm-to" value="' + adm.to + '"></div>' +

          '<button class="btn sm" onclick="admTab(\'sessions\')">진행 기록</button>' +
          '<button class="btn sm" onclick="admTab(\'students\')">학생별 누적</button>' +
          '<button class="btn sm" onclick="admTab(\'classes\')">학년·반 집계</button>' +
          '<div style="flex:1"></div>' +
          '<button class="btn sm ghost" onclick="admTab(\'manage\')">⚙ 관리</button>' +
        '</div>' +
      '</div>' +

  $('#adm-to').onchange = e => { adm.to = e.target.value; };

  $('#adm-klass').oninput = e => { adm.klassFilter = e.target.value; admRenderBody(); };
  $('#adm-set').onchange = e => { adm.setFilter = e.target.value; admRenderBody(); };

function admTab(t) { adm.tab = t; admRenderBody(); }

/** 기간에 걸린 세션만 골라 응답을 불러온다 — 전체를 매번 읽지 않기 위해 */
function admLoad() {
  const body = $('#adm-body');
  body.innerHTML = '<div class="empty">불러오는 중…</div>';
  adm.loading = true;
  adm.detail = null;

  const fromTs = adm.from ? new Date(adm.from + 'T00:00:00').getTime() : 0;
  const toTs = adm.to ? new Date(adm.to + 'T23:59:59').getTime() : Infinity;

  R('sessions').once('value').then(snap => {
    const all = snap.val() || {};
    const picked = {};
    Object.keys(all).forEach(id => {
      const s = all[id];
      const ts = s.createdAt || 0;
      if (ts >= fromTs && ts <= toTs) picked[id] = s;
    });
    adm.sessions = picked;

    const ids = Object.keys(picked);
    if (ids.length > 300) {
      body.innerHTML = '<div class="card"><div class="notice">기간에 포함된 진행 기록이 ' + ids.length +
        '건입니다. 기간을 좁혀서 조회해 주세요.</div></div>';
      adm.loading = false;
      return;
    }
    return Promise.all(ids.map(id => R('responses/' + id).once('value').then(s => [id, s.val() || {}])))
      .then(pairs => {
        adm.resp = {};
        pairs.forEach(([id, v]) => { adm.resp[id] = v; });
        adm.loading = false;
        admFillSetOptions();
        admRenderBody();
      });
  }).catch(e => { console.error(e); body.innerHTML = '<div class="card"><div class="empty">불러오기 실패: ' + esc(e.message) + '</div></div>'; });
}

function admFillSetOptions() {
  const sel = $('#adm-set');
  if (!sel) return;
  const titles = {};
  Object.keys(adm.sessions).forEach(id => {
    const s = adm.sessions[id];
    if (s.setId) titles[s.setId] = s.setTitle || s.setId;
  });
  sel.innerHTML = '<option value="">전체 세트</option>' +
    Object.keys(titles).map(k => '<option value="' + esc(k) + '"' + (adm.setFilter === k ? ' selected' : '') + '>' + esc(titles[k]) + '</option>').join('');
}

/** 필터를 적용한 세션 목록 + 학생 단위로 펼친 응답 레코드 */
function admCompute() {
  const g = adm.gradeFilter ? Number(adm.gradeFilter) : null;
  const k = adm.klassFilter ? Number(adm.klassFilter) : null;

  const sessions = Object.keys(adm.sessions)
    .filter(id => !adm.setFilter || adm.sessions[id].setId === adm.setFilter)
    .map(id => Object.assign({ id: id }, adm.sessions[id]))
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  // 학생 키(학년_반_번호) → 누적
  const students = {};
  const perSession = {};

  sessions.forEach(sess => {
    const studs = sess.students || {};
    const resp = adm.resp[sess.id] || {};
    let sAns = 0, sCor = 0, sStu = 0;

    Object.keys(studs).forEach(sid => {
      const s = studs[sid];
      if (g !== null && Number(s.grade) !== g) return;
      if (k !== null && Number(s.klass) !== k) return;
      sStu++;

      let answered = 0, correct = 0;
      Object.keys(resp).forEach(qi => {
        const r = resp[qi][sid];
        if (r) { answered++; if (r.ok) correct++; }
      });
      sAns += answered; sCor += correct;

      const key = sid;
      if (!students[key]) {
        students[key] = {
          key: key, grade: Number(s.grade), klass: Number(s.klass), num: Number(s.num),
          name: s.name || '', names: {}, lastAt: 0,
          sessions: [], answered: 0, correct: 0
        };
      }
      const rec = students[key];
      rec.names[s.name || ''] = (rec.names[s.name || ''] || 0) + 1;
      if ((sess.createdAt || 0) >= rec.lastAt) { rec.lastAt = sess.createdAt || 0; rec.name = s.name || rec.name; }
      rec.answered += answered;
      rec.correct += correct;
      rec.sessions.push({
        id: sess.id, title: sess.setTitle || '', code: sess.code, label: sess.label || '',
        at: sess.createdAt || 0, answered: answered, correct: correct
      });
    });

    perSession[sess.id] = { students: sStu, answered: sAns, correct: sCor };
  });

  return { sessions: sessions, students: students, perSession: perSession };
}

function admRenderBody() {
  const body = $('#adm-body');
  if (!body || adm.loading) return;
  const data = admCompute();

  if (adm.detail) { body.innerHTML = admStudentDetail(data, adm.detail); return; }
  if (adm.tab === 'manage')  { body.innerHTML = admManage(data); return; }
  if (adm.tab === 'students'){ body.innerHTML = admStudentsView(data); return; }
  if (adm.tab === 'classes') { body.innerHTML = admClassesView(data); return; }
  body.innerHTML = admSessionsView(data);
}

function admSessionsView(d) {
  if (!d.sessions.length) return '<div class="card"><div class="empty">해당 기간에 진행 기록이 없습니다.</div></div>';
  let tS = 0, tA = 0, tC = 0;
  d.sessions.forEach(s => { const p = d.perSession[s.id]; tS += p.students; tA += p.answered; tC += p.correct; });

  return '<div class="stat-row">' +
      '<div class="stat"><div class="k">진행 반 수</div><div class="v">' + d.sessions.length + '</div></div>' +
      '<div class="stat"><div class="k">연인원</div><div class="v">' + tS + '</div></div>' +
      '<div class="stat"><div class="k">제출 응답</div><div class="v">' + tA + '</div></div>' +
      '<div class="stat"><div class="k">전체 정답률</div><div class="v">' + (tA ? Math.round(tC / tA * 100) : 0) + '%</div></div>' +
    '</div>' +
    '<div class="card"><h2>진행 기록</h2>' +
      '<div class="sub">최근 순입니다. 반 코드를 누르면 그 반의 대시보드로 갑니다.</div>' +
      '<div class="tbl-scroll"><table class="tbl"><thead><tr>' +
        '<th class="nosort">일시</th><th class="nosort">퀴즈 세트</th><th class="nosort">반 이름</th>' +
        '<th class="nosort">코드</th><th class="nosort ctr">학생</th><th class="nosort ctr">응답</th>' +
        '<th class="nosort ctr">정답률</th><th class="nosort ctr">상태</th>' +
      '</tr></thead><tbody>' +
      d.sessions.map(s => {
        const p = d.perSession[s.id];
        return '<tr>' +
          '<td>' + fmtDate(s.createdAt) + '</td>' +
          '<td>' + esc(s.setTitle || '') + '</td>' +
          '<td>' + esc(s.label || '') + '</td>' +
          '<td><a class="mono" href="#/live/' + esc(s.id) + '">' + esc(s.code || '') + '</a></td>' +
          '<td class="ctr">' + p.students + '</td>' +
          '<td class="ctr">' + p.answered + '</td>' +
          '<td class="ctr">' + (p.answered ? Math.round(p.correct / p.answered * 100) + '%' : '–') + '</td>' +
          '<td class="ctr">' + (s.status === 'ended' ? '<span class="tag mute">종료</span>' : '<span class="tag ok">진행</span>') + '</td>' +
        '</tr>';
      }).join('') +
      '</tbody></table></div>' +
      '<div style="margin-top:12px"><button class="btn sm" onclick="admExportSessions()">CSV 내려받기</button></div>' +
    '</div>';
}

    .sort((a, b) => (a.grade - b.grade) || (a.klass - b.klass) || (a.num - b.num));
}

function admClassesView(d) {
  const list = admStudentList(d);
  if (!list.length) return '<div class="card"><div class="empty">해당 조건의 기록이 없습니다.</div></div>';
  const agg = {};
  list.forEach(s => {
    const k = s.grade + '-' + s.klass;
    if (!agg[k]) agg[k] = { grade: s.grade, klass: s.klass, students: 0, answered: 0, correct: 0 };
    agg[k].students++;
    agg[k].answered += s.answered;
    agg[k].correct += s.correct;
  });
  const rows = Object.keys(agg).map(k => agg[k]).sort((a, b) => (a.grade - b.grade) || (a.klass - b.klass));

  return '<div class="card"><h2>학년·반 집계</h2>' +
    '<div class="sub">기간 내 응답 전체를 학급 단위로 합산했습니다.</div>' +
    '<div class="tbl-scroll"><table class="tbl"><thead><tr>' +
      '<th class="nosort">학년</th><th class="nosort">반</th><th class="nosort ctr">참여 학생</th>' +
      '<th class="nosort ctr">응답</th><th class="nosort ctr">정답</th><th class="nosort ctr">정답률</th><th class="nosort">분포</th>' +
    '</tr></thead><tbody>' +
    rows.map(r => {
      const pct = r.answered ? Math.round(r.correct / r.answered * 100) : 0;
      return '<tr>' +
        '<td>' + r.grade + '</td><td>' + r.klass + '</td>' +
        '<td class="ctr">' + r.students + '</td>' +
        '<td class="ctr">' + r.answered + '</td>' +
        '<td class="ctr">' + r.correct + '</td>' +
        '<td class="ctr">' + pct + '%</td>' +
        '<td style="min-width:160px"><span class="track" style="display:block;height:14px;background:#eceef4;border-radius:4px;overflow:hidden">' +
          '<i style="display:block;height:100%;width:' + pct + '%;background:var(--accent)"></i></span></td>' +
      '</tr>';
    }).join('') +
    '</tbody></table></div></div>';

      '<h2>비밀번호 변경</h2>' +

        '· 비밀번호는 브라우저에서 확인하는 방식이라 화면 접근을 막아줄 뿐입니다. 데이터베이스 자체를 잠그려면 Firebase 인증 도입이 필요합니다.<br>' +

function admChangePw() {
  const a = $('#adm-newpw').value, b = $('#adm-newpw2').value;
  if (!a || a.length < 4) { alert('비밀번호는 4자 이상이어야 합니다.'); return; }
  if (a !== b) { alert('두 입력이 다릅니다.'); return; }
  sha256(a).then(h => R('config/adminHash').set(h)).then(() => {
    toast('비밀번호를 변경했습니다');
    $('#adm-newpw').value = ''; $('#adm-newpw2').value = '';
  }).catch(e => alert('변경 실패: ' + e.message));
}

function admPurge() {
  const d = admCompute();
  if (!d.sessions.length) { alert('삭제할 기록이 없습니다.'); return; }
  const msg = adm.from + ' ~ ' + adm.to + ' 기간의 진행 기록 ' + d.sessions.length + '건과 모든 학생 응답을 영구 삭제합니다.\n되돌릴 수 없습니다. 계속하려면 아래에 삭제 를 입력하세요.';
  const typed = prompt(msg, '');
  if (typed === null) return;
  if (typed.trim() !== '삭제') { alert('취소되었습니다.'); return; }

  const updates = {};
  d.sessions.forEach(s => {
    updates['sessions/' + s.id] = null;
    updates['responses/' + s.id] = null;
    if (s.code) updates['codes/' + s.code] = null;
  });
  R('').update(updates).then(() => {
    toast(d.sessions.length + '건을 삭제했습니다');
    admLoad();
  }).catch(e => alert('삭제 실패: ' + e.message));
}

function admExportSessions() {
  const d = admCompute();
  const out = [['진행 일시', '퀴즈 세트', '반 이름', '반 코드', '참여 학생', '제출 응답', '정답 수', '정답률(%)', '상태']];
  d.sessions.forEach(s => {
    const p = d.perSession[s.id];
    out.push([fmtDate(s.createdAt), s.setTitle || '', s.label || '', s.code || '',
      p.students, p.answered, p.correct, p.answered ? Math.round(p.correct / p.answered * 100) : '',
      s.status === 'ended' ? '종료' : '진행']);
  });
  downloadCSV('영상퀴즈_진행기록_' + adm.from + '_' + adm.to + '.csv', out);
}

function admExportStudents() {
  const d = admCompute();
  const out = [['학년', '반', '번호', '이름', '참여 횟수', '제출 응답', '정답 수', '정답률(%)']];
  admStudentList(d).forEach(s => {
    out.push([s.grade, s.klass, s.num, s.name, s.sessions.length, s.answered, s.correct,
      s.answered ? Math.round(s.correct / s.answered * 100) : '']);
  });
  downloadCSV('영상퀴즈_학생별누적_' + adm.from + '_' + adm.to + '.csv', out);
}

/* ══════════════════════════════════════════════════════════════════════
   부팅 — 익명 로그인 후 라우팅

   교사도 학생도 아무것도 로그인하지 않습니다. 페이지를 여는 순간 브라우저가
   조용히 익명 계정을 발급받고, 데이터베이스 규칙(auth != null)은 그 계정만
   통과시킵니다. 주소만 알아낸 외부인이 학생 이름을 긁어가는 것을 막기 위한 장치입니다.
   ══════════════════════════════════════════════════════════════════════ */
function bootWithAuth() {
  APP().innerHTML = topbar() + '<div class="wrap"><div class="empty">연결 중…</div></div>';

  firebase.auth().onAuthStateChanged(user => {
    if (user && !authReady) { authReady = true; router(); }
  });

  firebase.auth().signInAnonymously().catch(err => {
    console.error(err);
    // operation-not-allowed = 익명 공급자만 꺼져 있음 / configuration-not-found = Authentication 자체가 미설정
    const code = String(err.code || '');
    const needsEnable = code.indexOf('operation-not-allowed') >= 0 || code.indexOf('configuration-not-found') >= 0;
    APP().innerHTML = topbar() + '<div class="wrap"><div class="card">' +
      '<h2>접속할 수 없습니다</h2>' +
      '<div class="notice" style="margin-top:12px">' +
        (needsEnable
          ? 'Firebase에서 <b>익명 로그인</b>이 아직 켜져 있지 않습니다.<br>' +
            'Firebase 콘솔 → <b>Authentication → Sign-in method → 익명</b>을 사용 설정한 뒤 새로고침하세요.'
          : '오류: ' + esc(err.message)) +
      '</div>' +
      '<button class="btn primary" onclick="location.reload()">새로고침</button>' +
    '</div></div>';
  });
}
bootWithAuth();
</script>
