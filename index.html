/** 교사 화면은 교실 앞에 투사되므로 학생 화면과 같은 시점에만 정답을 드러낸다.
    (instant 모드는 학생마다 공개 시점이 달라, 교사가 직접 누를 때까지 기다린다) */
function plRevealed() {
  if (!pl) return false;
  const mode = pl.set.settings.revealMode;
  if (mode === 'never') return false;
  if (pl.live.revealed) return true;
  if (mode === 'timer') {
    if (!pl.live.openedAt) return false;
    return (serverNow() - pl.live.openedAt) / 1000 >= pl.set.settings.revealDelaySec;
  }
  return false;
}

/** 텍스트 답안 요약 — 단답형은 같은 답끼리 묶어 세고, 서술형은 답을 그대로 보여준다 */
function plTextSummary(q, resp) {
  const keys = Object.keys(resp);
  if (!keys.length) return '<div class="ov-explain">아직 제출한 학생이 없습니다.</div>';

  if (qType(q) === 'short') {
    const groups = {};
    keys.forEach(k => {
      const raw = (resp[k].txt || '').trim();
      const key = normAnswerText(raw);
      if (!groups[key]) groups[key] = { label: raw, n: 0, ok: !!resp[k].ok };
      groups[key].n++;
    });
    const rows = Object.keys(groups).map(k => groups[k]).sort((a, b) => b.n - a.n);
    return '<div class="ov-choices">' + rows.map(g =>
      '<div class="ov-choice' + (g.ok ? ' correct' : '') + '">' +
        '<span class="lt">' + (g.ok ? '○' : '×') + '</span>' +
        '<span>' + esc(g.label) + '</span>' +
        '<span class="cnt">' + g.n + '명</span>' +
      '</div>').join('') +
      '</div><div class="ov-explain">인정 답안: ' + esc((q.accept || []).join(', ')) + '</div>';
  }

  // 서술형 — 화면에 다 띄우면 넘치므로 앞의 몇 개만
  const sample = keys.slice(0, 6);
  return '<div>' + sample.map(k =>
      '<div class="ov-explain" style="margin-top:8px">' + esc((resp[k].txt || '').slice(0, 200)) + '</div>').join('') +
    (keys.length > sample.length
      ? '<div class="ov-explain" style="margin-top:8px;opacity:.7">외 ' + (keys.length - sample.length) + '명 — 전체는 대시보드에서 보세요</div>'
      : '') + '</div>';
}

function plRenderOverlayCounts() {
  const ov = document.getElementById('overlay');
  if (!ov || !pl || pl.live.q < 0) return;
  const i = pl.live.q, q = pl.set.questions[i];
  if (!q) return;
  const resp = pl.responses[i] || {};
  const keys = Object.keys(resp);
  const total = keys.length;
  const nStu = Math.max(Object.keys(pl.students).length, total);

  const type = qType(q);
  const counts = q.choices.map(() => 0);
  keys.forEach(k => {
    if (type === 'multi') parseMulti(resp[k].cs).forEach(j => { if (counts[j] !== undefined) counts[j]++; });
    else { const c = Number(resp[k].c); if (counts[c] !== undefined) counts[c]++; }
  });

  const cntEl = ov.querySelector('#ov-count');
  if (cntEl) cntEl.textContent = total + ' / ' + nStu + ' 제출';

  // 공개 전에는 정답 표시도, 보기별 응답 분포도 감춘다.
  // 이 화면은 교실 앞에 띄워 두는 것이라 둘 다 답을 알려주는 단서가 된다.
  const revealed = plRevealed();
  pl.uiRevealed = revealed;

  if (isTextType(q)) {
    // 단답형·서술형은 학생들이 쓴 답을 공개 시점에 모아 보여준다
    const wrap = ov.querySelector('#ov-textwrap');
    if (wrap) wrap.innerHTML = revealed ? plTextSummary(q, resp)
      : '<div class="ov-explain" style="opacity:.75">학생들이 답을 쓰는 중입니다. 공개하면 여기에 모아 보여줍니다.</div>';
  } else {
    const isAns = j => (type === 'multi') ? ((q.answers || []).indexOf(j) >= 0) : (j === Number(q.answer));
    $$('.ov-choice', ov).forEach(el => {
      const j = Number(el.dataset.c);
      const pct = (revealed && total) ? Math.round(counts[j] / total * 100) : 0;
      el.querySelector('.bar').style.width = pct + '%';
      el.querySelector('[data-cnt]').textContent = (revealed && total) ? counts[j] + '명 (' + pct + '%)' : '';
      el.classList.toggle('correct', revealed && isAns(j));
    });
  }
  const ex = ov.querySelector('#ov-explain-top');
  if (ex) ex.style.display = revealed ? '' : 'none';
  const rv = ov.querySelector('#ov-reveal');
  if (rv) {
    rv.disabled = revealed;
    rv.textContent = revealed ? '공개됨' : ('✅ ' + (pl.set.settings.revealMode === 'manual' ? '정답 공개' : '지금 공개'));
  }
}

/** 남은 시간 표시 — 서버 시각 기준이라 학생 화면과 어긋나지 않는다 */
function plTimerTick() {
  const ov = document.getElementById('overlay');
  if (!ov || !pl || pl.live.q < 0) return;

  // timer 모드는 시간이 차면 자동 공개되므로, 그 순간 화면을 갱신해 준다
  if (plRevealed() !== pl.uiRevealed) plRenderOverlayCounts();

  const el = ov.querySelector('#ov-timer'), num = ov.querySelector('#ov-timer-n');
  const limit = Number(pl.live.limitSec) || 0;
  if (!limit || !pl.live.openedAt) { if (el) el.style.display = 'none'; return; }
  const left = Math.max(0, limit - (serverNow() - pl.live.openedAt) / 1000);
  el.style.display = '';
  num.textContent = Math.ceil(left) + '초';
  el.classList.toggle('urgent', left <= 5);
}

/* ══════════════════════════════════════════════════════════════════════
   7. ③ 학생 참여 화면
   ══════════════════════════════════════════════════════════════════════ */
let st = null;

function screenStudent(codeArg) {
  st = {
    code: (codeArg || '').toUpperCase(),
    sessionId: null, session: null, set: null,
    sid: null, me: null,
    live: { q: -1, openedAt: 0, revealed: false, limitSec: 0 },
    myAnswers: {},          // { 문항index: {c, ok, ms} }
    sel: null, multiSel: [], draft: '', submitted: false, board: {},
    uiRevealed: false, uiLocked: false, uiQ: -2
  };
  onCleanup(() => { st = null; });

  if (st.code) stLookupCode(st.code);
  else stRenderCodeForm('');
}

function stShell(inner) {
  APP().innerHTML = topbar() + '<div class="stu-wrap">' + inner + '</div>';
}

function stRenderCodeForm(err) {
  const last = lsGet('vq_last_code');
  stShell(
    '<div class="card" style="text-align:center;padding:30px 22px">' +
      '<div style="font-size:40px;margin-bottom:6px">🙋</div>' +
      '<h2 style="font-size:20px;margin-bottom:4px">반 코드 입력</h2>' +
      '<p style="color:var(--ink-2);font-size:14px;margin-bottom:18px">선생님 화면에 뜬 6자리 코드를 입력하세요.</p>' +
      '<input type="text" id="st-code" class="mono" maxlength="6" autocapitalize="characters" autocomplete="off" ' +
        'value="' + esc(st.code || last) + '" placeholder="ABC234" ' +
        'style="text-align:center;font-size:32px;letter-spacing:.18em;font-weight:800;padding:14px">' +
      (err ? '<div style="color:var(--bad);font-size:13px;margin-top:10px;font-weight:600">' + esc(err) + '</div>' : '') +
      '<button class="btn primary lg block" style="margin-top:14px" onclick="stSubmitCode()">입장하기</button>' +
    '</div>' +
    '<div class="privacy-note">이 도구는 수업 참여 확인을 위해 <b>학년·반·번호·이름</b>과 문항별 응답을 저장합니다. ' +
      '저장된 자료는 담당 교사와 관리자만 조회하며, 학교 보관 정책에 따라 삭제됩니다.</div>'
  );
  const inp = $('#st-code');
  inp.oninput = e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); };
  inp.onkeydown = e => { if (e.key === 'Enter') stSubmitCode(); };
  inp.focus();
}

function stSubmitCode() {
  const v = ($('#st-code').value || '').trim().toUpperCase();
  if (v.length !== 6) { stRenderCodeForm('코드는 6자리입니다.'); return; }
  stLookupCode(v);
}

function stLookupCode(code) {
  stShell('<div class="empty">반을 찾는 중…</div>');
  R('codes/' + code).once('value').then(snap => {
    const v = snap.val();
    if (!v || !v.sessionId) { st.code = ''; stRenderCodeForm('그런 반 코드가 없습니다. 다시 확인해 주세요.'); return; }
    st.code = code;
    st.sessionId = v.sessionId;
    lsSet('vq_last_code', code);
    return R('sessions/' + v.sessionId).once('value').then(s2 => {
      const sess = s2.val();
      if (!sess) { stRenderCodeForm('반 정보를 불러오지 못했습니다.'); return; }
      st.session = sess;
      return R('quiz_sets/' + sess.setId).once('value').then(s3 => {
        st.set = normSet(s3.val());
        if (!st.set) { stRenderCodeForm('퀴즈 세트를 불러오지 못했습니다.'); return; }
        stRenderIdentityForm('');
      });
    });
  }).catch(e => { console.error(e); stRenderCodeForm('접속 오류: ' + e.message); });
}

function stRenderIdentityForm(err) {
  let saved = {};
  try { saved = JSON.parse(lsGet('vq_student', '{}')); } catch (e) {}
  stShell(
    '<div class="card">' +
      '<div style="font-size:13px;color:var(--ink-2);margin-bottom:2px">' + esc(st.code) +
        (st.session.label ? ' · ' + esc(st.session.label) : '') + '</div>' +
      '<h2 style="font-size:19px;margin-bottom:14px">' + esc(st.set.title) + '</h2>' +
      '<div class="row">' +
        '<div class="col" style="flex:1 1 80px"><label class="f">학년</label>' +
          '<input type="number" id="st-grade" inputmode="numeric" min="1" max="6" value="' + esc(saved.grade || '') + '"></div>' +
        '<div class="col" style="flex:1 1 80px"><label class="f">반</label>' +
          '<input type="number" id="st-klass" inputmode="numeric" min="1" max="30" value="' + esc(saved.klass || '') + '"></div>' +
        '<div class="col" style="flex:1 1 80px"><label class="f">번호</label>' +
          '<input type="number" id="st-num" inputmode="numeric" min="1" max="60" value="' + esc(saved.num || '') + '"></div>' +
      '</div>' +
      '<div class="field" style="margin-top:12px"><label class="f">이름</label>' +
        '<input type="text" id="st-name" autocomplete="off" value="' + esc(saved.name || '') + '" placeholder="홍길동"></div>' +
      (err ? '<div style="color:var(--bad);font-size:13px;margin-bottom:10px;font-weight:600">' + esc(err) + '</div>' : '') +
      '<button class="btn primary lg block" onclick="stJoin()">입장</button>' +
      '<button class="btn ghost sm block" style="margin-top:8px" onclick="go(\'join\')">다른 반 코드 입력</button>' +
    '</div>' +
    '<div class="privacy-note">입력한 학년·반·번호·이름과 응답 내용이 저장됩니다. 본인 정보를 정확히 입력해 주세요.</div>'
  );
  $('#st-name').onkeydown = e => { if (e.key === 'Enter') stJoin(); };
}

function stJoin() {
  const grade = Number($('#st-grade').value);
  const klass = Number($('#st-klass').value);
  const num   = Number($('#st-num').value);
  const name  = ($('#st-name').value || '').trim();
  if (!grade || !klass || !num) { stRenderIdentityForm('학년·반·번호를 모두 입력하세요.'); return; }
  if (!name) { stRenderIdentityForm('이름을 입력하세요.'); return; }

  // 학년_반_번호를 키로 삼아, 새로고침하거나 기기를 바꿔도 같은 학생으로 이어지게 한다
  const sid = grade + '_' + klass + '_' + num;
  const me = { grade: grade, klass: klass, num: num, name: name };
  lsSet('vq_student', JSON.stringify(me));

  R('sessions/' + st.sessionId + '/students/' + sid).once('value').then(snap => {
    const cur = snap.val();
    if (cur && cur.name && cur.name !== name) {
      if (!confirm(grade + '학년 ' + klass + '반 ' + num + '번은 이미 "' + cur.name + '" 학생으로 등록되어 있습니다.\n\n번호를 잘못 입력한 것이 아니라면 [확인]을 눌러 "' + name + '"(으)로 바꿉니다.')) return;
    }
    st.sid = sid;
    st.me = me;
    return R('sessions/' + st.sessionId + '/students/' + sid)
      .set(Object.assign({}, me, { joinedAt: SV_TS }))
      .then(() => R('responses/' + st.sessionId).once('value'))
      .then(rs => {
        // 새로고침 대비 — 내가 이미 낸 답을 복원한다
        const all = rs.val() || {};
        Object.keys(all).forEach(qi => {
          const r = all[qi] && all[qi][sid];
          if (!r) return;
          st.myAnswers[Number(qi)] = {
            c: r.c, cs: r.cs, txt: r.txt,
            ok: (r.ok === undefined || r.ok === null) ? null : !!r.ok,   // null = 서술형 미채점
            ms: r.ms || 0
          };
        });
        stStartWatching();
      });
  }).catch(e => { console.error(e); stRenderIdentityForm('입장 실패: ' + e.message); });
}

function stStartWatching() {
  watch(R('sessions/' + st.sessionId + '/live'), 'value', snap => {
    const nl = Object.assign({ q: -1, openedAt: 0, revealed: false, limitSec: 0 }, snap.val() || {});
    const changed = nl.q !== st.live.q || nl.openedAt !== st.live.openedAt;
    st.live = nl;
    if (changed) {
      const prev = st.myAnswers[nl.q];
      st.sel = prev ? prev.c : null;
      st.multiSel = prev ? parseMulti(prev.cs) : [];
      st.draft = prev ? (prev.txt || '') : '';
      st.submitted = !!prev;
    }
    stRender();
  });
  watch(R('sessions/' + st.sessionId + '/status'), 'value', snap => {
    if (st.session) st.session.status = snap.val() || 'live';
    stRender();
  });
  // 교사 화면이 올려 주는 점수 요약만 받는다 (남의 답은 내려받지 않아 베낄 수 없다)
  watch(R('sessions/' + st.sessionId + '/board'), 'value', snap => {
    st.board = snap.val() || {};
    stRender();
  });
  every(250, stTick);
  stRender();
}

/** 설정된 공개 방식에 따라 지금 정답을 보여줘도 되는지 */
function stRevealed() {
  const mode = st.set.settings.revealMode;
  if (mode === 'never') return false;
  if (mode === 'instant') return st.submitted;
  if (st.live.revealed) return true;               // 교사가 직접 공개
  if (mode === 'timer') {
    if (!st.live.openedAt) return false;
    return (serverNow() - st.live.openedAt) / 1000 >= st.set.settings.revealDelaySec;
  }
  return false;
}
/** 제한 시간이 지났거나 이미 제출했으면 더 못 고른다 */
function stLocked() {
  if (st.submitted) return true;
  const limit = Number(st.live.limitSec) || 0;
  if (!limit || !st.live.openedAt) return false;
  return (serverNow() - st.live.openedAt) / 1000 >= limit;
}
function stLeftRatio() {
  const limit = Number(st.live.limitSec) || 0;
  if (!limit || !st.live.openedAt) return null;
  const left = limit - (serverNow() - st.live.openedAt) / 1000;
  return { left: Math.max(0, left), ratio: Math.max(0, Math.min(1, left / limit)) };
}

/** 매 프레임 전체를 다시 그리면 조작감이 나빠지므로, 바뀐 것만 갱신한다 */
function stTick() {
  if (!st || !st.set || st.live.q < 0) return;
  const bar = $('#st-timer');
  const t = stLeftRatio();
  if (bar && t) {
    bar.querySelector('i').style.width = (t.ratio * 100) + '%';
    bar.classList.toggle('urgent', t.left <= 5);
    const n = $('#st-left');
    if (n) n.textContent = Math.ceil(t.left) + '초';
  }
  const rev = stRevealed(), lock = stLocked();
  if (rev !== st.uiRevealed || lock !== st.uiLocked) stRender();
}

function stRender() {
  if (!st || !st.set || !st.sid) return;
  const set = st.set, i = st.live.q;
  const ended = st.session && st.session.status === 'ended';
  const showScore = set.settings.revealMode !== 'never';

  const keys = Object.keys(st.myAnswers);
  const answered = keys.length;
  // 서술형은 아직 채점 전이므로 정답률 계산에서 뺀다
  const gradedKeys = keys.filter(k => st.myAnswers[k].ok !== null && st.myAnswers[k].ok !== undefined);
  const correct = gradedKeys.filter(k => st.myAnswers[k].ok).length;
  const nUngraded = answered - gradedKeys.length;

  const header =
    '<div class="stu-status">' +
      '<span class="tag">' + esc(st.code) + '</span>' +
      '<span>' + esc(st.me.grade) + '-' + esc(st.me.klass) + '-' + esc(st.me.num) + ' ' + esc(st.me.name) + '</span>' +
      '<span class="spacer"></span>' +
      (showScore
        ? '<span style="color:var(--ink-2)">' + correct + ' / ' + gradedKeys.length + ' 정답' +
            (nUngraded ? ' <span style="color:var(--ink-3)">(채점 전 ' + nUngraded + ')</span>' : '') + '</span>'
        : '<span style="color:var(--ink-2)">' + answered + '문항 제출</span>') +
    '</div>';

  if (ended) {
    stShell(header +
      '<div class="card"><div class="stu-wait">' +
        '<div class="big">🎉</div><h2>수업이 끝났습니다</h2>' +
        '<p>' + esc(set.title) + '</p>' +
        (showScore
          ? '<div class="result-banner ok" style="margin-top:18px">' + gradedKeys.length + '문항 중 ' + correct + '개 정답' +
              (function () {
                const rk = stRank();
                return rk ? '<div style="font-size:14px;font-weight:700;margin-top:6px">' + rk.total + '명 중 ' + rk.rank + '등</div>' : '';
              })() +
              (nUngraded ? '<div style="font-size:13px;font-weight:600;margin-top:6px;color:var(--ink-2)">서술형 ' + nUngraded + '문항은 선생님이 채점합니다</div>' : '') + '</div>'
          : '<div class="result-banner mute" style="margin-top:18px">' + answered + '문항 제출 완료</div>') +
      '</div>' +
      stMyStat(set, answered, correct, gradedKeys.length, nUngraded, showScore) +
      '</div>');
    st.uiQ = -3;
    return;
  }

  if (i < 0) {
    stShell(header +
      '<div class="card">' +
        '<div class="stu-wait" style="padding:38px 18px 8px">' +
          '<div class="big">📺</div>' +
          '<h2>선생님 화면을 보세요</h2>' +
          '<p>퀴즈가 나오면 이 화면에 자동으로 뜹니다.</p>' +
        '</div>' +
        stMyStat(set, answered, correct, gradedKeys.length, nUngraded, showScore) +
      '</div>');
    st.uiQ = -1;
    return;
  }

  const q = set.questions[i];
  if (!q) return;
  const revealed = stRevealed();
  const locked = stLocked();
  st.uiRevealed = revealed; st.uiLocked = locked; st.uiQ = i;

  const t = stLeftRatio();
  const my = st.myAnswers[i];

  const type = qType(q);
  const banner = stBanner(q, my, revealed, locked);

  stShell(header +
    '<div class="card">' +
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">' +
        '<span class="tag">문항 ' + (i + 1) + ' / ' + set.questions.length + '</span>' +
        (type !== 'choice' ? '<span class="tag qtype">' + QTYPES[type].split(' —')[0] + '</span>' : '') +
        (t ? '<span class="spacer" style="flex:1"></span><span style="font-size:13px;font-weight:700;color:' +
             (t.left <= 5 ? 'var(--bad)' : 'var(--ink-2)') + '" id="st-left">' + Math.ceil(t.left) + '초</span>' : '') +
      '</div>' +
      (t ? '<div class="stu-timer' + (t.left <= 5 ? ' urgent' : '') + '" id="st-timer"><i style="width:' + (t.ratio * 100) + '%"></i></div>' : '') +
      banner +
      (hasImage(q) ? '<img class="stu-q-img" id="st-img" alt="문항 이미지">' : '') +
      '<div class="stu-q">' + esc(q.text) + '</div>' +
      // 해설은 공개 직후 가장 먼저 눈에 들어와야 하므로 보기 위쪽에 크게 놓는다
      (revealed && q.explain ? '<div class="stu-explain-top">💡 ' + esc(q.explain) + '</div>' : '') +
      stAnswerUI(q, i, my, revealed, locked) +
      '<div class="privacy-note">입력한 학년·반·번호·이름과 응답이 저장됩니다.</div>' +
    '</div>');

  if (hasImage(q)) stShowImage(q, i);
}

/** 내 순위 — 교사 화면이 올린 점수 요약(board)으로만 계산한다 */
function stRank() {
  const b = st.board || {};
  const keys = Object.keys(b);
  if (!keys.length || b[st.sid] === undefined) return null;
  const my = Number(b[st.sid]) || 0;
  return { rank: keys.filter(k => (Number(b[k]) || 0) > my).length + 1, total: keys.length };
}

/** 대기 화면·종료 화면에 쓰는 내 진행 현황 */
function stMyStat(set, answered, correct, graded, ungraded, showScore) {
  const totalQ = set.questions.length;
  const left = Math.max(0, totalQ - answered);
  const rk = showScore ? stRank() : null;

  return '<div class="stu-mystat">' +
      (showScore
        ? '<div class="box ok"><div class="k">맞힌 개수</div><div class="v">' + correct + '<small> / ' + graded + '</small></div></div>'
        : '<div class="box"><div class="k">제출</div><div class="v">' + answered + '<small> / ' + totalQ + '</small></div></div>') +
      '<div class="box"><div class="k">남은 문항</div><div class="v">' + left + '<small>개</small></div></div>' +
      (rk
        ? '<div class="box rank"><div class="k">내 순위</div><div class="v">' + rk.rank + '<small> / ' + rk.total + '명</small></div></div>'
        : '<div class="box"><div class="k">푼 문항</div><div class="v">' + answered + '<small> / ' + totalQ + '</small></div></div>') +
    '</div>' +
    (ungraded && showScore
      ? '<div class="hint" style="text-align:center;margin-top:8px">서술형 ' + ungraded + '문항은 선생님이 채점한 뒤 점수에 들어갑니다</div>'
      : '') +
    (left === 0 && answered
      ? '<div class="hint" style="text-align:center;margin-top:8px">문항을 모두 풀었습니다. 수고했어요!</div>'
      : '');
}

/** 문항 이미지는 그 문항이 열릴 때만 내려받는다 */
function stShowImage(q, i) {
  const el = $('#st-img');
  if (!el) return;
  if (q.imgUrl) { el.src = q.imgUrl; return; }
  loadQuestionImage(st.session.setId, i).then(src => {
    const now = $('#st-img');
    if (now && src) now.src = src;
  });
}

function stBanner(q, my, revealed, locked) {
  const type = qType(q);
  if (type === 'long') {
    if (my) return '<div class="result-banner mute">✅ 제출 완료 — 선생님이 나중에 확인합니다</div>';
    if (locked) return '<div class="result-banner mute">⏱ 시간이 끝났습니다</div>';
    return '';
  }
  if (revealed && my) {
    return my.ok
      ? '<div class="result-banner ok">⭕ 정답입니다</div>'
      : '<div class="result-banner bad">❌ 아쉽네요 — 정답은 ' + esc(correctLabel(q)) + '</div>';
  }
  if (revealed && !my) return '<div class="result-banner mute">정답은 ' + esc(correctLabel(q)) + '입니다</div>';
  if (my) return '<div class="result-banner mute">✅ 제출 완료 — 잠시 기다리세요</div>';
  if (locked) return '<div class="result-banner mute">⏱ 시간이 끝났습니다</div>';
  return '';
}

/** 정답을 사람이 읽는 형태로 */
function correctLabel(q) {
  const type = qType(q);
  if (type === 'short') return (q.accept || [])[0] || '';
  if (type === 'multi') return (q.answers || []).map(j => LETTERS[j]).join(' ') + '번';
  if (type === 'ox') return ['O', 'X'][q.answer] || '';
  return LETTERS[q.answer] + '번';
}

/* ── 유형별 학생 응답 UI ───────────────────────────────────────────────── */
function stAnswerUI(q, i, my, revealed, locked) {
  const type = qType(q);

  if (type === 'short' || type === 'long') {
    if (my) {
      return '<div class="stu-answer-box">' + esc(my.txt || '') + '</div>' +
        (revealed && type === 'short'
          ? '<div class="hint">인정 답안: ' + esc((q.accept || []).join(', ')) + '</div>' : '');
    }
    if (locked) return '<div class="hint">응답 시간이 지났습니다.</div>';
    // 타이머 때문에 화면이 다시 그려져도 쓰던 글이 날아가지 않도록 st.draft 에 담아 둔다
    const draft = st.draft || '';
    return (type === 'short'
        ? '<input type="text" class="stu-text-input" id="st-txt" autocomplete="off" value="' + esc(draft) + '" ' +
          'oninput="st.draft=this.value" placeholder="답을 입력하세요" onkeydown="if(event.key===\'Enter\')stSubmitText()">'
        : '<textarea class="stu-text-input" id="st-txt" rows="5" oninput="st.draft=this.value" ' +
          'placeholder="생각을 자유롭게 적어 주세요">' + esc(draft) + '</textarea>') +
      '<button class="btn primary lg block" style="margin-top:10px" onclick="stSubmitText()">제출하기</button>';
  }

  if (type === 'multi') {
    const picked = my ? parseMulti(my.cs) : (st.multiSel || []);
    return q.choices.map((c, j) => {
      let cls = '';
      if (revealed) {
        if ((q.answers || []).indexOf(j) >= 0) cls = ' correct';
        else if (picked.indexOf(j) >= 0) cls = ' wrong';
      } else if (picked.indexOf(j) >= 0) cls = ' sel';
      return '<button class="stu-choice' + cls + '" ' + (locked || my ? 'disabled' : '') + ' onclick="stToggleMulti(' + j + ')">' +
        '<span class="lt">' + (picked.indexOf(j) >= 0 ? '✓' : LETTERS[j]) + '</span><span>' + esc(c) + '</span></button>';
    }).join('') +
    (my || locked ? '' :
      '<button class="btn primary lg block" style="margin-top:10px" onclick="stSubmitMulti()">' +
        (picked.length ? picked.length + '개 골랐어요 — 제출하기' : '고른 뒤 제출하세요') + '</button>');
  }

  // 객관식 / O·X
  return q.choices.map((c, j) => {
    let cls = '';
    if (revealed) {
      if (j === q.answer) cls = ' correct';
      else if (my && Number(my.c) === j) cls = ' wrong';
    } else if (st.sel === j) cls = ' sel';
    return '<button class="stu-choice' + cls + '" ' + (locked ? 'disabled' : '') + ' onclick="stAnswer(' + j + ')">' +
      '<span class="lt">' + (type === 'ox' ? ['O', 'X'][j] : LETTERS[j]) + '</span><span>' + esc(c) + '</span></button>';
  }).join('');
}

/** 응답을 서버에 보내고 화면을 갱신하는 공통 경로 */
function stSend(payload, localRec) {
  const i = st.live.q;
  st.submitted = true;
  st.myAnswers[i] = localRec;
  stRender();
  R('responses/' + st.sessionId + '/' + i + '/' + st.sid)
    .set(payload)
    .catch(e => {
      console.error(e);
      toast('전송 실패 — 다시 시도해 주세요');
      st.submitted = false;
      delete st.myAnswers[i];
      stRender();
    });
}

function stAnswer(j) {
  if (!st || st.live.q < 0 || stLocked()) return;
  const i = st.live.q, q = st.set.questions[i];
  if (!q || !q.choices[j]) return;
  const ok = (j === Number(q.answer));
  const ms = st.live.openedAt ? Math.max(0, serverNow() - st.live.openedAt) : 0;
  st.sel = j;
  stSend({ c: j, ok: ok, at: SV_TS, ms: ms }, { c: j, ok: ok, ms: ms });
}

function stToggleMulti(j) {
  if (!st || stLocked() || st.myAnswers[st.live.q]) return;
  st.multiSel = st.multiSel || [];
  const at = st.multiSel.indexOf(j);
  if (at >= 0) st.multiSel.splice(at, 1); else st.multiSel.push(j);
  stRender();
}

function stSubmitMulti() {
  if (!st || st.live.q < 0 || stLocked()) return;
  const i = st.live.q, q = st.set.questions[i];
  const picked = st.multiSel || [];
  if (!picked.length) { toast('하나 이상 고른 뒤 제출하세요'); return; }
  const ok = multiCorrect(q, picked);
  const ms = st.live.openedAt ? Math.max(0, serverNow() - st.live.openedAt) : 0;
  const cs = fmtMulti(picked);
  stSend({ cs: cs, ok: ok, at: SV_TS, ms: ms }, { cs: cs, ok: ok, ms: ms });
}

function stSubmitText() {
  if (!st || st.live.q < 0 || stLocked()) return;
  const el = $('#st-txt');
  if (!el) return;
  const txt = String(el.value || '').trim();
  if (!txt) { toast('답을 입력한 뒤 제출하세요'); return; }
  const i = st.live.q, q = st.set.questions[i];
  const type = qType(q);
  const ms = st.live.openedAt ? Math.max(0, serverNow() - st.live.openedAt) : 0;
  const capped = txt.slice(0, type === 'short' ? 100 : 1000);

  if (type === 'short') {
    const ok = shortCorrect(q, capped);
    stSend({ txt: capped, ok: ok, at: SV_TS, ms: ms }, { txt: capped, ok: ok, ms: ms });
  } else {
    // 서술형은 채점하지 않고 보낸다 (ok 없음 = 미채점)
    stSend({ txt: capped, at: SV_TS, ms: ms }, { txt: capped, ok: null, ms: ms });
  }
}

/* ══════════════════════════════════════════════════════════════════════
   8. ④ 실시간 결과 대시보드 (진행 교사용)
   ══════════════════════════════════════════════════════════════════════ */
let dash = null;

function screenDashboard(sessionId) {
  if (!sessionId) { go('home'); return; }
  dash = {
    sessionId: sessionId, session: null, set: null,
    students: {}, answers: {},
    sort: { key: 'no', dir: 1 },
    open: {}
  };
  onCleanup(() => { dash = null; });

  APP().innerHTML = topbar() + '<div class="wrap wide"><div class="empty">불러오는 중…</div></div>';

  R('sessions/' + sessionId).once('value').then(snap => {
    const sess = snap.val();
    if (!sess) { APP().innerHTML = topbar() + '<div class="wrap"><div class="card"><div class="empty">반 정보를 찾을 수 없습니다.</div></div></div>'; return; }
    dash.session = sess;
    return R('quiz_sets/' + sess.setId).once('value').then(s2 => {
      dash.set = normSet(s2.val()) || { title: sess.setTitle || '', questions: [], settings: normSettings(null) };
      watch(R('sessions/' + sessionId + '/students'), 'value', s => { dash.students = s.val() || {}; renderDash(); });
      watch(R('responses/' + sessionId), 'value', s => { dash.answers = s.val() || {}; renderDash(); });
      watch(R('sessions/' + sessionId + '/status'), 'value', s => { if (dash.session) dash.session.status = s.val(); renderDash(); });
    });
  }).catch(e => { console.error(e); APP().innerHTML = topbar() + '<div class="wrap"><div class="card"><div class="empty">불러오기 실패: ' + esc(e.message) + '</div></div></div>'; });
}

/** 학생별 응답을 표로 쓰기 좋게 정리 */
function dashBuildRows() {
  const qn = dash.set.questions.length;
  return Object.keys(dash.students).map(sid => {
    const s = dash.students[sid];
    const cells = [];
    let correct = 0, answered = 0, msSum = 0, graded = 0, ungraded = 0;
    for (let i = 0; i < qn; i++) {
      const r = (dash.answers[i] || {})[sid];
      cells.push(r || null);
      if (r) {
        answered++;
        msSum += (r.ms || 0);
        if (r.ok === true) { graded++; correct++; }
        else if (r.ok === false) graded++;
        else ungraded++;              // 서술형 채점 전
      }
    }
    return {
      sid: sid, grade: s.grade, klass: s.klass, num: s.num, name: s.name || '',
      cells: cells, correct: correct, answered: answered,
      graded: graded, ungraded: ungraded,
      rate: graded ? correct / graded : 0,
      avgMs: answered ? msSum / answered : 0
    };
  });
}

function dashSortBy(key) {
  if (!dash) return;
  if (dash.sort.key === key) dash.sort.dir *= -1;
  else dash.sort = { key: key, dir: 1 };
  renderDash();
}
function dashSortRows(rows) {
  const k = dash.sort.key, d = dash.sort.dir;
  rows.sort((a, b) => {
    let v = 0;
    if (k === 'no') v = (a.grade - b.grade) || (a.klass - b.klass) || (a.num - b.num);
    else if (k === 'name') v = String(a.name).localeCompare(String(b.name), 'ko');
    else if (k === 'correct') v = a.correct - b.correct;
    else if (k === 'rate') v = a.rate - b.rate;
    else if (k === 'speed') v = (a.avgMs || Infinity) - (b.avgMs || Infinity);
    return v * d;
  });
  return rows;
}

function renderDash() {
  if (!dash || !dash.set) return;
  const qs = dash.set.questions;
  const rows = dashSortRows(dashBuildRows());
  const nStu = rows.length;

  let totAns = 0, totCor = 0, totGraded = 0, totUngraded = 0;
  rows.forEach(r => { totAns += r.answered; totCor += r.correct; totGraded += r.graded; totUngraded += r.ungraded; });
  const overall = totGraded ? Math.round(totCor / totGraded * 100) : 0;
  const ended = dash.session.status === 'ended';
  const arrow = k => dash.sort.key === k ? (dash.sort.dir > 0 ? ' ▲' : ' ▼') : '';

  APP().innerHTML = topbar(
      '<a class="btn sm ghost" href="#/play/' + esc(dash.session.setId) + '">진행 화면</a>' +
      '<button class="btn sm" onclick="dashExportCSV()">CSV 내려받기</button>'
    ) +
    '<div class="wrap wide">' +
      '<h1 style="font-size:21px;margin-bottom:3px">' + esc(dash.set.title || dash.session.setTitle) + '</h1>' +
      '<p style="color:var(--ink-2);font-size:13.5px;margin-bottom:16px">' +
        '반 코드 <b class="mono">' + esc(dash.session.code) + '</b>' +
        (dash.session.label ? ' · ' + esc(dash.session.label) : '') +
        ' · ' + fmtDate(dash.session.createdAt) +
        ' · ' + (ended ? '<span class="tag mute">종료됨</span>' : '<span class="tag ok">진행 중</span>') +
      '</p>' +

      '<div class="stat-row">' +
        '<div class="stat"><div class="k">참여 학생</div><div class="v">' + nStu + '</div></div>' +
        '<div class="stat"><div class="k">문항 수</div><div class="v">' + qs.length + '</div></div>' +
        '<div class="stat"><div class="k">제출 응답</div><div class="v">' + totAns + '</div></div>' +
        '<div class="stat"><div class="k">전체 정답률</div><div class="v">' + overall + '%</div></div>' +
        (totUngraded ? '<div class="stat" style="border-color:#f0dcb4;background:var(--warn-bg)">' +
            '<div class="k" style="color:var(--warn)">채점 대기 (서술형)</div>' +
            '<div class="v" style="color:var(--warn)">' + totUngraded + '</div></div>' : '') +
      '</div>' +

      (totUngraded ? '<div class="notice">서술형 <b>' + totUngraded + '개</b>가 채점을 기다리고 있습니다. ' +
        '아래 문항별 응답에서 해당 문항을 펼쳐 <b>O / X</b>를 눌러 채점하세요. 채점하면 점수와 정답률에 바로 반영됩니다.</div>' : '') +

      '<div class="card">' +
        '<h2>문항별 응답</h2>' +
        '<div class="sub">막대를 눌러 펼치면 선택별 명단과 미응답자를 볼 수 있습니다. 서술형·단답형은 학생이 쓴 답이 그대로 나옵니다.</div>' +
        (qs.length ? qs.map((q, i) => dashQuestionBlock(q, i, rows)).join('') : '<div class="empty">문항이 없습니다.</div>') +
      '</div>' +

      '<div class="card">' +
        '<h2>학생별 결과</h2>' +
        '<div class="sub">머리글을 눌러 정렬합니다. 반응속도는 퀴즈가 뜬 뒤 답을 고르기까지 걸린 평균 시간입니다.</div>' +
        (nStu ? '<div class="tbl-scroll"><table class="tbl">' +
          '<thead><tr>' +
            '<th onclick="dashSortBy(\'no\')">학년-반-번호' + arrow('no') + '</th>' +
            '<th onclick="dashSortBy(\'name\')">이름' + arrow('name') + '</th>' +
            qs.map((q, i) => '<th class="ctr nosort" title="' + esc(q.text) + '">' + (i + 1) + '</th>').join('') +
            '<th class="ctr" onclick="dashSortBy(\'correct\')">정답' + arrow('correct') + '</th>' +
            '<th class="ctr" onclick="dashSortBy(\'rate\')">정답률' + arrow('rate') + '</th>' +
            '<th class="ctr" onclick="dashSortBy(\'speed\')">평균 반응' + arrow('speed') + '</th>' +
          '</tr></thead><tbody>' +
          rows.map(r => '<tr>' +
            '<td class="mono">' + r.grade + '-' + r.klass + '-' + r.num + '</td>' +
            '<td>' + esc(r.name) + '</td>' +
            r.cells.map(c => '<td class="ctr">' + (!c ? '<span class="ox-none">·</span>' :
              (c.ok === true ? '<span class="ox-o">O</span>'
               : c.ok === false ? '<span class="ox-x">X</span>'
               : '<span class="tag warn" style="font-size:10px;padding:1px 5px">미채점</span>')) + '</td>').join('') +
            '<td class="ctr">' + r.correct + ' / ' + r.graded +
              (r.ungraded ? ' <span style="color:var(--warn);font-size:11px">+' + r.ungraded + '</span>' : '') + '</td>' +
            '<td class="ctr">' + (r.graded ? Math.round(r.rate * 100) + '%' : '–') + '</td>' +
            '<td class="ctr">' + (r.answered ? (r.avgMs / 1000).toFixed(1) + '초' : '–') + '</td>' +
          '</tr>').join('') +
          '</tbody></table></div>'
          : '<div class="empty">아직 입장한 학생이 없습니다.</div>') +
      '</div>' +
    '</div>';
}

function dashQuestionBlock(q, i, rows) {
  const type = qType(q);
  const resp = dash.answers[i] || {};
  const keys = Object.keys(resp);
  const total = keys.length;
  const nGraded = keys.filter(k => resp[k].ok === true || resp[k].ok === false).length;
  const nCor = keys.filter(k => resp[k].ok === true).length;
  const nUngraded = total - nGraded;
  const rate = nGraded ? Math.round(nCor / nGraded * 100) : 0;
  const isOpen = !!dash.open[i];

  const missing = rows.filter(r => !resp[r.sid]);

  return '<div class="acc-item">' +
    '<div class="hd" onclick="dashToggle(' + i + ')">' +
      '<span class="tag mute mono">' + fmtTime(q.t) + '</span>' +
      (type !== 'choice' ? '<span class="tag qtype">' + QTYPES[type].split(' —')[0] + '</span>' : '') +
      '<span>' + (i + 1) + '. ' + esc(q.text) + '</span>' +
      '<span class="spacer"></span>' +
      '<span class="tag mute">' + total + '명</span>' +
      (nUngraded ? '<span class="tag warn">미채점 ' + nUngraded + '</span>' : '') +
      (nGraded ? '<span class="tag ' + (rate >= 70 ? 'ok' : rate >= 40 ? 'warn' : 'bad') + '">정답률 ' + rate + '%</span>' : '') +
      '<span style="color:var(--ink-3)">' + (isOpen ? '▲' : '▼') + '</span>' +
    '</div>' +
    (isOpen ? '<div class="bd">' +
      (isTextType(q) ? dashTextAnswers(q, i, rows, resp) : dashChoiceDist(q, i, rows, resp)) +
      (missing.length ? '<div style="margin-top:10px;font-size:12.5px;color:var(--warn)"><b>미응답 ' + missing.length + '명</b> — ' +
        missing.map(r => esc(r.name) + '(' + r.grade + '-' + r.klass + '-' + r.num + ')').join(', ') + '</div>' : '') +
      (q.explain ? '<div class="notice info" style="margin:12px 0 0">💡 ' + esc(q.explain) + '</div>' : '') +
    '</div>' : '') +
  '</div>';
}

/** 선택형 — 보기별 분포와 명단 */
function dashChoiceDist(q, i, rows, resp) {
  const type = qType(q);
  const total = Object.keys(resp).length;
  const counts = q.choices.map(() => 0);
  const byChoice = q.choices.map(() => []);
  rows.forEach(r => {
    const rr = resp[r.sid];
    if (!rr) return;
    const picks = (type === 'multi') ? parseMulti(rr.cs) : [Number(rr.c)];
    picks.forEach(j => { if (counts[j] !== undefined) { counts[j]++; byChoice[j].push(r); } });
  });
  const isAns = j => (type === 'multi') ? ((q.answers || []).indexOf(j) >= 0) : (j === Number(q.answer));

  return q.choices.map((c, j) => {
    const pct = total ? Math.round(counts[j] / total * 100) : 0;
    return '<div class="dist-row' + (isAns(j) ? ' is-ans' : '') + '">' +
      '<span class="lt">' + (type === 'ox' ? ['O', 'X'][j] : LETTERS[j]) + '</span>' +
      '<span class="txt" title="' + esc(c) + '">' + esc(c) + '</span>' +
      '<span class="track"><i style="width:' + pct + '%"></i></span>' +
      '<span class="n">' + counts[j] + '명 ' + pct + '%</span>' +
    '</div>' +
    (byChoice[j].length ? '<div style="font-size:12px;color:var(--ink-3);margin:-2px 0 8px 33px">' +
      byChoice[j].map(r => esc(r.name) + '(' + r.num + ')').join(', ') + '</div>' : '');
  }).join('');
}

/** 단답형·서술형 — 학생이 쓴 답을 그대로 보여주고, 서술형은 여기서 채점한다 */
function dashTextAnswers(q, i, rows, resp) {
  const answered = rows.filter(r => resp[r.sid]);
  if (!answered.length) return '<div class="empty">아직 제출한 학생이 없습니다.</div>';
  const needsGrading = (qType(q) === 'long');

  return (needsGrading
      ? '<div class="hint" style="margin-bottom:10px">각 답 오른쪽의 <b>O / X</b>를 눌러 채점하세요. 다시 누르면 미채점으로 되돌립니다.</div>'
      : '<div class="hint" style="margin-bottom:10px">인정 답안: ' + esc((q.accept || []).join(', ')) + '</div>') +
    answered.map(r => {
      const rr = resp[r.sid];
      const ok = rr.ok;
      return '<div class="txt-answer">' +
        '<div class="who">' +
          '<span>' + r.grade + '-' + r.klass + '-' + r.num + ' ' + esc(r.name) + '</span>' +
          (ok === true ? '<span class="tag ok">정답</span>' : ok === false ? '<span class="tag bad">오답</span>'
            : '<span class="tag warn">미채점</span>') +
          '<span class="spacer"></span>' +
          (needsGrading
            ? '<button class="btn sm" onclick="dashGrade(' + i + ',\'' + esc(r.sid) + '\',true)"' + (ok === true ? ' disabled' : '') + '>O</button>' +
              '<button class="btn sm" onclick="dashGrade(' + i + ',\'' + esc(r.sid) + '\',false)"' + (ok === false ? ' disabled' : '') + '>X</button>' +
              (ok === true || ok === false
                ? '<button class="btn sm ghost" onclick="dashGrade(' + i + ',\'' + esc(r.sid) + '\',null)">되돌리기</button>' : '')
            : '') +
        '</div>' +
        esc(rr.txt || '') +
      '</div>';
    }).join('');
}

/** 서술형 채점 — 교사가 O/X 를 누르면 그 응답의 ok 만 고쳐 쓴다 */
function dashGrade(qIdx, sid, ok) {
  if (!dash) return;
  R('responses/' + dash.sessionId + '/' + qIdx + '/' + sid + '/ok').set(ok)
    .catch(e => { console.error(e); alert('채점 저장 실패: ' + e.message); });
}

function dashToggle(i) { dash.open[i] = !dash.open[i]; renderDash(); }

function dashExportCSV() {
  if (!dash) return;
  const qs = dash.set.questions;
  const rows = dashSortRows(dashBuildRows());
  const head = ['학년', '반', '번호', '이름'];
  qs.forEach((q, i) => {
    head.push((i + 1) + '번 답(' + QTYPES[qType(q)].split(' —')[0] + ')');
    head.push((i + 1) + '번 정오');
    head.push((i + 1) + '번 반응(초)');
  });
  head.push('정답 수', '채점된 수', '미채점', '응답 수', '정답률(%)', '평균 반응(초)');

  const out = [
    ['퀴즈 세트', dash.set.title || dash.session.setTitle],
    ['반 코드', dash.session.code],
    ['반 이름', dash.session.label || ''],
    ['진행 일시', fmtDate(dash.session.createdAt)],
    [],
    head
  ];
  rows.forEach(r => {
    const line = [r.grade, r.klass, r.num, r.name];
    r.cells.forEach((c, i) => {
      line.push(c ? answerLabel(qs[i], c) : '');
      line.push(!c ? '미응답' : c.ok === true ? 'O' : c.ok === false ? 'X' : '미채점');
      line.push(c ? (c.ms / 1000).toFixed(1) : '');
    });
    line.push(r.correct, r.graded, r.ungraded, r.answered,
      r.graded ? Math.round(r.rate * 100) : '', r.answered ? (r.avgMs / 1000).toFixed(1) : '');
    out.push(line);
  });

  const safe = String(dash.set.title || '퀴즈').replace(/[\\/:*?"<>|]/g, '_').slice(0, 40);
  downloadCSV(safe + '_' + dash.session.code + '_' + fmtDay(dash.session.createdAt) + '.csv', out);
  toast('CSV를 내려받았습니다');
}

/* ══════════════════════════════════════════════════════════════════════
   9. ⑤ 관리자 통합 조회 화면
   ══════════════════════════════════════════════════════════════════════ */
/* 기본 비밀번호 admin1234 의 SHA-256. 관리자 화면에서 바꾸면 vq/config/adminHash 에 저장된다.
   ※ 클라이언트 검증이므로 화면 접근을 막아줄 뿐, DB 자체를 잠그지는 못한다 (README 참고). */
const DEFAULT_ADMIN_HASH = 'ac9689e2272427085e35b9d3e3e8bed88cb3434828b43b86fc0596cad4c6e270';

let adm = null;

function screenAdmin() {
  adm = {
    sessions: {}, resp: {}, sets: {},
    from: '', to: '', setFilter: '', gradeFilter: '', klassFilter: '',
    tab: 'sessions', loading: false, detail: null
  };
  onCleanup(() => { adm = null; });

  if (ssGet('vq_admin') === '1') admRenderShell();
  else admRenderLogin('');
}

function admRenderLogin(err) {
  APP().innerHTML = topbar() + '<div class="wrap" style="max-width:420px">' +
    '<div class="card" style="margin-top:40px;text-align:center;padding:30px 24px">' +
      '<div style="font-size:38px;margin-bottom:6px">🔐</div>' +
      '<h2 style="font-size:19px;margin-bottom:4px">관리자 로그인</h2>' +
      '<p style="color:var(--ink-2);font-size:13.5px;margin-bottom:18px">학생 개인정보가 포함된 화면입니다.</p>' +
      '<input type="password" id="adm-pw" placeholder="비밀번호" style="text-align:center">' +
      (err ? '<div style="color:var(--bad);font-size:13px;margin-top:10px;font-weight:600">' + esc(err) + '</div>' : '') +
      '<button class="btn primary lg block" style="margin-top:14px" onclick="admLogin()">로그인</button>' +
    '</div></div>';
  const inp = $('#adm-pw');
  inp.onkeydown = e => { if (e.key === 'Enter') admLogin(); };
  inp.focus();
}

function admLogin() {
  const pw = $('#adm-pw').value;
  if (!pw) return;
  Promise.all([sha256(pw), R('config/adminHash').once('value')]).then(([h, snap]) => {
    const want = snap.val() || DEFAULT_ADMIN_HASH;
    if (h !== want) { admRenderLogin('비밀번호가 올바르지 않습니다.'); return; }
    ssSet('vq_admin', '1');
    admRenderShell();
  }).catch(e => { console.error(e); admRenderLogin('확인 실패: ' + e.message); });
}
function admLogout() {
  ssDel('vq_admin');
  go('home');
}

function admRenderShell() {
  const today = new Date();
  const ago = new Date(today.getTime() - 29 * 86400000);
  adm.from = adm.from || fmtDay(ago.getTime());
  adm.to = adm.to || fmtDay(today.getTime());

  APP().innerHTML = topbar('<button class="btn sm ghost" onclick="admLogout()">로그아웃</button>') +
    '<div class="wrap wide">' +
      '<h1 style="font-size:21px;margin-bottom:3px">관리자 통합 조회</h1>' +
      '<p style="color:var(--ink-2);font-size:13.5px;margin-bottom:16px">전체 반의 응답을 학년·반·번호·이름 기준으로 모아 봅니다.</p>' +
      '<div class="card">' +
        '<div class="filters">' +
          '<div class="fc"><label class="f">시작일</label><input type="date" id="adm-from" value="' + adm.from + '"></div>' +
          '<div class="fc"><label class="f">종료일</label><input type="date" id="adm-to" value="' + adm.to + '"></div>' +
          '<div class="fc"><label class="f">학년</label><input type="number" id="adm-grade" min="1" max="6" placeholder="전체" value="' + esc(adm.gradeFilter) + '"></div>' +
          '<div class="fc"><label class="f">반</label><input type="number" id="adm-klass" min="1" max="30" placeholder="전체" value="' + esc(adm.klassFilter) + '"></div>' +
          '<div class="fc" style="flex:1 1 220px"><label class="f">퀴즈 세트</label><select id="adm-set"><option value="">전체</option></select></div>' +
          '<button class="btn primary" onclick="admLoad()">조회</button>' +
        '</div>' +
        '<div class="row">' +
          '<button class="btn sm" onclick="admTab(\'sessions\')">진행 기록</button>' +
          '<button class="btn sm" onclick="admTab(\'students\')">학생별 누적</button>' +
          '<button class="btn sm" onclick="admTab(\'classes\')">학년·반 집계</button>' +
          '<div style="flex:1"></div>' +
          '<button class="btn sm ghost" onclick="admTab(\'manage\')">⚙ 관리</button>' +
        '</div>' +
      '</div>' +
      '<div id="adm-body"><div class="empty">기간을 정하고 [조회]를 누르세요.</div></div>' +
    '</div>';

  $('#adm-from').onchange = e => { adm.from = e.target.value; };
  $('#adm-to').onchange = e => { adm.to = e.target.value; };
  $('#adm-grade').oninput = e => { adm.gradeFilter = e.target.value; admRenderBody(); };
  $('#adm-klass').oninput = e => { adm.klassFilter = e.target.value; admRenderBody(); };
  $('#adm-set').onchange = e => { adm.setFilter = e.target.value; admRenderBody(); };
  admLoad();
}

function admTab(t) { adm.tab = t; admRenderBody(); }

/** 기간에 걸린 세션만 골라 응답을 불러온다 — 전체를 매번 읽지 않기 위해 */
function admLoad() {
  const body = $('#adm-body');
  body.innerHTML = '<div class="empty">불러오는 중…</div>';
  adm.loading = true;
  adm.detail = null;

  const fromTs = adm.from ? new Date(adm.from + 'T00:00:00').getTime() : 0;
  const toTs = adm.to ? new Date(adm.to + 'T23:59:59').getTime() : Infinity;

  R('sessions').once('value').then(snap => {
    const all = snap.val() || {};
    const picked = {};
    Object.keys(all).forEach(id => {
      const s = all[id];
      const ts = s.createdAt || 0;
      if (ts >= fromTs && ts <= toTs) picked[id] = s;
    });
    adm.sessions = picked;

    const ids = Object.keys(picked);
    if (ids.length > 300) {
      body.innerHTML = '<div class="card"><div class="notice">기간에 포함된 진행 기록이 ' + ids.length +
        '건입니다. 기간을 좁혀서 조회해 주세요.</div></div>';
      adm.loading = false;
      return;
    }
    return Promise.all(ids.map(id => R('responses/' + id).once('value').then(s => [id, s.val() || {}])))
      .then(pairs => {
        adm.resp = {};
        pairs.forEach(([id, v]) => { adm.resp[id] = v; });
        adm.loading = false;
        admFillSetOptions();
        admRenderBody();
      });
  }).catch(e => { console.error(e); body.innerHTML = '<div class="card"><div class="empty">불러오기 실패: ' + esc(e.message) + '</div></div>'; });
}

function admFillSetOptions() {
  const sel = $('#adm-set');
  if (!sel) return;
  const titles = {};
  Object.keys(adm.sessions).forEach(id => {
    const s = adm.sessions[id];
    if (s.setId) titles[s.setId] = s.setTitle || s.setId;
  });
  sel.innerHTML = '<option value="">전체 세트</option>' +
    Object.keys(titles).map(k => '<option value="' + esc(k) + '"' + (adm.setFilter === k ? ' selected' : '') + '>' + esc(titles[k]) + '</option>').join('');
}

/** 필터를 적용한 세션 목록 + 학생 단위로 펼친 응답 레코드 */
function admCompute() {
  const g = adm.gradeFilter ? Number(adm.gradeFilter) : null;
  const k = adm.klassFilter ? Number(adm.klassFilter) : null;

  const sessions = Object.keys(adm.sessions)
    .filter(id => !adm.setFilter || adm.sessions[id].setId === adm.setFilter)
    .map(id => Object.assign({ id: id }, adm.sessions[id]))
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  // 학생 키(학년_반_번호) → 누적
  const students = {};
  const perSession = {};

  sessions.forEach(sess => {
    const studs = sess.students || {};
    const resp = adm.resp[sess.id] || {};
    let sAns = 0, sCor = 0, sStu = 0, sGraded = 0;

    Object.keys(studs).forEach(sid => {
      const s = studs[sid];
      if (g !== null && Number(s.grade) !== g) return;
      if (k !== null && Number(s.klass) !== k) return;
      sStu++;

      let answered = 0, correct = 0, graded = 0;
      Object.keys(resp).forEach(qi => {
        const r = resp[qi][sid];
        if (!r) return;
        answered++;
        // 서술형 미채점(ok 없음)은 정답률 계산에서 뺀다
        if (r.ok === true) { graded++; correct++; }
        else if (r.ok === false) graded++;
      });
      sAns += answered; sCor += correct; sGraded += graded;

      const key = sid;
      if (!students[key]) {
        students[key] = {
          key: key, grade: Number(s.grade), klass: Number(s.klass), num: Number(s.num),
          name: s.name || '', names: {}, lastAt: 0,
          sessions: [], answered: 0, correct: 0, graded: 0
        };
      }
      const rec = students[key];
      rec.names[s.name || ''] = (rec.names[s.name || ''] || 0) + 1;
      if ((sess.createdAt || 0) >= rec.lastAt) { rec.lastAt = sess.createdAt || 0; rec.name = s.name || rec.name; }
      rec.answered += answered;
      rec.correct += correct;
      rec.graded += graded;
      rec.sessions.push({
        id: sess.id, title: sess.setTitle || '', code: sess.code, label: sess.label || '',
        at: sess.createdAt || 0, answered: answered, correct: correct, graded: graded
      });
    });

    perSession[sess.id] = { students: sStu, answered: sAns, correct: sCor, graded: sGraded };
  });

  return { sessions: sessions, students: students, perSession: perSession };
}

function admRenderBody() {
  const body = $('#adm-body');
  if (!body || adm.loading) return;
  const data = admCompute();

  if (adm.detail) { body.innerHTML = admStudentDetail(data, adm.detail); return; }
  if (adm.tab === 'manage')  { body.innerHTML = admManage(data); return; }
  if (adm.tab === 'students'){ body.innerHTML = admStudentsView(data); return; }
  if (adm.tab === 'classes') { body.innerHTML = admClassesView(data); return; }
  body.innerHTML = admSessionsView(data);
}

function admSessionsView(d) {
  if (!d.sessions.length) return '<div class="card"><div class="empty">해당 기간에 진행 기록이 없습니다.</div></div>';
  let tS = 0, tA = 0, tC = 0, tG = 0;
  d.sessions.forEach(s => { const p = d.perSession[s.id]; tS += p.students; tA += p.answered; tC += p.correct; tG += p.graded; });

  return '<div class="stat-row">' +
      '<div class="stat"><div class="k">진행 반 수</div><div class="v">' + d.sessions.length + '</div></div>' +
      '<div class="stat"><div class="k">연인원</div><div class="v">' + tS + '</div></div>' +
      '<div class="stat"><div class="k">제출 응답</div><div class="v">' + tA + '</div></div>' +
      '<div class="stat"><div class="k">전체 정답률</div><div class="v">' + (tG ? Math.round(tC / tG * 100) : 0) + '%</div></div>' +
      (tA > tG ? '<div class="stat"><div class="k">채점 대기</div><div class="v">' + (tA - tG) + '</div></div>' : '') +
    '</div>' +
    '<div class="card"><h2>진행 기록</h2>' +
      '<div class="sub">최근 순입니다. 반 코드를 누르면 그 반의 대시보드로 갑니다.</div>' +
      '<div class="tbl-scroll"><table class="tbl"><thead><tr>' +
        '<th class="nosort">일시</th><th class="nosort">퀴즈 세트</th><th class="nosort">반 이름</th>' +
        '<th class="nosort">코드</th><th class="nosort ctr">학생</th><th class="nosort ctr">응답</th>' +
        '<th class="nosort ctr">정답률</th><th class="nosort ctr">상태</th>' +
      '</tr></thead><tbody>' +
      d.sessions.map(s => {
        const p = d.perSession[s.id];
        return '<tr>' +
          '<td>' + fmtDate(s.createdAt) + '</td>' +
          '<td>' + esc(s.setTitle || '') + '</td>' +
          '<td>' + esc(s.label || '') + '</td>' +
          '<td><a class="mono" href="#/live/' + esc(s.id) + '">' + esc(s.code || '') + '</a></td>' +
          '<td class="ctr">' + p.students + '</td>' +
          '<td class="ctr">' + p.answered + '</td>' +
          '<td class="ctr">' + (p.graded ? Math.round(p.correct / p.graded * 100) + '%' : '–') + '</td>' +
          '<td class="ctr">' + (s.status === 'ended' ? '<span class="tag mute">종료</span>' : '<span class="tag ok">진행</span>') + '</td>' +
        '</tr>';
      }).join('') +
      '</tbody></table></div>' +
      '<div style="margin-top:12px"><button class="btn sm" onclick="admExportSessions()">CSV 내려받기</button></div>' +
    '</div>';
}

function admStudentList(d) {
  return Object.keys(d.students).map(k => d.students[k])
    .sort((a, b) => (a.grade - b.grade) || (a.klass - b.klass) || (a.num - b.num));
}

function admStudentsView(d) {
  const list = admStudentList(d);
  if (!list.length) return '<div class="card"><div class="empty">해당 조건의 학생 기록이 없습니다.</div></div>';
  return '<div class="card"><h2>학생별 누적</h2>' +
    '<div class="sub">여러 반·여러 세트에 걸친 응답을 학년·반·번호 기준으로 합산했습니다. 이름을 누르면 개인 이력이 열립니다.</div>' +
    '<div class="tbl-scroll"><table class="tbl"><thead><tr>' +
      '<th class="nosort">학년</th><th class="nosort">반</th><th class="nosort">번호</th><th class="nosort">이름</th>' +
      '<th class="nosort ctr">참여 횟수</th><th class="nosort ctr">응답</th><th class="nosort ctr">정답</th><th class="nosort ctr">정답률</th>' +
    '</tr></thead><tbody>' +
    list.map(s => {
      const alias = Object.keys(s.names).filter(n => n && n !== s.name);
      return '<tr>' +
        '<td>' + s.grade + '</td><td>' + s.klass + '</td><td>' + s.num + '</td>' +
        '<td><a href="javascript:void(0)" onclick="admOpenStudent(\'' + esc(s.key) + '\')">' + esc(s.name) + '</a>' +
          (alias.length ? ' <span class="tag warn" title="다른 이름으로도 입력된 적이 있습니다">' + esc(alias.join(', ')) + '</span>' : '') + '</td>' +
        '<td class="ctr">' + s.sessions.length + '</td>' +
        '<td class="ctr">' + s.answered + '</td>' +
        '<td class="ctr">' + s.correct + '</td>' +
        '<td class="ctr">' + (s.graded ? Math.round(s.correct / s.graded * 100) + '%' : '–') + '</td>' +
      '</tr>';
    }).join('') +
    '</tbody></table></div>' +
    '<div style="margin-top:12px"><button class="btn sm" onclick="admExportStudents()">CSV 내려받기</button></div>' +
  '</div>';
}

function admOpenStudent(key) { adm.detail = key; admRenderBody(); }
function admCloseStudent() { adm.detail = null; admRenderBody(); }

function admStudentDetail(d, key) {
  const s = d.students[key];
  if (!s) return '<div class="card"><div class="empty">기록이 없습니다. <button class="btn sm" onclick="admCloseStudent()">돌아가기</button></div></div>';
  const list = s.sessions.slice().sort((a, b) => b.at - a.at);
  return '<div class="card">' +
    '<div class="row" style="align-items:center;margin-bottom:10px">' +
      '<button class="btn sm ghost" onclick="admCloseStudent()">← 목록</button>' +
      '<h2 style="font-size:18px">' + s.grade + '학년 ' + s.klass + '반 ' + s.num + '번 ' + esc(s.name) + '</h2>' +
    '</div>' +
    '<div class="stat-row">' +
      '<div class="stat"><div class="k">참여 횟수</div><div class="v">' + list.length + '</div></div>' +
      '<div class="stat"><div class="k">총 응답</div><div class="v">' + s.answered + '</div></div>' +
      '<div class="stat"><div class="k">정답</div><div class="v">' + s.correct + '</div></div>' +
      '<div class="stat"><div class="k">누적 정답률</div><div class="v">' + (s.graded ? Math.round(s.correct / s.graded * 100) : 0) + '%</div></div>' +
    '</div>' +
    '<div class="tbl-scroll"><table class="tbl"><thead><tr>' +
      '<th class="nosort">일시</th><th class="nosort">퀴즈 세트</th><th class="nosort">반</th>' +
      '<th class="nosort ctr">정답 / 응답</th><th class="nosort ctr">정답률</th><th class="nosort"></th>' +
    '</tr></thead><tbody>' +
    list.map(r => '<tr>' +
      '<td>' + fmtDate(r.at) + '</td>' +
      '<td>' + esc(r.title) + '</td>' +
      '<td>' + esc(r.label || r.code) + '</td>' +
      '<td class="ctr">' + r.correct + ' / ' + r.answered + '</td>' +
      '<td class="ctr">' + (r.graded ? Math.round(r.correct / r.graded * 100) + '%' : '–') + '</td>' +
      '<td><a class="btn sm ghost" href="#/live/' + esc(r.id) + '">대시보드</a></td>' +
    '</tr>').join('') +
    '</tbody></table></div>' +
  '</div>';
}

function admClassesView(d) {
  const list = admStudentList(d);
  if (!list.length) return '<div class="card"><div class="empty">해당 조건의 기록이 없습니다.</div></div>';
  const agg = {};
  list.forEach(s => {
    const k = s.grade + '-' + s.klass;
    if (!agg[k]) agg[k] = { grade: s.grade, klass: s.klass, students: 0, answered: 0, correct: 0, graded: 0 };
    agg[k].students++;
    agg[k].answered += s.answered;
    agg[k].correct += s.correct; agg[k].graded += s.graded;
  });
  const rows = Object.keys(agg).map(k => agg[k]).sort((a, b) => (a.grade - b.grade) || (a.klass - b.klass));

  return '<div class="card"><h2>학년·반 집계</h2>' +
    '<div class="sub">기간 내 응답 전체를 학급 단위로 합산했습니다.</div>' +
    '<div class="tbl-scroll"><table class="tbl"><thead><tr>' +
      '<th class="nosort">학년</th><th class="nosort">반</th><th class="nosort ctr">참여 학생</th>' +
      '<th class="nosort ctr">응답</th><th class="nosort ctr">정답</th><th class="nosort ctr">정답률</th><th class="nosort">분포</th>' +
    '</tr></thead><tbody>' +
    rows.map(r => {
      const pct = r.graded ? Math.round(r.correct / r.graded * 100) : 0;
      return '<tr>' +
        '<td>' + r.grade + '</td><td>' + r.klass + '</td>' +
        '<td class="ctr">' + r.students + '</td>' +
        '<td class="ctr">' + r.answered + '</td>' +
        '<td class="ctr">' + r.correct + '</td>' +
        '<td class="ctr">' + pct + '%</td>' +
        '<td style="min-width:160px"><span class="track" style="display:block;height:14px;background:#eceef4;border-radius:4px;overflow:hidden">' +
          '<i style="display:block;height:100%;width:' + pct + '%;background:var(--accent)"></i></span></td>' +
      '</tr>';
    }).join('') +
    '</tbody></table></div></div>';
}

function admManage(d) {
  return '<div class="card">' +
      '<h2>비밀번호 변경</h2>' +
      '<div class="sub">변경하면 모든 기기에서 새 비밀번호로 로그인합니다.</div>' +
      '<div class="row" style="align-items:flex-end">' +
        '<div class="fc" style="flex:1 1 200px"><label class="f">새 비밀번호 (4자 이상)</label>' +
          '<input type="password" id="adm-newpw"></div>' +
        '<div class="fc" style="flex:1 1 200px"><label class="f">한 번 더</label>' +
          '<input type="password" id="adm-newpw2"></div>' +
        '<button class="btn primary" onclick="admChangePw()">변경</button>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<h2>기간 지정 삭제</h2>' +
      '<div class="sub">학교 개인정보 보관 기준에 따라 오래된 기록을 지웁니다. 되돌릴 수 없습니다.</div>' +
      '<div class="notice">현재 조회 조건(' + esc(adm.from) + ' ~ ' + esc(adm.to) + ')에 해당하는 <b>' +
        d.sessions.length + '개 진행 기록</b>과 그 안의 모든 학생 응답이 함께 삭제됩니다. ' +
        '퀴즈 세트 자체는 지워지지 않습니다.</div>' +
      '<button class="btn danger" onclick="admPurge()">이 기간 기록 삭제</button>' +
    '</div>' +
    '<div class="card">' +
      '<h2>안내</h2>' +
      '<div style="font-size:13.5px;color:var(--ink-2);line-height:1.9">' +
        '· 이 화면은 학생 개인정보(학년·반·번호·이름)를 다룹니다. 공용 PC에서는 반드시 로그아웃하세요.<br>' +
        '· 비밀번호는 브라우저에서 확인하는 방식이라 화면 접근을 막아줄 뿐입니다. 데이터베이스 자체를 잠그려면 Firebase 인증 도입이 필요합니다.<br>' +
        '· 세션·응답은 Firebase Realtime Database의 <span class="mono">vq/</span> 경로에 저장됩니다.' +
      '</div>' +
    '</div>';
}

function admChangePw() {
  const a = $('#adm-newpw').value, b = $('#adm-newpw2').value;
  if (!a || a.length < 4) { alert('비밀번호는 4자 이상이어야 합니다.'); return; }
  if (a !== b) { alert('두 입력이 다릅니다.'); return; }
  sha256(a).then(h => R('config/adminHash').set(h)).then(() => {
    toast('비밀번호를 변경했습니다');
    $('#adm-newpw').value = ''; $('#adm-newpw2').value = '';
  }).catch(e => alert('변경 실패: ' + e.message));
}

function admPurge() {
  const d = admCompute();
  if (!d.sessions.length) { alert('삭제할 기록이 없습니다.'); return; }
  const msg = adm.from + ' ~ ' + adm.to + ' 기간의 진행 기록 ' + d.sessions.length + '건과 모든 학생 응답을 영구 삭제합니다.\n되돌릴 수 없습니다. 계속하려면 아래에 삭제 를 입력하세요.';
  const typed = prompt(msg, '');
  if (typed === null) return;
  if (typed.trim() !== '삭제') { alert('취소되었습니다.'); return; }

  const updates = {};
  d.sessions.forEach(s => {
    updates['sessions/' + s.id] = null;
    updates['responses/' + s.id] = null;
    if (s.code) updates['codes/' + s.code] = null;
  });
  R('').update(updates).then(() => {
    toast(d.sessions.length + '건을 삭제했습니다');
    admLoad();
  }).catch(e => alert('삭제 실패: ' + e.message));
}

function admExportSessions() {
  const d = admCompute();
  const out = [['진행 일시', '퀴즈 세트', '반 이름', '반 코드', '참여 학생', '제출 응답', '정답 수', '정답률(%)', '상태']];
  d.sessions.forEach(s => {
    const p = d.perSession[s.id];
    out.push([fmtDate(s.createdAt), s.setTitle || '', s.label || '', s.code || '',
      p.students, p.answered, p.correct, p.graded ? Math.round(p.correct / p.graded * 100) : '',
      s.status === 'ended' ? '종료' : '진행']);
  });
  downloadCSV('영상퀴즈_진행기록_' + adm.from + '_' + adm.to + '.csv', out);
}

function admExportStudents() {
  const d = admCompute();
  const out = [['학년', '반', '번호', '이름', '참여 횟수', '제출 응답', '정답 수', '정답률(%)']];
  admStudentList(d).forEach(s => {
    out.push([s.grade, s.klass, s.num, s.name, s.sessions.length, s.answered, s.correct,
      s.graded ? Math.round(s.correct / s.graded * 100) : '']);
  });
  downloadCSV('영상퀴즈_학생별누적_' + adm.from + '_' + adm.to + '.csv', out);
}

/* ══════════════════════════════════════════════════════════════════════
   부팅 — 익명 로그인 후 라우팅

   교사도 학생도 아무것도 로그인하지 않습니다. 페이지를 여는 순간 브라우저가
   조용히 익명 계정을 발급받고, 데이터베이스 규칙(auth != null)은 그 계정만
   통과시킵니다. 주소만 알아낸 외부인이 학생 이름을 긁어가는 것을 막기 위한 장치입니다.
   ══════════════════════════════════════════════════════════════════════ */
function bootWithAuth() {
  APP().innerHTML = topbar() + '<div class="wrap"><div class="empty">연결 중…</div></div>';

  firebase.auth().onAuthStateChanged(user => {
    if (user && !authReady) { authReady = true; router(); }
  });

  firebase.auth().signInAnonymously().catch(err => {
    console.error(err);
    // operation-not-allowed = 익명 공급자만 꺼져 있음 / configuration-not-found = Authentication 자체가 미설정
    const code = String(err.code || '');
    const needsEnable = code.indexOf('operation-not-allowed') >= 0 || code.indexOf('configuration-not-found') >= 0;
    APP().innerHTML = topbar() + '<div class="wrap"><div class="card">' +
      '<h2>접속할 수 없습니다</h2>' +
      '<div class="notice" style="margin-top:12px">' +
        (needsEnable
          ? 'Firebase에서 <b>익명 로그인</b>이 아직 켜져 있지 않습니다.<br>' +
            'Firebase 콘솔 → <b>Authentication → Sign-in method → 익명</b>을 사용 설정한 뒤 새로고침하세요.'
          : '오류: ' + esc(err.message)) +
      '</div>' +
      '<button class="btn primary" onclick="location.reload()">새로고침</button>' +
    '</div></div>';
  });
}
bootWithAuth();
</script>
</body>
</html>
