function renderTeacherDashboard(plans, identity, isAdmin, ownPlans) {
  const panel = document.getElementById('teacher-dashboard');
  if (!panel) return false;
  const escape = value => typeof esc === 'function' ? esc(value) : String(value == null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .split('"').join('&quot;').split("'").join('&#39;');
  const validPlans = Object.values(plans || {}).filter(plan => plan &&
    ['planned', 'live'].includes(plan.status) &&
    Number.isSafeInteger(plan.plannedStartAt) && Number.isSafeInteger(plan.plannedEndAt) &&
    plan.plannedEndAt > plan.plannedStartAt && Number.isSafeInteger(plan.expectedStudents) &&
    plan.expectedStudents >= 1 && plan.expectedStudents <= 500);
  const activePlans = validPlans;
  const livePlans = validPlans.filter(plan => plan.status === 'live');
  const actualParticipants = livePlans.reduce((total, plan) => total +
    (Number.isSafeInteger(plan.actualParticipants) && plan.actualParticipants >= 0 ? plan.actualParticipants : 0), 0);
  let peakExpected = 0;
  let warningLevel = 'green';
  activePlans.forEach(plan => {
    try {
      const thresholds = typeof classPlanningThresholds === 'object'
        ? classPlanningThresholds : ClassPlanningCore.DEFAULT_THRESHOLDS;
      const summary = ClassPlanningCore.summarizeWindow(activePlans, plan, thresholds);
      peakExpected = Math.max(peakExpected, summary.expectedConcurrentStudents);
      if (summary.level === 'crowded' || (summary.level === 'caution' && warningLevel === 'green')) {
        warningLevel = summary.level;
      }
    } catch (error) { console.warn('teacher dashboard summary', error); }
  });
  const warningLabel = warningLevel === 'crowded' ? '빨강' : warningLevel === 'caution' ? '노랑' : '초록';
  const statusLabel = { planned: '예정', live: '진행 중', ended: '종료', cancelled: '취소' };
  const timeLabel = millis => {
    const date = new Date(millis);
    return String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
  };
  const rows = validPlans.sort((a, b) => a.plannedStartAt - b.plannedStartAt).map(plan => {
    const own = ownPlans && ownPlans[plan.planId] &&
      ownPlans[plan.planId].status === 'planned' && plan.status === 'planned'
      ? ownPlans[plan.planId] : null;
    const administratorIdentity = isAdmin === true
      ? '<span class="admin-identity">담당 ' + escape(plan.ownerDisplayName || '이름 없음') +
        (plan.ownerEmailCanonical ? ' · ' + escape(plan.ownerEmailCanonical) : '') + '</span>'
      : '';
    const actual = Number.isSafeInteger(plan.actualParticipants) && plan.actualParticipants >= 0
      ? ' · 실제 ' + plan.actualParticipants + '명' : '';
    const actions = own ? '<span class="dashboard-plan-actions"><button class="btn sm" type="button" ' +
      'data-plan-id="' + escape(plan.planId) + '" data-dashboard-action="edit" ' +
      'onclick="teacherDashboardPlanAction(this.dataset.planId, this.dataset.dashboardAction)">계획 수정</button>' +
      '<button class="btn sm primary" type="button" data-plan-id="' + escape(plan.planId) + '" ' +
      'data-dashboard-action="start" onclick="teacherDashboardPlanAction(this.dataset.planId, this.dataset.dashboardAction)">수업 시작</button></span>' : '';
    return '<div class="plan-row"><span class="time">' + timeLabel(plan.plannedStartAt) +
      '–' + timeLabel(plan.plannedEndAt) + '</span><div class="name">' + escape(plan.className) +
      '<span class="admin-identity">' + escape(plan.setTitleSnapshot) + ' · ' +
      statusLabel[plan.status] + '</span>' + administratorIdentity + actions + '</div><span class="counts">예상 ' +
      plan.expectedStudents + '명' + actual + '</span></div>';
  }).join('');
  panel.innerHTML = '<h2>오늘의 수업 현황</h2><p class="sub">혼잡도는 수업 운영을 돕는 안내이며, 수업 시작을 제한하지 않습니다.</p>' +
    '<div class="summary"><span>현재 진행 ' + livePlans.length + '개</span><span>실제 참여 ' +
    actualParticipants + '명</span><span>예상 동시 참여 ' + peakExpected + '명</span><span class="' +
    warningLevel + '">혼잡도 ' + warningLabel + '</span></div>' +
    (rows ? '<div class="plan-list">' + rows + '</div>' : '<div class="empty">오늘 예정되었거나 진행 중인 수업이 없습니다.</div>');
  return true;
}

function teacherDashboardPlanAction(planId, action) {
  const state = teacherDashboard;
  if (!state || state.stopped || !state.isCurrent || !state.isCurrent()) return false;
  const own = state.ownPlans && state.ownPlans[planId];
  const plan = state.publicPlans && state.publicPlans[planId];
  if (!own || !plan || own.status !== 'planned' || plan.status !== 'planned' ||
      !Number.isSafeInteger(own.revision) || own.revision < 1 ||
      !['edit', 'start'].includes(action) || typeof plan.setId !== 'string' || !plan.setId) return false;
  go('play/' + encodeURIComponent(plan.setId) + '?plan=' + encodeURIComponent(planId) +
    '&revision=' + own.revision + '&mode=' + action);
  return true;
}

function startTeacherDashboard(identity) {
  const panel = document.getElementById('teacher-dashboard');
  const stateIdentity = identity || teacherState;
  if (!panel || !AuthCore.isTeacher(teacherState) || !stateIdentity ||
      stateIdentity.uid !== teacherState.uid || !['#/', '#', ''].includes(String(location.hash || '#/'))) {
    return Promise.resolve(false);
  }
  const authGeneration = teacherAuthVersion;
  const isAdmin = AuthCore.isAdmin(teacherState);
  if (teacherDashboard && !teacherDashboard.stopped && teacherDashboard.uid === stateIdentity.uid &&
      teacherDashboard.authGeneration === authGeneration && teacherDashboard.panel === panel) {
    return teacherDashboard.promise || Promise.resolve(true);
  }
  stopTeacherDashboard();
  const state = teacherDashboard = {
    uid: stateIdentity.uid, email: stateIdentity.email, authGeneration, panel, isAdmin,
    identity: { uid: stateIdentity.uid, email: stateIdentity.email, role: stateIdentity.role },
    stopped: false, error: '', promise: null, publicPlans: {}, privatePlans: {}, ownPlans: {},
    unsubscribers: []
  };
  const isCurrent = () => teacherDashboard === state && !state.stopped &&
    AuthCore.isTeacher(teacherState) && teacherState.uid === state.uid &&
    (!state.isAdmin || AuthCore.isAdmin(teacherState)) &&
    teacherAuthVersion === state.authGeneration && ['#/', '#', ''].includes(String(location.hash || '#/')) &&
    document.getElementById('teacher-dashboard') === state.panel &&
    (!document.body || typeof document.body.contains !== 'function' || document.body.contains(state.panel));
  state.isCurrent = isCurrent;
  state.promise = (async () => {
    try {
      if (!teacherUser || teacherUser.uid !== state.uid) {
        throw new Error('서버 시각 동기화를 준비하지 못했습니다.');
      }
      if (clockUserId !== state.uid) {
        if (typeof ensureClock !== 'function') throw new Error('서버 시각 동기화를 준비하지 못했습니다.');
        await ensureClock(teacherUser);
        if (!isCurrent()) return false;
      }
      if (clockUserId !== state.uid || !store || typeof store.serverNow !== 'function') {
        throw new Error('서버 시각을 확인하지 못했습니다.');
      }
      const now = store.serverNow();
      if (!Number.isSafeInteger(now)) throw new Error('서버 시각이 올바르지 않습니다.');
      const kstOffset = 9 * 60 * 60_000;
      const kstDate = new Date(now + kstOffset);
      kstDate.setUTCHours(0, 0, 0, 0);
      const dayStart = kstDate.getTime() - kstOffset;
      const nextDayStart = dayStart + 24 * 60 * 60_000;
      // Keep a one-minute transport margin inside the rules' 1448-minute horizon.
      const from = now - (24 * 60 + 7) * 60_000;
      const to = Math.min(nextDayStart, now + 32 * 24 * 60 * 60_000 - 1);
      if (to <= from) throw new Error('수업 현황 조회 기간을 계산하지 못했습니다.');
      if (state.isAdmin) {
        if (!store.probeTeacherAllowance || !store.listAdminPlans) throw new Error('관리자 현황 조회를 준비하지 못했습니다.');
        const allowance = await store.probeTeacherAllowance(state.email);
        if (!isCurrent()) return false;
        if (!allowance || allowance.enabled !== true || allowance.role !== 'admin') {
          throw new Error('관리자 권한을 서버에서 다시 확인하지 못했습니다.');
        }
      }
      if (typeof store.listPublicPlans !== 'function' || typeof store.listOwnClassPlans !== 'function' ||
          (state.isAdmin && typeof store.listAdminPlans !== 'function')) {
        throw new Error('수업 현황 조회를 준비하지 못했습니다.');
      }
      const [publicPlans, privatePlans, ownPlans, thresholds] = await Promise.all([
        store.listPublicPlans(from, to, 100),
        state.isAdmin ? store.listAdminPlans(from, to, 100) : Promise.resolve({}),
        store.listOwnClassPlans(from, to, 100, state.identity),
        typeof store.getClassPlanningThresholds === 'function'
          ? store.getClassPlanningThresholds()
          : Promise.resolve(ClassPlanningCore.DEFAULT_THRESHOLDS)
      ]);
      if (!isCurrent()) return false;
      classPlanningThresholds = ClassPlanningCore.normalizeThresholds(thresholds);
      state.error = '';
      const today = plans => Object.fromEntries(Object.entries(plans || {}).filter(([, plan]) => plan &&
        ['planned', 'live'].includes(plan.status) &&
        (plan.status === 'live' || Number(plan.plannedStartAt) >= dayStart)));
      const mergeAdmin = () => state.isAdmin
        ? Object.fromEntries(Object.entries(state.privatePlans).map(([planId, plan]) => {
            const publicPlan = state.publicRawPlans[planId] || {};
            return [planId, {
              ...plan,
              ...(Number.isSafeInteger(publicPlan.actualParticipants) && publicPlan.actualParticipants >= 0
                ? { actualParticipants: publicPlan.actualParticipants } : {})
            }];
          }))
        : state.publicRawPlans;
      const refresh = () => {
        if (!isCurrent()) return false;
        state.publicPlans = mergeAdmin();
        state.ownPlans = Object.fromEntries(Object.entries(state.rawOwnPlans || {}).filter(([planId, own]) =>
          state.publicPlans[planId] && own && own.planId === planId && own.status === state.publicPlans[planId].status
        ));
        return renderTeacherDashboard(state.publicPlans, state.identity, state.isAdmin, state.ownPlans);
      };
      state.publicRawPlans = today(publicPlans);
      state.privatePlans = today(privatePlans);
      state.rawOwnPlans = ownPlans || {};
      refresh();
      const listenerError = error => {
        if (!isCurrent()) return;
        console.warn('teacher dashboard live listener', error);
      };
      if (typeof store.subscribePublicPlans === 'function') {
        state.unsubscribers.push(store.subscribePublicPlans(from, to, 100, plans => {
          if (!isCurrent()) return;
          state.publicRawPlans = today(plans);
          refresh();
        }, listenerError));
      }
      if (state.isAdmin && typeof store.subscribeAdminPlans === 'function') {
        state.unsubscribers.push(store.subscribeAdminPlans(from, to, 100, plans => {
          if (!isCurrent()) return;
          state.privatePlans = today(plans);
          refresh();
        }, listenerError));
      }
      return true;
    } catch (error) {
      if (!isCurrent()) return false;
      state.error = error && error.message ? error.message : String(error);
      state.panel.innerHTML = '<h2>오늘의 수업 현황</h2><div class="notice bad" role="alert">현황을 불러오지 못했습니다. ' +
        '수업 시작은 계속할 수 있습니다.</div><button class="btn sm" onclick="retryTeacherDashboard()">다시 시도</button>';
      return false;
    }
  })();
  if (typeof onCleanup === 'function') onCleanup(() => { if (teacherDashboard === state) stopTeacherDashboard(); });
  return state.promise;
}

function retryTeacherDashboard() {
  const state = teacherDashboard;
  if (!state || state.stopped || !['#/', '#', ''].includes(String(location.hash || '#/'))) return Promise.resolve(false);
  const identity = state.identity;
  stopTeacherDashboard();
  return startTeacherDashboard(identity);
}

function teacherDeletionScreenIsCurrent(state) {
  const route = typeof location === 'undefined' ? '#/' : String(location.hash || '#/');
  return teacherDeletionScreen === state && !!state && teacherAuthVersion === state.authGeneration &&
    !!teacherUser && teacherUser.uid === state.uid && !!teacherState && teacherState.uid === state.uid &&
    ['teacher', 'deletion_pending', 'suspended'].includes(teacherState.status) &&
    ['#/', '#', ''].includes(route);
}

function renderTeacherDeletion(state) {
  if (!state || !teacherDeletionScreenIsCurrent(state)) return false;
  const safe = value => typeof esc === 'function' ? esc(value) : String(value == null ? '' : value);
  const readiness = state.readiness || {
    ownedSetCount: 0, blockingSessionCount: 0, blockingSessions: [],
    ownedSetLimitReached: false, blockingSessionLimitReached: false
  };
  const owned = readiness.ownedSetLimitReached ? '100개 이상' : readiness.ownedSetCount + '개';
  const blocking = readiness.blockingSessionLimitReached
    ? '100개 이상' : Number(readiness.blockingSessionCount || 0) + '개';
  const message = state.error
    ? '<div class="notice bad" role="alert">' + safe(state.error) + '</div>'
    : state.message ? '<div class="notice info" role="status">' + safe(state.message) + '</div>' : '';
  const allowance = state.allowance || {};
  let action = '';
  if (allowance.status === 'deletion_pending' || teacherState.status === 'deletion_pending') {
    const eligibleAt = allowance.purgeEligibleAtMs ||
      (allowance.purgeEligibleAt && typeof allowance.purgeEligibleAt.toMillis === 'function'
        ? allowance.purgeEligibleAt.toMillis() : null);
    const sessionRows = (Array.isArray(readiness.blockingSessions) ? readiness.blockingSessions : [])
      .filter(session => session && typeof session.sessionId === 'string' &&
        ['allocating', 'active', 'live', 'plan_live'].includes(session.status))
      .map(session => {
        const label = session.label || session.code || session.sessionId;
        const buttonLabel = session.status === 'allocating' ? '할당 정리'
          : session.status === 'plan_live' ? '계획 종료 재시도' : '안전 종료';
        return '<li><span><b>' + safe(label) + '</b> <span class="hint">' + safe(session.status) +
          (session.code ? ' · ' + safe(session.code) : '') + '</span></span> ' +
          '<button class="btn sm" onclick="resolveTeacherDeletionSession(' +
          safe(JSON.stringify(session.sessionId)) + ')"' +
          (state.busy || state.resolvingSessionId ? ' disabled' : '') + '>' + buttonLabel + '</button></li>';
      }).join('');
    action = '<div class="notice bad"><b>탈퇴 대기 중 — 계정은 안전하게 중지되었습니다.</b><br>' +
      '새 저장·복사·수업계획·수업 시작은 차단됩니다. 기존 진행 세션은 종료만 할 수 있습니다.' +
      (eligibleAt ? '<br>관리자 정리 가능 시각: ' + safe(new Date(eligibleAt).toLocaleString('ko-KR')) :
        '<br>정확한 관리자 정리 시각을 서버에서 다시 확인해야 합니다.') + '</div>' +
      (sessionRows ? '<h2 style="font-size:17px;margin-top:16px">내 정리 필요 세션</h2><ul>' + sessionRows + '</ul>' : '') +
      '<p class="sub">이 목록의 자기 세션만 안전 종료하거나 고아 할당을 정리할 수 있습니다. 편집·새 시작 기능은 열리지 않습니다.</p>' +
      '<p class="sub">30일 전에는 요청을 철회할 수 있습니다. 별도 관리자 중지가 있으면 철회 뒤 suspended 상태가 유지됩니다.</p>' +
      '<button class="btn" onclick="cancelTeacherDeletion()"' + (state.busy ? ' disabled' : '') + '>탈퇴 요청 철회</button>';
  } else if (allowance.status === 'suspended' || teacherState.status === 'suspended') {
    const sessionRows = (Array.isArray(readiness.blockingSessions) ? readiness.blockingSessions : [])
      .filter(session => session && typeof session.sessionId === 'string' &&
        ['allocating', 'active', 'live', 'plan_live'].includes(session.status))
      .map(session => '<li><span><b>' + safe(session.label || session.code || session.sessionId) +
        '</b> <span class="hint">' + safe(session.status) + '</span></span> ' +
        '<button class="btn sm" onclick="resolveTeacherDeletionSession(' +
        safe(JSON.stringify(session.sessionId)) + ')"' +
        (state.busy || state.resolvingSessionId ? ' disabled' : '') + '>안전 종료</button></li>').join('');
    action = '<div class="notice bad">관리자 중지 상태입니다. 새 저장·복사·수업 시작은 차단되며 기존 자기 세션은 안전 종료만 할 수 있습니다.</div>' +
      (sessionRows ? '<h2 style="font-size:17px;margin-top:16px">내 종료 필요 세션</h2><ul>' + sessionRows + '</ul>' : '') +
      '<p class="sub">관리자에게 복구를 요청해 주세요.</p>';
  } else {
    action = '<p class="sub">아래 문구를 정확히 입력해야 요청할 수 있습니다.</p>' +
      '<label class="f" for="teacher-deletion-ack">확인 문구<input id="teacher-deletion-ack" autocomplete="off" placeholder="계정 사용 종료 요청"' +
      (state.busy ? ' disabled' : '') + '></label>' +
      '<button class="btn danger" onclick="requestTeacherDeletion(document.getElementById(\'teacher-deletion-ack\'))"' +
      (state.busy ? ' disabled' : '') + '>계정 사용 종료 요청</button>';
  }
  APP().innerHTML = topbar() + '<div class="wrap"><div class="card"><h1 style="font-size:22px">교사 계정 사용 종료</h1>' +
    '<p class="sub">자동 삭제는 실행하지 않습니다. 관리자가 30일 경과와 모든 blocker 해소를 다시 감사한 뒤 명시적으로 정리합니다.</p>' +
    '<div class="notice info"><b>소유 세트 ' + safe(owned) + '</b> · <b>정리 필요 세션 ' + safe(blocking) +
    '</b><br>소유 세트는 다른 승인 교사에게 이전하거나 휴지통 정리를 완료해야 합니다. allocating·active·live 세션은 안전하게 정리해 주세요.</div>' +
    message + action + '</div></div>';
  return true;
}

function resolveTeacherDeletionSession(sessionId) {
  const state = teacherDeletionScreen;
  const exactSessionId = String(sessionId || '');
  const sessions = state && state.readiness && Array.isArray(state.readiness.blockingSessions)
    ? state.readiness.blockingSessions : [];
  const target = sessions.find(session => session && session.sessionId === exactSessionId &&
    ['allocating', 'active', 'live', 'plan_live'].includes(session.status));
  if (!teacherDeletionScreenIsCurrent(state) || !target || state.busy || state.resolvingSessionId ||
      !state.allowance || !['deletion_pending', 'suspended'].includes(state.allowance.status) ||
      !teacherState || !['deletion_pending', 'suspended'].includes(teacherState.status) ||
      typeof store.resolveTeacherDeletionSession !== 'function') return Promise.resolve(false);
  state.resolvingSessionId = exactSessionId;
  state.error = '';
  renderTeacherDeletion(state);
  return store.resolveTeacherDeletionSession(state.uid, exactSessionId).then(result => {
    if (!teacherDeletionScreenIsCurrent(state)) return false;
    if (result !== true && !(result && result.complete === true)) {
      throw new Error('세션 정리가 완료되지 않았습니다.');
    }
    state.resolvingSessionId = '';
    state.readiness.blockingSessions = sessions.filter(session => session.sessionId !== exactSessionId);
    state.readiness.blockingSessionCount = Math.max(
      0, Number(state.readiness.blockingSessionCount || 0) - 1
    );
    state.message = target.status === 'allocating'
      ? '고아 세션 할당을 안전하게 정리했습니다.' : '진행 세션을 안전하게 종료했습니다.';
    renderTeacherDeletion(state);
    return true;
  }).catch(error => {
    if (!teacherDeletionScreenIsCurrent(state)) return false;
    state.resolvingSessionId = '';
    state.error = error && error.message ? error.message : '세션을 안전하게 정리하지 못했습니다.';
    renderTeacherDeletion(state);
    return false;
  });
}

function screenTeacherDeletion() {
  if (!teacherUser || !teacherState ||
      !['teacher', 'deletion_pending', 'suspended'].includes(teacherState.status)) return Promise.resolve(false);
  const state = teacherDeletionScreen = {
    uid: teacherUser.uid,
    authGeneration: teacherAuthVersion,
    allowance: teacherAllowance || null,
    readiness: null,
    busy: false,
    error: '',
    message: ''
  };
  if (typeof onCleanup === 'function') onCleanup(() => {
    if (teacherDeletionScreen === state) teacherDeletionScreen = null;
  });
  renderTeacherDeletion(state);
  return Promise.all([
    typeof store.getOwnTeacherAllowance === 'function'
      ? store.getOwnTeacherAllowance(state.uid) : Promise.resolve(state.allowance),
    store.getTeacherDeletionReadiness(state.uid)
  ]).then(([allowance, readiness]) => {
    if (!teacherDeletionScreenIsCurrent(state)) return false;
    if (!allowance || allowance.uid !== state.uid) throw new Error('현재 계정 allowance를 서버에서 확인하지 못했습니다.');
    state.allowance = allowance;
    state.readiness = readiness;
    renderTeacherDeletion(state);
    return true;
  }).catch(error => {
    if (!teacherDeletionScreenIsCurrent(state)) return false;
    state.error = error && error.message ? error.message : '탈퇴 준비 상태를 불러오지 못했습니다.';
    renderTeacherDeletion(state);
    return false;
  });
}

function requestTeacherDeletion(acknowledgmentInput) {
  const state = teacherDeletionScreen;
  if (!teacherDeletionScreenIsCurrent(state) || state.busy ||
      !state.allowance || state.allowance.status !== 'active') return Promise.resolve(false);
  if (!acknowledgmentInput || String(acknowledgmentInput.value || '') !== '계정 사용 종료 요청') {
    alert('확인 문구 “계정 사용 종료 요청”을 정확히 입력해 주세요.');
    return Promise.resolve(false);
  }
  state.busy = true;
  state.error = '';
  state.message = '';
  renderTeacherDeletion(state);
  return store.requestTeacherDeletion(state.uid).then(allowance => {
    if (!teacherDeletionScreenIsCurrent(state)) return false;
    state.busy = false;
    state.allowance = allowance;
    state.message = '탈퇴 요청을 저장했고 교사 기능을 즉시 중지했습니다.';
    if (typeof setTeacherAllowance === 'function') setTeacherAllowance(allowance);
    renderTeacherDeletion(state);
    return true;
  }).catch(async error => {
    if (!teacherDeletionScreenIsCurrent(state)) return false;
    state.busy = false;
    try {
      const allowance = await store.getOwnTeacherAllowance(state.uid);
      if (!teacherDeletionScreenIsCurrent(state)) return false;
      if (allowance && allowance.status === 'deletion_pending') {
        state.allowance = allowance;
        state.message = '요청은 안전하게 중지 상태로 반영됐습니다. 정확한 정리 시각을 서버에서 다시 확인해 주세요.';
        state.error = '';
        if (typeof setTeacherAllowance === 'function') setTeacherAllowance(allowance);
        renderTeacherDeletion(state);
        return false;
      }
    } catch (reloadError) {
      if (typeof console !== 'undefined' && console.error) console.error(reloadError);
    }
    state.error = error && error.message ? error.message : '탈퇴 요청을 저장하지 못했습니다.';
    renderTeacherDeletion(state);
    return false;
  });
}

function cancelTeacherDeletion() {
  const state = teacherDeletionScreen;
  if (!teacherDeletionScreenIsCurrent(state) || state.busy || !state.allowance ||
      state.allowance.status !== 'deletion_pending') return Promise.resolve(false);
  if (typeof confirm === 'function' && !confirm('계정 사용 종료 요청을 철회할까요?')) return Promise.resolve(false);
  state.busy = true;
  state.error = '';
  renderTeacherDeletion(state);
  return store.cancelTeacherDeletion(state.uid).then(allowance => {
    if (!teacherDeletionScreenIsCurrent(state)) return false;
    state.busy = false;
    state.allowance = allowance;
    state.message = allowance.status === 'suspended'
      ? '탈퇴 요청을 철회했습니다. 별도 관리자 중지는 유지됩니다.'
      : '탈퇴 요청을 철회하고 교사 권한을 복구했습니다.';
    if (typeof setTeacherAllowance === 'function') setTeacherAllowance(allowance);
    renderTeacherDeletion(state);
    return true;
  }).catch(error => {
    if (!teacherDeletionScreenIsCurrent(state)) return false;
    state.busy = false;
    state.error = error && error.message ? error.message : '탈퇴 요청을 철회하지 못했습니다.';
    renderTeacherDeletion(state);
    return false;
  });
}

function teacherRequestRouteIsCurrent() {
  const route = typeof location === 'undefined' ? '#/' : String(location.hash || '#/');
  return route === '#/' || route === '' || route === '#';
}

function clearTeacherRequestScreen(retract) {
  const hadScreen = !!teacherRequestScreen;
  teacherRequestScreen = null;
  if (retract && hadScreen && teacherRequestRouteIsCurrent() && typeof APP === 'function') {
    APP().innerHTML = '<div class="wrap"><div class="empty">인증 상태를 다시 확인하는 중…</div></div>';
  }
  return hadScreen;
}

function teacherRequestScreenIsCurrent(state) {
  const routeCurrent = typeof teacherRequestRouteIsCurrent === 'function'
    ? teacherRequestRouteIsCurrent()
    : (typeof location === 'undefined' || ['#/', '', '#'].includes(String(location.hash || '#/')));
  return teacherRequestScreen === state && !!state && teacherAuthVersion === state.authGeneration &&
    !!teacherUser && teacherUser.uid === state.uid && !!teacherState && teacherState.uid === state.uid &&
    teacherState.status === 'unapproved' && routeCurrent;
}

function renderTeacherRequest(state) {
  if (!state) return false;
  const request = state.request || null;
  const draft = state.draft || { displayName: state.displayName || '', organization: '', note: '' };
  const busy = !!state.submitting || !!state.cancelling || !!state.refreshing;
  const status = state.error
    ? '<div class="notice bad" role="alert">' + esc(state.error) + '</div>'
    : state.message ? '<div class="notice ok" role="status">' + esc(state.message) + '</div>' : '';
  const identity = '<div class="card"><h2>Google 계정 확인</h2><div class="sub">이름과 이메일은 Google 계정에서 가져오며 신청 내용으로 바꿀 수 없습니다.</div>' +
    '<div><b>' + esc(draft.displayName) + '</b><br><span class="hint">' + esc(state.email) + '</span></div></div>';
  let body = '';
  if (!request) {
    body = '<div class="card"><h1 style="font-size:22px">교사 권한 신청</h1><p class="sub">공용 계정을 쓰지 않고, 지금 로그인한 Google 계정으로 교사 권한을 신청합니다.</p>' + status +
      '<form id="teacher-request-form" onsubmit="submitTeacherRequestForm(event)">' +
      '<div class="field"><label class="f" for="teacher-request-organization">소속 (선택)</label><input id="teacher-request-organization" name="organization" maxlength="120" value="' + esc(draft.organization) + '"' + (busy ? ' disabled' : '') + '></div>' +
      '<div class="field"><label class="f" for="teacher-request-note">메모 (선택)</label><textarea id="teacher-request-note" name="note" maxlength="500"' + (busy ? ' disabled' : '') + '>' + esc(draft.note) + '</textarea></div>' +
      '<button class="btn primary" type="submit"' + (busy ? ' disabled' : '') + '>' + (state.submitting ? '신청 저장 중…' : '교사 권한 신청') + '</button></form></div>';
  } else if (request.status === 'pending') {
    body = '<div class="card"><h1 style="font-size:22px">교사 권한 신청</h1><div class="notice info" role="status">승인 대기 중입니다. 관리자가 신청 내용을 검토한 뒤 알려드립니다.</div>' + status +
      '<div class="row"><button class="btn" onclick="refreshTeacherRequestStatus()"' + (busy ? ' disabled' : '') + '>' + (state.refreshing ? '상태 확인 중…' : '승인 상태 새로고침') + '</button>' +
      '<button class="btn danger" onclick="cancelTeacherRequest()"' + (busy ? ' disabled' : '') + '>' + (state.cancelling ? '신청 취소 중…' : '신청 취소') + '</button></div></div>';
  } else if (request.status === 'rejected') {
    body = '<div class="card"><h1 style="font-size:22px">교사 권한 신청</h1><div class="notice bad" role="status">신청이 승인되지 않았습니다.' +
      (request.decisionReason ? ' 사유: ' + esc(request.decisionReason) : ' 관리자에게 문의해 주세요.') + '</div>' + status +
      '<form id="teacher-request-form" onsubmit="submitTeacherRequestForm(event)">' +
      '<div class="field"><label class="f">소속 (선택)<input name="organization" maxlength="120" value="' + esc(request.organization || '') + '"' + (busy ? ' disabled' : '') + '></label></div>' +
      '<div class="field"><label class="f">메모 (선택)<textarea name="note" maxlength="500"' + (busy ? ' disabled' : '') + '>' + esc(request.note || '') + '</textarea></label></div>' +
      '<button class="btn primary" type="submit"' + (busy ? ' disabled' : '') + '>다시 신청</button></form></div>';
  } else if (request.status === 'cancelled') {
    body = '<div class="card"><h1 style="font-size:22px">교사 권한 신청</h1><div class="notice" role="status">신청이 취소되었습니다. 현재 Google 신원을 유지한 채 다시 신청할 수 있습니다.</div>' + status +
      '<form id="teacher-request-form" onsubmit="submitTeacherRequestForm(event)">' +
      '<div class="field"><label class="f">소속 (선택)<input name="organization" maxlength="120" value="' + esc(request.organization || '') + '"' + (busy ? ' disabled' : '') + '></label></div>' +
      '<div class="field"><label class="f">메모 (선택)<textarea name="note" maxlength="500"' + (busy ? ' disabled' : '') + '>' + esc(request.note || '') + '</textarea></label></div>' +
      '<button class="btn primary" type="submit"' + (busy ? ' disabled' : '') + '>다시 신청</button></form></div>';
  } else {
    body = '<div class="card"><h1 style="font-size:22px">교사 권한 신청</h1><div class="notice info" role="status">승인 상태를 서버에서 다시 확인해 주세요.</div>' + status +
      '<button class="btn" onclick="refreshTeacherRequestStatus()"' + (busy ? ' disabled' : '') + '>승인 상태 새로고침</button></div>';
  }
  APP().innerHTML = topbar() + '<div class="wrap">' + identity + body + '</div>';
  return true;
}

function screenTeacherRequest() {
  if (!teacherUser || !teacherState || teacherState.status !== 'unapproved') return false;
  const state = teacherRequestScreen = {
    uid: teacherUser.uid, email: String(teacherUser.email || '').trim().toLowerCase(),
    displayName: String(teacherUser.displayName || '').trim(), authGeneration: teacherAuthVersion,
    request: null, submitting: false, cancelling: false, refreshing: false, message: '', error: '',
    draft: { displayName: String(teacherUser.displayName || '').trim(), organization: '', note: '' }
  };
  if (!state.uid || !state.email || !state.displayName) return false;
  if (typeof onCleanup === 'function') onCleanup(() => { if (teacherRequestScreen === state) clearTeacherRequestScreen(false); });
  renderTeacherRequest(state);
  return store.getOwnTeacherRequest(state.uid).then(request => {
    if (!teacherRequestScreenIsCurrent(state)) return false;
    state.request = request || null;
    renderTeacherRequest(state);
    return true;
  }).catch(error => {
    if (!teacherRequestScreenIsCurrent(state)) return false;
    state.error = '신청 상태를 불러오지 못했습니다. 다시 시도해 주세요.';
    console.error(error);
    renderTeacherRequest(state);
    return false;
  });
}

function submitTeacherRequestForm(event) {
  if (event && typeof event.preventDefault === 'function') event.preventDefault();
  const state = teacherRequestScreen;
  const resubmitting = !!state.request && ['cancelled', 'rejected'].includes(state.request.status);
  if (!teacherRequestScreenIsCurrent(state) || state.submitting || state.cancelling ||
      (state.request && !resubmitting)) return Promise.resolve(false);
  const form = event && event.currentTarget;
  const fields = form && form.elements ? form.elements : {};
  state.draft = Object.assign({}, state.draft, {
    organization: String(fields.organization ? fields.organization.value : ''),
    note: String(fields.note ? fields.note.value : '')
  });
  let request;
  try {
    request = TeacherAccessRequestCore.buildRequest(teacherUser, {
      organization: state.draft.organization, note: state.draft.note
    }, Date.now());
  } catch (error) {
    state.error = error && error.message ? error.message : String(error);
    renderTeacherRequest(state);
    return Promise.resolve(false);
  }
  state.submitting = true; state.error = ''; state.message = '';
  renderTeacherRequest(state);
  const write = resubmitting
    ? store.resubmitTeacherRequest(state.uid, state.request.revision, {
        emailCanonical: request.emailCanonical, displayName: request.displayName,
        organization: request.organization, note: request.note
      })
    : store.submitTeacherRequest(request);
  return write.then(saved => {
    if (!teacherRequestScreenIsCurrent(state)) return false;
    state.request = saved || request;
    state.submitting = false;
    state.message = '신청을 저장했습니다. 관리자 승인을 기다려 주세요.';
    renderTeacherRequest(state);
    return true;
  }).catch(error => {
    if (!teacherRequestScreenIsCurrent(state)) return false;
    state.submitting = false;
    state.error = error && error.message ? error.message : '신청 저장에 실패했습니다. 다시 시도해 주세요.';
    renderTeacherRequest(state);
    return false;
  });
}

function refreshTeacherRequestStatus() {
  const state = teacherRequestScreen;
  if (!teacherRequestScreenIsCurrent(state) || state.submitting || state.cancelling || state.refreshing) return Promise.resolve(false);
  state.refreshing = true; state.error = ''; state.message = '';
  renderTeacherRequest(state);
  return store.getOwnTeacherRequest(state.uid).then(async request => {
    if (!teacherRequestScreenIsCurrent(state)) return false;
    const allowance = await store.probeTeacherAllowance(state.email);
    if (!teacherRequestScreenIsCurrent(state)) return false;
    state.request = request || null;
    state.refreshing = false;
    if (request && request.status === 'approved' && allowance) {
      if (typeof setTeacherAllowance === 'function') setTeacherAllowance(allowance);
      if (typeof go === 'function') go('sets');
      return true;
    }
    state.message = '승인 상태를 서버에서 다시 확인했습니다.';
    renderTeacherRequest(state);
    return true;
  }).catch(error => {
    if (!teacherRequestScreenIsCurrent(state)) return false;
    state.refreshing = false;
    state.error = error && error.message ? error.message : '승인 상태를 확인하지 못했습니다. 다시 시도해 주세요.';
    renderTeacherRequest(state);
    return false;
  });
}

function cancelTeacherRequest() {
  const state = teacherRequestScreen;
  if (!teacherRequestScreenIsCurrent(state) || state.submitting || state.cancelling ||
      !state.request || state.request.status !== 'pending' || !Number.isSafeInteger(state.request.revision)) return Promise.resolve(false);
  state.cancelling = true; state.error = ''; state.message = '';
  renderTeacherRequest(state);
  return store.cancelTeacherRequest(state.uid, state.request.revision).then(request => {
    if (!teacherRequestScreenIsCurrent(state)) return false;
    state.request = request || Object.assign({}, state.request, { status: 'cancelled', revision: state.request.revision + 1 });
    state.cancelling = false; state.message = '신청을 취소했습니다.';
    renderTeacherRequest(state);
    return true;
  }).catch(error => {
    if (!teacherRequestScreenIsCurrent(state)) return false;
    state.cancelling = false;
    state.error = error && error.message ? error.message : '신청 취소에 실패했습니다. 다시 시도해 주세요.';
    renderTeacherRequest(state);
    return false;
  });
}

/* ══════════════════════════════════════════════════════════════════════
   4-2. 세트 목록 — 불러오기 / 복제

let setList = null;

function screenSetList() {
  setList = { all: [], q: '', showHidden: false, loadingAccess: true };
  const state = setList;
  onCleanup(() => { if (setList === state) setList = null; });
  APP().innerHTML = topbar('<a class="btn sm primary" href="#/make">＋ 새 세트</a>') +
    '<div class="wrap"><div class="empty">세트를 불러오는 중…</div></div>';

  const trashPromise = store.listTrash ? store.listTrash({ ownerUid: teacherState && teacherState.uid, role: teacherState && teacherState.role }).catch(() => []) : Promise.resolve([]);
  Promise.all([store.listQuizSets(), trashPromise]).then(([all, trash]) => {
    if (setList !== state) return;
    state.all = all.map(item => {
      const s = normSet(item);
      const id = item.id;
      s.id = id;
      return s;
    }).sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
    state.trashCount = Array.isArray(trash) ? trash.length : 0;
    const checks = state.all.map(s => {
      if (!s.ownerUid || !teacherState || s.ownerUid === teacherState.uid || !store.canEditQuizSet) return Promise.resolve(s);
      return store.canEditQuizSet(s.id, teacherState).then(ok => { s.isCollaborator = !!ok; return s; }).catch(() => s);
    });
    Promise.all(checks).then(() => { if (setList === state) { state.loadingAccess = false; renderSetList(); } });
  }).catch(e => {
    if (setList !== state) return;
    console.error(e);
    APP().innerHTML = topbar() + '<div class="wrap"><div class="card"><div class="empty">불러오기 실패: ' + esc(e.message) + '</div></div></div>';
  });
}

            '<input type="file" accept=".json,application/json" style="display:none" onchange="setImportPick(this)"></label>' +
          '<button class="btn sm" onclick="setExportAll()">📦 전체 내보내기 (백업)</button>' +
        '</div>' +

function setCurrentListSet(id) {
  return setList && setList.all && setList.all.find(s => s.id === id);
}

function uiTrashMillis(value) {
  if (value && typeof value.toMillis === 'function') return value.toMillis();
  if (value && value.seconds != null) return Number(value.seconds) * 1000 + Math.floor(Number(value.nanoseconds || 0) / 1e6);
  if (value instanceof Date) return value.getTime();
  return Number(value) || 0;
}
function trashDates(set) {
  const deleted = uiTrashMillis(set.trashedAt);
  if (!deleted) return '';
  const deadline = deleted + 30 * 24 * 60 * 60 * 1000;
  const remaining = Math.max(0, Math.ceil((deadline - Date.now()) / (24 * 60 * 60 * 1000)));
  return '삭제일 ' + fmtDate(deleted) + ' · 자동 삭제 예정 ' + fmtDate(deadline) + ' · 남은 기간 ' + remaining + '일';
}

function setMoveToTrash(id) {
  const current = setCurrentListSet(id);
  if (!current || !teacherState || current.ownerUid !== teacherState.uid) {
    toast('소유자만 세트를 휴지통으로 이동할 수 있습니다.'); return Promise.resolve(false);
  }

/* ── 세트 내보내기 / 가져오기 ─────────────────────────────────────────
   세트와 이미지를 JSON 파일 한 개로 주고받는다. 백업과 데이터 이전에도 쓴다. */
const EXPORT_VERSION = 1;

function setExport(id) {
  return Promise.all([
    store.getQuizSet(id),
    store.getImages(id)
  ]).then(([savedSet, images]) => {
    if (!savedSet) { toast('세트를 찾을 수 없습니다'); return; }
    const set = Object.assign({}, savedSet);
    delete set.id;
    const pack = {
      _: '영상 퀴즈 세트 파일 — 다른 프로젝트의 세트 목록에서 [가져오기]로 넣으세요.',
      v: EXPORT_VERSION,
      exportedAt: new Date().toISOString(),
      set: set,
      images: Object.keys(images).length ? images : null
    };
    const json = JSON.stringify(pack, null, 1);
    downloadBlob(safeFileName(set.title) + '.영상퀴즈.json',
      new Blob([json], { type: 'application/json;charset=utf-8' }));
    toast('세트를 파일로 내보냈습니다 (' + Math.round(json.length / 1024) + 'KB)');
  }).catch(e => { console.error(e); alert('내보내기 실패: ' + e.message); });
}

/** 목록에 보이는 세트를 한 파일로 — 백업용 */
function setExportAll() {
  if (!setList) return;
  const ids = setList.all.map(s => s.id);
  if (!ids.length) { toast('내보낼 세트가 없습니다'); return; }
  toast(ids.length + '개 세트를 모으는 중…');
  Promise.all(ids.map(id => Promise.all([
    store.getQuizSet(id),

    return { set: set, images: Object.keys(images).length ? images : null };
  })))
  .then(packs => {
    const json = JSON.stringify({
      _: '영상 퀴즈 세트 묶음 파일', v: EXPORT_VERSION,
      exportedAt: new Date().toISOString(),
      sets: packs.filter(p => p.set)

    downloadBlob('영상퀴즈_세트전체_' + fmtDay(Date.now()) + '.영상퀴즈.json',

  }).catch(e => { console.error(e); alert('내보내기 실패: ' + e.message); });
}

function setImportPick(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const fr = new FileReader();
  fr.onerror = () => alert('파일을 읽지 못했습니다.');
  fr.onload = () => {
    let pack;
    try { pack = JSON.parse(fr.result); }
    catch (e) { alert('이 파일은 영상 퀴즈 세트 파일이 아닙니다.'); return; }

    const list = pack.sets ? pack.sets : (pack.set ? [{ set: pack.set, images: pack.images }] : null);
    if (!list || !list.length) { alert('세트가 들어 있지 않은 파일입니다.'); return; }
    if (!confirm(list.length + '개 세트를 이 프로젝트로 가져옵니다.\n기존 세트는 그대로 두고 새로 만듭니다. 계속할까요?')) return;

    toast('가져오는 중…');
    Promise.all(list.map(p => setImportOne(p)))
      .then(ids => {
        toast(ids.length + '개 세트를 가져왔습니다');
        if (setList) screenSetList();
      })
      .catch(e => { console.error(e); alert('가져오기 실패: ' + e.message); });
  };
  fr.readAsText(file);
}

function setImportOne(p) {
  const src = p.set || {};
  const set = normSet(src);
  if (!set || !PlaylistCore.flattenQuestions(set.videos).length) return Promise.reject(new Error('문항이 없는 세트입니다.'));

  // 저장 형식으로 다시 만든다 (낯선 필드가 섞여 규칙에 걸리지 않도록)
  const videos = set.videos.map(video => ({
    videoId: video.videoId,
    videoUrl: video.videoUrl,
    startSec: video.startSec,
    endSec: video.endSec,
    questions: video.questions.map(q => {
      const o = { type: qType(q), t: q.t, text: q.text, choices: q.choices, answer: q.answer };
      if ((q.answers || []).length) o.answers = q.answers;
      if ((q.accept || []).length) o.accept = q.accept;
      if (q.imgUrl) o.imgUrl = q.imgUrl;
      if (q.imgUp) o.imgUp = true;
      if (q.explain) o.explain = q.explain;
      if (q.explainImgUrl) o.explainImgUrl = q.explainImgUrl;
      if (q.explainImgUp) o.explainImgUp = true;
      if (q.limitSec !== null && q.limitSec !== undefined) o.limitSec = q.limitSec;
      return o;
    })
  }));

  const newId = rid(8);
  const data = {
    title: (set.title + ' (가져옴)').slice(0, 200),
    author: set.author || lsGet('vq_teacher'),
    settings: set.settings, videos: videos,
    createdAt: SV_TS, updatedAt: SV_TS
  };
  const saving = store.saveOwnedQuizSet(newId, data, p.images || {}, teacherState);
  return saving
    .then(() => newId);
}

  }).catch(e => { console.error(e); alert('복제 실패: ' + e.message); return null; });
}

/* ══════════════════════════════════════════════════════════════════════
   5. ① 퀴즈 세트 제작 화면
   ══════════════════════════════════════════════════════════════════════ */
let mk = null;          // 편집 중인 세트 상태
let mkPlayer = null;    // 미리보기 플레이어
let mkPlayerVid = '';   // 현재 플레이어에 로드된 영상 ID
let mkQuestionPreviewState = null;
let mkQuestionPreviewTimer = null;
let mkQuestionPreviewRequest = 0;
let mkDraftTimer = null;

function mkHistorySnapshot(state) {
  const source = state || mk || {};
  const videos = typeof PlaylistCore !== 'undefined' && PlaylistCore.normalizeVideos
    ? PlaylistCore.normalizeVideos({ videos: source.videos || [] })
    : (source.videos || []);
  return {
    title: String(source.title || ''),
    author: String(source.author || ''),
    settings: JSON.parse(JSON.stringify(source.settings || {})),
    videos: JSON.parse(JSON.stringify(videos)),
    activeVideo: Number(source.activeVideo) || 0
  };
}
function mkSnapshotsEqual(left, right) {
  return !!right && JSON.stringify(left) === JSON.stringify(right);
}

function mkHistoryRecord(key) {
  const state = mk;
  if (!state || !state.history) return false;
  const next = mkHistorySnapshot(state);
  const current = state.history.current();
  if (JSON.stringify(next) === JSON.stringify(current)) return false;
  state.history.record(next, { key: String(key || 'edit'), at: Date.now(), coalesceMs: 600 });
  mkUpdateHistoryControls();
  return true;
}

function mkResetHistory() {
  const state = mk;
  if (!state || typeof EditorHistoryCore === 'undefined') return;
  const snapshot = mkHistorySnapshot(state);
  if (!state.history) state.history = EditorHistoryCore.create(snapshot, { limit: 50 });
  else state.history.reset(snapshot);
  if (arguments[0] === true) state.persistedSnapshot = JSON.parse(JSON.stringify(snapshot));
  mkUpdateHistoryControls();
}

function mkUpdateHistoryControls() {
  const state = mk;
  if (!state || !state.history || typeof document === 'undefined') return;
  const undo = document.getElementById('mk-undo');
  const redo = document.getElementById('mk-redo');
  if (undo) undo.disabled = !state.history.canUndo();
  if (redo) redo.disabled = !state.history.canRedo();
}

function mkRestoreHistory(snapshot) {
  const state = mk;
  if (!state || !snapshot) return;
  state.title = String(snapshot.title || '');
  state.author = String(snapshot.author || '');
  state.settings = normSettings(snapshot.settings);
  state.videos = PlaylistCore.normalizeVideos({ videos: snapshot.videos || [] });
  state.activeVideo = Math.max(0, Math.min(Number(snapshot.activeVideo) || 0, state.videos.length - 1));
  // Undo/redo is an editor mutation too.  An in-flight save must treat the
  // restored model as newer and leave it dirty until an explicit next save.
  state.editRevision = (Number(state.editRevision) || 0) + 1;
  state.saved = typeof mkSnapshotsEqual === 'function' &&
    mkSnapshotsEqual(mkHistorySnapshot(state), state.persistedSnapshot);
  mkSetSaveStatus(state.saved ? 'saved' : 'dirty');
  if (!state.saved) mkPersistDraft();
  renderMake();
}

function mkUndo() {
  const state = mk;
  if (!state || !state.history || !state.history.canUndo()) return false;
  mkRestoreHistory(state.history.undo());
  return true;
}

function mkRedo() {
  const state = mk;
  if (!state || !state.history || !state.history.canRedo()) return false;
  mkRestoreHistory(state.history.redo());
  return true;
}

function mkHistoryKeyFromEvent(event) {
  const target = event && event.target;
  if (!target) return 'edit';
  if (target.id) return target.id;
  if (target.dataset && target.dataset.questionTime) return 'question-time:' + target.dataset.questionTime;
  const card = target.closest && target.closest('[id^="mk-q-"]');
  return (card && card.id ? card.id : target.type || target.tagName || 'edit');
}

function mkShowSaveToast(message) {
  const el = document.getElementById('mk-save-toast');
  if (!el) return;
  el.textContent = message || '저장 완료';
  el.classList.add('show');
  clearTimeout(mk && mk.saveToastTimer);
  const state = mk;
  state.saveToastTimer = setTimeout(() => {
    if (mk === state) el.classList.remove('show');
  }, 2600);
}

function mkCaptureEditorView() {
  if (typeof document === 'undefined') return null;
  const active = document.activeElement;
  const view = {
    x: typeof window !== 'undefined' ? Number(window.scrollX) || 0 : 0,
    y: typeof window !== 'undefined' ? Number(window.scrollY) || 0 : 0,
    selectionStart: active && typeof active.selectionStart === 'number' ? active.selectionStart : null,
    selectionEnd: active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null,
    id: active && active.id || '',
    questionTime: active && active.dataset && active.dataset.questionTime || '',
    cardId: '', fieldIndex: -1
  };
  const card = active && active.closest && active.closest('[id^="mk-q-"]');
  if (card) {
    view.cardId = card.id;
    view.fieldIndex = Array.from(card.querySelectorAll('input, textarea, select')).indexOf(active);
  }
  return view;
}

function mkRestoreEditorView(view) {
  if (!view || typeof document === 'undefined') return;
  if (typeof window !== 'undefined' && typeof window.scrollTo === 'function') {
    window.scrollTo(view.x || 0, view.y || 0);
  }
  let target = view.id ? document.getElementById(view.id) : null;
  if (!target && view.questionTime && document.querySelector) {
    target = document.querySelector('[data-question-time="' + view.questionTime + '"]');
  }
  if (!target && view.cardId) {
    const card = document.getElementById(view.cardId);
    const fields = card && card.querySelectorAll && card.querySelectorAll('input, textarea, select');
    target = fields && fields[view.fieldIndex] || null;
  }
  if (!target || typeof target.focus !== 'function') return;
  try { target.focus({ preventScroll: true }); } catch (e) { target.focus(); }
  if (view.selectionStart != null && typeof target.setSelectionRange === 'function') {
    try { target.setSelectionRange(view.selectionStart, view.selectionEnd == null ? view.selectionStart : view.selectionEnd); } catch (e) {}
  }
}

function mkSetSaveStatus(state, detail) {
  const el = $('#mk-save-status');
  if (!el) return;
  const label = {
    dirty: '저장하지 않은 변경', saving: '저장 중…',
    saved: '저장됨', failed: '저장 실패 · 다시 시도'
  }[state] || '';
  el.textContent = label + (detail ? ' · ' + detail : '');
  el.dataset.state = state || '';
}

function mkPersistDraft() {
  if (!mk || typeof EditorDraft === 'undefined') return;
  EditorDraft.write(localStorage, mk.id, mk, Date.now());
}

function mkClearDraft(setId) {
  if (typeof EditorDraft === 'undefined') return;
  EditorDraft.clear(localStorage, setId === undefined ? (mk && mk.id) : setId);
}

function mkMarkDirty(key) {
  const state = mk;
  if (!state) return;
  const recorded = typeof mkHistoryRecord === 'function' && mkHistoryRecord(key);
  if (recorded) state.editRevision = (Number(state.editRevision) || 0) + 1;
  state.saved = false;
  mkSetSaveStatus('dirty');
  clearTimeout(state.draftTimer);
  const timer = setTimeout(() => { if (mk === state) mkPersistDraft(); }, 350);
  state.draftTimer = timer;
  mkDraftTimer = timer;
}

function mkHandleSaveShortcut(event) {
  if (!mk || !event || event.isComposing || String(event.key).toLowerCase() !== 's' || (!event.ctrlKey && !event.metaKey)) return;
  event.preventDefault();
  return mkSave(false, { view: typeof mkCaptureEditorView === 'function' ? mkCaptureEditorView() : null });
}

function mkHandleHistoryShortcut(event) {
  if (!mk || !event || event.isComposing || (!event.ctrlKey && !event.metaKey)) return;
  const key = String(event.key || '').toLowerCase();
  if (key === 'z') {
    event.preventDefault();
    if (event.shiftKey) mkRedo(); else mkUndo();
  } else if (key === 'y') {
    event.preventDefault();
    mkRedo();
  }
}

function mkRestoreDraft(savedAt) {
  if (!mk || typeof EditorDraft === 'undefined') return false;
  const value = EditorDraft.read(localStorage, mk.id);
  if (!EditorDraft.isNewer(value, savedAt)) return false;
  if (!confirm('이 컴퓨터에 정식 저장보다 새로운 편집 내용이 있습니다. 복구할까요?')) {
    mkClearDraft(mk.id);
    return false;
  }
  Object.assign(mk, value.model, { id: mk.id, saved: false });
  mk.videos = PlaylistCore.normalizeVideos(mk);
  mk.activeVideo = Math.max(0, Math.min(Number(mk.activeVideo) || 0, mk.videos.length - 1));
  return true;
}

function blankQuestion(t) {
  return {
    type: 'choice', t: t || 0, text: '',
    choices: ['', '', '', ''], answer: 0, answers: [], accept: [],
    imgUrl: '', imgUp: false, _img: '', _imgOpen: false,
    explain: '', explainImgUrl: '', explainImgUp: false, _explainImg: '', _explainOpen: false,
    limitSec: null
  };
}

function mkTimelineDomain(video) {
  const start = Math.max(0, Number(video && video.startSec) || 0);
  const duration = Number(video && video.durationSec);
  const knownDuration = Number.isFinite(duration) && duration > 0 ? duration : null;
  const explicitEnd = video && video.endSec != null && video.endSec !== ''
    ? Math.max(start + 1, Number(video.endSec) || 0) : null;
  const furthestQuestion = ((video && video.questions) || [])
    .reduce((max, q) => Math.max(max, Number(q.t) || 0), 0);
  const fallbackEnd = Math.max(start + 600, furthestQuestion, 600);
  const end = explicitEnd == null ? (knownDuration || fallbackEnd) : explicitEnd;
  return { start: start, end: end, max: Math.max(end, knownDuration || 0) };
}

function mkRefreshVideoTiming(videoIndex) {
  const video = mk.videos[videoIndex];
  if (!video || typeof document === 'undefined' || !document.querySelector) return;
  const domain = mkTimelineDomain(video);
  const startInput = document.querySelector('[data-range-input="' + videoIndex + '-start"]');
  const endInput = document.querySelector('[data-range-input="' + videoIndex + '-end"]');
  const startSlider = document.querySelector('[data-range-slider="' + videoIndex + '-start"]');
  const endSlider = document.querySelector('[data-range-slider="' + videoIndex + '-end"]');
  if (startInput) startInput.value = fmtTime(domain.start);
  if (endInput) endInput.value = video.endSec == null || video.endSec === '' ? '' : fmtTime(domain.end);
  if (startSlider) { startSlider.max = domain.max; startSlider.value = domain.start; }
  if (endSlider) { endSlider.max = domain.max; endSlider.value = domain.end; }
  const timeline = document.querySelector('[data-timeline-video="' + videoIndex + '"]');
  if (timeline) Array.from(timeline.querySelectorAll('.mk-q-dot')).forEach((dot, questionIndex) => {
    const q = video.questions[questionIndex];
    if (q) dot.style.left = (PlaylistCore.timelineRatio(q.t, domain.start, domain.end) * 100) + '%';
  });
}

function mkApplyDuration(videoIndex, value) {
  const video = mk.videos[videoIndex], duration = Math.floor(Number(value) || 0);
  if (!video || duration <= 0 || duration === video.durationSec) return;
  video.durationSec = duration;
  let clamped = false;
  if (Number(video.startSec) >= duration) {
    video.startSec = Math.max(0, duration - 1);
    clamped = true;
  }
  if (video.endSec != null && video.endSec !== '' && Number(video.endSec) > duration) {
    video.endSec = duration;
    clamped = true;
  }
  if (clamped) mkMarkDirty();
  mkRefreshVideoTiming(videoIndex);
}

    player: null,

    ytCancels: [],
    history: null,
    saveToastTimer: null,
    editRevision: 0,
    saveSequence: 0,
    saveProcessedSequence: 0,
    saveRequested: null,
    saveRunning: false,
    saveQueue: null,
    persistedSnapshot: null,
    persistedSaveSequence: 0,
    pendingSaveId: null,

  };

  let stopAccessWatch = null;

    (editAuthGeneration === null || teacherAuthVersion === editAuthGeneration) &&
    (!editRouteToken || !location || String(location.hash || '') === editRouteToken);
  const startAccessWatch = () => {
    if (!setId || !store.subscribeDoc || stopAccessWatch) return;
    let stopped = false, triggered = false;
    const stops = [];
    const stop = () => { if (stopped) return; stopped = true; stops.splice(0).forEach(fn => { try { fn(); } catch (e) {} }); stopAccessWatch = null; };
    const lost = reason => {
      if (stopped || triggered || mk !== state) return;
      if (!sameEditIdentity()) { stop(); return; }
      triggered = true; stop();
      mkHandlePermissionLoss(Object.assign(new Error(reason || 'permission-denied'), { code: 'permission-denied' }));
    };
    stops.push(store.subscribeDoc('quiz_sets/' + setId, value => {
      if (!value || value.ownerUid !== state.ownerUid || value.trashedAt || value.purgeStartedAt || value.lifecycleState === 'purging' || value.lifecycleState === 'trashed') lost('세트 상태가 변경되었습니다.');
    }, () => lost('세트 권한을 확인하지 못했습니다.')));
    if (state.ownerUid !== editIdentity.uid) {
      const email = String(editIdentity.email).trim().toLowerCase();
      if (email) stops.push(store.subscribeDoc('quiz_sets/' + setId + '/collaborators/' + email, value => { if (!value) lost('공동 편집 권한이 제거되었습니다.'); }, () => lost('공동 편집 권한을 확인하지 못했습니다.')));
    }
    stopAccessWatch = stop;
  };
  const showReadOnly = set => {
    state.readOnly = true;
    APP().innerHTML = topbar('<a class="btn sm ghost" href="#/sets">📚 세트 목록</a>') +
      '<div class="wrap"><h1 style="font-size:22px;margin-bottom:12px">' + esc(set.title) + '</h1>' +
        '<div class="card"><div class="notice info" style="margin:0 0 16px"><b>읽기 전용</b> — ' +
          (set.ownerUid
            ? '다른 교사가 소유한 공유 세트입니다. 사본을 만들면 내 세트로 편집할 수 있습니다.'
            : '소유자 정보가 없는 이전 세트입니다. 이전 작업이 완료될 때까지 원본을 편집할 수 없습니다.') +
        '</div><div class="row">' +
          '<a class="btn primary" href="#/play/' + esc(setId) + '">🚀 우리 반 시작하기</a>' +
          '<button class="btn" onclick="setDuplicate(\'' + esc(setId) + '\')">⧉ 사본 만들기</button>' +
        '</div></div></div>';
  };
  mkPlayer = null;
  mkPlayerVid = '';
  const saveShortcut = event => {
    if (mk !== state) return;
    mkHandleSaveShortcut(event);
    if (!event.defaultPrevented) mkHandleHistoryShortcut(event);
  };
  document.addEventListener('keydown', saveShortcut);
  onCleanup(() => {
    if (stopAccessWatch) stopAccessWatch();
    document.removeEventListener('keydown', saveShortcut);
    (state.ytCancels || []).forEach(cancel => { try { cancel(); } catch (e) {} });
    state.ytCancels = [];
    const ownPlayer = state.player;
    try { ownPlayer && ownPlayer.destroy(); } catch (e) {}
    state.player = null;
    if (mkPlayer === ownPlayer) mkPlayer = null;
    clearTimeout(state.draftTimer);
    clearTimeout(state.saveToastTimer);
    if (mkDraftTimer === state.draftTimer) mkDraftTimer = null;
    state.draftTimer = null;
    if (mk !== state) return;
    mk = null;
  });

  // 재생 위치 표시 — 화면당 한 번만 등록한다 (URL을 고칠 때마다 쌓이지 않도록)
  every(500, () => {
    if (mk !== state) return;
    const el = $('#mk-cur');
    if (el && mkPlayer && mkPlayer.getCurrentTime) {
      try { el.textContent = '현재 재생 위치: ' + fmtTime(mkPlayer.getCurrentTime()); } catch (e) {}
    }
    const active = mk && mk.videos && mk.videos[mk.activeVideo];
    if (active && mkPlayer && mkPlayer.getDuration) {
      try {
        mkApplyDuration(mk.activeVideo, mkPlayer.getDuration());
      } catch (e) {}
    }
  });

  if (setId) {
    APP().innerHTML = topbar() + '<div class="wrap"><div class="empty">세트를 불러오는 중…</div></div>';
    store.getQuizSet(setId).then(savedSet => {
      if (mk !== state) return;
      const set = normSet(savedSet);
      if (!set) { APP().innerHTML = topbar() + '<div class="wrap"><div class="card"><div class="empty">세트를 찾을 수 없습니다.<br><br><a class="btn" href="#/make">새 세트 만들기</a></div></div></div>'; return; }
      if (!sameEditIdentity()) { showReadOnly(set); return; }
      const accessCheck = canEditSet(set, teacherState)
        ? Promise.resolve(true)
        : (store.canEditQuizSet ? store.canEditQuizSet(setId, teacherState) : Promise.resolve(false));
      return accessCheck.then(allowed => {
        if (!allowed || mk !== state || !sameEditIdentity()) { if (mk === state) showReadOnly(set); return; }
      state.ownerUid = set.ownerUid;
      state.title = set.title;
      state.author = set.author || state.author;
      state.settings = set.settings;
      state.videos = set.videos;
      state.activeVideo = 0;
      state.createdAt = set.createdAt;
      state.archived = set.archived;
      state.saved = true;
      // 편집 화면에서는 교사가 그림을 봐야 하므로 업로드 이미지를 한 번에 불러온다
      return store.getImages(setId).then(imgs => {
        if (mk !== state || !sameEditIdentity()) { if (mk === state) showReadOnly(set); return; }
        const currentAccess = canEditSet(set, teacherState)
          ? Promise.resolve(true)
          : (store.canEditQuizSet ? store.canEditQuizSet(setId, teacherState) : Promise.resolve(false));
        return currentAccess.then(allowedNow => {
          if (mk !== state || !sameEditIdentity()) return;
          if (!allowedNow) { showReadOnly(set); return; }
        state.videos.forEach((video, videoIndex) => {
          video.questions.forEach((q, questionIndex) => {
            if (q.imgUp) q._img = imgs['v' + videoIndex + 'q' + questionIndex] || '';
            if (q.explainImgUp) q._explainImg = imgs['v' + videoIndex + 'q' + questionIndex + 'e'] || '';
          });
        });
        // The persisted comparison basis is always the canonical server model,
        // including its images.  A newer local draft is restored only after
        // that basis is captured and remains dirty until explicitly saved.
        if (typeof mkResetHistory === 'function') mkResetHistory(true);
        if (mkRestoreDraft(set.updatedAt || set.createdAt || 0) && typeof mkResetHistory === 'function') {
          mkResetHistory();
        }
        renderMake();
        startAccessWatch();
        });
      });
      });
    }).catch(e => {
      if (mk !== state) return;
      console.error(e); toast('불러오기 실패: ' + e.message);
    });
  } else {
    mkRestoreDraft(0);
    if (typeof mkResetHistory === 'function') mkResetHistory();
    renderMake();
  }
}

function mkQuestionNavigatorDragOver(event) {
  mkQuestionDragOver(event);
  const navigator = event && event.currentTarget;
  if (!navigator || !navigator.getBoundingClientRect) return;
  const rect = navigator.getBoundingClientRect();
  const edge = Math.min(64, Math.max(32, rect.height * .18));
  if (event.clientY < rect.top + edge) navigator.scrollTop -= 22;
  else if (event.clientY > rect.bottom - edge) navigator.scrollTop += 22;
}

function mkQuestionPreviewHtml(q, number) {
  const type = qType(q);
  const choices = Array.isArray(q && q.choices) ? q.choices : [];
  const typeLabel = QTYPES[type] ? QTYPES[type].split(' —')[0] : '문항';
  const answerArea = (type === 'short' || type === 'long')
    ? '<div class="preview-choice"><span>학생 답안 입력 영역</span></div>'
    : '<div class="preview-choices">' + choices.map((choice, index) =>
        '<div class="preview-choice"><b>' +
          (type === 'ox' ? (['O', 'X'][index] || '') : (LETTERS[index] || index + 1)) +
          '</b><span>' + esc(choice || '보기 ' + (index + 1)) + '</span></div>'
      ).join('') + '</div>';
  return '<div class="preview-top"><span class="tag">문항 ' + number + '</span>' +
    '<span class="tag mute">' + esc(typeLabel) + '</span></div>' +
    '<div class="preview-q">' + esc(String(q && q.text || '').trim() || '질문을 입력하세요') + '</div>' +
    answerArea;
}

function mkCloseQuestionPreview() {
  mkQuestionPreviewRequest++;
  if (mkQuestionPreviewTimer) clearInterval(mkQuestionPreviewTimer);
  mkQuestionPreviewTimer = null;
  const preview = document.getElementById('mk-question-preview');
  if (preview && preview.remove) preview.remove();
  const state = mkQuestionPreviewState;
  mkQuestionPreviewState = null;
  if (!state || !state.player) return;
  try {
    state.player.seekTo(state.originalTime, true);
    if (state.originalWasPlaying) state.player.playVideo();
    else state.player.pauseVideo();
  } catch (e) {}
}

function mkPreviewChoiceIsCorrect(question, index) {
  return question.type === 'multi'
    ? (question.answers || []).indexOf(index) >= 0
    : Number(question.answer) === index;
}

function mkPreviewRender() {
  const state = mkQuestionPreviewState;
  if (!state || (state.phase !== 'question' && state.phase !== 'result')) return false;
  let dialog = document.getElementById('mk-question-preview');
  if (!dialog) {
    dialog = document.createElement('div');
    dialog.id = 'mk-question-preview';
    dialog.className = 'overlay';
    dialog.setAttribute('role', 'dialog');
    dialog.setAttribute('aria-modal', 'true');
    document.body.appendChild(dialog);
  }
  const q = state.question;
  const type = q.type || 'choice';
  const isResult = state.phase === 'result';
  const image = q._img || q.imgUrl || '';
  const explanationImage = q._explainImg || q.explainImgUrl || '';
  let answerArea = '';
  if (type === 'short' || type === 'long') {
    answerArea = '<textarea class="mk-preview-text" placeholder="답을 입력하세요" ' +
      (isResult ? 'disabled' : 'oninput="mkPreviewSetText(this.value,this)"') + '>' +
      esc(state.answer == null ? '' : state.answer) + '</textarea>';
  } else {
    const choices = Array.isArray(q.choices) ? q.choices : [];
    answerArea = '<div class="preview-choices">' + choices.map((choice, index) => {
      const selected = QuizPreviewCore.isSelected(state, index);
      const correct = isResult && mkPreviewChoiceIsCorrect(q, index);
      const wrong = isResult && selected && !correct;
      return '<button type="button" class="preview-choice' + (selected ? ' selected' : '') +
        (correct ? ' correct' : '') + (wrong ? ' wrong' : '') + '" ' +
        (isResult ? 'disabled' : 'onclick="mkPreviewSelect(' + index + ')"') + '><b>' +
        (type === 'ox' ? (['O', 'X'][index] || '') : (LETTERS[index] || index + 1)) +
        '</b><span>' + esc(choice || '보기 ' + (index + 1)) + '</span></button>';
    }).join('') + '</div>';
  }
  let result = '';
  if (isResult) {
    const message = state.correct === true ? '정답입니다.'
      : state.correct === false ? '아쉽지만 오답입니다.' : '서술형 답안을 확인했습니다.';
    const resultClass = state.correct === true ? 'ok' : state.correct === false ? 'bad' : 'manual';
    result = '<div class="preview-result ' + resultClass + '">' + message + '</div>' +
      '<div class="preview-explanation"><b>해설</b><br>' +
      esc(state.explanation || '등록된 해설이 없습니다.') + '</div>' +
      (explanationImage ? '<img class="preview-explanation-img" data-lightbox tabindex="0" role="button" aria-label="해설 이미지 크게 보기" src="' + esc(explanationImage) + '" alt="해설 이미지">' : '');
  }
  const card = mode => '<div class="mk-question-preview-card ' + mode + '">' +
      '<div class="preview-top"><span class="tag">문항 ' + state.number + '</span>' +
      '<span class="tag mute">실제 흐름 미리보기</span></div>' +
      (image ? '<img class="q-img" data-lightbox tabindex="0" role="button" aria-label="문항 이미지 크게 보기" src="' + esc(image) + '" alt="문항 이미지">' : '') +
      '<div class="preview-q">' + esc(String(q.text || '').trim() || '질문을 입력하세요') + '</div>' +
      answerArea + result + '<div class="preview-actions">' +
      (isResult
        ? '<button class="btn primary" onclick="mkPreviewContinue()">▶ 계속 재생</button>'
        : '<button class="btn primary" onclick="mkPreviewSubmit()">제출</button>') +
      '</div></div>';
  dialog.setAttribute('aria-label', '문항 ' + state.number + ' 교사·학생 퀴즈 미리보기');
  dialog.innerHTML = '<div class="mk-preview-shell">' +
    '<div class="mk-preview-grid">' +
      '<section class="mk-preview-pane teacher-pane"><h2 class="mk-preview-pane-title">교사용 화면</h2>' + card('teacher') + '</section>' +
      '<section class="mk-preview-pane mobile-pane"><h2 class="mk-preview-pane-title">학생 모바일 화면</h2>' + card('mobile') + '</section>' +
    '</div><div class="mk-preview-close"><button class="btn" onclick="mkCloseQuestionPreview()">미리보기 종료</button></div></div>';
  dialog.onclick = event => { if (event.target === dialog) mkCloseQuestionPreview(); };
  dialog.onkeydown = event => { if (event.key === 'Escape') mkCloseQuestionPreview(); };
  const first = dialog.querySelector('button.preview-choice, textarea, .preview-actions button');
  if (first && first.focus) first.focus();
  return true;
}

function mkPreviewSelect(index) {
  const state = mkQuestionPreviewState;
  if (!state || state.phase !== 'question') return false;
  if (state.question.type === 'multi') {
    const answer = (state.answer || []).slice();
    const at = answer.indexOf(index);
    if (at >= 0) answer.splice(at, 1); else answer.push(index);
    mkQuestionPreviewState = QuizPreviewCore.select(state, answer);
  } else {
    mkQuestionPreviewState = QuizPreviewCore.select(state, index);
  }
  return mkPreviewRender();
}

function mkPreviewSetText(value, source) {
  if (!mkQuestionPreviewState || mkQuestionPreviewState.phase !== 'question') return false;
  mkQuestionPreviewState = QuizPreviewCore.select(mkQuestionPreviewState, value);
  const inputs = document.querySelectorAll ? document.querySelectorAll('.mk-preview-text') : [];
  Array.from(inputs).forEach(input => { if (input !== source && input.value !== value) input.value = value; });
  return true;
}

function mkPreviewSubmit() {
  const state = mkQuestionPreviewState;
  if (!state || state.phase !== 'question') return false;
  const input = document.querySelector ? document.querySelector('.mk-preview-text') : null;
  if (input) mkQuestionPreviewState = QuizPreviewCore.select(state, input.value);
  mkQuestionPreviewState = QuizPreviewCore.submit(mkQuestionPreviewState);
  return mkPreviewRender();
}

function mkPreviewContinue() {
  const state = mkQuestionPreviewState;
  if (!state || state.phase !== 'result') return false;
  mkQuestionPreviewState = QuizPreviewCore.continuePlayback(state);
  if (mkQuestionPreviewTimer) clearInterval(mkQuestionPreviewTimer);
  mkQuestionPreviewTimer = null;
  const preview = document.getElementById('mk-question-preview');
  if (preview && preview.remove) preview.remove();
  mkQuestionPreviewState = null;
  try {
    state.player.seekTo(state.targetTime + .05, true);
    state.player.playVideo();
  } catch (e) { toast('영상을 계속 재생하지 못했습니다: ' + e.message); return false; }
  return true;
}

function mkPreviewTick() {
  const state = mkQuestionPreviewState;
  if (!state || state.phase !== 'video' || !state.player) return false;
  let currentTime = state.startAt;
  try { currentTime = state.player.getCurrentTime(); } catch (e) {}
  const timedOut = Date.now() - state.startedAt > Math.max(5000, (state.targetTime - state.startAt + 2) * 1000);
  const next = QuizPreviewCore.advance(state, timedOut ? state.targetTime : currentTime);
  if (next === state) return false;
  mkQuestionPreviewState = next;
  if (mkQuestionPreviewTimer) clearInterval(mkQuestionPreviewTimer);
  mkQuestionPreviewTimer = null;
  try { state.player.pauseVideo(); } catch (e) {}
  return mkPreviewRender();
}

function mkOpenQuestionPreview(videoIndex, questionIndex) {
  const video = mk && mk.videos && mk.videos[videoIndex];
  const q = video && video.questions && video.questions[questionIndex];
  if (!q) return false;
  if (!video.videoId) { toast('먼저 유튜브 주소를 입력해 주세요.'); return false; }
  mkCloseQuestionPreview();
  const request = ++mkQuestionPreviewRequest;
  const number = mk.videos.slice(0, videoIndex)
    .reduce((count, item) => count + ((item && item.questions) || []).length, 0) + questionIndex + 1;
  const question = JSON.parse(JSON.stringify(q));
  if (videoIndex !== mk.activeVideo) {
    mk.activeVideo = videoIndex;
    renderMake();
  }
  const begin = attempt => {
    if (request !== mkQuestionPreviewRequest) return;
    if ((!mkPlayer || !mkPlayer.seekTo || !mkPlayer.playVideo) && attempt < 60) {
      setTimeout(() => begin(attempt + 1), 100);
      return;
    }
    if (!mkPlayer || !mkPlayer.seekTo || !mkPlayer.playVideo) {
      toast('영상 플레이어가 준비되지 않았습니다. 잠시 후 다시 시도해 주세요.');
      return;
    }
    let originalTime = 0, originalWasPlaying = false;
    try {
      originalTime = Number(mkPlayer.getCurrentTime()) || 0;
      originalWasPlaying = !!(mkPlayer.getPlayerState && mkPlayer.getPlayerState() === 1);
    } catch (e) {}
    const state = QuizPreviewCore.create(question, { startSec: video.startSec });
    mkQuestionPreviewState = Object.assign(state, {
      number, videoIndex, questionIndex, player: mkPlayer,
      originalTime, originalWasPlaying, startedAt: Date.now()
    });
    mkPlayer.seekTo(mkQuestionPreviewState.startAt, true);
    mkPlayer.playVideo();
    toast('문항 ' + number + '의 3초 전부터 재생합니다. 문항 시각에 퀴즈가 열립니다.');
    mkQuestionPreviewTimer = setInterval(mkPreviewTick, 100);
    mkPreviewTick();
  };
  begin(0);
  return true;
}

   한 번 정하고 마는 값이라 평소에는 한 줄 요약으로 접어 둔다.
   펼쳐 둔 채로 두면 영상이 첫 화면에서 밀려나 정작 중요한 작업이 불편해진다. */

    s.limitSec ? '제한 ' + s.limitSec + '초' : '시간 제한 없음',

    s.autoPause ? '퀴즈 뜨면 일시정지' : '퀴즈 떠도 계속 재생'

}

    '</div>' +
    '<div class="grid2">' +
      '<div class="field" id="mk-delay-field"><label class="f">정답 자동 공개까지</label>' +
        '<div class="unit-wrap"><input type="number" id="mk-delay" min="0" max="600" value="' + mk.settings.revealDelaySec + '"><span class="unit">초</span></div>' +
        '<div class="hint">퀴즈가 뜬 뒤 이만큼 지나면 학생 화면에 정답·해설이 뜹니다.</div></div>' +
      '<div class="field"><label class="f">퀴즈가 뜰 때 영상</label>' +

          '<option value="1"' + (mk.settings.autoPause ? ' selected' : '') + '>자동으로 일시정지</option>' +

  $('#mk-delay').oninput = e => { mk.settings.revealDelaySec = Math.max(0, Number(e.target.value) || 0); mkMarkDirty(); };
  $('#mk-pause').onchange = e => { mk.settings.autoPause = e.target.value === '1'; mkMarkDirty(); };

function mkRevealHint() {
  const m = mk.settings.revealMode;
  const hints = {
    instant: '학생이 답을 고르는 즉시 각자 화면에 O/X와 해설이 뜹니다.',
    timer:   '아래 초 설정에 따라 자동으로 공개됩니다. 교사가 [지금 공개]로 앞당길 수 있습니다.',
    manual:  '교사가 진행 화면에서 [정답 공개]를 누를 때까지 학생은 결과를 볼 수 없습니다.',
    never:   '학생 화면에는 끝까지 정답이 뜨지 않습니다. 교사 대시보드에서만 채점 결과를 봅니다.'
  };
  const el = $('#mk-reveal-hint');
  if (el) el.textContent = hints[m] || '';
  const df = $('#mk-delay-field');
  if (df) df.style.opacity = (m === 'timer') ? '1' : '.4';
}

function mkAddVideo() {
  mk.videos.push({ videoUrl: '', videoId: '', startSec: 0, endSec: null,
    durationSec: null, questions: [blankQuestion(0)] });
  mk.activeVideo = mk.videos.length - 1;
  mkMarkDirty();
  renderMake();
}

function mkCopyVideo(i) {
  if (!mk.videos[i]) return;
  const copy = JSON.parse(JSON.stringify(mk.videos[i]));
  copy.questions = copy.questions.map(q => Object.assign({}, q, { _img: q._img || '' }));
  mk.videos.splice(i + 1, 0, copy);
  mk.activeVideo = i + 1;
  mkMarkDirty();
  renderMake();
}

function mkRemoveVideo(i) {
  if (mk.videos.length <= 1 || !mk.videos[i]) return;
  if (typeof confirm === 'function' && !confirm('영상 ' + (i + 1) + '과 문항을 모두 삭제할까요?')) return;
  mk.videos.splice(i, 1);
  if (mk.activeVideo > i) mk.activeVideo--;
  else if (mk.activeVideo === i) mk.activeVideo = Math.min(i, mk.videos.length - 1);
  mkMarkDirty();
  renderMake();
}

function mkMoveVideo(i, delta) {
  const to = i + delta;
  if (!mk.videos[i] || to < 0 || to >= mk.videos.length) return;
  const active = mk.videos[mk.activeVideo];
  const temp = mk.videos[i]; mk.videos[i] = mk.videos[to]; mk.videos[to] = temp;
  mk.activeVideo = Math.max(0, mk.videos.indexOf(active));
  mkMarkDirty();
  renderMake();
}

function mkSelectVideo(i) {
  if (!mk.videos[i] || i === mk.activeVideo) return;
  mk.activeVideo = i;
  renderMake();
}

function mkSetVideoUrl(i, value) {
  const video = mk.videos[i];
  if (!video) return;
  video.videoUrl = String(value || '').trim();
  video.videoId = parseYouTube(video.videoUrl);
  mk.activeVideo = i;
  mkMarkDirty();
  renderMake();
}

function mkSetRange(i, edge, value) {
  const video = mk.videos[i];
  if (!video || (edge !== 'start' && edge !== 'end')) return;
  if (edge === 'end' && String(value == null ? '' : value).trim() === '') {
    video.endSec = null;
    mkMarkDirty();
    mkRefreshVideoTiming(i);
    return;
  }
  let seconds = typeof value === 'number' ? value : parseTime(value);
  if (!Number.isFinite(seconds)) return;
  const domain = mkTimelineDomain(video);
  const duration = Number(video.durationSec);
  seconds = Math.max(0, Math.round(seconds));
  if (Number.isFinite(duration) && duration > 0) seconds = Math.min(duration, seconds);
  if (edge === 'start') video.startSec = Math.min(seconds, Math.max(0, domain.end - 1));
  else video.endSec = Math.max(seconds, domain.start + 1);
  mkMarkDirty();
  mkRefreshVideoTiming(i);
}

function mkSetQuestionTime(videoIndex, questionIndex, value, options) {
  const video = mk.videos[videoIndex], question = video && video.questions[questionIndex];
  if (!question) return;
  let seconds = typeof value === 'number' ? value : parseTime(value);
  if (!Number.isFinite(seconds)) return;
  const domain = mkTimelineDomain(video);
  const next = Math.round(Math.max(domain.start, Math.min(domain.end, seconds)));
  if (next === Number(question.t)) return false;
  question.t = next;
  if (!(options && options.skipHistory)) mkMarkDirty(options && options.key);
  if (typeof document !== 'undefined' && document.querySelector) {
    const input = document.querySelector('[data-question-time="' + videoIndex + '-' + questionIndex + '"]');
    if (input) input.value = fmtTime(question.t);
    const timeline = document.querySelector('[data-timeline-video="' + videoIndex + '"]');
    if (timeline) {
      const dot = timeline.querySelectorAll('.mk-q-dot')[questionIndex];
      if (dot) dot.style.left = (PlaylistCore.timelineRatio(question.t, domain.start, domain.end) * 100) + '%';
    }
  }
  return true;
}

function mkStartQuestionDrag(event, videoIndex, questionIndex) {
  const timeline = event.currentTarget && event.currentTarget.parentElement;
  const state = mk;
  const video = state && state.videos[videoIndex];
  const question = video && video.questions[questionIndex];
  if (!timeline || !video || !question) return;
  // Keep one pre-drag snapshot. Pointer moves are DOM previews only.
  const before = typeof mkHistorySnapshot === 'function' ? mkHistorySnapshot(state) : null;
  const original = Number(question.t) || 0;
  let preview = original;
  let changed = false;
  const previewDom = seconds => {
    if (typeof document === 'undefined' || !document.querySelector) return;
    const domain = mkTimelineDomain(video);
    const input = document.querySelector('[data-question-time="' + videoIndex + '-' + questionIndex + '"]');
    if (input) input.value = fmtTime(seconds);
    const timelineEl = document.querySelector('[data-timeline-video="' + videoIndex + '"]');
    const dot = timelineEl && timelineEl.querySelectorAll('.mk-q-dot')[questionIndex];
    if (dot) dot.style.left = (PlaylistCore.timelineRatio(seconds, domain.start, domain.end) * 100) + '%';
  };
  const move = e => {
    const rect = timeline.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / Math.max(1, rect.width)));
    const domain = mkTimelineDomain(video);
    preview = Math.round(domain.start + ratio * (domain.end - domain.start));
    changed = preview !== original;
    mkSetQuestionTime(videoIndex, questionIndex, preview, { skipHistory: true });
  };
  const finish = cancelled => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('pointercancel', cancel);
    if (cancelled || !changed || mk !== state) {
      if (cancelled && mk === state) mkSetQuestionTime(videoIndex, questionIndex, original, { skipHistory: true });
      else previewDom(Number(question.t) || 0);
      return;
    }
    // The history core records the pre-drag state while committing once.
    if (before && typeof mkHistorySnapshot === 'function') mkHistorySnapshot(state);
    mkMarkDirty('question-drag');
  };
  const up = () => finish(false);
  const cancel = () => finish(true);
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', cancel);
  if (event.preventDefault) event.preventDefault();
}

/** 선택한 카드의 URL이 바뀔 때만 미리보기 플레이어를 새로 만든다 */
function mkSyncVideo(i) {
  const video = mk.videos[i];
  if (!video) return;
  const vid = parseYouTube(video.videoUrl);
  video.videoId = vid;
  const wrap = $('#mk-player-wrap');
  if (!wrap) return;
  if (!vid) {
    wrap.innerHTML = '<div class="empty" style="padding:44px 12px">위에 유튜브 주소를 넣으면<br>여기에 영상이 뜹니다.</div>';
    mkPlayer = null; mkPlayerVid = '';
    return;
  }
  if (vid === mkPlayerVid && mkPlayer) return;

  mkPlayerVid = vid;
  wrap.innerHTML =
    '<div class="player-box"><div id="mk-player"></div></div>' +
    '<div class="row" style="margin-top:10px;align-items:center">' +
      '<button class="btn sm" onclick="mkStampNew()">📍 현재 시각으로 문항 추가</button>' +
      ccButton('mkToggleCC()') +
      '<span class="hint" id="mk-cur" style="margin:0">—</span>' +
    '</div>';

  const state = mk;
  const cancelYT = whenYT(() => {
    if (mk !== state || mkPlayerVid !== vid || !document.getElementById('mk-player')) return;
    try { state.player && state.player.destroy(); } catch (e) {}
    const player = new YT.Player('mk-player', {
      videoId: vid,
      playerVars: { rel: 0, modestbranding: 1, playsinline: 1, cc_load_policy: 0 },
      events: ytEvents(() => mk === state ? state.player : null)
    });
    state.player = player;
    mkPlayer = player;
  });
  if (state && state.ytCancels) state.ytCancels.push(cancelYT);
}

function mkCurrentTime() {

}
