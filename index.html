    if (player && player.getCurrentTime) status.currentTime = Number(player.getCurrentTime());
  } catch (e) {}
  try {
    if (player && player.getDuration) status.duration = Number(player.getDuration());
  } catch (e) {}
  return status;
}

function plHandlePlayerStateChange(event) {
  if (!pl || !event) return;
  const currentVideoId = plPlayerEventVideoId(event);
  const status = plPlayerEventStatus(event);
  const matchesExpected = !pl.expectedVideoId || currentVideoId === String(pl.expectedVideoId);
  if (event.data === YT.PlayerState.PLAYING || event.data === YT.PlayerState.CUED) {
    if (!matchesExpected || (status.state !== null && status.state !== event.data)) return;
    pl.playerLoading = false;
    pl.activePlaybackGeneration = pl.loadGeneration;
    pl.playbackEnded = false;
    pl.playerError = null;
    if (typeof plRenderTimeline === 'function') plRenderTimeline();
  }
  if (event.data !== YT.PlayerState.ENDED) return;
  if (!matchesExpected || pl.playerLoading || pl.activePlaybackGeneration !== pl.loadGeneration) return;
  if (status.state !== null && status.state !== YT.PlayerState.ENDED) return;
  pl.playbackEnded = true;
  plTick();
}

function plHandlePlayerError(event) {
  if (!pl) return;
  const currentVideoId = plPlayerEventVideoId(event);
  const status = plPlayerEventStatus(event);
  if (pl.expectedVideoId && currentVideoId !== String(pl.expectedVideoId)) return;
  if (status.state === YT.PlayerState.PLAYING) return;
  if (!pl.playerLoading && pl.activePlaybackGeneration !== pl.loadGeneration) return;
  pl.playerLoading = false;
  pl.playbackEnded = false;
  pl.playerError = event && event.data;
  plRenderPlayerError();
}

function plQueueDueQuestions(prev, now) {
  if (!pl) return false;
  if (!Array.isArray(pl.dueQuestions)) pl.dueQuestions = [];
  if (pl.quizTrigger && pl.quizTrigger.advance) {
    const result = pl.quizTrigger.advance({
      videoIndex: pl.videoIndex,
      previousTime: prev,
      currentTime: now,
      event: 'tick'
    });
    (result.rearmed || []).forEach(index => { pl.fired[index] = false; });
    (result.enqueue || []).forEach(index => {
      if (pl.dueQuestions.indexOf(index) < 0) pl.dueQuestions.push(index);
    });
    return !!((result.rearmed && result.rearmed.length) || (result.enqueue && result.enqueue.length));
  }
  let markerStateChanged = false;
  pl.flatQuestions.forEach((q, i) => {
    if (q.videoIndex !== pl.videoIndex) return;
    if (now < q.t - 0.6 && pl.fired[i]) {
      pl.fired[i] = false;
      pl.dueQuestions = pl.dueQuestions.filter(index => index !== i);
      markerStateChanged = true;
    }
    if (!pl.fired[i] && prev < q.t && q.t <= now) {
      if (pl.dueQuestions.indexOf(i) < 0) pl.dueQuestions.push(i);
      markerStateChanged = true;
    }
  });
  return markerStateChanged;
}

function plOpenNextDueQuestion() {
  if (!pl || (pl.live && pl.live.q >= 0) || pl.pendingLiveQuestion >= 0 ||
      pl.openError || !Array.isArray(pl.dueQuestions) || !pl.dueQuestions.length) return false;
  const state = pl;
  const next = state.dueQuestions[0];
  const published = plOpenQuestion(next);
  const finish = opened => {
    if (opened === false || pl !== state) return false;
    state.dueQuestions = state.dueQuestions.filter(index => index !== next);
    if (state.quizTrigger && state.quizTrigger.open) state.quizTrigger.open(next);
    state.fired[next] = true;
    return true;
  };
  return published && typeof published.then === 'function'
    ? published.then(finish)
    : finish(published);
}

function plTick() {
  if (!pl || !pl.player || !pl.player.getCurrentTime) return;
  if (pl.playlistDone) return;
  if (pl.playerLoading) return;
  if (pl.playerError !== null && pl.playerError !== undefined) return;

  if (pl.transitionUntil) {
    if (pl.live.q >= 0 || pl.pendingLiveQuestion >= 0) {
      pl.transitionUntil = 0;
      if (typeof document !== 'undefined') {
        const transition = document.getElementById('pl-transition');
        if (transition && transition.remove) transition.remove();
      }
      return;
    }
    if (Date.now() >= pl.transitionUntil) {
      pl.transitionUntil = 0;
      plLoadVideo(pl.videoIndex + 1, true);
    } else plRenderTransition();
    return;
  }

  let now;
  try { now = pl.player.getCurrentTime(); } catch (e) { return; }
  if (typeof now !== 'number' || isNaN(now)) return;

  const video = pl.set && pl.set.videos && pl.set.videos[pl.videoIndex];
  if (!video) return;
  const prev = pl.lastT;
  pl.lastT = now;

  const end = plEffectiveEnd(video, pl.player);
  const reachedEnd = pl.playbackEnded || (Number.isFinite(end) && end > 0 && now >= end);

  const clock = $('#pl-clock');
  if (clock) clock.textContent = fmtTime(now);
  if (typeof plUpdateTimeline === 'function' && typeof plTimelineDomain === 'function') {
    plUpdateTimeline(now, plTimelineDomain());
  }

  // 다음 문항 안내
  const nextEl = $('#pl-next');
  if (nextEl) {
    const nx = pl.flatQuestions.findIndex(q => q.videoIndex === pl.videoIndex && q.t > now);
    nextEl.textContent = nx === -1 ? '남은 문항 없음' :
      '다음 문항 ' + (pl.flatQuestions[nx].number || nx + 1) + '번까지 ' + fmtTime(pl.flatQuestions[nx].t - now);
  }

  const markerStateChanged = plQueueDueQuestions(prev, now);
  if (markerStateChanged && typeof plRenderTimeline === 'function') plRenderTimeline();

  if (pl.live.q >= 0 || pl.pendingLiveQuestion >= 0) {
    if (reachedEnd) {
      try { if (pl.player.pauseVideo) pl.player.pauseVideo(); } catch (e) {}
    }
    return;
  }

  const opening = plOpenNextDueQuestion();
  if (opening && typeof opening.then === 'function') opening.catch(() => {});
  if (opening || !reachedEnd) return;
  if (pl.openError && pl.dueQuestions && pl.dueQuestions.length) {
    try { if (pl.player.pauseVideo) pl.player.pauseVideo(); } catch (e) {}
    return;
  }

  if (pl.videoIndex >= pl.set.videos.length - 1) {
    plCompletePlaylist();
    return;
  }
  try { if (pl.player.pauseVideo) pl.player.pauseVideo(); } catch (e) {}
  pl.transitionUntil = Date.now() + 3000;
  plRenderTransition();
}

async function plOpenQuestion(i) {
  if (!pl || !pl.sessionId) return;
  const state = pl;
  const question = state.flatQuestions[i];
  if (!question) return;
  if (state.closeFlight && state.live && Number(state.live.q) >= 0) return false;
  const graceUntil = Number(state.live && state.live.submitGraceUntil);
  if (state.live && Number(state.live.q) >= 0 && state.live.accepting !== false &&
      Number.isFinite(graceUntil) && serverNow() < graceUntil) return false;
  if (pl.set.settings.autoPause) { try { pl.player.pauseVideo(); } catch (e) {} }
  pl.pendingLiveQuestion = i;
  let image = '';
  try {
    if (question.imgUrl) image = question.imgUrl;
    else if (question.imgUp) image = await loadQuestionImage(
      state.setId, question.key || i, state.sessionId, state.snapshotVersion
    );
  } catch (e) {
    if (pl === state && state.pendingLiveQuestion === i) {
      state.pendingLiveQuestion = -1;
      state.openError = e && e.message ? e.message : String(e);
      if (typeof plRenderQList === 'function') plRenderQList();
      toast('문항 공개 실패 — 문항의 [열기]를 눌러 다시 시도해 주세요');
    }
    throw e;
  }
  if (pl !== state || state.pendingLiveQuestion !== i) return false;
  const mode = state.set.settings.revealMode;
  const revealed = mode === 'instant';
  const configuredLimit = limitFor(state.set, i, state.flatQuestions);
  let liveLimit = configuredLimit;
  const live = {
    q: i,
    liveToken: FirestoreStore.createLiveToken(),
    openedAt: SV_TS,
    revealed,
    accepting: true,
    limitSec: liveLimit,
    publicQuestion: FirestoreStore.publicQuestion(
      question, question.number || i + 1, state.flatQuestions.length, image
    )
  };
  if (mode === 'timer') {
    const openedMillis = serverNow();
    const revealDelay = Math.max(0, Number(state.set.settings.revealDelaySec) || 0);
    liveLimit = configuredLimit > 0 ? Math.min(configuredLimit, revealDelay) : revealDelay;
    const closesAt = openedMillis + liveLimit * 1000;
    const graceUntil = closesAt + 2000;
    live.limitSec = liveLimit;
    live.responseClosesAt = new Date(closesAt);
    live.submitGraceUntil = new Date(graceUntil);
    live.revealAt = new Date(Math.max(openedMillis + revealDelay * 1000, graceUntil));
  }
  if (revealed) {
    const explainImage = await plExplanationImage(question, i);
    if (pl !== state || state.pendingLiveQuestion !== i) return false;
    live.publicAnswer = FirestoreStore.publicAnswer(question, explainImage);
  }
  try {
    await store.setLive(state.sessionId, live);
    if (pl !== state || state.pendingLiveQuestion !== i) return false;
    state.openError = '';
    state.dueQuestions = (state.dueQuestions || []).filter(index => index !== i);
    if (state.quizTrigger && state.quizTrigger.open) state.quizTrigger.open(i);
    if (!Array.isArray(state.fired)) state.fired = [];
    state.fired[i] = true;
    if (typeof plRenderQList === 'function') plRenderQList();
    if (typeof plRenderTimeline === 'function') plRenderTimeline();
    return true;
  } catch (e) {
    if (pl === state && state.pendingLiveQuestion === i) {
      state.pendingLiveQuestion = -1;
      state.openError = e && e.message ? e.message : String(e);
      if (typeof plRenderQList === 'function') plRenderQList();
      toast('문항 공개 실패 — 문항의 [열기]를 눌러 다시 시도해 주세요');
    }
    throw e;
  }
}
async function plExplanationImage(question, questionIndex) {
  if (!pl || !question) return '';
  if (question.explainImgUrl) return question.explainImgUrl;
  if (!question.explainImgUp) return '';
  return loadQuestionImage(
    pl.setId, String(question.key || questionIndex) + 'e', pl.sessionId, pl.snapshotVersion
  );
}

async function plReveal() {
  if (!pl || pl.live.q < 0) return;
  const question = pl.flatQuestions[pl.live.q];
  if (!question) return;
  const identity = FirestoreStore.liveIdentity(pl.live);
  if (!identity) return Promise.resolve(false);
  const explainImage = await plExplanationImage(question, pl.live.q);
  return store.revealLive(
    pl.sessionId,
    identity,
    FirestoreStore.publicAnswer(question, explainImage)
  );
}

/** 재생 시작은 close 확정 전에 확인한다. false/throw/rejection은 재시도 가능한 실패다. */
async function plContinuePlayback(state) {
  if (!state || !state.player || typeof state.player.playVideo !== 'function') {
    return { ok: false, error: new Error('재생기를 찾을 수 없습니다.') };
  }
  try {
    const result = state.player.playVideo();
    const settled = result && typeof result.then === 'function' ? await result : result;
    if (settled === false) return { ok: false, error: new Error('동영상 재생을 시작하지 못했습니다.') };
    return { ok: true };
  } catch (error) {
    return { ok: false, error: error instanceof Error ? error : new Error(String(error)) };
  }
}

function plCloseQuestion() {
  const state = pl;
  if (!state || !state.live || Number(state.live.q) < 0) return Promise.resolve(false);
  const questionIndex = Number(state.live.q);
  const identity = { q: questionIndex, openedAt: state.live.openedAt };
  if (typeof state.live.liveToken === 'string' && state.live.liveToken) {
    identity.liveToken = state.live.liveToken;
  }
  const generation = Number(state.liveGeneration) || 0;
  if (state.closeFlight) {
    return state.closeFlight.questionIndex === questionIndex &&
      state.closeFlight.generation === generation
      ? state.closeFlight.promise
      : Promise.resolve(false);
  }

  const flight = {
    questionIndex: questionIndex, generation: generation, promise: null,
    playbackStarted: false, overlayHidden: false
  };
  const stillCurrent = () => pl === state && state.closeFlight === flight &&
    Number(state.live && state.live.q) === questionIndex &&
    (Number(state.liveGeneration) || 0) === generation;
  const rollbackContinuePlayback = () => {
    if (flight.playbackStarted) {
      try { if (state.player && state.player.pauseVideo) state.player.pauseVideo(); } catch (e) {}
      flight.playbackStarted = false;
    }
    if (pl === state && Number(state.live && state.live.q) === questionIndex &&
        flight.overlayHidden && typeof plRenderOverlay === 'function') {
      plRenderOverlay();
    }
  };
  state.closeError = '';

  const run = async () => {
    const frozen = await store.freezeLive(state.sessionId, identity);
    if (!frozen) return false;
    if (!stillCurrent()) return false;
    state.live = Object.assign({}, state.live, { accepting: false });
    const [responseDocs, gradeDocs] = await Promise.all([
      store.getResponses(state.sessionId),
      store.getGrades(state.sessionId)
    ]);
    if (!stillCurrent()) return false;
    state.responseDocs = responseDocs || {};
    state.gradeDocs = gradeDocs || {};
    state.responses = FirestoreCore.responseDocsToQuestionMaps(
      state.responseDocs, state.gradeDocs
    );
    await plGradeCurrentResponses(state, questionIndex);
    if (!stillCurrent()) return false;
    await plPushBoard();
    if (!stillCurrent()) return false;
    const hasQueuedFollowup = Array.isArray(state.dueQuestions) && state.dueQuestions.length > 0;
    if (!hasQueuedFollowup) {
      // 재생 probe 동안 overlay를 가역적으로 숨겨 실제 재생 frame과 퀴즈가 겹치지 않게 한다.
      if (typeof plSetQuizOpen === 'function') {
        plSetQuizOpen(false);
        flight.overlayHidden = true;
      }
      const playback = typeof plContinuePlayback === 'function'
        ? await plContinuePlayback(state)
        : { ok: (() => {
          try { return !state.player || !state.player.playVideo || state.player.playVideo() !== false; }
          catch (error) { return false; }
        })() };
      if (!playback.ok) {
        state.closeError = '동영상 재생을 시작하지 못했습니다. 계속 재생을 다시 시도해 주세요.';
        if (typeof toast === 'function') toast(state.closeError);
        rollbackContinuePlayback();
        return false;
      }
      flight.playbackStarted = true;
      if (!stillCurrent()) {
        rollbackContinuePlayback();
        return false;
      }
    }
    const closed = await store.closeLive(state.sessionId, identity);
    if (!closed) {
      rollbackContinuePlayback();
      return false;
    }
    if (pl !== state || state.closeFlight !== flight) {
      rollbackContinuePlayback();
      return false;
    }
    if (Number(state.live && state.live.q) !== questionIndex &&
        Number(state.live && state.live.q) !== -1) {
      rollbackContinuePlayback();
      return false;
    }
    if (Number(state.live && state.live.q) === questionIndex) {
      state.liveGeneration = generation + 1;
      state.live = {
        q: -1, openedAt: 0, revealed: false, limitSec: 0
      };
    }
    state.closeError = '';
    state.pendingLiveQuestion = -1;
    if (typeof plSetQuizOpen === 'function') plSetQuizOpen(false);
    if (state.quizTrigger && state.quizTrigger.complete) state.quizTrigger.complete(questionIndex);
    if (Array.isArray(state.fired)) state.fired[questionIndex] = true;
    try {
      if (await plOpenNextDueQuestion()) return true;
    } catch (error) {
      return false;
    }
    if (typeof plTick === 'function') plTick();
    if (state.transitionUntil || state.playlistDone) return true;
    return true;
  };

  flight.promise = run().catch(error => {
    rollbackContinuePlayback();
    if (pl === state && Number(state.live && state.live.q) === questionIndex) {
      state.closeError = error && error.message ? error.message : String(error);
    }
    throw error;
  }).finally(() => {
    if (pl === state && state.closeFlight === flight) state.closeFlight = null;
    if (pl === state && typeof plRenderOverlay === 'function') plRenderOverlay();
  });
  state.closeFlight = flight;
  if (typeof plRenderOverlay === 'function') plRenderOverlay();
  return flight.promise;
}
function plJumpTo(i) {
  if (!pl || !pl.player || !pl.player.seekTo) return;
  const question = pl.flatQuestions[i];
  if (!question) return;
  const t = Math.max(0, question.t - 3);
  let markerStateChanged = false;
  if (pl.quizTrigger && pl.quizTrigger.advance) {
    const rearm = pl.quizTrigger.advance({
      videoIndex: question.videoIndex,
      previousTime: pl.lastT,
      currentTime: t,
      event: 'seek'
    });
    (rearm.rearmed || []).forEach(index => {
      if (pl.fired[index]) markerStateChanged = true;
      pl.fired[index] = false;
    });
  } else {
    markerStateChanged = pl.fired[i] !== false;
    pl.fired[i] = false;
  }
  if (question.videoIndex !== pl.videoIndex) plLoadVideo(question.videoIndex, true);
  else if (markerStateChanged && typeof plRenderTimeline === 'function') plRenderTimeline();
  pl.lastT = t;
  pl.player.seekTo(t, true);
  pl.player.playVideo();
}
async function plEndSession() {
  const state = pl;
  if (!state) return;
  if (!confirm('진행을 종료할까요? 학생 화면은 종료 안내로 바뀌고, 기록은 그대로 남습니다.')) return;
  await plExitStageFullscreen();
  if (pl !== state) return;
  await store.endSession(state.sessionId);
  if (pl !== state) return;
  if (state.classPlanAttached && store.finishClassPlan) {
    const finished = await store.finishClassPlan(
      state.classPlanId,
      state.sessionId,
      { expectedRevision: state.classPlanRevision }
    );
    if (pl !== state) return;
    state.classPlanRevision = finished && finished.revision || state.classPlanRevision + 1;
    state.classPlanFinished = true;
  }
  pendingAllocationRemove(state.sessionId, state.allocationToken);
  toast('진행을 종료했습니다');
  go('live/' + state.sessionId);
}

function plRenderQList() {
  const box = $('#pl-qlist');
  if (!box || !pl) return;
  box.innerHTML = pl.flatQuestions.map((q, i) => {
    const resp = pl.responses[i] || {};
    const n = Object.keys(resp).length;
    const cls = pl.live.q === i ? ' active' : (n > 0 ? ' done' : '');
    return '<div class="qlist-item' + cls + '">' +
      '<span class="t" onclick="plJumpTo(' + i + ')" style="cursor:pointer">' + fmtTime(q.t) + '</span>' +
      '<span class="x" onclick="plJumpTo(' + i + ')" style="cursor:pointer">' + (q.number || i + 1) + '. ' + esc(q.text) + '</span>' +
      (n ? '<span class="tag mute">' + n + '명 응답</span>' : '') +
      '<button class="btn sm ghost" onclick="plOpenQuestion(' + i + ')" title="영상과 상관없이 지금 이 문항을 엽니다">열기</button>' +
    '</div>';
  }).join('') + (pl.openError
    ? '<div class="notice bad" role="alert">문항 공개 실패: ' + esc(pl.openError) +
      ' · 해당 문항의 [열기]를 눌러 다시 시도해 주세요.</div>'
    : '');
}

/* ── 실시간 순위 ──────────────────────────────────────────────────────
   점수 계산은 교사 화면에서만 한다. 학생에게 responses 를 통째로 내려보내면
   순위는 계산할 수 있지만 남의 답도 그대로 보여 베끼기가 가능해지기 때문이다.
   대신 점수만 요약한 board 를 세션에 올리고 학생은 그것만 구독한다. */
function plScoreboard() {
  const rows = Object.keys(pl.students).map(sid => {
    const s = pl.students[sid];
    let correct = 0, answered = 0, graded = 0;
    pl.flatQuestions.forEach((q, i) => {
      const r = (pl.responses[i] || {})[sid];
      if (!r) return;
      answered++;
      if (r.ok === true) { graded++; correct++; }
      else if (r.ok === false) graded++;
    });
    return {
      sid: sid, name: s.name || '', grade: s.grade, klass: s.klass, num: s.num,
      correct: correct, answered: answered, graded: graded
    };
  });
  // 같은 점수면 더 적게 풀고 맞힌 쪽을, 그다음은 번호 순
  rows.sort((a, b) => (b.correct - a.correct) || (a.answered - b.answered) || (a.num - b.num));
  let rank = 0, prev = null;
  rows.forEach((r, i) => {
    if (prev === null || r.correct !== prev) { rank = i + 1; prev = r.correct; }
    r.rank = rank;
  });
  return rows;
}

/** 문항을 닫을 때 현재 점수판을 한 번 저장한다. */
function plPushBoard() {
  if (!pl || !pl.sessionId) return;
  const board = {};
  const studentScores = {};
  const rows = plScoreboard();
  const visible = !!(pl.live && pl.live.revealed &&
    pl.set && pl.set.settings && pl.set.settings.revealMode !== 'never');
  rows.forEach(r => {
    board[r.sid] = r.correct;
    studentScores[r.sid] = visible
      ? {
          uid: r.sid, visible: true, score: r.correct, graded: r.graded,
          answered: r.answered, rank: r.rank, total: rows.length
        }
      : { uid: r.sid, visible: false };
  });
  return store.writeBoard(pl.sessionId, board, studentScores);
}

function plRenderStudents() {
  const list = $('#pl-stulist'), n = $('#pl-nstu');
  const rows = plScoreboard();
  if (n) n.textContent = rows.length;
  if (!list) { plRenderQrBubble(); return; }
  if (!rows.length) {
    list.innerHTML = '<div style="padding:8px 0;color:var(--ink-3)">아직 입장한 학생이 없습니다.</div>';
    plRenderQrBubble();
    return;
  }
  const total = pl.flatQuestions.length;
  list.innerHTML = rows.map(r =>
    '<div class="rank-row' + (r.rank <= 3 ? ' top' + r.rank : '') + '">' +
      '<span class="rk">' + r.rank + '</span>' +
      '<span class="nm">' + esc(r.name) + ' <span style="color:var(--ink-3);font-size:11px">' + r.num + '번</span></span>' +
      '<span class="prog">' + r.answered + '/' + total + '</span>' +
      '<span class="sc">' + r.correct + '</span>' +
    '</div>').join('');
  plRenderQrBubble();
}

function plStageRoot() {
  return document.getElementById('pl-stage') || document.body;
}

function plRenderCenteredOverlay(open) {
  const stage = plStageRoot();
  if (open) stage.classList.add('quiz-open');
  else stage.classList.remove('quiz-open');
  return stage;
}

/** 퀴즈 종료는 다음 재생 전에 overlay·timer projection·dim을 한 번에 비운다. */
function plSetQuizOpen(open) {
  const stage = plStageRoot();
  if (open) {
    if (typeof plRenderCenteredOverlay === 'function') plRenderCenteredOverlay(true);
    else stage.classList.add('quiz-open');
    if (typeof plApplyStageLayout === 'function') plApplyStageLayout();
    return stage;
  }
  if (pl) pl.quizTimerGeneration = (Number(pl.quizTimerGeneration) || 0) + 1;
  const overlay = typeof document !== 'undefined' && document.getElementById
    ? document.getElementById('overlay') : null;
  if (overlay && overlay.remove) overlay.remove();
  if (typeof plRenderCenteredOverlay === 'function') plRenderCenteredOverlay(false);
  else stage.classList.remove('quiz-open');
  if (typeof plApplyStageLayout === 'function') plApplyStageLayout();
  return stage;
}

/* ── 교실 화면용 전체 순위표 ─────────────────────────────────────────── */
function plToggleBoard() {
  const el = document.getElementById('board-overlay');
  const stage = plStageRoot();
  if (el) { el.remove(); stage.classList.remove('rank-open'); return; }
  const box = document.createElement('div');
  box.id = 'board-overlay';
  stage.classList.add('rank-open');
  stage.appendChild(box);
  plRenderBoardOverlay();
}
function plRenderBoardOverlay() {
  const box = document.getElementById('board-overlay');
  if (!box || !pl) return;
  const rows = plScoreboard();
  const total = pl.flatQuestions.length;
  const nUngraded = rows.reduce((a, r) => a + (r.answered - r.graded), 0);

  box.innerHTML = '<div class="bo-inner">' +
    '<h2>🏆 우리 반 순위</h2>' +
    '<div class="bo-sub">' + esc(pl.set.title) + ' · 문항 ' + total + '개 · 참여 ' + rows.length + '명' +
      (nUngraded ? ' · 서술형 ' + nUngraded + '개는 채점 전이라 점수에 빠져 있습니다' : '') + '</div>' +
    (rows.length
      ? '<div class="bo-list">' + rows.map(r =>
          '<div class="bo-row' + (r.rank <= 3 ? ' top' + r.rank : '') + '">' +
            '<span class="rk">' + (r.rank === 1 ? '🥇' : r.rank === 2 ? '🥈' : r.rank === 3 ? '🥉' : r.rank) + '</span>' +
            '<span class="who"><span class="no">' + r.grade + '-' + r.klass + '-' + r.num + '</span>' + esc(r.name) + '</span>' +
            '<span class="sc">' + r.correct + '<small> / ' + total + '</small></span>' +
          '</div>').join('') + '</div>'
      : '<div style="color:rgba(255,255,255,.6);padding:40px 0">아직 입장한 학생이 없습니다.</div>') +
    '<div class="ov-actions" style="margin-top:26px">' +
      '<button class="btn primary" onclick="plToggleBoard()">닫기</button>' +
    '</div>' +
  '</div>';
}

/* ── 교사 퀴즈 오버레이 ─────────────────────────────────────────────── */
function plRenderOverlay() {
  let ov = document.getElementById('overlay');
  if (!pl || pl.live.q < 0) {
    if (typeof plSetQuizOpen === 'function') plSetQuizOpen(false);
    else {
      if (ov) ov.remove();
      if (typeof plRenderCenteredOverlay === 'function') plRenderCenteredOverlay(false);
      else plStageRoot().classList.remove('quiz-open');
    }
    plRenderQList();
    return;
  }
  const stage = typeof plSetQuizOpen === 'function' ? plSetQuizOpen(true) :
    (typeof plRenderCenteredOverlay === 'function' ? plRenderCenteredOverlay(true) : plStageRoot());
  if (typeof plSetQuizOpen !== 'function' && typeof plRenderCenteredOverlay !== 'function') stage.classList.add('quiz-open');

  const i = pl.live.q, q = pl.flatQuestions[i];
  if (!q) return;
  const mode = pl.set.settings.revealMode;
  const closeBusy = !!(pl.closeFlight && pl.closeFlight.questionIndex === i);

  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'overlay';
    stage.appendChild(ov);
  }
  const type = qType(q);
  const publicAnswer = pl.live.publicAnswer || {};
  ov.innerHTML = '<div class="ov-inner">' +
    '<div class="ov-top">' +
      '<span class="tag" style="background:rgba(255,255,255,.18);color:#fff">문항 ' + (q.number || i + 1) + ' / ' + pl.flatQuestions.length + '</span>' +
      (type !== 'choice' ? '<span class="tag" style="background:rgba(255,255,255,.18);color:#fff">' + QTYPES[type].split(' —')[0] + '</span>' : '') +
      '<span class="ov-count" id="ov-count">참여 0명 · 제출 0명 · 미제출 0명</span>' +
      '<div style="flex:1"></div>' +
      '<div class="quiz-timer" id="ov-timer" style="display:none"><div class="quiz-timer-track"><i></i></div><strong class="quiz-timer-number" id="ov-timer-n">–</strong></div>' +
    '</div>' +
    '<div class="quiz-body">' +
      (hasImage(q) ? '<img class="q-img" data-lightbox tabindex="0" role="button" aria-label="문항 이미지 크게 보기" id="ov-img" alt="문항 이미지">' : '') +
      '<div class="ov-q">' + esc(q.text) + '</div>' +
      (publicAnswer.explain ? '<div class="ov-explain-top" id="ov-explain-top" style="display:none">💡 ' + esc(publicAnswer.explain) + '</div>' : '') +
      (publicAnswer.explainImage ? '<img class="ov-explain-img" data-lightbox tabindex="0" role="button" aria-label="해설 이미지 크게 보기" id="ov-explain-img" style="display:none" src="' + esc(publicAnswer.explainImage) + '" alt="해설 이미지">' : '') +
      (isTextType(q)
        ? '<div id="ov-textwrap"></div>'
        : '<div class="ov-choices" id="ov-choices">' +
            q.choices.map((c, j) =>
              '<div class="ov-choice" data-c="' + j + '">' +
                '<span class="bar"></span>' +
                '<span class="lt">' + (type === 'ox' ? ['O', 'X'][j] : LETTERS[j]) + '</span>' +
                '<span>' + esc(c) + '</span>' +
                '<span class="cnt" data-cnt="' + j + '"></span>' +
              '</div>').join('') +
          '</div>') +
    '</div>' +
    '<div class="ov-actions">' +
      (pl.closeError ? '<div class="notice bad" role="alert">종료 저장 실패: ' +
        esc(pl.closeError) + ' · 다시 시도해 주세요.</div>' : '') +
      (mode === 'never' ? '' :
        '<button class="btn" id="ov-reveal" onclick="plReveal()">✅ ' + (mode === 'manual' ? '정답 공개' : '지금 공개') + '</button>') +
      '<button class="btn primary" onclick="plCloseQuestion().catch(()=>{})"' +
        (closeBusy ? ' disabled aria-busy="true"' : '') + '>' +
        (closeBusy ? '저장 중…' : '▶ 계속 재생') + '</button>' +
      '<button class="btn ghost" style="color:#fff;border-color:rgba(255,255,255,.3)" onclick="plToggleBoard()">🏆 순위</button>' +
      '<a class="btn ghost" style="color:#fff;border-color:rgba(255,255,255,.3)" href="#/live/' + esc(pl.sessionId) + '" target="_blank">📊 대시보드</a>' +
    '</div>' +
  '</div>';

  if (hasImage(q)) {
    const state = pl;
    const imgEl = ov.querySelector('#ov-img');
    if (q.imgUrl) imgEl.src = q.imgUrl;
    else loadQuestionImage(
      pl.setId, q.key || i, pl.sessionId, pl.snapshotVersion
    ).then(src => {
      const now = document.querySelector('#ov-img');
      if (pl === state && state.live.q === i && now === imgEl && src) now.src = src;
    });
  }

  plRenderOverlayCounts();
  plRenderQList();
}

/** 교사 화면은 교실 앞에 투사되므로 학생 화면과 같은 시점에만 정답을 드러낸다.
    (instant 모드는 학생마다 공개 시점이 달라, 교사가 직접 누를 때까지 기다린다) */
function plRevealed() {
  return !!(pl && pl.live && pl.live.revealed && pl.live.publicAnswer);
}

/** 텍스트 답안 요약 — 단답형은 같은 답끼리 묶어 세고, 서술형은 답을 그대로 보여준다 */
function plTextSummary(q, resp) {
  const keys = Object.keys(resp);
  if (!keys.length) return '<div class="ov-explain">아직 제출한 학생이 없습니다.</div>';

  if (qType(q) === 'short') {
    const groups = {};
    keys.forEach(k => {
      const raw = (resp[k].txt || '').trim();
      const key = normAnswerText(raw);
      if (!groups[key]) groups[key] = { label: raw, n: 0, ok: !!resp[k].ok };
      groups[key].n++;
    });
    const rows = Object.keys(groups).map(k => groups[k]).sort((a, b) => b.n - a.n);
    return '<div class="ov-choices">' + rows.map(g =>
      '<div class="ov-choice' + (g.ok ? ' correct' : '') + '">' +
        '<span class="lt">' + (g.ok ? '○' : '×') + '</span>' +
        '<span>' + esc(g.label) + '</span>' +
        '<span class="cnt">' + g.n + '명</span>' +
      '</div>').join('') +
      '</div><div class="ov-explain">인정 답안: ' + esc((q.accept || []).join(', ')) + '</div>';
  }

  // 서술형 — 화면에 다 띄우면 넘치므로 앞의 몇 개만
  const sample = keys.slice(0, 6);
  return '<div>' + sample.map(k =>
      '<div class="ov-explain" style="margin-top:8px">' + esc((resp[k].txt || '').slice(0, 200)) + '</div>').join('') +
    (keys.length > sample.length
      ? '<div class="ov-explain" style="margin-top:8px;opacity:.7">외 ' + (keys.length - sample.length) + '명 — 전체는 대시보드에서 보세요</div>'
      : '') + '</div>';
}

function plRenderOverlayCounts() {
  const ov = document.getElementById('overlay');
  if (!ov || !pl || pl.live.q < 0) return;
  const i = pl.live.q, q = pl.flatQuestions[i];
  if (!q) return;
  const resp = pl.responses[i] || {};
  const keys = Object.keys(resp);
  const total = keys.length;
  const totals = FirestoreCore.submissionCounts(pl.students, resp);

  const type = qType(q);
  const counts = q.choices.map(() => 0);
  keys.forEach(k => {
    if (type === 'multi') parseMulti(resp[k].cs).forEach(j => { if (counts[j] !== undefined) counts[j]++; });
    else { const c = Number(resp[k].c); if (counts[c] !== undefined) counts[c]++; }
  });

  const cntEl = ov.querySelector('#ov-count');
  if (cntEl) cntEl.textContent = '참여 ' + totals.participants + '명 · 제출 ' + totals.submitted + '명 · 미제출 ' + totals.missing + '명';

  // 공개 전에는 정답 표시도, 보기별 응답 분포도 감춘다.
  // 이 화면은 교실 앞에 띄워 두는 것이라 둘 다 답을 알려주는 단서가 된다.
  const revealed = plRevealed();
  pl.uiRevealed = revealed;

  if (isTextType(q)) {
    // 단답형·서술형은 학생들이 쓴 답을 공개 시점에 모아 보여준다
    const wrap = ov.querySelector('#ov-textwrap');
    if (wrap) wrap.innerHTML = revealed ? plTextSummary(q, resp)
      : '<div class="ov-explain" style="opacity:.75">학생들이 답을 쓰는 중입니다. 공개하면 여기에 모아 보여줍니다.</div>';
  } else {
    const isAns = j => (type === 'multi') ? ((q.answers || []).indexOf(j) >= 0) : (j === Number(q.answer));
    $$('.ov-choice', ov).forEach(el => {
      const j = Number(el.dataset.c);
      const pct = (revealed && total) ? Math.round(counts[j] / total * 100) : 0;
      el.querySelector('.bar').style.width = pct + '%';
      el.querySelector('[data-cnt]').textContent = (revealed && total) ? counts[j] + '명 (' + pct + '%)' : '';
      el.classList.toggle('correct', revealed && isAns(j));
    });
  }
  const ex = ov.querySelector('#ov-explain-top');
  if (ex) ex.style.display = revealed ? '' : 'none';
  const exImage = ov.querySelector('#ov-explain-img');
  if (exImage) exImage.style.display = revealed ? '' : 'none';
  const rv = ov.querySelector('#ov-reveal');
  if (rv) {
    rv.disabled = revealed;
    rv.textContent = revealed ? '공개됨' : ('✅ ' + (pl.set.settings.revealMode === 'manual' ? '정답 공개' : '지금 공개'));
  }
}

/** 남은 시간 표시 — 서버 시각 기준이라 학생 화면과 어긋나지 않는다 */
function plTimerTick() {
  const ov = document.getElementById('overlay');
  if (!ov || !pl || pl.live.q < 0) return;
  const timerGeneration = Number(pl.quizTimerGeneration) || 0;
  const questionIndex = Number(pl.live.q);
  const liveToken = String(pl.live.liveToken || '');
  const isCurrentTimer = state => pl === state &&
    (Number(state.quizTimerGeneration) || 0) === timerGeneration &&
    Number(state.live && state.live.q) === questionIndex &&
    String(state.live && state.live.liveToken || '') === liveToken;

  // timer 모드는 시간이 차면 정답 projection도 Firestore에 함께 공개한다.
  const revealAt = Number(pl.live.revealAt) || 0;
  const revealDue = revealAt > 0 && serverNow() >= revealAt;
  if (pl.set && pl.set.settings && pl.set.settings.revealMode === 'timer' &&
      !pl.live.revealed && !pl.revealPending && !pl.revealRequested &&
      serverNow() >= (Number(pl.revealRetryAt) || 0) && revealDue) {
    const state = pl;
    state.revealPending = true;
    Promise.resolve(plReveal()).then(revealed => {
      if (!isCurrentTimer(state)) return;
      if (revealed === false) state.revealRetryAt = serverNow() + 1000;
      else state.revealRequested = true;
    }).catch(e => {
      if (isCurrentTimer(state)) {
        state.revealRequested = false;
        state.revealRetryAt = serverNow() + 1000;
        state.revealPending = false;
      }
      console.error(e);
    }).finally(() => {
      if (isCurrentTimer(state)) state.revealPending = false;
    });
  }
  if (plRevealed() !== pl.uiRevealed) plRenderOverlayCounts();

  const el = ov.querySelector('#ov-timer'), num = ov.querySelector('#ov-timer-n');
  const t = FirestoreCore.timerView(pl.live, serverNow());
  if (!t) { if (el) el.style.display = 'none'; return; }
  el.style.display = '';
  num.textContent = Math.ceil(t.left) + '초';
  el.querySelector('.quiz-timer-track i').style.width = (t.ratio * 100) + '%';
  el.classList.toggle('warning', t.phase === 'warning');
  el.classList.toggle('urgent', t.phase === 'urgent');
}

/* ══════════════════════════════════════════════════════════════════════
   7. ③ 학생 참여 화면
   ══════════════════════════════════════════════════════════════════════ */
let st = null;

function screenJoin(codeArg) {
  const request = { cancelled: false };
  onCleanup(() => { request.cancelled = true; });
  APP().innerHTML = topbar() + '<div class="wrap"><div class="empty">학생 참여를 준비하는 중…</div></div>';
  ensureAnonymousStudent()
    .then(user => { if (!request.cancelled) screenStudent(codeArg, user); })
    .catch(error => {
      if (request.cancelled) return;
      console.error(error);
      APP().innerHTML = topbar() + '<div class="wrap"><div class="card">' +
        '<h2>학생 참여를 시작할 수 없습니다</h2>' +
        '<div class="notice" style="margin-top:12px">익명 학생 로그인을 확인한 뒤 다시 시도해 주세요.</div>' +
        '<button class="btn primary" onclick="screenJoin(' + JSON.stringify(codeArg || '') + ')">다시 시도</button>' +
      '</div></div>';
    });
}

function screenStudent(codeArg, authUser) {
  const currentUser = authUser || (typeof firebase !== 'undefined' && firebase.auth
    ? firebase.auth().currentUser : null);
  st = {
    code: (codeArg || '').toUpperCase(),
    sessionId: null, session: null,
    authUid: currentUser && currentUser.isAnonymous ? currentUser.uid : null,
    sid: null, me: null, currentQuestion: null, totalQuestions: 0,
    live: { q: -1, openedAt: 0, revealed: false, limitSec: 0 },
    myAnswers: {},          // { 문항index: {answer, submitted, revision, ok?} }
    sel: null, multiSel: [], draft: '', submitted: false, ownScore: null,
    revision: 0, deadlineHandled: '', writeQueues: {}, optimisticRevisions: {},
    uiRevealed: false, uiLocked: false, uiQ: -2
  };
  const state = st;
  onCleanup(() => { if (st === state) st = null; });

  if (state.code) stLookupCode(state.code);
  else stRenderCodeForm('');
}

function stShell(inner) {
  APP().innerHTML = topbar() + '<div class="stu-wrap">' + inner + '</div>';
}

function stRenderCodeForm(err) {
  const last = lsGet('vq_last_code');
  stShell(
    '<div class="card" style="text-align:center;padding:30px 22px">' +
      '<div style="font-size:40px;margin-bottom:6px">🙋</div>' +
      '<h2 style="font-size:20px;margin-bottom:4px">반 코드 입력</h2>' +
      '<p style="color:var(--ink-2);font-size:14px;margin-bottom:18px">선생님 화면에 뜬 6자리 코드를 입력하세요.</p>' +
      '<input type="text" id="st-code" class="mono" maxlength="6" autocapitalize="characters" autocomplete="off" ' +
        'value="' + esc(st.code || last) + '" placeholder="ABC234" ' +
        'style="text-align:center;font-size:32px;letter-spacing:.18em;font-weight:800;padding:14px">' +
      (err ? '<div style="color:var(--bad);font-size:13px;margin-top:10px;font-weight:600">' + esc(err) + '</div>' : '') +
      '<button class="btn primary lg block" style="margin-top:14px" onclick="stSubmitCode()">입장하기</button>' +
    '</div>' +
    '<div class="privacy-note">이 도구는 수업 참여 확인을 위해 <b>학년·반·번호·이름</b>과 문항별 응답을 저장합니다. ' +
      '저장된 자료는 담당 교사와 관리자만 조회하며, 학교 보관 정책에 따라 삭제됩니다.</div>'
  );
  const inp = $('#st-code');
  inp.oninput = e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); };
  inp.onkeydown = e => { if (e.key === 'Enter') stSubmitCode(); };
  inp.focus();
}

function stSubmitCode() {
  const v = ($('#st-code').value || '').trim().toUpperCase();
  if (v.length !== 6) { stRenderCodeForm('코드는 6자리입니다.'); return; }
  stLookupCode(v);
}

async function stLookupCode(code) {
  const state = st;
  if (!state) return;
  stShell('<div class="empty">반을 찾는 중…</div>');
  try {
    const v = await store.getCode(code);
    if (st !== state) return;
    if (!v || !v.sessionId) { state.code = ''; stRenderCodeForm('그런 반 코드가 없습니다. 다시 확인해 주세요.'); return; }
    state.code = code;
    state.sessionId = v.sessionId;
    lsSet('vq_last_code', code);
    const sess = await store.getSession(v.sessionId);
    if (st !== state) return;
    if (!sess) { stRenderCodeForm('반 정보를 불러오지 못했습니다.'); return; }
    state.session = sess;
    stRenderIdentityForm('');
  } catch (e) {
    if (st !== state) return;
    console.error(e);
    stRenderCodeForm('접속 오류: ' + e.message);
  }
}

function stRenderIdentityForm(err) {
  let saved = {};
  try { saved = JSON.parse(lsGet('vq_student', '{}')); } catch (e) {}
  stShell(
    '<div class="card">' +
      '<div style="font-size:13px;color:var(--ink-2);margin-bottom:2px">' + esc(st.code) +
        (st.session.label ? ' · ' + esc(st.session.label) : '') + '</div>' +
      '<h2 style="font-size:19px;margin-bottom:14px">학생 정보</h2>' +
      '<div class="row">' +
        '<div class="col" style="flex:1 1 80px"><label class="f">학년</label>' +
          '<input type="number" id="st-grade" inputmode="numeric" min="1" max="6" value="' + esc(saved.grade || '') + '"></div>' +
        '<div class="col" style="flex:1 1 80px"><label class="f">반</label>' +
          '<input type="number" id="st-klass" inputmode="numeric" min="1" max="30" value="' + esc(saved.klass || '') + '"></div>' +
        '<div class="col" style="flex:1 1 80px"><label class="f">번호</label>' +
          '<input type="number" id="st-num" inputmode="numeric" min="1" max="60" value="' + esc(saved.num || '') + '"></div>' +
      '</div>' +
      '<div class="field" style="margin-top:12px"><label class="f">이름</label>' +
        '<input type="text" id="st-name" autocomplete="off" value="' + esc(saved.name || '') + '" placeholder="홍길동"></div>' +
      (err ? '<div style="color:var(--bad);font-size:13px;margin-bottom:10px;font-weight:600">' + esc(err) + '</div>' : '') +
      '<button class="btn primary lg block" onclick="stJoin()">입장</button>' +
      '<button class="btn ghost sm block" style="margin-top:8px" onclick="go(\'join\')">다른 반 코드 입력</button>' +
    '</div>' +
    '<div class="privacy-note">입력한 학년·반·번호·이름과 응답 내용이 저장됩니다. 본인 정보를 정확히 입력해 주세요.</div>'
  );
  $('#st-name').onkeydown = e => { if (e.key === 'Enter') stJoin(); };
}

async function stJoin() {
  const state = st;
  if (!state) return;
  const grade = Number($('#st-grade').value);
  const klass = Number($('#st-klass').value);
  const num   = Number($('#st-num').value);
  const name  = ($('#st-name').value || '').trim();
  if (!grade || !klass || !num) { stRenderIdentityForm('학년·반·번호를 모두 입력하세요.'); return; }
  if (!name) { stRenderIdentityForm('이름을 입력하세요.'); return; }

  const authUid = state.authUid;
  if (!authUid) { stRenderIdentityForm('익명 학생 로그인을 다시 확인해 주세요.'); return; }
  const me = { grade: grade, klass: klass, num: num, name: name };
  lsSet('vq_student', JSON.stringify(me));

  try {
    await store.joinStudent(state.sessionId, authUid, me);
    if (st !== state) return;
    state.sid = authUid;
    state.me = me;
    const answers = await store.getOwnResponses(state.sessionId, authUid);
    if (st !== state) return;
    // 새로고침 대비 — 내가 이미 낸 답만 복원한다
    Object.keys(answers).forEach(qi => {
      const r = answers[qi];
      if (!r) return;
      const record = {
        answer: r.answer,
        ok: (r.ok === undefined || r.ok === null) ? null : !!r.ok,
        submitted: r.submitted !== false,
        revision: Number(r.revision) || 0
      };
      if (r.score !== undefined) record.score = r.score;
      state.revision = Math.max(state.revision, record.revision);
      if (record.submitted) state.myAnswers[Number(qi)] = record;
    });
    stStartWatching(state);
  } catch (e) {
    if (st !== state) return;
    console.error(e);
    stRenderIdentityForm('입장 실패: ' + e.message);
  }
}

function stStartWatching(expectedState) {
  const state = expectedState || st;
  if (!state || st !== state) return;
  onCleanup(store.subscribeLive(state.sessionId, async live => {
    if (st !== state) return;
    const previousQ = state.live.q;
    const nl = Object.assign({ q: -1, openedAt: 0, revealed: false, limitSec: 0 }, live || {});
    const nextToken = String(nl.liveToken || '');
    const currentToken = String(state.live.liveToken || '');
    const identityChanged = nextToken || currentToken
      ? nextToken !== currentToken
      : nl.openedAt !== state.live.openedAt;
    const changed = nl.q !== state.live.q || identityChanged;
    state.live = nl;
    const view = studentQuestionView(nl);
    state.currentQuestion = view.question || null;
    if (view.total) state.totalQuestions = view.total;
    if (nl.status === 'ended' && state.session) state.session.status = 'ended';
    if (changed) {
      const prev = state.myAnswers[nl.q];
      state.sel = prev && !Array.isArray(prev.answer) && typeof prev.answer !== 'string'
        ? prev.answer : null;
      state.multiSel = prev && Array.isArray(prev.answer) ? prev.answer.slice() : [];
      state.draft = prev && typeof prev.answer === 'string' ? prev.answer : '';
      state.submitted = !!prev;
      state.deadlineHandled = '';
    }
    stRender();
    if (previousQ >= 0 && nl.q < 0) {
      try {
        const ownScore = await store.getOwnScore(state.sessionId, state.authUid);
        if (st !== state) return;
        state.ownScore = ownScore;
        stRender();
      } catch (e) { if (st === state) console.error(e); }
    }
  }, e => { if (st === state) console.error(e); }));
  every(250, stTick);
  stRender();
}

/** 설정된 공개 방식에 따라 지금 정답을 보여줘도 되는지 */
function stRevealed() {
  return !!(st && st.live && st.live.revealed && st.live.publicAnswer);
}
/** 제한 시간이 지났거나 공개됐으면 더 못 고른다 */
function stLocked() {
  if (stRevealed()) return true;
  const responseClosesAt = Number(st.live.responseClosesAt) || 0;
  if (responseClosesAt) return serverNow() >= responseClosesAt;
  const limit = Number(st.live.limitSec) || 0;
  if (!limit || !st.live.openedAt) return false;
  return (serverNow() - st.live.openedAt) / 1000 >= limit;
}
function stLeftRatio() {
  return FirestoreCore.timerView(st.live, serverNow());
}

/** 매 프레임 전체를 다시 그리면 조작감이 나빠지므로, 바뀐 것만 갱신한다 */
function stTick() {
  if (!st || !st.currentQuestion || st.live.q < 0) return;
  const bar = $('#st-timer');
  const t = stLeftRatio();
  if (bar && t) {
    bar.querySelector('.quiz-timer-track i').style.width = (t.ratio * 100) + '%';
    bar.classList.toggle('warning', t.phase === 'warning');
    bar.classList.toggle('urgent', t.phase === 'urgent');
    const n = $('#st-left');
    if (n) n.textContent = Math.ceil(t.left) + '초';
  }
  stDeadlineTick();
  const rev = stRevealed(), lock = stLocked();
  if (rev !== st.uiRevealed || lock !== st.uiLocked) stRender();
}

function studentQuestionView(live) {
  const i = live && Number.isInteger(live.q) ? live.q : -1;
  const question = live && live.publicQuestion;
  const revealed = !!(live && live.revealed && live.publicAnswer);
  const visible = question ? Object.assign({}, question, revealed ? live.publicAnswer : {}) : null;
  return {
    number: visible ? (visible.number || i + 1) : 0,
    total: visible ? (visible.total || 0) : 0,
    question: visible
  };
}

function stRender() {
  if (!st || !st.sid) return;
  const i = st.live.q;
  const ended = st.session && st.session.status === 'ended';
  const showScore = !!(st.ownScore && st.ownScore.visible === true);

  const keys = Object.keys(st.myAnswers);
  const answered = keys.length;
  // 서술형은 아직 채점 전이므로 정답률 계산에서 뺀다
  const gradedKeys = keys.filter(k => st.myAnswers[k].ok !== null && st.myAnswers[k].ok !== undefined);
  const localCorrect = gradedKeys.filter(k => st.myAnswers[k].ok).length;
  const correct = showScore ? Math.max(0, Number(st.ownScore.score) || 0) : localCorrect;
  const graded = showScore ? Math.max(0, Number(st.ownScore.graded) || 0) : gradedKeys.length;
  const nUngraded = showScore
    ? Math.max(0, (Number(st.ownScore.answered) || answered) - graded)
    : answered - graded;

  const header =
    '<div class="stu-status">' +
      '<span class="tag">' + esc(st.code) + '</span>' +
      '<span>' + esc(st.me.grade) + '-' + esc(st.me.klass) + '-' + esc(st.me.num) + ' ' + esc(st.me.name) + '</span>' +
      '<span class="spacer"></span>' +
      (showScore
        ? '<span style="color:var(--ink-2)">' + correct + ' / ' + graded + ' 정답' +
            (nUngraded ? ' <span style="color:var(--ink-3)">(채점 전 ' + nUngraded + ')</span>' : '') + '</span>'
        : '<span style="color:var(--ink-2)">' + answered + '문항 제출</span>') +
    '</div>';

  if (ended) {
    stShell(header +
      '<div class="card"><div class="stu-wait">' +
        '<div class="big">🎉</div><h2>수업이 끝났습니다</h2>' +
        '<p>' + esc(st.session.label || st.code) + '</p>' +
        (showScore
          ? '<div class="result-banner ok" style="margin-top:18px">' + graded + '문항 중 ' + correct + '개 정답' +
              (function () {
                const rk = stRank();
                return rk ? '<div style="font-size:14px;font-weight:700;margin-top:6px">' + rk.total + '명 중 ' + rk.rank + '등</div>' : '';
              })() +
              (nUngraded ? '<div style="font-size:13px;font-weight:600;margin-top:6px;color:var(--ink-2)">서술형 ' + nUngraded + '문항은 선생님이 채점합니다</div>' : '') + '</div>'
          : '<div class="result-banner mute" style="margin-top:18px">' + answered + '문항 제출 완료</div>') +
      '</div>' +
      stMyStat(st.totalQuestions, answered, correct, graded, nUngraded, showScore) +
      '</div>');
    st.uiQ = -3;
    return;
  }

  if (i < 0) {
    stShell(header +
      '<div class="card">' +
        '<div class="stu-wait" style="padding:38px 18px 8px">' +
          '<div class="big">📺</div>' +
          '<h2>선생님 화면을 보세요</h2>' +
          '<p>퀴즈가 나오면 이 화면에 자동으로 뜹니다.</p>' +
        '</div>' +
        stMyStat(st.totalQuestions, answered, correct, graded, nUngraded, showScore) +
      '</div>');
    st.uiQ = -1;
    return;
  }

  const view = studentQuestionView(st.live);
  const q = view.question;
  if (!q) return;
  const revealed = stRevealed();
  const locked = stLocked();
  st.uiRevealed = revealed; st.uiLocked = locked; st.uiQ = i;

  const t = stLeftRatio();
  const my = st.myAnswers[i];

  const type = qType(q);
  const banner = stBanner(q, my, revealed, locked);

  stShell(header +
    '<div class="card">' +
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">' +
        '<span class="tag">문항 ' + view.number + ' / ' + view.total + '</span>' +
        (type !== 'choice' ? '<span class="tag qtype">' + QTYPES[type].split(' —')[0] + '</span>' : '') +
        (t ? '<span class="spacer" style="flex:1"></span>' : '') +
      '</div>' +
      (t ? '<div class="quiz-timer ' + esc(t.phase) + '" id="st-timer"><div class="quiz-timer-track"><i style="width:' + (t.ratio * 100) + '%"></i></div><strong class="quiz-timer-number" id="st-left">' + Math.ceil(t.left) + '초</strong></div>' : '') +
      banner +
      (hasImage(q) ? '<img class="stu-q-img" data-lightbox tabindex="0" role="button" aria-label="문항 이미지 크게 보기" id="st-img" alt="문항 이미지">' : '') +
      '<div class="stu-q">' + esc(q.text) + '</div>' +
      // 해설은 공개 직후 가장 먼저 눈에 들어와야 하므로 보기 위쪽에 크게 놓는다
      (revealed && q.explain ? '<div class="stu-explain-top">💡 ' + esc(q.explain) + '</div>' : '') +
      (revealed && q.explainImage ? '<img class="stu-explain-img" data-lightbox tabindex="0" role="button" aria-label="해설 이미지 크게 보기" src="' + esc(q.explainImage) + '" alt="해설 이미지">' : '') +
      stAnswerUI(q, i, my, revealed, locked) +
      '<div class="privacy-note">입력한 학년·반·번호·이름과 응답이 저장됩니다.</div>' +
    '</div>');

  if (hasImage(q)) stShowImage(q, i);
}

/** 내 순위 — 교사 화면이 올린 점수 요약(board)으로만 계산한다 */
function stRank() {
  const score = st && st.ownScore;
  if (!score || score.visible !== true) return null;
  return { rank: Number(score.rank) || 0, total: Number(score.total) || 0 };
}

/** 대기 화면·종료 화면에 쓰는 내 진행 현황 */
function stMyStat(totalQuestions, answered, correct, graded, ungraded, showScore) {
  const totalQ = Math.max(0, Number(totalQuestions) || 0);
  const left = Math.max(0, totalQ - answered);
  const rk = showScore ? stRank() : null;

  return '<div class="stu-mystat">' +
      (showScore
        ? '<div class="box ok"><div class="k">맞힌 개수</div><div class="v">' + correct + '<small> / ' + graded + '</small></div></div>'
        : '<div class="box"><div class="k">제출</div><div class="v">' + answered + '<small> / ' + totalQ + '</small></div></div>') +
      '<div class="box"><div class="k">남은 문항</div><div class="v">' + left + '<small>개</small></div></div>' +
      (rk
        ? '<div class="box rank"><div class="k">내 순위</div><div class="v">' + rk.rank + '<small> / ' + rk.total + '명</small></div></div>'
        : '<div class="box"><div class="k">푼 문항</div><div class="v">' + answered + '<small> / ' + totalQ + '</small></div></div>') +
    '</div>' +
    (ungraded && showScore
      ? '<div class="hint" style="text-align:center;margin-top:8px">서술형 ' + ungraded + '문항은 선생님이 채점한 뒤 점수에 들어갑니다</div>'
      : '') +
    (left === 0 && answered
      ? '<div class="hint" style="text-align:center;margin-top:8px">문항을 모두 풀었습니다. 수고했어요!</div>'
      : '');
}

/** 문항 이미지는 그 문항이 열릴 때만 내려받는다 */
function stShowImage(q, i) {
  const el = $('#st-img');
  if (!el) return;
  if (q.image) el.src = q.image;
}

function stBanner(q, my, revealed, locked) {
  const type = qType(q);
  if (type === 'long') {
    if (my && my.ok === true) return '<div class="result-banner ok">⭕ 선생님이 정답으로 채점했습니다</div>';
    if (my && my.ok === false) return '<div class="result-banner bad">❌ 선생님이 오답으로 채점했습니다</div>';
    if (my) return '<div class="result-banner mute">✅ 제출 완료 — 선생님이 나중에 확인합니다</div>';
    if (locked) return '<div class="result-banner mute">⏱ 시간이 끝났습니다</div>';
    return '';
  }
  if (revealed && my) {
    return gradeResponse(q, my)
      ? '<div class="result-banner ok">⭕ 정답입니다</div>'
      : '<div class="result-banner bad">❌ 아쉽네요 — 정답은 ' + esc(correctLabel(q)) + '</div>';
  }
  if (revealed && !my) return '<div class="result-banner mute">정답은 ' + esc(correctLabel(q)) + '입니다</div>';
  if (my) return '<div class="result-banner mute">✅ 제출 완료 — 잠시 기다리세요</div>';
  if (locked) return '<div class="result-banner mute">⏱ 시간이 끝났습니다</div>';
  return '';
}

/** 정답을 사람이 읽는 형태로 */
function correctLabel(q) {
  const type = qType(q);
  if (type === 'short') return (q.accept || [])[0] || '';
  if (type === 'multi') return (q.answers || []).map(j => LETTERS[j]).join(' ') + '번';
  if (type === 'ox') return ['O', 'X'][q.answer] || '';
  return LETTERS[q.answer] + '번';
}

/* ── 유형별 학생 응답 UI ───────────────────────────────────────────────── */
function stAnswerUI(q, i, my, revealed, locked) {
  const type = qType(q);

  if (type === 'short' || type === 'long') {
    if (my) {
      return '<div class="stu-answer-box">' + esc(typeof my.answer === 'string' ? my.answer : '') + '</div>' +
        (revealed && type === 'short'
          ? '<div class="hint">인정 답안: ' + esc((q.accept || []).join(', ')) + '</div>' : '') +
        (!locked && !revealed ? '<button class="btn block" style="margin-top:10px" onclick="stReviseAnswer()">다시 고르기</button>' : '');
    }
    if (locked) return '<div class="hint">응답 시간이 지났습니다.</div>';
    // 타이머 때문에 화면이 다시 그려져도 쓰던 글이 날아가지 않도록 st.draft 에 담아 둔다
    const draft = st.draft || '';
    return (type === 'short'
        ? '<input type="text" class="stu-text-input" id="st-txt" autocomplete="off" value="' + esc(draft) + '" ' +
          'oninput="st.draft=this.value" placeholder="답을 입력하세요" onkeydown="if(event.key===\'Enter\')stSubmitText()">'
        : '<textarea class="stu-text-input" id="st-txt" rows="5" oninput="st.draft=this.value" ' +
          'placeholder="생각을 자유롭게 적어 주세요">' + esc(draft) + '</textarea>') +
      '<button class="btn primary lg block" style="margin-top:10px" onclick="stSubmitText()">제출하기</button>';
  }

  if (type === 'multi') {
    const picked = my && Array.isArray(my.answer) ? my.answer : (st.multiSel || []);
    return q.choices.map((c, j) => {
      let cls = '';
      if (revealed) {
        if ((q.answers || []).indexOf(j) >= 0) cls = ' correct';
        else if (picked.indexOf(j) >= 0) cls = ' wrong';
      } else if (picked.indexOf(j) >= 0) cls = ' sel';
      return '<button class="stu-choice' + cls + '" ' + (locked || my ? 'disabled' : '') + ' onclick="stToggleMulti(' + j + ')">' +
        '<span class="lt">' + (picked.indexOf(j) >= 0 ? '✓' : LETTERS[j]) + '</span><span>' + esc(c) + '</span></button>';
    }).join('') +
    (my && !locked && !revealed ? '<button class="btn block" style="margin-top:10px" onclick="stReviseAnswer()">다시 고르기</button>' : '') +
    (my || locked ? '' :
      '<button class="btn primary lg block" style="margin-top:10px" onclick="stSubmitMulti()">' +
        (picked.length ? picked.length + '개 골랐어요 — 제출하기' : '고른 뒤 제출하세요') + '</button>');
  }

  // 객관식 / O·X
  return q.choices.map((c, j) => {
    let cls = '';
    if (revealed) {
      if (j === q.answer) cls = ' correct';
      else if (my && Number(my.answer) === j) cls = ' wrong';
    } else if (st.sel === j) cls = ' sel';
    return '<button class="stu-choice' + cls + '" ' + (locked || my ? 'disabled' : '') + ' onclick="stAnswer(' + j + ')">' +
      '<span class="lt">' + (type === 'ox' ? ['O', 'X'][j] : LETTERS[j]) + '</span><span>' + esc(c) + '</span></button>';
  }).join('') +
    (my && !locked && !revealed ? '<button class="btn block" style="margin-top:10px" onclick="stReviseAnswer()">다시 고르기</button>' : '') +
    (!my && !locked ? '<button class="btn primary lg block" style="margin-top:10px" onclick="stSubmitCurrent(\'button\')">' +
      (st.sel === null ? '고른 뒤 제출하세요' : '제출하기') + '</button>' : '');
}

/** 응답을 서버에 보내고 화면을 갱신하는 공통 경로 */
function stQueueWrite(state, questionIndex, task) {
  if (!state.writeQueues) state.writeQueues = {};
  const previous = state.writeQueues[questionIndex] || Promise.resolve();
  const queued = previous.catch(() => {}).then(task);
  state.writeQueues[questionIndex] = queued;
  return queued.finally(() => {
    if (state.writeQueues && state.writeQueues[questionIndex] === queued) {
      delete state.writeQueues[questionIndex];
    }
  });
}

function stSend(payload, localRec) {
  const state = st;
  if (!state) return Promise.resolve(false);
  const i = state.live.q;
  const revision = Number(payload && payload.revision) || 0;
  const previous = state.myAnswers[i];
  if (!state.optimisticRevisions) state.optimisticRevisions = {};
  state.optimisticRevisions[i] = revision;
  state.submitted = true;
  state.myAnswers[i] = localRec;
  stRender();
  return stQueueWrite(state, i, () => store.writeStudentAnswer(
    state.sessionId, state.authUid, i, payload
  ))
    .then(() => {
      if (state.optimisticRevisions && state.optimisticRevisions[i] === revision) {
        delete state.optimisticRevisions[i];
      }
      return true;
    })
    .catch(e => {
      console.error(e);
      if (st === state && state.optimisticRevisions &&
          state.optimisticRevisions[i] === revision && state.myAnswers[i] === localRec) {
        delete state.optimisticRevisions[i];
        if (previous) state.myAnswers[i] = previous;
        else delete state.myAnswers[i];
        if (state.live.q === i) state.submitted = !!previous;
        stRender();
        toast('전송 실패 — 다시 시도해 주세요');
      }
      return false;
    });
}

function stAnswer(j) {
  if (!st || st.live.q < 0 || stLocked()) return;
  const q = st.currentQuestion;
  if (!q || !q.choices[j]) return;
  st.sel = j;
  stRender();
}

function stToggleMulti(j) {
  if (!st || stLocked() || st.myAnswers[st.live.q]) return;
  st.multiSel = st.multiSel || [];
  const at = st.multiSel.indexOf(j);
  if (at >= 0) st.multiSel.splice(at, 1); else st.multiSel.push(j);
  stRender();
}

function stSubmitMulti() {
  return stSubmitCurrent('button');
}

function stSubmitText() {
  if (!st || st.live.q < 0 || stLocked()) return;
  const el = $('#st-txt');
  if (el) st.draft = el.value;
  return stSubmitCurrent('button');
}

function stHasDraftAnswer() {
  if (!st || st.live.q < 0) return false;
  const q = st.currentQuestion, type = qType(q);
  if (type === 'multi') return !!(st.multiSel && st.multiSel.length);
  if (type === 'short' || type === 'long') return !!String(st.draft || '').trim();
  return st.sel !== null && st.sel !== undefined;
}

function stBuildAnswer() {
  if (!stHasDraftAnswer()) return null;
  const q = st.currentQuestion, type = qType(q);
  let answer;
  if (type === 'multi') {
    answer = (st.multiSel || []).slice();
  } else if (type === 'short' || type === 'long') {
    answer = String(st.draft || '').trim().slice(0, type === 'short' ? 100 : 1000);
  } else {
    answer = st.sel;
  }
  if (typeof FirestoreStore !== 'undefined' && FirestoreStore.validateStudentAnswer) {
    FirestoreStore.validateStudentAnswer(q, answer);
  }
  return { payload: { answer }, local: { answer } };
}

function stSubmitCurrent(source) {
  if (!st || st.live.q < 0 || (source !== 'timer' && stLocked()) || st.submitted) return Promise.resolve(false);
  const built = stBuildAnswer();
  if (!built) {
    if (source !== 'timer') toast('답을 선택하거나 입력한 뒤 제출하세요');
    return Promise.resolve(false);
  }
  st.revision = (Number(st.revision) || 0) + 1;
  const payload = Object.assign({}, built.payload, {
    submitted: true, revision: st.revision, submittedAt: SV_TS
  });
  built.local.submitted = true;
  built.local.revision = st.revision;
  return stSend(payload, built.local).then(() => true);
}

function stReviseAnswer() {
  if (!st || st.live.q < 0 || !st.submitted || stLocked()) return Promise.resolve(false);
  const state = st;
  const i = state.live.q, current = state.myAnswers[i];
  if (!current) return Promise.resolve(false);
  state.revision = Math.max(Number(state.revision) || 0, Number(current.revision) || 0) + 1;
  const revision = state.revision;
  const payload = {
    answer: current.answer,
    submitted: false,
    revision: revision,
    submittedAt: SV_TS
  };
  if (!state.optimisticRevisions) state.optimisticRevisions = {};
  state.optimisticRevisions[i] = revision;
  delete state.myAnswers[i];
  state.submitted = false;
  stRender();
  return stQueueWrite(state, i, () => store.writeStudentAnswer(
    state.sessionId, state.authUid, i, payload
  )).then(() => {
    if (state.optimisticRevisions && state.optimisticRevisions[i] === revision) {
      delete state.optimisticRevisions[i];
    }
    return true;
  }).catch(e => {
    console.error(e);
    if (st === state && state.optimisticRevisions &&
        state.optimisticRevisions[i] === revision && !state.myAnswers[i]) {
      delete state.optimisticRevisions[i];
      state.myAnswers[i] = current;
      if (state.live.q === i) state.submitted = true;
      stRender();
      toast('다시 고르기 실패 — 다시 시도해 주세요');
    }
    return false;
  });
}

function stDeadlineTick() {
  if (!st || st.live.q < 0 || !st.live.openedAt || !st.live.limitSec) return;
  const t = stLeftRatio();
  if (!t || t.left > 0) return;
  const key = st.live.liveToken || (st.live.q + ':' + st.live.openedAt);
  if (st.deadlineHandled === key) return;
  st.deadlineHandled = key;
  if (!st.submitted && stHasDraftAnswer()) stSubmitCurrent('timer');
}

/* ══════════════════════════════════════════════════════════════════════
   8. ④ 실시간 결과 대시보드 (진행 교사용)
   ══════════════════════════════════════════════════════════════════════ */
let dash = null;

function screenDashboard(sessionId) {
  if (!sessionId) { go('home'); return; }
  dash = {
    sessionId: sessionId, session: null, set: null, flatQuestions: [],
    students: {}, responseDocs: {}, gradeDocs: {}, answers: {},
    sort: { key: 'no', dir: 1 },
    open: {}
  };
  const state = dash;
  onCleanup(() => { if (dash === state) dash = null; });

  APP().innerHTML = topbar() + '<div class="wrap wide"><div class="empty">불러오는 중…</div></div>';

  return store.getSession(sessionId).then(sess => {
    if (dash !== state) return;
    if (!sess) { APP().innerHTML = topbar() + '<div class="wrap"><div class="card"><div class="empty">반 정보를 찾을 수 없습니다.</div></div></div>'; return; }
    state.session = sess;
    const setLoad = store.getSessionQuizSet
      ? store.getSessionQuizSet(sess)
      : store.getQuizSet(sess.setId);
    return setLoad.then(savedSet => {
      if (dash !== state) return;
      state.set = normSet(savedSet) || { title: sess.setTitle || '', videos: [], settings: normSettings(null) };
      state.flatQuestions = PlaylistCore.flattenQuestions(state.set.videos);
      onCleanup(store.subscribeStudents(sessionId, students => {
        if (dash !== state) return;
        state.students = students || {};
        renderDash();
      }, e => { if (dash === state) console.error(e); }));
      onCleanup(store.subscribeResponses(sessionId, responseDocs => {
        if (dash !== state) return;
        state.responseDocs = responseDocs || {};
        state.answers = FirestoreCore.responseDocsToQuestionMaps(
          state.responseDocs, state.gradeDocs
        );
        renderDash();
      }, e => { if (dash === state) console.error(e); }));
      onCleanup(store.subscribeGrades(sessionId, gradeDocs => {
        if (dash !== state) return;
        state.gradeDocs = gradeDocs || {};
        state.answers = FirestoreCore.responseDocsToQuestionMaps(
          state.responseDocs, state.gradeDocs
        );
        renderDash();
      }, e => { if (dash === state) console.error(e); }));
    });
  }).catch(e => {
    if (dash !== state) return;
    console.error(e);
    APP().innerHTML = topbar() + '<div class="wrap"><div class="card"><div class="empty">불러오기 실패: ' + esc(e.message) + '</div></div></div>';
  });
}

/** 학생별 응답을 표로 쓰기 좋게 정리 */
function dashBuildRowsFor(flatQuestions, students, answers) {
  const qn = (flatQuestions || []).length;
  return Object.keys(students || {}).map(sid => {
    const s = students[sid];
    const cells = [];
    let correct = 0, answered = 0, msSum = 0, graded = 0, ungraded = 0;
    for (let i = 0; i < qn; i++) {
      const r = ((answers || {})[i] || {})[sid];
      cells.push(r || null);
      if (r) {
        answered++;
        msSum += (r.ms || 0);
        if (r.ok === true) { graded++; correct++; }
        else if (r.ok === false) graded++;
        else ungraded++;              // 서술형 채점 전
      }
    }
    return {
      sid: sid, grade: s.grade, klass: s.klass, num: s.num, name: s.name || '',
      cells: cells, correct: correct, answered: answered,
      graded: graded, ungraded: ungraded,
      rate: graded ? correct / graded : 0,
      avgMs: answered ? msSum / answered : 0
    };
  });
}

function dashBuildRows() {
  return dashBuildRowsFor(dash.flatQuestions, dash.students, dash.answers);
}

function dashSortBy(key) {
  if (!dash) return;
  if (dash.sort.key === key) dash.sort.dir *= -1;
  else dash.sort = { key: key, dir: 1 };
  renderDash();
}
function dashSortRows(rows) {
  const k = dash.sort.key, d = dash.sort.dir;
  rows.sort((a, b) => {
    let v = 0;
    if (k === 'no') v = (a.grade - b.grade) || (a.klass - b.klass) || (a.num - b.num);
    else if (k === 'name') v = String(a.name).localeCompare(String(b.name), 'ko');
    else if (k === 'correct') v = a.correct - b.correct;
    else if (k === 'rate') v = a.rate - b.rate;
    else if (k === 'speed') v = (a.avgMs || Infinity) - (b.avgMs || Infinity);
    return v * d;
  });
  return rows;
}

function renderDash() {
  if (!dash || !dash.set) return;
  const qs = dash.flatQuestions;
  const rows = dashSortRows(dashBuildRows());
  const nStu = rows.length;

  let totAns = 0, totCor = 0, totGraded = 0, totUngraded = 0;
  rows.forEach(r => { totAns += r.answered; totCor += r.correct; totGraded += r.graded; totUngraded += r.ungraded; });
  const overall = totGraded ? Math.round(totCor / totGraded * 100) : 0;
  const ended = dash.session.status === 'ended';
  const arrow = k => dash.sort.key === k ? (dash.sort.dir > 0 ? ' ▲' : ' ▼') : '';

  APP().innerHTML = topbar(
      '<a class="btn sm ghost" href="#/play/' + esc(dash.session.setId) + '">진행 화면</a>' +
      '<button class="btn sm" onclick="dashExportCSV()">CSV 내려받기</button>'
    ) +
    '<div class="wrap wide">' +
      '<h1 style="font-size:21px;margin-bottom:3px">' + esc(dash.set.title || dash.session.setTitle) + '</h1>' +
      '<p style="color:var(--ink-2);font-size:13.5px;margin-bottom:16px">' +
        '반 코드 <b class="mono">' + esc(dash.session.code) + '</b>' +
        (dash.session.label ? ' · ' + esc(dash.session.label) : '') +
        ' · ' + fmtDate(dash.session.createdAt) +
        ' · ' + (ended ? '<span class="tag mute">종료됨</span>' : '<span class="tag ok">진행 중</span>') +
      '</p>' +

      '<div class="stat-row">' +
        '<div class="stat"><div class="k">참여 학생</div><div class="v">' + nStu + '</div></div>' +
        '<div class="stat"><div class="k">문항 수</div><div class="v">' + qs.length + '</div></div>' +
        '<div class="stat"><div class="k">제출 응답</div><div class="v">' + totAns + '</div></div>' +
        '<div class="stat"><div class="k">전체 정답률</div><div class="v">' + overall + '%</div></div>' +
        (totUngraded ? '<div class="stat" style="border-color:#f0dcb4;background:var(--warn-bg)">' +
            '<div class="k" style="color:var(--warn)">채점 대기 (서술형)</div>' +
            '<div class="v" style="color:var(--warn)">' + totUngraded + '</div></div>' : '') +
      '</div>' +

      (totUngraded ? '<div class="notice">서술형 <b>' + totUngraded + '개</b>가 채점을 기다리고 있습니다. ' +
        '아래 문항별 응답에서 해당 문항을 펼쳐 <b>O / X</b>를 눌러 채점하세요. 채점하면 점수와 정답률에 바로 반영됩니다.</div>' : '') +

      '<div class="card">' +
        '<h2>문항별 응답</h2>' +
        '<div class="sub">막대를 눌러 펼치면 선택별 명단과 미응답자를 볼 수 있습니다. 서술형·단답형은 학생이 쓴 답이 그대로 나옵니다.</div>' +
        (qs.length ? qs.map((q, i) => dashQuestionBlock(q, i, rows)).join('') : '<div class="empty">문항이 없습니다.</div>') +
      '</div>' +

      '<div class="card">' +
        '<h2>학생별 결과</h2>' +
        '<div class="sub">머리글을 눌러 정렬합니다. 반응속도는 퀴즈가 뜬 뒤 답을 고르기까지 걸린 평균 시간입니다.</div>' +
        (nStu ? '<div class="tbl-scroll"><table class="tbl">' +
          '<thead><tr>' +
            '<th onclick="dashSortBy(\'no\')">학년-반-번호' + arrow('no') + '</th>' +
            '<th onclick="dashSortBy(\'name\')">이름' + arrow('name') + '</th>' +
            qs.map((q, i) => '<th class="ctr nosort" title="' + esc(q.text) + '">' + (i + 1) + '</th>').join('') +
            '<th class="ctr" onclick="dashSortBy(\'correct\')">정답' + arrow('correct') + '</th>' +
            '<th class="ctr" onclick="dashSortBy(\'rate\')">정답률' + arrow('rate') + '</th>' +
            '<th class="ctr" onclick="dashSortBy(\'speed\')">평균 반응' + arrow('speed') + '</th>' +
          '</tr></thead><tbody>' +
          rows.map(r => '<tr>' +
            '<td class="mono">' + r.grade + '-' + r.klass + '-' + r.num + '</td>' +
            '<td>' + esc(r.name) + '</td>' +
            r.cells.map(c => '<td class="ctr">' + (!c ? '<span class="ox-none">·</span>' :
              (c.ok === true ? '<span class="ox-o">O</span>'
               : c.ok === false ? '<span class="ox-x">X</span>'
               : '<span class="tag warn" style="font-size:10px;padding:1px 5px">미채점</span>')) + '</td>').join('') +
            '<td class="ctr">' + r.correct + ' / ' + r.graded +
              (r.ungraded ? ' <span style="color:var(--warn);font-size:11px">+' + r.ungraded + '</span>' : '') + '</td>' +
            '<td class="ctr">' + (r.graded ? Math.round(r.rate * 100) + '%' : '–') + '</td>' +
            '<td class="ctr">' + (r.answered ? (r.avgMs / 1000).toFixed(1) + '초' : '–') + '</td>' +
          '</tr>').join('') +
          '</tbody></table></div>'
          : '<div class="empty">아직 입장한 학생이 없습니다.</div>') +
      '</div>' +
    '</div>';
}

function dashQuestionBlock(q, i, rows) {
  const type = qType(q);
  const resp = dash.answers[i] || {};
  const keys = Object.keys(resp);
  const total = keys.length;
  const nGraded = keys.filter(k => resp[k].ok === true || resp[k].ok === false).length;
  const nCor = keys.filter(k => resp[k].ok === true).length;
  const nUngraded = total - nGraded;
  const rate = nGraded ? Math.round(nCor / nGraded * 100) : 0;
  const isOpen = !!dash.open[i];

  const missing = rows.filter(r => !resp[r.sid]);

  return '<div class="acc-item">' +
    '<div class="hd" onclick="dashToggle(' + i + ')">' +
      '<span class="tag mute mono">' + fmtTime(q.t) + '</span>' +
      (type !== 'choice' ? '<span class="tag qtype">' + QTYPES[type].split(' —')[0] + '</span>' : '') +
      '<span>' + (i + 1) + '. ' + esc(q.text) + '</span>' +
      '<span class="spacer"></span>' +
      '<span class="tag mute">' + total + '명</span>' +
      (nUngraded ? '<span class="tag warn">미채점 ' + nUngraded + '</span>' : '') +
      (nGraded ? '<span class="tag ' + (rate >= 70 ? 'ok' : rate >= 40 ? 'warn' : 'bad') + '">정답률 ' + rate + '%</span>' : '') +
      '<span style="color:var(--ink-3)">' + (isOpen ? '▲' : '▼') + '</span>' +
    '</div>' +
    (isOpen ? '<div class="bd">' +
      (isTextType(q) ? dashTextAnswers(q, i, rows, resp) : dashChoiceDist(q, i, rows, resp)) +
      (missing.length ? '<div style="margin-top:10px;font-size:12.5px;color:var(--warn)"><b>미응답 ' + missing.length + '명</b> — ' +
        missing.map(r => esc(r.name) + '(' + r.grade + '-' + r.klass + '-' + r.num + ')').join(', ') + '</div>' : '') +
      (q.explain ? '<div class="notice info" style="margin:12px 0 0">💡 ' + esc(q.explain) + '</div>' : '') +
    '</div>' : '') +
  '</div>';
}

/** 선택형 — 보기별 분포와 명단 */
function dashChoiceDist(q, i, rows, resp) {
  const type = qType(q);
  const total = Object.keys(resp).length;
  const counts = q.choices.map(() => 0);
  const byChoice = q.choices.map(() => []);
  rows.forEach(r => {
    const rr = resp[r.sid];
    if (!rr) return;
    const picks = (type === 'multi') ? parseMulti(rr.cs) : [Number(rr.c)];
    picks.forEach(j => { if (counts[j] !== undefined) { counts[j]++; byChoice[j].push(r); } });
  });
  const isAns = j => (type === 'multi') ? ((q.answers || []).indexOf(j) >= 0) : (j === Number(q.answer));

  return q.choices.map((c, j) => {
    const pct = total ? Math.round(counts[j] / total * 100) : 0;
    return '<div class="dist-row' + (isAns(j) ? ' is-ans' : '') + '">' +
      '<span class="lt">' + (type === 'ox' ? ['O', 'X'][j] : LETTERS[j]) + '</span>' +
      '<span class="txt" title="' + esc(c) + '">' + esc(c) + '</span>' +
      '<span class="track"><i style="width:' + pct + '%"></i></span>' +
      '<span class="n">' + counts[j] + '명 ' + pct + '%</span>' +
    '</div>' +
    (byChoice[j].length ? '<div style="font-size:12px;color:var(--ink-3);margin:-2px 0 8px 33px">' +
      byChoice[j].map(r => esc(r.name) + '(' + r.num + ')').join(', ') + '</div>' : '');
  }).join('');
}

/** 단답형·서술형 — 학생이 쓴 답을 그대로 보여주고, 서술형은 여기서 채점한다 */
function dashTextAnswers(q, i, rows, resp) {
  const answered = rows.filter(r => resp[r.sid]);
  if (!answered.length) return '<div class="empty">아직 제출한 학생이 없습니다.</div>';
  const needsGrading = (qType(q) === 'long');

  return (needsGrading
      ? '<div class="hint" style="margin-bottom:10px">각 답 오른쪽의 <b>O / X</b>를 눌러 채점하세요. 다시 누르면 미채점으로 되돌립니다.</div>'
      : '<div class="hint" style="margin-bottom:10px">인정 답안: ' + esc((q.accept || []).join(', ')) + '</div>') +
    answered.map(r => {
      const rr = resp[r.sid];
      const ok = rr.ok;
      return '<div class="txt-answer">' +
        '<div class="who">' +
          '<span>' + r.grade + '-' + r.klass + '-' + r.num + ' ' + esc(r.name) + '</span>' +
          (ok === true ? '<span class="tag ok">정답</span>' : ok === false ? '<span class="tag bad">오답</span>'
            : '<span class="tag warn">미채점</span>') +
          '<span class="spacer"></span>' +
          (needsGrading
            ? '<button class="btn sm" onclick="dashGrade(' + i + ',\'' + esc(r.sid) + '\',true)"' + (ok === true ? ' disabled' : '') + '>O</button>' +
              '<button class="btn sm" onclick="dashGrade(' + i + ',\'' + esc(r.sid) + '\',false)"' + (ok === false ? ' disabled' : '') + '>X</button>' +
              (ok === true || ok === false
                ? '<button class="btn sm ghost" onclick="dashGrade(' + i + ',\'' + esc(r.sid) + '\',null)">되돌리기</button>' : '')
            : '') +
        '</div>' +
        esc(rr.txt || '') +
      '</div>';
    }).join('');
}

/** 서술형 채점 — 교사가 O/X 를 누르면 그 응답의 ok 만 고쳐 쓴다 */
function dashGrade(qIdx, sid, ok) {
  if (!dash) return;
  const response = dash.answers && dash.answers[qIdx] && dash.answers[qIdx][sid];
  if (!response) return Promise.resolve(false);
  return store.gradeAnswer(dash.sessionId, sid, qIdx, response.revision, ok)
    .catch(e => { console.error(e); alert('채점 저장 실패: ' + e.message); });
}

function dashToggle(i) { dash.open[i] = !dash.open[i]; renderDash(); }

function dashCsvRows(set, students, responses, studentRows) {
  const flatQuestions = PlaylistCore.flattenQuestions((set && set.videos) || []);
  const rows = studentRows || dashBuildRowsFor(flatQuestions, students, responses);
  const head = ['학년', '반', '번호', '이름'];
  flatQuestions.forEach((q, i) => {
    const video = set.videos[q.videoIndex] || {};
    const defaultTitle = '영상 ' + (q.videoIndex + 1);
    const videoContext = video.title && video.title !== defaultTitle
      ? defaultTitle + ' (' + video.title + ')'
      : (video.title || defaultTitle);
    const prefix = videoContext + ' · 문항 ' + (q.number || i + 1);
    head.push(prefix + ' 답(' + QTYPES[qType(q)].split(' —')[0] + ')');
    head.push(prefix + ' 정오');
    head.push(prefix + ' 반응(초)');
  });
  head.push('정답 수', '채점된 수', '미채점', '응답 수', '정답률(%)', '평균 반응(초)');

  const out = [head];
  rows.forEach(r => {
    const line = [r.grade, r.klass, r.num, r.name];
    r.cells.forEach((c, i) => {
      line.push(c ? answerLabel(flatQuestions[i], c) : '');
      line.push(!c ? '미응답' : c.ok === true ? 'O' : c.ok === false ? 'X' : '미채점');
      line.push(c ? (c.ms / 1000).toFixed(1) : '');
    });
    line.push(r.correct, r.graded, r.ungraded, r.answered,
      r.graded ? Math.round(r.rate * 100) : '', r.answered ? (r.avgMs / 1000).toFixed(1) : '');
    out.push(line);
  });
  return out;
}

function dashExportCSV() {
  if (!dash) return;
  const rows = dashSortRows(dashBuildRows());
  const out = [
    ['퀴즈 세트', dash.set.title || dash.session.setTitle],
    ['반 코드', dash.session.code],
    ['반 이름', dash.session.label || ''],
    ['진행 일시', fmtDate(dash.session.createdAt)],
    []
  ];
  out.push.apply(out, dashCsvRows(dash.set, dash.students, dash.answers, rows));

  const safe = String(dash.set.title || '퀴즈').replace(/[\\/:*?\x22<>|]/g, '_').slice(0, 40);
  downloadCSV(safe + '_' + dash.session.code + '_' + fmtDay(dash.session.createdAt) + '.csv', out);
  toast('CSV를 내려받았습니다');
}

/* ══════════════════════════════════════════════════════════════════════
   9. ⑤ 관리자 통합 조회 화면
   ══════════════════════════════════════════════════════════════════════ */
let adm = null;

function admTeacherAccounts() {
  if (!AuthCore.isAdmin(teacherState)) return Promise.reject(new Error('관리자 권한이 필요합니다.'));
  const state = adm || (adm = { allowances: {} });
  state.loadingAllowances = true;
  return store.listTeacherAllowances(teacherState).then(items => {
    state.allowances = {};
    Object.entries(items || {}).forEach(([email, allowance]) => {
      const normalized = maintenanceCanonicalEmail(email);
      if (normalized) state.allowances[normalized] = allowance || {};
    });
    state.loadingAllowances = false;
    const rows = Object.entries(state.allowances).sort(([a], [b]) => a.localeCompare(b)).map(([email, allowance]) => {
      const uid = String(allowance.uid || '');
      const revision = Number(allowance.revision);
      const authoritative = allowance.migrated === true && uid && Number.isSafeInteger(revision) && revision > 0;
      const self = uid === teacherState.uid;
      const role = allowance.role === 'admin' ? 'admin' : 'teacher';
      const enabled = allowance.enabled === true;
      const locked = self || !authoritative;
      return '<div class="row" style="justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)" data-teacher-uid="' + esc(uid) + '" data-teacher-email="' + esc(email) + '" data-teacher-revision="' + (authoritative ? revision : '') + '">' +
        '<span><b>' + esc(email) + '</b> <span class="hint">' + (enabled ? '활성' : '비활성') +
        (authoritative ? ' · UID ' + esc(uid) + ' · revision ' + revision : ' · UID migration 필요') + '</span></span>' +
        '<span class="row" style="gap:6px"><select data-teacher-role="' + esc(email) + '"' + (self ? ' disabled' : '') + '>' +
          '<option value="teacher"' + (role === 'teacher' ? ' selected' : '') + '>teacher</option>' +
          '<option value="admin"' + (role === 'admin' ? ' selected' : '') + '>admin</option></select>' +
          '<button class="btn sm" data-teacher-save="1"' + (locked ? ' disabled title="UID migration 또는 현재 관리자 보호로 잠겼습니다."' : '') + '>저장</button>' +
          '<button class="btn sm danger" data-teacher-disable="1"' + (locked ? ' disabled title="UID migration 또는 현재 관리자 보호로 잠겼습니다."' : '') + '>비활성화</button></span></div>';
    }).join('');
    const maintenanceWarning = typeof trashMaintenance !== 'undefined' && trashMaintenance && trashMaintenance.warning
      ? '<div class="notice bad">휴지통 자동 정리 실패' + (trashMaintenance.failedSetId ? ' (' + esc(trashMaintenance.failedSetId) + ')' : '') + ': ' + esc(trashMaintenance.warning) + ' <button class="btn sm" onclick="runTrashMaintenancePage()">재시도</button></div>' : '';
    return '<div class="card"><h2>승인 교사 계정</h2><p class="sub">승인된 Google 계정만 교사 화면을 사용할 수 있습니다. 현재 관리자 계정은 자기 역할 하향·비활성화가 잠겨 있습니다.</p>' + maintenanceWarning +
      '<div class="notice info">신규 교사는 권한 신청 탭에서 정확한 Google UID 신청을 승인하세요. 이메일만으로 계정을 추가할 수 없습니다.</div>' +
      '<div id="adm-teacher-error" class="notice bad" style="display:none"></div><div id="adm-teacher-list">' + (rows || '<div class="empty">등록된 계정이 없습니다.</div>') + '</div></div>';
  }).catch(error => {
    state.loadingAllowances = false;
    throw error;
  });
}

function adminTeacherRequestScreenIsCurrent(state) {
  const route = typeof location === 'undefined' ? '#/admin' : String(location.hash || '');
  const body = typeof $ === 'function' ? $('#adm-body') : null;
  return adminTeacherRequestScreen === state && !!state && adm === state.adm &&
