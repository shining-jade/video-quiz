    teacherAuthVersion === state.authGeneration && !!teacherUser && teacherUser.uid === state.uid &&
    AuthCore.isAdmin(teacherState) && route === '#/admin' && adm.tab === 'requests' && state.body === body;
}

function renderAdminTeacherRequests() {
  if (!AuthCore.isAdmin(teacherState) || !adm || adm.tab !== 'requests') return false;
  const body = $('#adm-body');
  if (!body) return false;
  let state = adminTeacherRequestScreen;
  if (!adminTeacherRequestScreenIsCurrent(state)) {
    state = adminTeacherRequestScreen = {
      adm, body, uid: teacherUser && teacherUser.uid, authGeneration: teacherAuthVersion,
      requests: null, deletions: null, loading: false, inFlight: null, message: '', error: '', loadError: ''
    };
    if (typeof onCleanup === 'function') onCleanup(() => { if (adminTeacherRequestScreen === state) adminTeacherRequestScreen = null; });
  }
  if ((!state.requests || state.deletions === null) && !state.loading) {
    if (state.loadError) {
      body.innerHTML = '<div class="card"><div class="notice bad" role="alert">' + esc(state.loadError) + '</div>' +
        '<button class="btn" onclick="retryAdminTeacherRequests()">다시 시도</button></div>';
      return true;
    }
    state.loading = true;
    body.innerHTML = '<div class="empty">교사 권한 신청을 불러오는 중…</div>';
    const actor = Object.assign({}, teacherState, { authGeneration: state.authGeneration, currentAuthGeneration: teacherAuthVersion });
    Promise.all([
      store.listPendingTeacherRequests(50, actor),
      typeof store.listDeletionPendingTeachers === 'function'
        ? store.listDeletionPendingTeachers(50, actor) : Promise.resolve({})
    ]).then(([requests, deletions]) => {
      if (!adminTeacherRequestScreenIsCurrent(state)) return;
      state.loading = false;
      state.requests = requests || {};
      state.deletions = deletions || {};
      renderAdminTeacherRequests();
    }).catch(error => {
      if (!adminTeacherRequestScreenIsCurrent(state)) return;
      state.loading = false;
      state.loadError = error && error.message ? error.message : '신청 목록을 불러오지 못했습니다.';
      if (String(error && error.code || '').toLowerCase().indexOf('permission-denied') >= 0) {
        if (typeof retractProtectedTeacherScreen === 'function') retractProtectedTeacherScreen();
        if (typeof go === 'function') go('home');
        return;
      }
      renderAdminTeacherRequests();
    });
    return true;
  }
  if (state.loading) return true;
  const requests = Object.values(state.requests || {}).sort((a, b) =>
    String(a.displayName || '').localeCompare(String(b.displayName || '')));
  const status = state.error ? '<div class="notice bad" role="alert">' + esc(state.error) + '</div>' :
    state.message ? '<div class="notice ok" role="status">' + esc(state.message) + '</div>' : '';
  const rows = requests.map(request => {
    const uid = String(request.uid || '');
    const revision = Number(request.revision);
    const locked = !!state.inFlight;
    const callUid = esc(JSON.stringify(uid));
    const disabled = locked ? ' disabled' : '';
    return '<div class="card" data-admin-request-row="' + esc(uid) + '"><b>' + esc(request.displayName || '') + '</b>' +
      '<div class="hint">' + esc(request.emailCanonical || '') + '</div>' +
      (request.organization ? '<div class="sub">소속: ' + esc(request.organization) + '</div>' : '') +
      (request.note ? '<div class="sub">메모: ' + esc(request.note) + '</div>' : '') +
      '<label class="f">처리 사유 (선택)<input data-admin-request-reason maxlength="200"' + disabled + '></label>' +
      '<div class="row"><button class="btn primary" onclick="adminDecideTeacherRequest(' + callUid + ',' + revision + ',\'approved\',this)"' + disabled + '>승인</button>' +
      '<button class="btn danger" onclick="adminDecideTeacherRequest(' + callUid + ',' + revision + ',\'rejected\',this)"' + disabled + '>거절</button></div></div>';
  }).join('');
  const deletionRows = Object.values(state.deletions || {}).sort((a, b) =>
    String(a.displayName || '').localeCompare(String(b.displayName || ''))).map(allowance => {
    const uid = String(allowance.uid || '');
    const revision = Number(allowance.revision);
    const locked = !!state.inFlight;
    return '<div class="card" data-admin-deletion-row="' + esc(uid) + '"><b>' +
      esc(allowance.displayName || '') + '</b><div class="hint">' +
      esc(allowance.emailCanonical || '') + '</div><div class="sub">탈퇴 대기 revision ' +
      revision + (allowance.administrativeHold === true ? ' · 관리자 중지 유지' : '') + '</div>' +
      '<button class="btn" onclick="adminCancelTeacherDeletionRequest(' + esc(JSON.stringify(uid)) +
      ',' + revision + ',this)"' + (locked ? ' disabled' : '') + '>관리자 철회</button></div>';
  }).join('');
  body.innerHTML = '<div class="card"><h2>교사 권한 신청</h2><p class="sub">신청자의 이름·이메일·소속·메모는 승인 처리에만 사용합니다.</p>' + status +
    (rows || '<div class="empty">승인 대기 중인 신청이 없습니다.</div>') + '</div>' +
    '<div class="card"><h2>교사 탈퇴 대기</h2><p class="sub">30일 복구 기간 안에서만 정확한 UID와 revision으로 철회합니다. 별도 관리자 중지는 유지됩니다.</p>' +
    (deletionRows || '<div class="empty">탈퇴 대기 중인 교사가 없습니다.</div>') + '</div>';
  return true;
}

function adminCancelTeacherDeletionRequest(uid, revision) {
  const state = adminTeacherRequestScreen;
  if (!adminTeacherRequestScreenIsCurrent(state) || state.inFlight ||
      !Number.isSafeInteger(revision) || revision < 1 || !state.deletions ||
      !state.deletions[uid] || state.deletions[uid].uid !== uid ||
      state.deletions[uid].revision !== revision ||
      typeof store.adminCancelTeacherDeletion !== 'function') return Promise.resolve(false);
  state.inFlight = { uid, revision, action: 'cancel-deletion' };
  state.error = '';
  state.message = '';
  renderAdminTeacherRequests();
  const actor = Object.assign({}, teacherState, {
    authGeneration: state.authGeneration,
    currentAuthGeneration: teacherAuthVersion
  });
  return store.adminCancelTeacherDeletion(uid, revision, actor).then(result => {
    if (!adminTeacherRequestScreenIsCurrent(state)) return false;
    delete state.deletions[uid];
    state.inFlight = null;
    state.message = result && result.status === 'suspended'
      ? '탈퇴 요청을 철회했습니다. 별도 관리자 중지는 유지됩니다.'
      : '탈퇴 요청을 철회하고 교사 권한을 복구했습니다.';
    renderAdminTeacherRequests();
    return true;
  }).catch(error => {
    if (!adminTeacherRequestScreenIsCurrent(state)) return false;
    state.inFlight = null;
    state.error = error && error.message ? error.message : '탈퇴 요청을 철회하지 못했습니다.';
    renderAdminTeacherRequests();
    return false;
  });
}

function adminDecideTeacherRequest(uid, revision, decision, control) {
  const state = adminTeacherRequestScreen;
  if (!adminTeacherRequestScreenIsCurrent(state) || state.inFlight || !['approved', 'rejected'].includes(decision) ||
      !Number.isSafeInteger(revision) || revision < 1 || !state.requests || !state.requests[uid] ||
      state.requests[uid].revision !== revision) return Promise.resolve(false);
  const row = control && typeof control.closest === 'function' ? control.closest('[data-admin-request-row]') : null;
  const reasonInput = row && typeof row.querySelector === 'function' ? row.querySelector('[data-admin-request-reason]') : null;
  const reason = String(reasonInput && reasonInput.value || '').trim();
  if (reason.length > 200) {
    state.error = '처리 사유는 200자 이하여야 합니다.';
    renderAdminTeacherRequests();
    return Promise.resolve(false);
  }
  state.inFlight = { uid, revision }; state.error = ''; state.message = '';
  renderAdminTeacherRequests();
  const actor = Object.assign({}, teacherState, { authGeneration: state.authGeneration, currentAuthGeneration: teacherAuthVersion });
  return store.decideTeacherRequest(uid, revision, { status: decision, reason }, actor).then(async () => {
    if (!adminTeacherRequestScreenIsCurrent(state)) return false;
    delete state.requests[uid];
    state.inFlight = null;
    state.message = decision === 'approved' ? '교사 권한을 승인했습니다.' : '교사 권한 신청을 거절했습니다.';
    renderAdminTeacherRequests();
    return true;
  }).catch(error => {
    if (!adminTeacherRequestScreenIsCurrent(state)) return false;
    state.inFlight = null;
    state.error = error && error.message ? error.message : '신청 처리에 실패했습니다. 다시 시도해 주세요.';
    if (String(error && error.code || '').toLowerCase().indexOf('permission-denied') >= 0) {
      if (typeof retractProtectedTeacherScreen === 'function') retractProtectedTeacherScreen();
      if (typeof go === 'function') go('home');
      return false;
    }
    renderAdminTeacherRequests();
    return false;
  });
}

function retryAdminTeacherRequests() {
  const state = adminTeacherRequestScreen;
  if (!adminTeacherRequestScreenIsCurrent(state) || state.loading || state.inFlight) return false;
  state.loadError = '';
  state.error = '';
  state.requests = null;
  state.deletions = null;
  return renderAdminTeacherRequests();
}

async function admSaveTeacherAllowance(uid, email, revision, role, enabled) {
  if (!AuthCore.isAdmin(teacherState)) throw new Error('관리자 권한이 필요합니다.');
  if (typeof uid !== 'string' || !uid || uid.includes('/') || uid.length > 128) throw new Error('유효한 UID가 필요합니다.');
  const normalized = maintenanceCanonicalEmail(email);
  if (!normalized || !normalized.includes('@')) throw new Error('유효한 이메일을 입력해 주세요.');
  if (!Number.isSafeInteger(revision) || revision < 1) throw new Error('유효한 revision이 필요합니다.');
  const row = adm && adm.allowances && adm.allowances[normalized];
  if (!row || row.uid !== uid || row.emailCanonical !== normalized || row.revision !== revision) {
    throw new Error('계정 행의 UID/email/revision이 변경되었습니다.');
  }
  const self = uid === teacherState.uid;
  if (self && (enabled === false || role === 'teacher')) throw new Error('현재 관리자 계정은 자기 계정을 낮추거나 비활성화할 수 없습니다.');
  if (enabled === false && adm && adm.allowances && adm.allowances[normalized] && adm.allowances[normalized].role === 'admin' &&
      typeof confirm === 'function' && !confirm(normalized + ' 관리자 계정을 비활성화할까요?')) return false;
  const actor = Object.assign({}, teacherState, { authGeneration: teacherAuthVersion, currentAuthGeneration: teacherAuthVersion });
  if (!store.adminUpdateTeacherAllowance) throw new Error('authoritative allowance API를 사용할 수 없습니다.');
  await store.adminUpdateTeacherAllowance({
    uid, emailCanonical: normalized, expectedRevision: revision,
    role: role === 'admin' ? 'admin' : 'teacher',
    status: enabled === false ? 'suspended' : 'active',
    reason: enabled === false ? '관리자 UI 중지' : ''
  }, actor);
  await admTeacherAccounts();
  if (typeof admRenderBody === 'function') admRenderBody();
  return true;
}

/** 기간에 걸린 세션만 골라 응답을 불러온다 — 전체를 매번 읽지 않기 위해 */
function admLoad() {
  const state = adm;
  if (!state) return Promise.resolve();
  const generation = (Number(state.loadGeneration) || 0) + 1;
  state.loadGeneration = generation;
  const filter = {
    from: state.from, to: state.to,
    setFilter: state.setFilter || '',
    gradeFilter: state.gradeFilter || '',
    klassFilter: state.klassFilter || ''
  };
  const isCurrent = () => adm === state && state.loadGeneration === generation;
  const body = $('#adm-body');
  body.innerHTML = '<div class="empty">불러오는 중…</div>';
  state.loading = true;
  state.detail = null;
  state.displayedSessionIds = [];
  state.purgeSessionIds = [];
  state.purgeFilterSnapshot = null;
  state.rangeRejected = false;
  state.rejectedSessionCount = 0;

  const fromTs = filter.from ? new Date(filter.from + 'T00:00:00').getTime() : 0;
  const toTs = filter.to ? new Date(filter.to + 'T23:59:59').getTime() : Infinity;

  return store.listSessions().then(sessions => {
    if (!isCurrent()) return;
    const all = sessions || [];
    const picked = {};
    all.forEach(s => {
      const id = s.id;
      const ts = s.createdAt || 0;
      if (ts >= fromTs && ts <= toTs) picked[id] = s;
    });
    const ids = Object.keys(picked);
    if (ids.length > 300) {
      if (!isCurrent()) return;
      state.sessions = {};
      state.resp = {};
      state.displayedSessionIds = [];
      state.purgeSessionIds = [];
      state.purgeFilterSnapshot = Object.freeze(Object.assign({}, filter));
      state.displayedRange = { from: filter.from, to: filter.to };
      state.rangeRejected = true;
      state.rejectedSessionCount = ids.length;
      body.innerHTML = '<div class="card"><div class="notice">기간에 포함된 진행 기록이 ' + ids.length +
        '건입니다. 기간을 좁혀서 조회해 주세요.</div></div>';
      state.loading = false;
      return;
    }
    const nextSets = Object.assign({}, state.sets);
    const legacyLoads = {};
    const setLoads = ids.map(id => {
      const session = picked[id];
      const setId = session.setId;
      if (!setId) return Promise.resolve([id, null, false]);
      const hasSnapshot = Object.prototype.hasOwnProperty.call(session, 'snapshotVersion') &&
        store.getSessionQuizSet;
      if (hasSnapshot || (!store.getQuizSet && store.getSessionQuizSet)) {
        return store.getSessionQuizSet(session).then(rawSet => [id, rawSet, true]);
      }
      if (nextSets[setId]) return Promise.resolve([id, nextSets[setId].set, false]);
      if (!legacyLoads[setId]) legacyLoads[setId] = store.getQuizSet(setId);
      return legacyLoads[setId].then(rawSet => [id, rawSet, false]);
    }).map(load => load.then(([id, rawSet, snapshot]) => {
        const set = normSet(rawSet);
        return [id, {
          set: set,
          flatQuestions: PlaylistCore.flattenQuestions(set ? set.videos : [])
        }, snapshot];
      }));
    const sessionLoads = ids.map(id => Promise.all([
      store.getCollection('sessions/' + id + '/students'),
      store.getCollection('sessions/' + id + '/responses'),
      store.getCollection('sessions/' + id + '/grades')
    ]).then(([students, responseDocs, gradeDocs]) => [
      id,
      students || {},
      FirestoreCore.responseDocsToQuestionMaps(responseDocs || {}, gradeDocs || {})
    ]));
    return Promise.all([Promise.all(setLoads), Promise.all(sessionLoads)])
      .then(([sets, pairs]) => {
        if (!isCurrent()) return;
        sets.forEach(([id, cached, snapshot]) => {
          picked[id].flatQuestions = cached.flatQuestions;
          if (!snapshot && picked[id].setId) nextSets[picked[id].setId] = cached;
        });
        const nextResp = {};
        pairs.forEach(([id, students, responses]) => {
          picked[id].students = students;
          nextResp[id] = responses;
        });
        state.sessions = picked;
        state.sets = nextSets;
        state.resp = nextResp;
        state.displayedSessionIds = ids.slice();
        state.purgeSessionIds = Object.freeze(ids.filter(id =>
          !filter.setFilter || picked[id].setId === filter.setFilter
        ));
        state.purgeFilterSnapshot = Object.freeze(Object.assign({}, filter));
        state.displayedRange = { from: filter.from, to: filter.to };
        state.rangeRejected = false;
        state.rejectedSessionCount = 0;
        state.loading = false;
        admFillSetOptions();
        admRenderBody();
      });
  }).catch(e => {
    if (!isCurrent()) return;
    state.loading = false;
    state.sessions = {};
    state.resp = {};
    state.displayedSessionIds = [];
    state.purgeSessionIds = [];
    state.purgeFilterSnapshot = null;
    state.rangeRejected = false;
    state.rejectedSessionCount = 0;
    console.error(e);
    body.innerHTML = '<div class="card"><div class="empty">불러오기 실패: ' + esc(e.message) + '</div></div>';
  });
}

/** 필터를 적용한 세션 목록 + 학생 단위로 펼친 응답 레코드 */
function admCompute() {
  const g = adm.gradeFilter ? Number(adm.gradeFilter) : null;
  const k = adm.klassFilter ? Number(adm.klassFilter) : null;

  const sessions = Object.keys(adm.sessions)
    .filter(id => !adm.setFilter || adm.sessions[id].setId === adm.setFilter)
    .map(id => Object.assign({ id: id }, adm.sessions[id]))
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  // 학생 키(학년_반_번호) → 누적
  const students = {};
  const perSession = {};

  sessions.forEach(sess => {
    const studs = sess.students || {};
    const resp = adm.resp[sess.id] || {};
    const cachedSet = adm.sets[sess.setId];
    const flatQuestions = sess.flatQuestions || (cachedSet ? cachedSet.flatQuestions : []);
    let sAns = 0, sCor = 0, sStu = 0, sGraded = 0;

    Object.keys(studs).forEach(sid => {
      const s = studs[sid];
      if (g !== null && Number(s.grade) !== g) return;
      if (k !== null && Number(s.klass) !== k) return;
      sStu++;

      let answered = 0, correct = 0, graded = 0;
      flatQuestions.forEach((question, qi) => {
        const r = (resp[qi] || {})[sid];
        if (!r) return;
        answered++;
        // 서술형 미채점(ok 없음)은 정답률 계산에서 뺀다
        if (r.ok === true) { graded++; correct++; }
        else if (r.ok === false) graded++;
      });
      sAns += answered; sCor += correct; sGraded += graded;

      const key = sid;
      if (!students[key]) {
        students[key] = {
          key: key, grade: Number(s.grade), klass: Number(s.klass), num: Number(s.num),
          name: s.name || '', names: {}, lastAt: 0,
          sessions: [], answered: 0, correct: 0, graded: 0
        };
      }
      const rec = students[key];
      rec.names[s.name || ''] = (rec.names[s.name || ''] || 0) + 1;
      if ((sess.createdAt || 0) >= rec.lastAt) { rec.lastAt = sess.createdAt || 0; rec.name = s.name || rec.name; }
      rec.answered += answered;
      rec.correct += correct;
      rec.graded += graded;
      rec.sessions.push({
        id: sess.id, title: sess.setTitle || '', code: sess.code, label: sess.label || '',
        at: sess.createdAt || 0, answered: answered, correct: correct, graded: graded
      });
    });

    perSession[sess.id] = { students: sStu, answered: sAns, correct: sCor, graded: sGraded };
  });

  return { sessions: sessions, students: students, perSession: perSession };
}

function admRenderBody() {
  const body = $('#adm-body');
  if (!body || adm.loading) return;
  if (adm.tab === 'accounts') { admAccountsView(); return; }
  if (adm.tab === 'requests') { renderAdminTeacherRequests(); return; }
  if (adm.rangeRejected) {
    adm.displayedSessionIds = [];
    body.innerHTML = '<div class="card"><div class="notice">기간에 포함된 진행 기록이 ' +
      (Number(adm.rejectedSessionCount) || 0) +
      '건입니다. 기간을 좁혀서 조회해 주세요.</div></div>';
    return;
  }
  const data = admCompute();
  adm.displayedSessionIds = data.sessions.map(session => session.id);

  if (adm.detail) { body.innerHTML = admStudentDetail(data, adm.detail); return; }
  if (adm.tab === 'manage')  { body.innerHTML = admManage(data); return; }
  if (adm.tab === 'students'){ body.innerHTML = admStudentsView(data); return; }
  if (adm.tab === 'classes') { body.innerHTML = admClassesView(data); return; }
  body.innerHTML = admSessionsView(data);
}

function admSessionsView(d) {
  if (!d.sessions.length) return '<div class="card"><div class="empty">해당 기간에 진행 기록이 없습니다.</div></div>';
  let tS = 0, tA = 0, tC = 0, tG = 0;
  d.sessions.forEach(s => { const p = d.perSession[s.id]; tS += p.students; tA += p.answered; tC += p.correct; tG += p.graded; });

  return '<div class="stat-row">' +
      '<div class="stat"><div class="k">진행 반 수</div><div class="v">' + d.sessions.length + '</div></div>' +
      '<div class="stat"><div class="k">연인원</div><div class="v">' + tS + '</div></div>' +
      '<div class="stat"><div class="k">제출 응답</div><div class="v">' + tA + '</div></div>' +
      '<div class="stat"><div class="k">전체 정답률</div><div class="v">' + (tG ? Math.round(tC / tG * 100) : 0) + '%</div></div>' +
      (tA > tG ? '<div class="stat"><div class="k">채점 대기</div><div class="v">' + (tA - tG) + '</div></div>' : '') +
    '</div>' +
    '<div class="card"><h2>진행 기록</h2>' +
      '<div class="sub">최근 순입니다. 반 코드를 누르면 그 반의 대시보드로 갑니다.</div>' +
      '<div class="tbl-scroll"><table class="tbl"><thead><tr>' +
        '<th class="nosort">일시</th><th class="nosort">퀴즈 세트</th><th class="nosort">반 이름</th>' +
        '<th class="nosort">코드</th><th class="nosort ctr">학생</th><th class="nosort ctr">응답</th>' +
        '<th class="nosort ctr">정답률</th><th class="nosort ctr">상태</th>' +
      '</tr></thead><tbody>' +
      d.sessions.map(s => {
        const p = d.perSession[s.id];
        return '<tr>' +
          '<td>' + fmtDate(s.createdAt) + '</td>' +
          '<td>' + esc(s.setTitle || '') + '</td>' +
          '<td>' + esc(s.label || '') + '</td>' +
          '<td><a class="mono" href="#/live/' + esc(s.id) + '">' + esc(s.code || '') + '</a></td>' +
          '<td class="ctr">' + p.students + '</td>' +
          '<td class="ctr">' + p.answered + '</td>' +
          '<td class="ctr">' + (p.graded ? Math.round(p.correct / p.graded * 100) + '%' : '–') + '</td>' +
          '<td class="ctr">' + (s.status === 'ended' ? '<span class="tag mute">종료</span>' : '<span class="tag ok">진행</span>') + '</td>' +
        '</tr>';
      }).join('') +
      '</tbody></table></div>' +
      '<div style="margin-top:12px"><button class="btn sm" onclick="admExportSessions()">CSV 내려받기</button></div>' +
    '</div>';
}

function admStudentList(d) {
  return Object.keys(d.students).map(k => d.students[k])
    .sort((a, b) => (a.grade - b.grade) || (a.klass - b.klass) || (a.num - b.num));
}

function admStudentsView(d) {
  const list = admStudentList(d);
  if (!list.length) return '<div class="card"><div class="empty">해당 조건의 학생 기록이 없습니다.</div></div>';
  return '<div class="card"><h2>학생별 누적</h2>' +
    '<div class="sub">여러 반·여러 세트에 걸친 응답을 학년·반·번호 기준으로 합산했습니다. 이름을 누르면 개인 이력이 열립니다.</div>' +
    '<div class="tbl-scroll"><table class="tbl"><thead><tr>' +
      '<th class="nosort">학년</th><th class="nosort">반</th><th class="nosort">번호</th><th class="nosort">이름</th>' +
      '<th class="nosort ctr">참여 횟수</th><th class="nosort ctr">응답</th><th class="nosort ctr">정답</th><th class="nosort ctr">정답률</th>' +
    '</tr></thead><tbody>' +
    list.map(s => {
      const alias = Object.keys(s.names).filter(n => n && n !== s.name);
      return '<tr>' +
        '<td>' + s.grade + '</td><td>' + s.klass + '</td><td>' + s.num + '</td>' +
        '<td><a href="javascript:void(0)" onclick="admOpenStudent(\'' + esc(s.key) + '\')">' + esc(s.name) + '</a>' +
          (alias.length ? ' <span class="tag warn" title="다른 이름으로도 입력된 적이 있습니다">' + esc(alias.join(', ')) + '</span>' : '') + '</td>' +
        '<td class="ctr">' + s.sessions.length + '</td>' +
        '<td class="ctr">' + s.answered + '</td>' +
        '<td class="ctr">' + s.correct + '</td>' +
        '<td class="ctr">' + (s.graded ? Math.round(s.correct / s.graded * 100) + '%' : '–') + '</td>' +
      '</tr>';
    }).join('') +
    '</tbody></table></div>' +
    '<div style="margin-top:12px"><button class="btn sm" onclick="admExportStudents()">CSV 내려받기</button></div>' +
  '</div>';
}

function admOpenStudent(key) { adm.detail = key; admRenderBody(); }
function admCloseStudent() { adm.detail = null; admRenderBody(); }

function admStudentDetail(d, key) {
  const s = d.students[key];
  if (!s) return '<div class="card"><div class="empty">기록이 없습니다. <button class="btn sm" onclick="admCloseStudent()">돌아가기</button></div></div>';
  const list = s.sessions.slice().sort((a, b) => b.at - a.at);
  return '<div class="card">' +
    '<div class="row" style="align-items:center;margin-bottom:10px">' +
      '<button class="btn sm ghost" onclick="admCloseStudent()">← 목록</button>' +
      '<h2 style="font-size:18px">' + s.grade + '학년 ' + s.klass + '반 ' + s.num + '번 ' + esc(s.name) + '</h2>' +
    '</div>' +
    '<div class="stat-row">' +
      '<div class="stat"><div class="k">참여 횟수</div><div class="v">' + list.length + '</div></div>' +
      '<div class="stat"><div class="k">총 응답</div><div class="v">' + s.answered + '</div></div>' +
      '<div class="stat"><div class="k">정답</div><div class="v">' + s.correct + '</div></div>' +
      '<div class="stat"><div class="k">누적 정답률</div><div class="v">' + (s.graded ? Math.round(s.correct / s.graded * 100) : 0) + '%</div></div>' +
    '</div>' +
    '<div class="tbl-scroll"><table class="tbl"><thead><tr>' +
      '<th class="nosort">일시</th><th class="nosort">퀴즈 세트</th><th class="nosort">반</th>' +
      '<th class="nosort ctr">정답 / 응답</th><th class="nosort ctr">정답률</th><th class="nosort"></th>' +
    '</tr></thead><tbody>' +
    list.map(r => '<tr>' +
      '<td>' + fmtDate(r.at) + '</td>' +
      '<td>' + esc(r.title) + '</td>' +
      '<td>' + esc(r.label || r.code) + '</td>' +
      '<td class="ctr">' + r.correct + ' / ' + r.answered + '</td>' +
      '<td class="ctr">' + (r.graded ? Math.round(r.correct / r.graded * 100) + '%' : '–') + '</td>' +
      '<td><a class="btn sm ghost" href="#/live/' + esc(r.id) + '">대시보드</a></td>' +
    '</tr>').join('') +
    '</tbody></table></div>' +
  '</div>';
}

function admClassesView(d) {
  const list = admStudentList(d);
  if (!list.length) return '<div class="card"><div class="empty">해당 조건의 기록이 없습니다.</div></div>';
  const agg = {};
  list.forEach(s => {
    const k = s.grade + '-' + s.klass;
    if (!agg[k]) agg[k] = { grade: s.grade, klass: s.klass, students: 0, answered: 0, correct: 0, graded: 0 };
    agg[k].students++;
    agg[k].answered += s.answered;
    agg[k].correct += s.correct; agg[k].graded += s.graded;
  });
  const rows = Object.keys(agg).map(k => agg[k]).sort((a, b) => (a.grade - b.grade) || (a.klass - b.klass));

  return '<div class="card"><h2>학년·반 집계</h2>' +
    '<div class="sub">기간 내 응답 전체를 학급 단위로 합산했습니다.</div>' +
    '<div class="tbl-scroll"><table class="tbl"><thead><tr>' +
      '<th class="nosort">학년</th><th class="nosort">반</th><th class="nosort ctr">참여 학생</th>' +
      '<th class="nosort ctr">응답</th><th class="nosort ctr">정답</th><th class="nosort ctr">정답률</th><th class="nosort">분포</th>' +
    '</tr></thead><tbody>' +
    rows.map(r => {
      const pct = r.graded ? Math.round(r.correct / r.graded * 100) : 0;
      return '<tr>' +
        '<td>' + r.grade + '</td><td>' + r.klass + '</td>' +
        '<td class="ctr">' + r.students + '</td>' +
        '<td class="ctr">' + r.answered + '</td>' +
        '<td class="ctr">' + r.correct + '</td>' +
        '<td class="ctr">' + pct + '%</td>' +
        '<td style="min-width:160px"><span class="track" style="display:block;height:14px;background:#eceef4;border-radius:4px;overflow:hidden">' +
          '<i style="display:block;height:100%;width:' + pct + '%;background:var(--accent)"></i></span></td>' +
      '</tr>';
    }).join('') +
    '</tbody></table></div></div>';
}

function admPurgeFilterChanged() {
  const accepted = adm && adm.purgeFilterSnapshot;
  if (!accepted) return true;
  return ['from', 'to', 'setFilter', 'gradeFilter', 'klassFilter'].some(key =>
    String(adm[key] || '') !== String(accepted[key] || '')
  );
}

function admManage(d) {
  const displayedIds = (adm.purgeSessionIds || []).slice();
  const displayedRange = adm.displayedRange || { from: adm.from, to: adm.to };
  const purgeDisabled = admPurgeFilterChanged();
  return '<div class="card">' +
      '<h2>기간 지정 삭제</h2>' +
      '<div class="sub">학교 개인정보 보관 기준에 따라 오래된 기록을 지웁니다. 되돌릴 수 없습니다.</div>' +
      '<div class="notice">현재 게시된 조회 결과(' + esc(displayedRange.from) + ' ~ ' + esc(displayedRange.to) + ')의 <b>' +
        displayedIds.length + '개 진행 기록</b>과 그 안의 모든 학생 응답이 함께 삭제됩니다. ' +
        '퀴즈 세트 자체는 지워지지 않습니다.</div>' +
      (purgeDisabled ? '<div class="notice">필터가 변경되었습니다. 다시 조회하여 삭제 대상을 확정해 주세요.</div>' : '') +
      '<button class="btn danger" onclick="admPurge()"' + (purgeDisabled ? ' disabled' : '') + '>이 기간 기록 삭제</button>' +
    '</div>' +
    '<div class="card">' +
      '<h2>안내</h2>' +
      '<div style="font-size:13.5px;color:var(--ink-2);line-height:1.9">' +
        '· 이 화면은 학생 개인정보(학년·반·번호·이름)를 다룹니다. 공용 PC에서는 반드시 로그아웃하세요.<br>' +
        '· 관리자 권한은 검증된 Google 계정과 비공개 승인 목록, Firestore 규칙으로 확인합니다.<br>' +
        '· 세션·응답은 Cloud Firestore의 <span class="mono">sessions/</span> 컬렉션에 저장됩니다.' +
      '</div>' +
    '</div>';
}

function admPurge() {
  if (admPurgeFilterChanged()) {
    alert('필터가 변경되었습니다. 다시 조회하여 삭제 대상을 확정해 주세요.');
    return;
  }
  const sessionIds = Array.isArray(adm.purgeSessionIds)
    ? adm.purgeSessionIds.slice()
    : [];
  const range = adm.displayedRange || { from: adm.from, to: adm.to };
  if (!sessionIds.length) { alert('삭제할 기록이 없습니다.'); return; }
  const msg = range.from + ' ~ ' + range.to + ' 기간의 진행 기록 ' + sessionIds.length + '건과 모든 학생 응답을 영구 삭제합니다.\n되돌릴 수 없습니다. 계속하려면 아래에 삭제 를 입력하세요.';
  const typed = prompt(msg, '');
  if (typed === null) return;
  if (typed.trim() !== '삭제') { alert('취소되었습니다.'); return; }

  return store.purgeSessions(sessionIds).then(() => {
    toast(sessionIds.length + '건을 삭제했습니다');
    admLoad();
  }).catch(e => alert('삭제 실패: ' + e.message));
}

function admExportSessions() {
  const d = admCompute();
  const out = [['진행 일시', '퀴즈 세트', '반 이름', '반 코드', '참여 학생', '제출 응답', '정답 수', '정답률(%)', '상태']];
  d.sessions.forEach(s => {
    const p = d.perSession[s.id];
    out.push([fmtDate(s.createdAt), s.setTitle || '', s.label || '', s.code || '',
      p.students, p.answered, p.correct, p.graded ? Math.round(p.correct / p.graded * 100) : '',
      s.status === 'ended' ? '종료' : '진행']);
  });
  downloadCSV('영상퀴즈_진행기록_' + adm.from + '_' + adm.to + '.csv', out);
}

function admExportStudents() {
  const d = admCompute();
  const out = [['학년', '반', '번호', '이름', '참여 횟수', '제출 응답', '정답 수', '정답률(%)']];
  admStudentList(d).forEach(s => {
    out.push([s.grade, s.klass, s.num, s.name, s.sessions.length, s.answered, s.correct,
      s.graded ? Math.round(s.correct / s.graded * 100) : '']);
  });
  downloadCSV('영상퀴즈_학생별누적_' + adm.from + '_' + adm.to + '.csv', out);
}

/* ══════════════════════════════════════════════════════════════════════
   부팅 — Google 교사 인증 상태 확인 후 라우팅

   교사 화면은 현재 Firebase 인증 상태와 비공개 승인 문서를 확인합니다.
   학생 익명 계정은 반 코드 참여 흐름에서만 필요할 때 발급합니다.
   ══════════════════════════════════════════════════════════════════════ */
function bootWithAuth() {
  APP().innerHTML = topbar() + '<div class="wrap"><div class="empty">연결 중…</div></div>';
  firebase.auth().onAuthStateChanged(async user => {
    const applied = await applyTeacherUser(user);
    if (!applied) return;
    if (!authReady) {
      authReady = true;
      router();
    }
  });
}
bootWithAuth();
</script>
</body>
</html>
