<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>영상 퀴즈 — 실시간 진행 도구</title>
<style>
/* ══════════════════════════════════════════════════════════
   기본 / 토큰
   ══════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
:root {
  --bg:        #f4f5f8;
  --panel:     #ffffff;
  --line:      #e2e5ec;
  --line-2:    #cfd4de;
  --ink:       #1c2030;
  --ink-2:     #5a6276;
  --ink-3:     #8b93a5;
  --accent:    #4338ca;
  --accent-2:  #eef0ff;
  --ok:        #0f8a4d;
  --ok-bg:     #e6f6ed;
  --bad:       #c62828;
  --bad-bg:    #fdeaea;
  --warn:      #b26a00;
  --warn-bg:   #fff4e0;
  --radius:    12px;
  --shadow:    0 1px 2px rgba(20,25,45,.06), 0 6px 20px rgba(20,25,45,.07);
}
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI",
               "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -.02em; }
p { margin: 0 0 .6em; }
a { color: var(--accent); }

/* ══════════════════════════════════════════════════════════
   레이아웃
   ══════════════════════════════════════════════════════════ */
.wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 80px; }
.wrap.wide { max-width: 1400px; }
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; background: var(--panel);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 50;
}
.topbar .brand {
  font-weight: 800; font-size: 15px; letter-spacing: -.03em;
  color: var(--ink); text-decoration: none; white-space: nowrap;
}
.topbar .brand span { color: var(--accent); }
.topbar .spacer { flex: 1; }
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.card > h2 { font-size: 17px; margin-bottom: 4px; }
.card > .sub { color: var(--ink-2); font-size: 13px; margin-bottom: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { min-width: 0; }
.col { flex: 1 1 220px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }

/* ══════════════════════════════════════════════════════════
   폼
   ══════════════════════════════════════════════════════════ */
label.f { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; }
input[type=text], input[type=number], input[type=password], input[type=date], select, textarea {
  width: 100%; padding: 10px 12px; font: inherit; font-size: 15px;
  border: 1px solid var(--line-2); border-radius: 9px;
  background: #fff; color: var(--ink); outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-2); }
textarea { resize: vertical; min-height: 62px; }
.field { margin-bottom: 14px; }
.hint { font-size: 12px; color: var(--ink-3); margin-top: 5px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 16px; font: inherit; font-size: 14px; font-weight: 600;
  border: 1px solid var(--line-2); border-radius: 9px;
  background: #fff; color: var(--ink); cursor: pointer;
  transition: background .12s, border-color .12s;
}
.btn:hover { background: #f7f8fb; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #372cb0; }
.btn.danger { color: var(--bad); border-color: #f0c5c5; }
.btn.danger:hover { background: var(--bad-bg); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: #eceef4; }
.btn.sm { padding: 6px 11px; font-size: 13px; }
.btn.lg { padding: 15px 28px; font-size: 17px; border-radius: 11px; }
.btn.block { width: 100%; }

/* ══════════════════════════════════════════════════════════
   공용 조각
   ══════════════════════════════════════════════════════════ */
.tag {
  display: inline-block; padding: 2px 9px; border-radius: 999px;
  font-size: 12px; font-weight: 700; background: var(--accent-2); color: var(--accent);
}
.tag.ok   { background: var(--ok-bg);   color: var(--ok); }
.tag.bad  { background: var(--bad-bg);  color: var(--bad); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.mute { background: #eceef4; color: var(--ink-2); }
.empty { text-align: center; color: var(--ink-3); padding: 36px 16px; font-size: 14px; }
.notice {
  background: var(--warn-bg); border: 1px solid #f0dcb4; color: #7a4a00;
  border-radius: 10px; padding: 12px 14px; font-size: 13px; margin-bottom: 16px;
}
.notice.info { background: var(--accent-2); border-color: #d4d8ff; color: #2f2a86; }
.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }

#toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
  background: #1c2030; color: #fff; padding: 11px 20px; border-radius: 999px;
  font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .18s; z-index: 9999; max-width: 90vw;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

#conn-banner {
  position: fixed; left: 0; right: 0; top: 0; z-index: 9998;
  background: #b3261e; color: #fff; padding: 10px 16px;
  font-size: 13.5px; line-height: 1.5; text-align: center;
}

/* ══════════════════════════════════════════════════════════
   홈
   ══════════════════════════════════════════════════════════ */
.home-hero { text-align: center; padding: 44px 0 30px; }
.home-hero h1 { font-size: 30px; margin-bottom: 8px; }
.home-hero p { color: var(--ink-2); font-size: 15px; }
.home-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.home-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 22px; text-decoration: none; color: inherit; display: block;
  box-shadow: var(--shadow); transition: transform .12s, border-color .12s;
}
.home-card:hover { transform: translateY(-2px); border-color: var(--accent); }
.home-card .ico { font-size: 26px; margin-bottom: 10px; }
.home-card h3 { font-size: 16px; margin-bottom: 5px; }
.home-card p { font-size: 13px; color: var(--ink-2); margin: 0; }

/* ══════════════════════════════════════════════════════════
   세트 제작
   ══════════════════════════════════════════════════════════ */
.q-card {
  border: 1px solid var(--line); border-radius: 11px; padding: 15px;
  margin-bottom: 12px; background: #fbfbfd;
}
.q-card .q-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.q-card .q-no {
  width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff;
  display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none;
}
.q-card .q-head .spacer { flex: 1; }
.choice-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.choice-row input[type=radio] { width: 20px; height: 20px; flex: none; accent-color: var(--accent); }
.choice-row .cno { width: 20px; text-align: center; color: var(--ink-3); font-size: 13px; font-weight: 700; flex: none; }
.choice-row .btn { flex: none; }
.time-input { width: 110px !important; }

/* 숫자 칸 옆에 단위를 붙여 초/분 헷갈리지 않게 */
.unit-wrap { display: flex; align-items: center; gap: 7px; }
.unit-wrap input { flex: 1; min-width: 0; }
.unit-wrap .unit { flex: none; font-size: 14px; font-weight: 700; color: var(--ink-2); }

/* 문항 이미지 */
.img-box { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.img-box img { max-width: 240px; max-height: 150px; border-radius: 8px; border: 1px solid var(--line); display: block; }
.img-box .img-bad { color: var(--bad); font-size: 13px; }
.q-img { max-width: 100%; max-height: 260px; border-radius: 10px; display: block; margin: 0 auto 14px; }
#overlay .q-img { max-height: 34vh; margin-bottom: 18px; }
.stu-q-img { max-width: 100%; max-height: 220px; border-radius: 10px; display: block; margin: 0 auto 14px; }

/* 학생 입력형 문항 */
.stu-text-input { width: 100%; font-size: 17px; padding: 14px; }
.stu-answer-box {
  background: var(--accent-2); border: 1px solid #d4d8ff; border-radius: 10px;
  padding: 12px 14px; font-size: 15px; margin-bottom: 12px; word-break: break-word; white-space: pre-wrap;
}
.txt-answer {
  background: #fbfbfd; border: 1px solid var(--line); border-radius: 9px;
  padding: 9px 12px; margin-bottom: 7px; font-size: 13.5px; white-space: pre-wrap; word-break: break-word;
}
.txt-answer .who { font-weight: 700; color: var(--ink-2); font-size: 12.5px; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
.txt-answer .who .spacer { flex: 1; }
.tag.qtype { background: #eef6ff; color: #1d4ed8; }

/* ── 실시간 순위표 ─────────────────────────────────────────────────── */
.rank-row {
  display: flex; align-items: center; gap: 9px; padding: 5px 7px;
  border-radius: 7px; font-size: 13px;
}
.rank-row + .rank-row { margin-top: 2px; }
.rank-row .rk {
  width: 22px; height: 22px; border-radius: 6px; background: #eceef4; color: var(--ink-2);
  display: grid; place-items: center; font-size: 11px; font-weight: 800; flex: none;
}
.rank-row.top1 .rk { background: #f5c518; color: #4a3600; }
.rank-row.top2 .rk { background: #cfd4de; color: #3a3f4c; }
.rank-row.top3 .rk { background: #e0a06a; color: #4a2a00; }
.rank-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-row .sc { font-weight: 800; color: var(--accent); flex: none; font-variant-numeric: tabular-nums; }
.rank-row .prog { flex: none; font-size: 11px; color: var(--ink-3); }

#board-overlay {
  position: fixed; inset: 0; background: #12162a; z-index: 300;
  padding: 28px; overflow-y: auto;
}
#board-overlay .bo-inner { max-width: 1100px; margin: 0 auto; color: #fff; }
#board-overlay h2 { font-size: clamp(24px, 3.2vw, 40px); margin-bottom: 6px; }
#board-overlay .bo-sub { color: rgba(255,255,255,.6); font-size: 15px; margin-bottom: 22px; }
#board-overlay .bo-list { display: grid; gap: 8px; }
#board-overlay .bo-row {
  display: flex; align-items: center; gap: 16px;
  padding: 12px 18px; border-radius: 12px; background: rgba(255,255,255,.07);
  font-size: clamp(16px, 1.9vw, 24px); font-weight: 700;
}
#board-overlay .bo-row .rk {
  width: 44px; height: 44px; border-radius: 11px; background: rgba(255,255,255,.14);
  display: grid; place-items: center; font-size: 19px; font-weight: 800; flex: none;
}
#board-overlay .bo-row.top1 { background: rgba(245,197,24,.2); }
#board-overlay .bo-row.top1 .rk { background: #f5c518; color: #4a3600; }
#board-overlay .bo-row.top2 .rk { background: #cfd4de; color: #3a3f4c; }
#board-overlay .bo-row.top3 .rk { background: #e0a06a; color: #4a2a00; }
#board-overlay .bo-row .who { flex: 1; }
#board-overlay .bo-row .no { font-size: .7em; opacity: .6; font-weight: 600; margin-right: 8px; }
#board-overlay .bo-row .sc { flex: none; }
#board-overlay .bo-row .sc small { opacity: .55; font-size: .6em; font-weight: 600; }

/* 학생 개인 진행 현황 */
.stu-mystat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0 4px; }
.stu-mystat .box {
  background: #fff; border: 1px solid var(--line); border-radius: 11px; padding: 11px 8px; text-align: center;
}
.stu-mystat .box .k { font-size: 11.5px; color: var(--ink-2); font-weight: 600; }
.stu-mystat .box .v { font-size: 24px; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; }
.stu-mystat .box .v small { font-size: 13px; font-weight: 700; color: var(--ink-3); }
.stu-mystat .box.ok .v { color: var(--ok); }
.stu-mystat .box.rank .v { color: var(--accent); }

/* 제작 화면 — 영상은 왼쪽에 고정해 두고 문항은 오른쪽에서 편집한다.
   영상을 보며 문항을 만드는 흐름이라 스크롤해도 영상이 따라와야 한다. */
.mk-layout {
  display: grid;
  grid-template-columns: var(--mk-left-w, 480px) 14px minmax(0, 1fr);
  gap: 0; align-items: start;
}
.mk-left { position: sticky; top: 68px; }

/* 가운데 경계 — 끌어서 영상/문항 폭을 조절한다 */
.mk-resizer { align-self: stretch; min-height: 240px; cursor: col-resize; position: relative; }
.mk-resizer::before {
  content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 3px;
  transform: translateX(-50%); background: var(--line); border-radius: 3px;
  transition: background .12s, width .12s;
}
.mk-resizer::after {
  content: '⋮'; position: absolute; left: 50%; top: 90px; transform: translateX(-50%);
  color: var(--ink-3); font-size: 15px; line-height: 1; letter-spacing: -1px;
  background: var(--bg); padding: 5px 1px; border-radius: 4px;
}
.mk-resizer:hover::before, .mk-resizer.dragging::before { background: var(--accent); width: 5px; }
/* 드래그 중에는 유튜브 iframe 이 마우스를 먹어 버리므로 덮개를 깐다 */
#mk-dragshield { position: fixed; inset: 0; z-index: 999; cursor: col-resize; }

@media (max-width: 1080px) {
  .mk-layout { grid-template-columns: 1fr; }
  .mk-left { position: static; }
  .mk-resizer { display: none; }
}

/* 문항 목차 — 문항이 많아지면 스크롤로 오가기 번거로워 영상 아래에 붙인다 */
#mk-nav {
  margin-top: 14px; max-height: 44vh;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden;
}
#mk-nav .hd {
  padding: 9px 12px; font-size: 12px; font-weight: 700; color: var(--ink-2);
  border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 6px;
}
#mk-nav .hd .spacer { flex: 1; }
#mk-nav .bd { overflow-y: auto; padding: 6px; }
#mk-nav .ft { padding: 7px; border-top: 1px solid var(--line); }
#mk-nav .it {
  display: flex; align-items: center; gap: 6px; padding: 6px 7px;
  border-radius: 7px; cursor: pointer; font-size: 12px;
}
#mk-nav .it:hover { background: #f2f3f8; }
#mk-nav .it .n {
  width: 19px; height: 19px; border-radius: 5px; background: var(--accent); color: #fff;
  display: grid; place-items: center; font-size: 10px; font-weight: 700; flex: none;
}
#mk-nav .it .t { font-family: ui-monospace, Consolas, monospace; color: var(--accent); font-weight: 700; flex: none; font-size: 11px; }
#mk-nav .it .x { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
#mk-nav .it .x.empty-q { color: var(--ink-3); font-style: italic; }
#mk-nav .it .mv { display: flex; flex-direction: column; gap: 1px; opacity: 0; transition: opacity .1s; flex: none; }
#mk-nav .it:hover .mv { opacity: 1; }
#mk-nav .it .mv button {
  width: 17px; height: 13px; padding: 0; line-height: 1; font-size: 9px;
  border: 1px solid var(--line-2); background: #fff; border-radius: 3px; cursor: pointer; color: var(--ink-2);
}
#mk-nav .it .mv button:hover { background: var(--accent-2); border-color: var(--accent); color: var(--accent); }
#mk-nav .it .mv button:disabled { opacity: .3; cursor: not-allowed; }
@keyframes qflash { 0%,100% { box-shadow: 0 0 0 0 rgba(67,56,202,0); } 30% { box-shadow: 0 0 0 4px rgba(67,56,202,.35); } }
.q-card.flash { animation: qflash 1s ease; }

.player-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; }
.player-box > div, .player-box iframe { width: 100%; height: 100%; border: 0; }

/* ══════════════════════════════════════════════════════════
   교사 재생
   ══════════════════════════════════════════════════════════ */
.play-layout { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .play-layout { grid-template-columns: 1fr; } }

.code-panel { background: var(--accent); color: #fff; border-radius: var(--radius); padding: 18px; text-align: center; }
.code-panel .lbl { font-size: 12px; opacity: .8; font-weight: 600; letter-spacing: .06em; }
.code-panel .code {
  font-size: 44px; font-weight: 800; letter-spacing: .12em; line-height: 1.15;
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace; margin: 4px 0 8px;
}
.code-panel .url { font-size: 12px; opacity: .9; word-break: break-all; }
.code-panel .qr { background: #fff; padding: 8px; border-radius: 8px; display: inline-block; margin-top: 10px; line-height: 0; }

.qlist-item {
  display: flex; align-items: center; gap: 9px; padding: 9px 10px;
  border-radius: 9px; cursor: pointer; font-size: 13px; border: 1px solid transparent;
}
.qlist-item:hover { background: #f2f3f8; }
.qlist-item.done { color: var(--ink-3); }
.qlist-item.active { background: var(--accent-2); border-color: var(--accent); }
.qlist-item .t { font-family: ui-monospace, Consolas, monospace; font-weight: 700; color: var(--accent); flex: none; }
.qlist-item .x { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 교사 퀴즈 오버레이 */
#overlay {
  position: fixed; inset: 0; background: rgba(14,17,30,.93); z-index: 200;
  display: flex; align-items: center; justify-content: center; padding: 24px;
  overflow-y: auto;
}
/* 퀴즈가 열리면 영상은 왼쪽에 그대로 두고 문항을 오른쪽에 붙인다.
   iframe 을 DOM 에서 옮기면 영상이 처음부터 다시 로드되므로 CSS 로만 자리를 바꾼다. */
@media (min-width: 900px) {
  /* 반쪽 패널이 되면 뒤 페이지가 비쳐 산만하므로 불투명하게 */
  body.quiz-open #overlay { left: 53vw; padding: 26px 30px; background: #12162a; }
  body.quiz-open #pl-video {
    position: fixed; left: 0; top: 0; width: 53vw; height: 100vh; z-index: 201;
    margin: 0; padding: 0; border: 0; border-radius: 0; background: #000;
    display: flex; align-items: center; box-shadow: none;
  }
  body.quiz-open #pl-video .player-box { border-radius: 0; }
  body.quiz-open #pl-video .pl-toolbar { display: none; }
  body.quiz-open #overlay .ov-q { font-size: clamp(20px, 2.1vw, 30px); }
  body.quiz-open #overlay .ov-choice { padding: 11px 15px; font-size: clamp(15px, 1.35vw, 19px); }
  body.quiz-open #overlay .q-img { max-height: 22vh; }
}
#overlay .ov-inner { width: 100%; max-width: 960px; color: #fff; }
#overlay .ov-top { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
#overlay .ov-q { font-size: clamp(22px, 3.4vw, 38px); font-weight: 800; line-height: 1.35; margin-bottom: 22px; }
#overlay .ov-choices { display: grid; gap: 10px; }
#overlay .ov-choice {
  display: flex; align-items: center; gap: 14px; padding: 14px 18px;
  border: 2px solid rgba(255,255,255,.22); border-radius: 12px;
  font-size: clamp(16px, 2vw, 22px); font-weight: 600; position: relative; overflow: hidden;
}
#overlay .ov-choice .bar {
  position: absolute; inset: 0 auto 0 0; background: rgba(255,255,255,.13);
  width: 0; transition: width .4s ease;
}
#overlay .ov-choice > * { position: relative; }
#overlay .ov-choice .lt {
  width: 34px; height: 34px; border-radius: 8px; background: rgba(255,255,255,.16);
  display: grid; place-items: center; font-weight: 800; flex: none; font-size: 17px;
}
#overlay .ov-choice .cnt { margin-left: auto; font-size: 16px; font-weight: 700; opacity: .85; }
#overlay .ov-choice.correct { border-color: #34d17f; background: rgba(52,209,127,.16); }

/* crypto.subtle 은 https(또는 file://)에서만 제공된다.

    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

  const bytes = Array.from(new TextEncoder().encode(str));
  const bitLen = bytes.length * 8;

  bytes.push(0, 0, 0, 0, (bitLen >>> 24) & 255, (bitLen >>> 16) & 255, (bitLen >>> 8) & 255, bitLen & 255);

  const w = new Array(64);

  for (let i = 0; i < bytes.length; i += 64) {

    for (let t = 16; t < 64; t++) {

      w[t] = (w[t - 16] + s0 + w[t - 7] + s1) | 0;
    }
    let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];

      const t2 = (S0 + ((a & b) ^ (a & c) ^ (b & c))) | 0;

         (H[4] + e) | 0, (H[5] + f) | 0, (H[6] + g) | 0, (H[7] + h) | 0];
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');

/* ── 유튜브 자막(CC) 제어 ──────────────────────────────────────────────
   자동 생성 자막이 화면 아래쪽을 가려 수업에 방해가 되는 경우가 많아 기본은 끕니다.
   유튜브는 플레이어가 준비될 때와 재생이 시작될 때 자막 모듈을 다시 얹으므로,
   그 두 시점에 다시 적용해 주어야 확실히 꺼집니다.

   끄는 것은 확실히 동작하지만, API로 특정 자막을 "켜는" 것은 영상에 따라 되지 않습니다.
   그래서 켜기는 '차단 해제'까지만 하고, 어떤 자막을 볼지는 플레이어 ⚙ 메뉴에 맡깁니다.
   광고 재생 중에는 자막 API가 먹지 않으며, 본 영상이 시작되면 정상 적용됩니다. */
let captionsOn = lsGet('vq_captions') === '1';

function applyCaptions(player) {
  if (!player) return;
  // 'captions'는 구버전, 'cc'는 HTML5 플레이어의 모듈 이름 — 둘 다 시도한다
  ['captions', 'cc'].forEach(m => {
    try {
      if (captionsOn) {
        // 자막 차단만 해제한다. 어떤 자막을 켤지는 유튜브(와 교사)가 정한다.
        // setOption('track', ...) 으로 트랙을 강제하는 방법은 영상에 따라 먹지 않아
        // (자동 번역 트랙은 is_servable:false 라 지정해도 무시됨) 시도하지 않는다.
        player.loadModule(m);
      } else {
        player.unloadModule(m);
        player.setOption(m, 'track', {});
      }
    } catch (e) { /* 해당 모듈이 없는 플레이어면 무시 */ }
  });
}
function ytEvents(getPlayer) {
  return {
    onReady: () => applyCaptions(getPlayer()),
    onStateChange: e => {
      if (e.data === YT.PlayerState.PLAYING || e.data === YT.PlayerState.BUFFERING) applyCaptions(getPlayer());
    }
  };
}
function toggleCaptions(getPlayer) {
  captionsOn = !captionsOn;
  lsSet('vq_captions', captionsOn ? '1' : '0');
  applyCaptions(getPlayer());
  $$('.cc-btn').forEach(b => { b.textContent = ccLabel(); });
  toast(captionsOn
    ? '자막 차단을 풀었습니다. 자막이 안 보이면 플레이어 ⚙ → 자막에서 고르세요'
    : '자막을 껐습니다');
}
function ccLabel() { return captionsOn ? '💬 자막 끄기' : '💬 자막 허용'; }
function ccButton(handler) { return '<button class="btn sm cc-btn" onclick="' + handler + '">' + ccLabel() + '</button>'; }

function mkToggleCC() { toggleCaptions(() => mkPlayer); }
function plToggleCC() { toggleCaptions(() => pl && pl.player); }

/* ══════════════════════════════════════════════════════════════════════
   2. 기본값 / 스키마 헬퍼
   ══════════════════════════════════════════════════════════════════════ */
const DEFAULT_SETTINGS = {
  revealMode: 'timer',    // instant | timer | manual | never
  limitSec: 20,           // 문항당 응답 제한 시간 (0 = 무제한, 교사가 닫을 때까지)
  revealDelaySec: 5,      // revealMode='timer' 일 때 오픈 후 정답 공개까지
  autoPause: true         // 퀴즈가 뜰 때 영상 자동 일시정지
};
const REVEAL_LABEL = {
  instant: '제출 즉시 공개',
  timer:   '타이머 종료 후 자동 공개',
  manual:  '교사가 버튼을 누를 때 공개',
  never:   '학생에게 공개 안 함'
};

function normSettings(s) {
  const o = Object.assign({}, DEFAULT_SETTINGS, s || {});
  if (!REVEAL_LABEL[o.revealMode]) o.revealMode = DEFAULT_SETTINGS.revealMode;
  o.limitSec = Math.max(0, Math.min(600, Number(o.limitSec) || 0));
  o.revealDelaySec = Math.max(0, Math.min(600, Number(o.revealDelaySec) || 0));
  o.autoPause = o.autoPause !== false;
  return o;
}
/* ── 문항 유형 ──────────────────────────────────────────────────────── */
const QTYPES = {
  choice: '객관식 — 하나 고르기',
  multi:  '복수 정답 — 모두 고르기',
  ox:     'O · X (참·거짓)',
  short:  '단답형 — 직접 입력, 자동 채점',
  long:   '서술형 — 교사가 나중에 채점'
};
const OX_CHOICES = ['O (맞다)', 'X (아니다)'];

function qType(q) { return (q && QTYPES[q.type]) ? q.type : 'choice'; }
function isTextType(q) { const t = qType(q); return t === 'short' || t === 'long'; }
/** 서술형만 사람이 채점한다. 나머지는 학생이 제출하는 순간 채점된다. */
function isAutoGraded(q) { return qType(q) !== 'long'; }

/** 단답형 비교용 정규화 — 띄어쓰기·대소문자·흔한 문장부호를 무시한다 */
function normAnswerText(s) {
  return String(s == null ? '' : s)
    .trim().toLowerCase()
    .replace(/\s+/g, '')
    .replace(/[.,!?~·'"’”\-–—()[\]]/g, '');
}
function shortCorrect(q, txt) {
  const n = normAnswerText(txt);
  if (!n) return false;
  return (q.accept || []).some(a => normAnswerText(a) === n);
}
/** 복수 정답은 고른 것이 정답 집합과 정확히 같아야 맞다 */
function multiCorrect(q, arr) {
  const want = (q.answers || []).slice().sort((a, b) => a - b).join(',');
  const got = (arr || []).slice().sort((a, b) => a - b).join(',');
  return want !== '' && want === got;
}
/** 응답 하나를 유형에 맞게 채점. 서술형은 null(미채점)을 돌려준다. */
function gradeResponse(q, resp) {
  const t = qType(q);
  if (t === 'long') return null;
  if (t === 'short') return shortCorrect(q, resp.txt);
  if (t === 'multi') return multiCorrect(q, parseMulti(resp.cs));
  return Number(resp.c) === Number(q.answer);
}
/** 복수 정답은 "0,2" 문자열로 저장한다 (RTDB에서 배열이 다루기 번거로워서) */
function parseMulti(cs) {
  return String(cs || '').split(',').filter(x => x !== '').map(Number).filter(n => !isNaN(n));
}
function fmtMulti(arr) { return (arr || []).slice().sort((a, b) => a - b).join(','); }

/** 응답을 사람이 읽을 수 있는 형태로 (표·CSV·명단에서 공용) */
function answerLabel(q, r) {
  if (!r) return '';
  const t = qType(q);
  if (t === 'short' || t === 'long') return r.txt || '';
  if (t === 'multi') return parseMulti(r.cs).map(j => LETTERS[j] || ('?' + j)).join(' ');
  const c = Number(r.c);
  return (t === 'ox' ? ['O', 'X'][c] : LETTERS[c]) || '';
}

/** Firebase는 빈 배열을 지우므로 questions가 없을 수 있다 */
function normQuestions(qs) {
  return (qs || []).filter(Boolean).map(q => {
    const type = QTYPES[q.type] ? q.type : 'choice';
    return {
      type: type,
      t: Number(q.t) || 0,
      text: q.text || '',
      // O·X 도 보기 문구는 교사가 고칠 수 있다. 저장된 게 없을 때만 기본 문구를 쓴다.
      choices: type === 'ox'
        ? (((q.choices || []).filter(c => c != null).length >= 2) ? q.choices.slice(0, 2) : OX_CHOICES.slice())
        : (q.choices || []).filter(c => c != null),
      answer: Number(q.answer) || 0,
      answers: (q.answers ? Object.keys(q.answers).map(k => Number(q.answers[k])) : []).filter(n => !isNaN(n)),
      accept: (q.accept ? Object.keys(q.accept).map(k => String(q.accept[k])) : []).filter(s => s.trim() !== ''),
      imgUrl: q.imgUrl || '',
      imgUp: !!q.imgUp,
      _img: '',                 // 업로드 이미지 원본 (vq/images 에서 따로 불러온다)
      explain: q.explain || '',
      limitSec: (q.limitSec === undefined || q.limitSec === null || q.limitSec === '') ? null : Number(q.limitSec)
    };
  });
}
function normSet(raw) {
  if (!raw) return null;
  return {
    title: raw.title || '제목 없음',
    videoId: raw.videoId || '',
    videoUrl: raw.videoUrl || '',
    author: raw.author || '',
    createdAt: raw.createdAt || 0,
    updatedAt: raw.updatedAt || 0,
    archived: !!raw.archived,
    settings: normSettings(raw.settings),
    questions: normQuestions(raw.questions)
  };
}
/* ── 문항 이미지 ────────────────────────────────────────────────────────
   Firebase Storage 는 유료 요금제라야 쓸 수 있어서, 브라우저에서 크기를 줄여
   데이터베이스에 넣습니다. 대신 이미지는 퀴즈 세트가 아니라 vq/images/{세트}/{문항}
   에 따로 두고, 그 문항이 열릴 때만 내려받습니다. 학생 30명이 세트를 열 때마다
   모든 이미지를 받아가면 무료 전송량이 금방 동나기 때문입니다. */
const IMG_MAX_CHARS = 380000;   // 규칙의 400,000자 상한 아래로 (대략 280KB 사진)

function compressImage(file, maxPx, quality) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error('이미지 파일이 아닙니다.'));
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('파일을 읽지 못했습니다.'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => reject(new Error('이미지를 열지 못했습니다.'));
      im.onload = () => {
        let w = im.naturalWidth, h = im.naturalHeight;
        const scale = Math.min(1, maxPx / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const cx = cv.getContext('2d');
        cx.fillStyle = '#fff';           // 투명 PNG가 검게 나오지 않도록
        cx.fillRect(0, 0, w, h);
        cx.drawImage(im, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/** 상한에 들어올 때까지 화질과 크기를 차례로 낮춘다 */
async function prepareImage(file) {
  let quality = 0.72, px = 1000;
  let out = await compressImage(file, px, quality);
  while (out.length > IMG_MAX_CHARS && (quality > 0.4 || px > 480)) {
    if (quality > 0.45) quality -= 0.12;
    else px = Math.round(px * 0.8);
    out = await compressImage(file, px, quality);
  }
  if (out.length > IMG_MAX_CHARS) throw new Error('이미지가 너무 큽니다. 더 작은 파일을 써 주세요.');
  return out;
}

/** 문항 이미지를 그때그때 받아 캐시한다 (교사 재생 화면과 학생 화면 공용) */
const imgCache = {};
function loadQuestionImage(setId, i) {
  const key = setId + '/' + i;
  if (imgCache[key] !== undefined) return Promise.resolve(imgCache[key]);
  return store.getQuestionImage(setId, i)
    .then(src => { imgCache[key] = src || ''; return imgCache[key]; })
    .catch(() => '');
}
/** 문항에 보여줄 그림이 있는지 (업로드 또는 주소) */
function hasImage(q) { return !!(q && (q.imgUp || q.imgUrl)); }

/** 문항별 제한시간 덮어쓰기가 있으면 그것을, 없으면 세트 기본값을 쓴다 */
function limitFor(set, i) {
  const q = set.questions[i];
  if (q && q.limitSec !== null && q.limitSec !== undefined && !isNaN(q.limitSec)) return Math.max(0, q.limitSec);
  return set.settings.limitSec;
}

/* 익명 로그인이 끝나기 전에는 DB를 건드릴 수 없으므로 라우팅을 잠시 미뤄 둔다 */
let authReady = false;

function router() {
  if (!authReady) return;
  runCleanups();
  window.scrollTo(0, 0);
  const raw = location.hash.replace(/^#\/?/, '');
  const parts = raw.split('/').filter(x => x !== '');
  const name = parts[0] || 'home';
  const arg = parts[1] ? decodeURIComponent(parts[1]) : '';

  switch (name) {
    case 'home':  screenHome(); break;
    case 'sets':  screenSetList(); break;
    case 'make':  screenMake(arg); break;
    case 'play':  screenPlay(arg); break;
    case 'join':  screenStudent(arg); break;
    case 'live':  screenDashboard(arg); break;
    case 'admin': screenAdmin(); break;
    default:      screenHome();
  }
}
window.addEventListener('hashchange', router);

   4-2. 세트 목록 — 불러오기 / 복제
   ══════════════════════════════════════════════════════════════════════ */
let setList = null;

function screenSetList() {
  setList = { all: [], q: '', showHidden: false };
  const state = setList;
  onCleanup(() => { if (setList === state) setList = null; });
  APP().innerHTML = topbar('<a class="btn sm primary" href="#/make">＋ 새 세트</a>') +
    '<div class="wrap"><div class="empty">세트를 불러오는 중…</div></div>';

  store.listQuizSets().then(all => {
    if (setList !== state) return;
    state.all = all.map(item => {
      const s = normSet(item);
      const id = item.id;
      s.id = id;
      return s;
    }).sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
    renderSetList();
  }).catch(e => {
    if (setList !== state) return;
    console.error(e);
    APP().innerHTML = topbar() + '<div class="wrap"><div class="card"><div class="empty">불러오기 실패: ' + esc(e.message) + '</div></div></div>';
  });
}

      '<div class="notice info">' +
        '<b>다른 프로젝트로 세트 옮기기</b> — 세트마다 있는 <b>[📤 파일]</b>로 내보낸 뒤, 옮길 곳의 이 화면에서 ' +
        '<b>[📥 세트 가져오기]</b>로 넣으면 됩니다. 문항·설정·이미지가 그대로 따라갑니다. 백업으로도 쓸 수 있습니다.' +
      '</div>' +
      '<div class="card" style="padding:14px">' +
        '<div class="row" style="margin-bottom:10px">' +
          '<label class="btn sm primary" style="margin:0">📥 세트 가져오기' +
            '<input type="file" accept=".json,application/json" style="display:none" onchange="setImportPick(this)"></label>' +
          '<button class="btn sm" onclick="setExportAll()">📦 전체 내보내기 (백업)</button>' +
        '</div>' +
        '<input type="text" id="sl-q" placeholder="제목이나 만든 사람으로 찾기" value="' + esc(setList.q) + '">' +
        (nHidden ? '<div style="margin-top:10px"><label style="font-size:13px;color:var(--ink-2);cursor:pointer">' +
            '<input type="checkbox" id="sl-hidden" ' + (setList.showHidden ? 'checked' : '') + '> ' +
            '숨긴 세트도 보기 (' + nHidden + '개)</label></div>' : '') +
      '</div>' +
      (rows.length ? rows.map(setListRow).join('')
        : '<div class="card"><div class="empty">' +
            (setList.all.length ? '검색 결과가 없습니다.' : '아직 만들어진 세트가 없습니다.') +

/** 세트를 지우는 대신 숨긴다.
    다른 선생님이 공유받아 쓰는 세트를 실수로 없애지 않도록 삭제는 규칙으로 막아 두었고,
    대신 목록에서 감추는 방식으로 정리한다. 진행 기록과 링크는 그대로 살아 있다. */
function setArchive(id, on) {
  if (on && !confirm('이 세트를 목록에서 숨길까요?\n\n기록은 지워지지 않고, 이미 공유한 링크도 계속 열립니다.\n[숨긴 세트도 보기]로 언제든 되돌릴 수 있습니다.')) return;
  store.patchQuizSet(id, { archived: !!on }).then(() => {
    const s = setList && setList.all.filter(x => x.id === id)[0];
    if (s) s.archived = on;
    toast(on ? '목록에서 숨겼습니다' : '다시 표시합니다');
    renderSetList();
  }).catch(e => { console.error(e); alert('실패: ' + e.message); });
}

/* ── 세트 내보내기 / 가져오기 ─────────────────────────────────────────
   Firebase 프로젝트를 학년별로 나누면 프로젝트끼리는 데이터가 통하지 않는다.
   그때 세트를 옮기려고 매번 사람을 거치지 않도록, 파일 한 개로 주고받게 한다.
   백업 용도로도 그대로 쓸 수 있다. */
const EXPORT_VERSION = 1;

function setExport(id) {
  return Promise.all([
    store.getQuizSet(id),
    store.getImages(id)
  ]).then(([savedSet, images]) => {
    if (!savedSet) { toast('세트를 찾을 수 없습니다'); return; }
    const set = Object.assign({}, savedSet);
    delete set.id;
    const pack = {
      _: '영상 퀴즈 세트 파일 — 다른 프로젝트의 세트 목록에서 [가져오기]로 넣으세요.',
      v: EXPORT_VERSION,
      exportedAt: new Date().toISOString(),
      set: set,
      images: Object.keys(images).length ? images : null
    };
    const json = JSON.stringify(pack, null, 1);
    downloadBlob(safeFileName(set.title) + '.영상퀴즈.json',
      new Blob([json], { type: 'application/json;charset=utf-8' }));
    toast('세트를 파일로 내보냈습니다 (' + Math.round(json.length / 1024) + 'KB)');
  }).catch(e => { console.error(e); alert('내보내기 실패: ' + e.message); });
}

/** 목록에 보이는 세트를 한 파일로 — 백업용 */
function setExportAll() {
  if (!setList) return;
  const ids = setList.all.map(s => s.id);
  if (!ids.length) { toast('내보낼 세트가 없습니다'); return; }
  toast(ids.length + '개 세트를 모으는 중…');
  Promise.all(ids.map(id => Promise.all([
    store.getQuizSet(id),
    store.getImages(id)
  ]).then(([savedSet, images]) => {
    if (!savedSet) return { set: null, images: null };
    const set = Object.assign({}, savedSet);
    delete set.id;
    return { set: set, images: Object.keys(images).length ? images : null };
  })))
  .then(packs => {
    const json = JSON.stringify({
      _: '영상 퀴즈 세트 묶음 파일', v: EXPORT_VERSION,
      exportedAt: new Date().toISOString(),
      sets: packs.filter(p => p.set)
    }, null, 1);
    downloadBlob('영상퀴즈_세트전체_' + fmtDay(Date.now()) + '.영상퀴즈.json',
      new Blob([json], { type: 'application/json;charset=utf-8' }));
    toast(packs.length + '개 세트를 내보냈습니다 (' + Math.round(json.length / 1024) + 'KB)');
  }).catch(e => { console.error(e); alert('내보내기 실패: ' + e.message); });
}

function setImportPick(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const fr = new FileReader();
  fr.onerror = () => alert('파일을 읽지 못했습니다.');
  fr.onload = () => {
    let pack;
    try { pack = JSON.parse(fr.result); }
    catch (e) { alert('이 파일은 영상 퀴즈 세트 파일이 아닙니다.'); return; }

    const list = pack.sets ? pack.sets : (pack.set ? [{ set: pack.set, images: pack.images }] : null);
    if (!list || !list.length) { alert('세트가 들어 있지 않은 파일입니다.'); return; }
    if (!confirm(list.length + '개 세트를 이 프로젝트로 가져옵니다.\n기존 세트는 그대로 두고 새로 만듭니다. 계속할까요?')) return;

    toast('가져오는 중…');
    Promise.all(list.map(p => setImportOne(p)))
      .then(ids => {
        toast(ids.length + '개 세트를 가져왔습니다');
        if (setList) screenSetList();
      })
      .catch(e => { console.error(e); alert('가져오기 실패: ' + e.message); });
  };
  fr.readAsText(file);
}

function setImportOne(p) {
  const src = p.set || {};
  const set = normSet(src);
  if (!set || !set.questions.length) return Promise.reject(new Error('문항이 없는 세트입니다.'));

  // 저장 형식으로 다시 만든다 (낯선 필드가 섞여 규칙에 걸리지 않도록)
  const questions = set.questions.map(q => {
    const o = { type: qType(q), t: q.t, text: q.text, choices: q.choices, answer: q.answer };
    if ((q.answers || []).length) o.answers = q.answers;
    if ((q.accept || []).length) o.accept = q.accept;
    if (q.imgUrl) o.imgUrl = q.imgUrl;
    if (q.imgUp) o.imgUp = true;
    if (q.explain) o.explain = q.explain;
    if (q.limitSec !== null && q.limitSec !== undefined) o.limitSec = q.limitSec;
    return o;
  });

  const newId = rid(8);
  const data = {
    title: (set.title + ' (가져옴)').slice(0, 200),
    videoId: set.videoId, videoUrl: set.videoUrl,
    author: set.author || lsGet('vq_teacher'),
    settings: set.settings, questions: questions,
    createdAt: SV_TS, updatedAt: SV_TS
  };
  return store.saveQuizSet(newId, data)
    .then(() => store.replaceImages(newId, p.images || {}))
    .then(() => newId);
}

/** 원본은 그대로 두고 새 ID로 사본을 만든다 (규칙상 세트 삭제는 막혀 있으므로 원본이 안전) */
function setDuplicate(id) {
  store.getQuizSet(id).then(src => {
    if (!src) { toast('세트를 찾을 수 없습니다'); return; }
    const newId = rid(8);
    return store.copyQuizSet(id, newId, {
      title: ((src.title || '제목 없음') + ' (사본)').slice(0, 200),
      author: lsGet('vq_teacher') || src.author || '',
      createdAt: SV_TS,
      updatedAt: SV_TS
    })
      .then(() => {
        toast('사본을 만들었습니다');
        go('make/' + newId);
      });
  }).catch(e => { console.error(e); alert('복제 실패: ' + e.message); });
}

/* ── 영상 / 문항 폭 조절 ───────────────────────────────────────────────
   선생님마다 영상을 크게 보고 싶은지, 문항을 넓게 쓰고 싶은지가 달라서
   가운데 경계를 끌어 조절하게 하고 그 폭을 브라우저에 기억시킨다. */
const MK_SPLIT_DEFAULT = 480;

function mkInitResizer() {
  const layout = $('.mk-layout'), rz = $('#mk-resizer');
  if (!layout || !rz) return;

  const clamp = w => {
    const total = layout.getBoundingClientRect().width;
    const max = Math.max(320, total - 420);   // 문항 칸이 너무 좁아지지 않게
    return Math.round(Math.max(300, Math.min(w, max)));
  };
  const apply = (w, save) => {
    layout.style.setProperty('--mk-left-w', w + 'px');
    if (save) lsSet('vq_mk_split', String(w));
  };

  const saved = parseInt(lsGet('vq_mk_split', ''), 10);
  if (saved) apply(clamp(saved), false);

  let shield = null;
  const onMove = e => {
    if (!shield) return;
    apply(clamp(e.clientX - layout.getBoundingClientRect().left), true);
    e.preventDefault();
  };
  const stop = () => {
    if (!shield) return;
    shield.remove(); shield = null;
    rz.classList.remove('dragging');
  };
  rz.onmousedown = e => {
    rz.classList.add('dragging');
    shield = document.createElement('div');
    shield.id = 'mk-dragshield';
    document.body.appendChild(shield);
    e.preventDefault();
  };
  rz.ondblclick = () => { apply(MK_SPLIT_DEFAULT, true); toast('기본 너비로 되돌렸습니다'); };

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', stop);
  onCleanup(() => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', stop);
    stop();
  });
}

/* ── 진행 설정 ─────────────────────────────────────────────────────────
   한 번 정하고 마는 값이라 평소에는 한 줄 요약으로 접어 둔다.
   펼쳐 둔 채로 두면 영상이 첫 화면에서 밀려나 정작 중요한 작업이 불편해진다. */
function mkSettingsSummary() {
  const s = mk.settings;
  return [
    REVEAL_LABEL[s.revealMode],
    s.limitSec ? '제한 ' + s.limitSec + '초' : '시간 제한 없음',
    (s.revealMode === 'timer' ? s.revealDelaySec + '초 뒤 공개' : null),
    s.autoPause ? '퀴즈 뜨면 일시정지' : '퀴즈 떠도 계속 재생'
  ].filter(Boolean).join(' · ');
}

function mkToggleSettings() { mk.settingsOpen = !mk.settingsOpen; mkRenderSettings(); }

        '</div>' +
        '<button class="btn sm" onclick="mkToggleSettings()">설정 바꾸기</button>' +
      '</div>';
    return;
  }

  box.innerHTML =
    '<div class="row" style="align-items:center;margin-bottom:4px">' +
      '<h2 style="flex:1">2. 진행 설정</h2>' +
      '<button class="btn sm ghost" onclick="mkToggleSettings()">접기</button>' +
    '</div>' +
    '<div class="sub">이 세트로 진행하는 모든 반에 동일하게 적용됩니다.</div>' +
    '<div class="grid2">' +
      '<div class="field"><label class="f">정답 공개 시점</label>' +
        '<select id="mk-reveal">' +
          Object.keys(REVEAL_LABEL).map(k =>
            '<option value="' + k + '"' + (mk.settings.revealMode === k ? ' selected' : '') + '>' + REVEAL_LABEL[k] + '</option>').join('') +
        '</select>' +
        '<div class="hint" id="mk-reveal-hint"></div></div>' +
      '<div class="field"><label class="f">문항당 응답 제한 시간</label>' +
        '<div class="unit-wrap"><input type="number" id="mk-limit" min="0" max="600" value="' + mk.settings.limitSec + '"><span class="unit">초</span></div>' +
        '<div class="hint">0을 넣으면 시간 제한 없이, 교사가 [계속 재생]을 누를 때까지 열려 있습니다.</div></div>' +
    '</div>' +
    '<div class="grid2">' +
      '<div class="field" id="mk-delay-field"><label class="f">정답 자동 공개까지</label>' +
        '<div class="unit-wrap"><input type="number" id="mk-delay" min="0" max="600" value="' + mk.settings.revealDelaySec + '"><span class="unit">초</span></div>' +
        '<div class="hint">퀴즈가 뜬 뒤 이만큼 지나면 학생 화면에 정답·해설이 뜹니다.</div></div>' +
      '<div class="field"><label class="f">퀴즈가 뜰 때 영상</label>' +
        '<select id="mk-pause">' +
          '<option value="1"' + (mk.settings.autoPause ? ' selected' : '') + '>자동으로 일시정지</option>' +
          '<option value="0"' + (!mk.settings.autoPause ? ' selected' : '') + '>계속 재생</option>' +
        '</select>' +
        '<div class="hint">보통은 일시정지가 편합니다.</div></div>' +
    '</div>';

  $('#mk-reveal').onchange = e => { mk.settings.revealMode = e.target.value; mkRevealHint(); };
  $('#mk-limit').oninput = e => { mk.settings.limitSec = Math.max(0, Number(e.target.value) || 0); };
  $('#mk-delay').oninput = e => { mk.settings.revealDelaySec = Math.max(0, Number(e.target.value) || 0); };
  $('#mk-pause').onchange = e => { mk.settings.autoPause = e.target.value === '1'; };
  mkRevealHint();
}

function mkRevealHint() {
  const m = mk.settings.revealMode;
  const hints = {
    instant: '학생이 답을 고르는 즉시 각자 화면에 O/X와 해설이 뜹니다.',
    timer:   '아래 초 설정에 따라 자동으로 공개됩니다. 교사가 [지금 공개]로 앞당길 수 있습니다.',
    manual:  '교사가 진행 화면에서 [정답 공개]를 누를 때까지 학생은 결과를 볼 수 없습니다.',
    never:   '학생 화면에는 끝까지 정답이 뜨지 않습니다. 교사 대시보드에서만 채점 결과를 봅니다.'
  };
  const el = $('#mk-reveal-hint');
  if (el) el.textContent = hints[m] || '';
  const df = $('#mk-delay-field');
  if (df) df.style.opacity = (m === 'timer') ? '1' : '.4';
}

/** URL이 바뀔 때만 미리보기 플레이어를 새로 만든다 */
function mkSyncVideo() {
  const vid = parseYouTube(mk.videoUrl);
  mk.videoId = vid;
  const hint = $('#mk-url-hint');
  if (hint) {
    hint.textContent = mk.videoUrl ? (vid ? '영상 ID: ' + vid : '⚠ 유튜브 주소를 인식하지 못했습니다.') : '';
    hint.style.color = (mk.videoUrl && !vid) ? 'var(--bad)' : '';
  }
  const wrap = $('#mk-player-wrap');
  if (!wrap) return;
  if (!vid) {
    wrap.innerHTML = '<div class="empty" style="padding:44px 12px">위에 유튜브 주소를 넣으면<br>여기에 영상이 뜹니다.</div>';
    mkPlayer = null; mkPlayerVid = '';
    return;
  }
  if (vid === mkPlayerVid && mkPlayer) return;

  mkPlayerVid = vid;
  wrap.innerHTML =
    '<div class="player-box"><div id="mk-player"></div></div>' +
    '<div class="row" style="margin-top:10px;align-items:center">' +
      '<button class="btn sm" onclick="mkStampNew()">📍 현재 시각으로 문항 추가</button>' +
      ccButton('mkToggleCC()') +
      '<span class="hint" id="mk-cur" style="margin:0">—</span>' +
    '</div>';

  whenYT(() => {
    if (mkPlayerVid !== vid || !document.getElementById('mk-player')) return;
    try { mkPlayer && mkPlayer.destroy(); } catch (e) {}
    mkPlayer = new YT.Player('mk-player', {
      videoId: vid,
      playerVars: { rel: 0, modestbranding: 1, playsinline: 1, cc_load_policy: 0 },
      events: ytEvents(() => mkPlayer)
    });
  });
}

function mkCurrentTime() {
  try { return (mkPlayer && mkPlayer.getCurrentTime) ? mkPlayer.getCurrentTime() : 0; }
  catch (e) { return 0; }
}

function mkRenderQuestions() {
  const box = $('#mk-questions');
  if (!box) return;
  if (!mk.questions.length) {
    box.innerHTML = '<div class="empty">문항이 없습니다. 아래에서 추가하세요.</div>';
    mkRenderNav();
    return;
  }
  box.innerHTML = mk.questions.map((q, i) => {
    return '<div class="q-card" id="mk-q-' + i + '">' +
      '<div class="q-head">' +
        '<div class="q-no">' + (i + 1) + '</div>' +
        '<input type="text" class="time-input mono" value="' + esc(fmtTime(q.t)) + '" ' +
          'onchange="mkSetTime(' + i + ', this.value, this)" title="이 시각에 퀴즈가 뜹니다">' +
        '<button class="btn sm" onclick="mkStamp(' + i + ')" title="플레이어의 현재 위치를 넣습니다">📍 현재 시각 찍기</button>' +
        '<button class="btn sm ghost" onclick="mkSeek(' + i + ')" title="이 시각으로 영상 이동">↪ 이동</button>' +
        '<div class="spacer"></div>' +
        '<button class="btn sm ghost" onclick="mkMove(' + i + ',-1)" ' + (i === 0 ? 'disabled' : '') + '>↑</button>' +
        '<button class="btn sm ghost" onclick="mkMove(' + i + ',1)" ' + (i === mk.questions.length - 1 ? 'disabled' : '') + '>↓</button>' +
        '<button class="btn sm danger" onclick="mkDelQuestion(' + i + ')">삭제</button>' +
      '</div>' +
      '<div class="field"><label class="f">문항 유형</label>' +
        '<select onchange="mkSetType(' + i + ', this.value)">' +
          Object.keys(QTYPES).map(k =>
            '<option value="' + k + '"' + (qType(q) === k ? ' selected' : '') + '>' + QTYPES[k] + '</option>').join('') +
        '</select></div>' +
      '<div class="field"><label class="f">질문</label>' +
        '<textarea oninput="mk.questions[' + i + '].text=this.value; mkNavText(' + i + ')" placeholder="예) 감염병 전파를 막는 가장 기본적인 방법은?">' + esc(q.text) + '</textarea></div>' +
      mkImageField(q, i) +
      mkAnswerField(q, i) +
      '<div class="grid2">' +
        '<div class="field"><label class="f">해설 (선택)</label>' +
          '<input type="text" value="' + esc(q.explain) + '" oninput="mk.questions[' + i + '].explain=this.value" placeholder="정답 공개 때 함께 보여줄 설명"></div>' +
        '<div class="field"><label class="f">이 문항만 제한 시간 다르게 (선택)</label>' +
          '<div class="unit-wrap">' +
            '<input type="number" min="0" max="600" value="' + (q.limitSec == null ? '' : q.limitSec) + '" ' +
              'oninput="mk.questions[' + i + '].limitSec = this.value===\'\' ? null : Math.max(0,Number(this.value)||0)" ' +
              'placeholder="비우면 세트 기본값 ' + mk.settings.limitSec + '초">' +
            '<span class="unit">초</span></div></div>' +
      '</div>' +
    '</div>';
  }).join('');
  mkRenderNav();
}

/* ── 유형별 정답 입력 ─────────────────────────────────────────────────── */
function mkAnswerField(q, i) {
  const type = qType(q);

  if (type === 'long') {
    return '<div class="notice info" style="margin-bottom:14px">' +
      '학생이 글로 답하고, 수업이 끝난 뒤 <b>대시보드</b>에서 선생님이 O/X를 눌러 채점합니다. ' +
      '채점 전에는 점수 집계에서 <b>미채점</b>으로 표시됩니다.</div>';
  }

  if (type === 'short') {
    return '<div class="field"><label class="f">정답으로 인정할 표현 — 한 줄에 하나씩</label>' +
      '<textarea rows="3" oninput="mkSetAccept(' + i + ', this.value)" ' +
        'placeholder="손씻기&#10;손 씻기&#10;비누로 손씻기">' + esc((q.accept || []).join('\n')) + '</textarea>' +
      '<div class="hint">띄어쓰기·대소문자·마침표는 무시하고 비교합니다. 하나라도 맞으면 정답 처리됩니다.</div></div>';
  }

  const isOX = (type === 'ox');
  const isMulti = (type === 'multi');
  const choices = q.choices.length ? q.choices : (isOX ? OX_CHOICES.slice() : ['', '']);
  const label = isMulti ? '보기 — 정답을 <b>모두</b> 체크하세요'
              : isOX ? '보기 — 왼쪽 동그라미로 정답을 지정하세요 (문구는 고쳐도 됩니다)'
              : '보기 — 왼쪽 동그라미로 정답을 지정하세요';

  return '<div class="field"><label class="f">' + label + '</label>' +
    choices.map((c, j) => {
      const checked = isMulti ? ((q.answers || []).indexOf(j) >= 0) : (q.answer === j);
      return '<div class="choice-row">' +
        (isMulti
          ? '<input type="checkbox" ' + (checked ? 'checked' : '') + ' onchange="mkToggleMulti(' + i + ',' + j + ',this.checked)" style="width:20px;height:20px;accent-color:var(--accent)">'
          : '<input type="radio" name="ans-' + i + '" ' + (checked ? 'checked' : '') + ' onchange="mk.questions[' + i + '].answer=' + j + '">') +
        '<span class="cno">' + (isOX ? ['O', 'X'][j] : LETTERS[j]) + '</span>' +
        '<input type="text" value="' + esc(c) + '" oninput="mk.questions[' + i + '].choices[' + j + ']=this.value" ' +
          'placeholder="' + (isOX ? ['맞다 / 그렇다', '아니다 / 틀리다'][j] : '보기 ' + (j + 1)) + '">' +
        (!isOX && choices.length > 2 ? '<button class="btn sm ghost" onclick="mkDelChoice(' + i + ',' + j + ')">✕</button>' : '') +
      '</div>';
    }).join('') +
    (!isOX && choices.length < 6 ? '<button class="btn sm ghost" onclick="mkAddChoice(' + i + ')">＋ 보기 추가</button>' : '') +
    (isOX ? '<div class="hint">학생 화면에는 ①② 대신 큼직한 <b>O · X</b> 로 나옵니다. 객관식과 똑같이 자동 채점됩니다.</div>' : '') +
    (isMulti ? '<div class="hint">고른 것이 정답과 <b>정확히 같아야</b> 정답 처리됩니다.</div>' : '') +
  '</div>';
}

/* ── 이미지 넣기 ──────────────────────────────────────────────────────── */
function mkImageField(q, i) {
  const src = q._img || q.imgUrl || '';
  return '<div class="field"><label class="f">이미지 (선택)</label>' +
    (src
      ? '<div class="img-box"><img src="' + esc(src) + '" alt="문항 이미지" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'\'">' +
          '<div class="img-bad" style="display:none">⚠ 이미지를 불러오지 못했습니다. 주소를 확인하세요.</div>' +
          '<button class="btn sm danger" onclick="mkClearImage(' + i + ')">이미지 제거</button>' +
          '<span class="hint" style="margin:0">' + (q.imgUp ? '업로드한 그림 (' + Math.round((q._img || '').length / 1024) + 'KB)' : '외부 주소') + '</span>' +
        '</div>'
      : '<div class="row" style="align-items:center">' +
          '<label class="btn sm" style="margin:0">📁 파일 올리기' +
            '<input type="file" accept="image/*" style="display:none" onchange="mkUploadImage(' + i + ', this)"></label>' +
          '<input type="text" placeholder="또는 이미지 주소(https://…) 붙여넣기" ' +
            'onchange="mkSetImageUrl(' + i + ', this.value)" style="flex:1 1 220px">' +
        '</div>' +
        '<div class="hint">올린 사진은 브라우저에서 자동으로 줄여 저장합니다. 외부 주소는 원본이 지워지면 안 보이게 됩니다.</div>') +
  '</div>';
}

function mkUploadImage(i, input) {
  const file = input.files && input.files[0];
  if (!file) return;
  toast('이미지를 줄이는 중…');
  prepareImage(file).then(dataUri => {
    mk.questions[i]._img = dataUri;
    mk.questions[i].imgUp = true;
    mk.questions[i].imgUrl = '';
    mkRenderQuestions();
    toast('이미지를 넣었습니다 (' + Math.round(dataUri.length / 1024) + 'KB)');
  }).catch(e => { console.error(e); alert(e.message); });
  input.value = '';
}
function mkSetImageUrl(i, v) {
  const url = String(v || '').trim();
  if (!url) return;
  if (!/^https?:\/\//i.test(url)) { alert('http:// 또는 https:// 로 시작하는 주소를 넣어 주세요.'); return; }
  mk.questions[i].imgUrl = url.slice(0, 1000);
  mk.questions[i].imgUp = false;
  mk.questions[i]._img = '';
  mkRenderQuestions();
}
function mkClearImage(i) {
  mk.questions[i]._img = '';
  mk.questions[i].imgUp = false;
  mk.questions[i].imgUrl = '';
  mkRenderQuestions();
}

function mkSetType(i, type) {
  const q = mk.questions[i];
  q.type = QTYPES[type] ? type : 'choice';
  if (q.type === 'ox') {
    // 이미 써 둔 보기가 있으면 앞 2개를 살리고, 없을 때만 기본 문구를 넣는다
    const cur = (q.choices || []).map(c => String(c)).filter(c => c.trim() !== '');
    q.choices = (cur.length >= 2) ? cur.slice(0, 2) : OX_CHOICES.slice();
    if (q.answer > 1) q.answer = 0;
    q.answers = [];
  } else if (q.type === 'choice' || q.type === 'multi') {
    // O·X 기본 문구 그대로였다면 빈 보기로 되돌린다
    if (!q.choices.length || q.choices.join('') === OX_CHOICES.join('')) q.choices = ['', '', '', ''];
  }
  mkRenderQuestions();
}
function mkToggleMulti(i, j, on) {
  const q = mk.questions[i];
  q.answers = q.answers || [];
  const at = q.answers.indexOf(j);
  if (on && at < 0) q.answers.push(j);
  if (!on && at >= 0) q.answers.splice(at, 1);
}
function mkSetAccept(i, v) {
  mk.questions[i].accept = String(v || '').split('\n').map(s => s.trim()).filter(Boolean);
}

/** 문항 목차 버블 — 클릭하면 해당 문항으로, ↑↓ 로 순서 바꾸기 */
function mkRenderNav() {
  const nav = $('#mk-nav');
  if (!nav) return;
  if (mk.questions.length < 2) { nav.style.display = 'none'; return; }
  nav.style.display = '';
  nav.innerHTML =
    '<div class="hd"><span>📑 문항 ' + mk.questions.length + '개</span><span class="spacer"></span>' +
      '<button class="btn sm ghost" style="padding:2px 6px;font-size:11px" onclick="mkSortQuestions()" title="시각 순으로 정렬">↕ 정렬</button>' +
    '</div>' +
    '<div class="bd">' +
      mk.questions.map((q, i) => {
        const t = (q.text || '').trim();
        return '<div class="it">' +
          '<span class="n" onclick="mkJumpTo(' + i + ')">' + (i + 1) + '</span>' +
          '<span class="t" onclick="mkJumpTo(' + i + ')">' + fmtTime(q.t) + '</span>' +
          '<span class="x' + (t ? '' : ' empty-q') + '" data-navtext="' + i + '" onclick="mkJumpTo(' + i + ')" ' +
            'title="' + esc(QTYPES[qType(q)] + ' — ' + t) + '">' +
            (hasImage(q) ? '🖼 ' : '') + esc(t || '(질문 비어 있음)') + '</span>' +
          '<span class="mv">' +
            '<button onclick="mkMove(' + i + ',-1)" ' + (i === 0 ? 'disabled' : '') + ' title="위로">▲</button>' +
            '<button onclick="mkMove(' + i + ',1)" ' + (i === mk.questions.length - 1 ? 'disabled' : '') + ' title="아래로">▼</button>' +
          '</span>' +
        '</div>';
      }).join('') +
    '</div>' +
    '<div class="ft"><button class="btn sm block" onclick="mkAddQuestion()">＋ 문항 추가</button></div>';
}

/** 질문을 타이핑하는 중에는 목차 전체를 다시 그리면 입력 포커스를 잃으므로 그 줄만 고친다 */
function mkNavText(i) {
  const el = $('#mk-nav [data-navtext="' + i + '"]');
  if (!el) return;
  const t = (mk.questions[i].text || '').trim();
  el.textContent = t || '(질문 비어 있음)';
  el.title = t;
  el.classList.toggle('empty-q', !t);
}

function mkJumpTo(i) {
  const card = document.getElementById('mk-q-' + i);
  if (!card) return;
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  card.classList.remove('flash');
  void card.offsetWidth;          // 애니메이션을 다시 태우기 위한 리플로우
  card.classList.add('flash');
}

function mkSetTime(i, v, el) {
  const t = parseTime(v);
  if (isNaN(t)) { toast('시각 형식이 올바르지 않습니다 (예: 1:23)'); el.value = fmtTime(mk.questions[i].t); return; }
  mk.questions[i].t = t;
  el.value = fmtTime(t);
  mkRenderNav();
}
function mkStamp(i) {
  const t = mkCurrentTime();
  if (!mkPlayer) { toast('먼저 유튜브 주소를 입력하세요'); return; }
  mk.questions[i].t = Math.floor(t);
  mkRenderQuestions();
  toast(fmtTime(t) + ' 지점으로 설정했습니다');
}
function mkStampNew() {
  const t = Math.floor(mkCurrentTime());
  mk.questions.push(blankQuestion(t));
  mkRenderQuestions();
  toast(fmtTime(t) + ' 지점에 문항을 추가했습니다 — 바로 질문을 입력하세요');
  mkFocusQuestion(mk.questions.length - 1);
}

/** 새로 만든 문항으로 옮겨 가면서 질문 칸에 커서까지 넣어 준다.
    영상은 왼쪽에 고정되어 있으므로 다시 위로 올라갈 필요가 없다. */
function mkFocusQuestion(i) {
  const card = document.getElementById('mk-q-' + i);
  if (!card) return;
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  card.classList.remove('flash');
  void card.offsetWidth;
  card.classList.add('flash');
  const ta = card.querySelector('textarea');
  if (ta) setTimeout(() => { try { ta.focus({ preventScroll: true }); } catch (e) { ta.focus(); } }, 320);
}
function mkSeek(i) {
  if (!mkPlayer || !mkPlayer.seekTo) { toast('미리보기 플레이어가 없습니다'); return; }
  mkPlayer.seekTo(Math.max(0, mk.questions[i].t - 3), true);
  mkPlayer.playVideo();
}
function mkAddQuestion() {
  const last = mk.questions[mk.questions.length - 1];
  mk.questions.push(blankQuestion(last ? last.t + 30 : 0));
  mkRenderQuestions();
  mkFocusQuestion(mk.questions.length - 1);
}
function mkDelQuestion(i) {
  if (!confirm((i + 1) + '번 문항을 삭제할까요?')) return;
  mk.questions.splice(i, 1);
  mkRenderQuestions();
}
function mkMove(i, d) {
  const j = i + d;
  if (j < 0 || j >= mk.questions.length) return;
  const tmp = mk.questions[i];
  mk.questions[i] = mk.questions[j];
  mk.questions[j] = tmp;
  mkRenderQuestions();
}
function mkSortQuestions() {
  mk.questions.sort((a, b) => a.t - b.t);
  mkRenderQuestions();
  toast('시각 순으로 정렬했습니다');
}
function mkAddChoice(i) {
  if (mk.questions[i].choices.length >= 6) return;
  mk.questions[i].choices.push('');
  mkRenderQuestions();
}
function mkDelChoice(i, j) {
  const q = mk.questions[i];
  if (q.choices.length <= 2) return;
  q.choices.splice(j, 1);
  if (q.answer >= q.choices.length) q.answer = q.choices.length - 1;
  else if (q.answer > j) q.answer--;
  // 복수 정답 목록도 지운 보기에 맞춰 당긴다
  q.answers = (q.answers || []).filter(x => x !== j).map(x => (x > j ? x - 1 : x));
  mkRenderQuestions();
}

function mkValidate() {
  if (!mk.title.trim()) return '세트 제목을 입력하세요.';
  if (!mk.videoId) return '유튜브 주소를 올바르게 입력하세요.';
  if (!mk.questions.length) return '문항을 최소 1개 이상 추가하세요.';
  for (let i = 0; i < mk.questions.length; i++) {
    const q = mk.questions[i], n = i + 1, type = qType(q);
    if (!q.text.trim()) return n + '번 문항의 질문이 비어 있습니다.';

    if (type === 'long') continue;                       // 채점 기준이 필요 없다

    if (type === 'short') {
      if (!(q.accept || []).length) return n + '번 문항(단답형)에 정답으로 인정할 표현을 한 개 이상 적으세요.';
      continue;
    }
    const filled = q.choices.filter(c => String(c).trim() !== '');
    if (filled.length < 2) return n + '번 문항의 보기를 ' + (type === 'ox' ? 'O·X 두 개 모두' : '2개 이상') + ' 채우세요.';

    if (type === 'multi') {
      const picked = (q.answers || []).filter(j => String(q.choices[j] || '').trim() !== '');
      if (!picked.length) return n + '번 문항(복수 정답)의 정답을 하나 이상 체크하세요.';
      if (picked.length === filled.length) return n + '번 문항(복수 정답)은 보기 전부가 정답입니다. 확인해 주세요.';
    } else {
      if (!String(q.choices[q.answer] || '').trim()) return n + '번 문항의 정답으로 지정된 보기가 비어 있습니다.';
    }
  }
  return null;
}

function mkPayload() {
  // 저장 전에 시각 순으로 맞춰 둔다 (이미지도 같은 순서로 따라가야 하므로 여기서 한 번에)
  const ordered = mk.questions.slice().sort((a, b) => a.t - b.t);

  const questions = ordered.map(q => {
    const type = qType(q);
    const o = { type: type, t: Math.max(0, Number(q.t) || 0), text: q.text.trim() };

    if (type === 'short') {
      o.accept = (q.accept || []).map(s => String(s).trim().slice(0, 100)).filter(Boolean);
      o.choices = [];
      o.answer = 0;
    } else if (type === 'long') {
      o.choices = [];
      o.answer = 0;
    } else if (type === 'ox') {
      const cur = (q.choices || []).map(c => String(c).trim()).filter(Boolean);
      o.choices = (cur.length >= 2) ? cur.slice(0, 2) : OX_CHOICES.slice();
      o.answer = Math.min(1, Math.max(0, Number(q.answer) || 0));
    } else {
      // 빈 보기는 빼고, 정답 위치를 그에 맞게 다시 계산한다
      const keep = [], remap = {};
      q.choices.forEach((c, j) => {
        if (String(c).trim() === '') return;
        remap[j] = keep.length;
        keep.push(String(c).trim());
      });
      o.choices = keep;
      o.answer = (remap[q.answer] !== undefined) ? remap[q.answer] : 0;
      if (type === 'multi') {
        o.answers = (q.answers || []).map(j => remap[j]).filter(x => x !== undefined).sort((a, b) => a - b);
      }
    }

    if (q.imgUp && q._img) o.imgUp = true;
    else if (q.imgUrl) o.imgUrl = q.imgUrl;
    if (q.explain && q.explain.trim()) o.explain = q.explain.trim();
    if (q.limitSec !== null && q.limitSec !== undefined && !isNaN(q.limitSec)) o.limitSec = Math.max(0, Number(q.limitSec));
    return o;
  });

  // 업로드 이미지는 세트가 아니라 vq/images 에 따로 넣는다 (학생이 통째로 받지 않도록)
  const images = {};
  ordered.forEach((q, i) => { if (q.imgUp && q._img) images[i] = q._img; });

  const out = {
    title: mk.title.trim(),
    videoId: mk.videoId,
    videoUrl: mk.videoUrl.trim(),
    author: (mk.author || '').trim(),
    settings: normSettings(mk.settings),
    questions: questions,
    createdAt: mk.createdAt || SV_TS,
    updatedAt: SV_TS
  };
  if (mk.archived) out.archived = true;   // 숨김 상태는 편집해도 유지한다
  return { set: out, images: images, ordered: ordered };
}

function mkSave(forceNew) {
  const err = mkValidate();
  if (err) { toast(err); return; }
  const id = (forceNew || !mk.id) ? rid(8) : mk.id;
  const isNew = (id !== mk.id);
  const built = mkPayload();
  const data = built.set;
  if (isNew) data.createdAt = SV_TS;

  const nImg = Object.keys(built.images).length;
  if (nImg) toast('이미지 ' + nImg + '장과 함께 저장 중…');

  return store.saveQuizSet(id, data)
    .then(() => store.replaceImages(id, built.images))
    .then(() => {
      mk.id = id;
      mk.saved = true;
      // 저장 결과를 그대로 다시 읽어들여, 정렬·인덱스 재계산이 화면에도 반영되게 한다
      mk.questions = normQuestions(data.questions);
      mk.questions.forEach((q, i) => { if (q.imgUp) q._img = built.images[i] || ''; });
      Object.keys(built.images).forEach(i => { imgCache[id + '/' + i] = built.images[i]; });
      if (location.hash !== '#/make/' + id) {
        history.replaceState(null, '', '#/make/' + id);
      }
      toast(isNew ? '세트를 저장했습니다' : '변경 사항을 저장했습니다');
      renderMake();
      const card = $('#mk-save-card');
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    })
    .catch(e => { console.error(e); alert('저장 실패: ' + e.message); });
}
function mkSaveAsNew() {
  if (!confirm('현재 내용을 새 세트로 복제 저장합니다. 원본은 그대로 남습니다. 계속할까요?')) return;
  mkSave(true);
}

    live: { q: -1, openedAt: 0, revealed: false, limitSec: 0 },

    pl.fired = set.questions.map(() => false);
    renderPlayIntro();

function plStartSession() {
  const label = ($('#pl-label') && $('#pl-label').value.trim()) || '';
  lsSet('vq_last_label', label);
  const sessionId = rid(12);
  const teacher = pl.set.author || '';

  return store.startSession(sessionId, {
    setId: pl.setId,
    setTitle: pl.set.title,
    label: label,
    teacher: teacher,
    createdAt: SV_TS,
    status: 'live'
  }, () => rid(6)).then(code => {
    pl.sessionId = sessionId;
    pl.code = code;
    renderPlayRun();
  }).catch(e => {
    console.error(e);
    alert(e.message === '사용 가능한 반 코드를 만들지 못했습니다. 다시 시도해 주세요.'
      ? '반 코드 발급에 실패했습니다. 잠시 후 다시 시도해 주세요.'
      : '반 시작 실패: ' + e.message);
  });
}

    });
  });

  // 타임코드 감시 루프
  every(200, plTick);
  every(250, plTimerTick);
}

function plTick() {
  if (!pl || !pl.player || !pl.player.getCurrentTime) return;
  let now;
  try { now = pl.player.getCurrentTime(); } catch (e) { return; }
  if (typeof now !== 'number' || isNaN(now)) return;

  const prev = pl.lastT;
  pl.lastT = now;

  const clock = $('#pl-clock');
  if (clock) clock.textContent = fmtTime(now);

  // 다음 문항 안내
  const nextEl = $('#pl-next');
  if (nextEl) {
    const nx = pl.set.questions.findIndex(q => q.t > now);
    nextEl.textContent = nx === -1 ? '남은 문항 없음' :
      '다음 문항 ' + (nx + 1) + '번까지 ' + fmtTime(pl.set.questions[nx].t - now);
  }

  if (pl.live.q >= 0) return;   // 이미 퀴즈가 열려 있으면 새로 발화하지 않음

  pl.set.questions.forEach((q, i) => {
    // 뒤로 되감으면 다시 발화할 수 있게 플래그를 푼다
    if (now < q.t - 0.6) pl.fired[i] = false;
    if (!pl.fired[i] && prev < q.t && q.t <= now) {
      pl.fired[i] = true;
      plOpenQuestion(i);
    }
  });
}

function plOpenQuestion(i) {
  if (!pl || !pl.sessionId) return;
  if (pl.set.settings.autoPause) { try { pl.player.pauseVideo(); } catch (e) {} }
  return store.setLive(pl.sessionId, {
    q: i,
    openedAt: SV_TS,
    revealed: pl.set.settings.revealMode === 'instant',
    limitSec: limitFor(pl.set, i)
  });
}
function plReveal() {
  if (!pl || pl.live.q < 0) return;
  return store.setLive(pl.sessionId, {
    q: pl.live.q,
    openedAt: pl.live.openedAt,
    revealed: true,
    limitSec: pl.live.limitSec
  });
}
async function plCloseQuestion() {
  if (!pl) return;
  await plPushBoard();
  await store.setLive(pl.sessionId, { q: -1, openedAt: 0, revealed: false, limitSec: 0 });
  try { pl.player.playVideo(); } catch (e) {}
}
function plJumpTo(i) {
  if (!pl || !pl.player || !pl.player.seekTo) return;
  const t = Math.max(0, pl.set.questions[i].t - 3);
  pl.fired[i] = false;
  pl.lastT = t;
  pl.player.seekTo(t, true);
  pl.player.playVideo();
}
async function plEndSession() {
  if (!confirm('진행을 종료할까요? 학생 화면은 종료 안내로 바뀌고, 기록은 그대로 남습니다.')) return;
  await store.endSession(pl.sessionId);
  toast('진행을 종료했습니다');
  go('live/' + pl.sessionId);
}

function plRenderQList() {
  const box = $('#pl-qlist');
  if (!box || !pl) return;
  box.innerHTML = pl.set.questions.map((q, i) => {
    const resp = pl.responses[i] || {};
    const n = Object.keys(resp).length;
    const cls = pl.live.q === i ? ' active' : (n > 0 ? ' done' : '');
    return '<div class="qlist-item' + cls + '">' +
      '<span class="t" onclick="plJumpTo(' + i + ')" style="cursor:pointer">' + fmtTime(q.t) + '</span>' +
      '<span class="x" onclick="plJumpTo(' + i + ')" style="cursor:pointer">' + (i + 1) + '. ' + esc(q.text) + '</span>' +
      (n ? '<span class="tag mute">' + n + '명 응답</span>' : '') +
      '<button class="btn sm ghost" onclick="plOpenQuestion(' + i + ')" title="영상과 상관없이 지금 이 문항을 엽니다">열기</button>' +
    '</div>';
  }).join('');
}

/* ── 실시간 순위 ──────────────────────────────────────────────────────
   점수 계산은 교사 화면에서만 한다. 학생에게 responses 를 통째로 내려보내면
   순위는 계산할 수 있지만 남의 답도 그대로 보여 베끼기가 가능해지기 때문이다.
   대신 점수만 요약한 board 를 세션에 올리고 학생은 그것만 구독한다. */
function plScoreboard() {
  const rows = Object.keys(pl.students).map(sid => {
    const s = pl.students[sid];
    let correct = 0, answered = 0, graded = 0;
    pl.set.questions.forEach((q, i) => {
      const r = (pl.responses[i] || {})[sid];
      if (!r) return;
      answered++;
      if (r.ok === true) { graded++; correct++; }
      else if (r.ok === false) graded++;
    });
    return {
      sid: sid, name: s.name || '', grade: s.grade, klass: s.klass, num: s.num,
      correct: correct, answered: answered, graded: graded
    };
  });
  // 같은 점수면 더 적게 풀고 맞힌 쪽을, 그다음은 번호 순
  rows.sort((a, b) => (b.correct - a.correct) || (a.answered - b.answered) || (a.num - b.num));
  let rank = 0, prev = null;
  rows.forEach((r, i) => {
    if (prev === null || r.correct !== prev) { rank = i + 1; prev = r.correct; }
    r.rank = rank;
  });
  return rows;
}

/** 문항을 닫을 때 현재 점수판을 한 번 저장한다. */
function plPushBoard() {
  if (!pl || !pl.sessionId) return;
  const board = {};
  plScoreboard().forEach(r => { board[r.sid] = r.correct; });
  return store.writeBoard(pl.sessionId, board).catch(e => console.warn('board', e));
}

function plRenderStudents() {
  const list = $('#pl-stulist'), n = $('#pl-nstu');
  const rows = plScoreboard();
  if (n) n.textContent = rows.length;

      '<span class="rk">' + r.rank + '</span>' +
      '<span class="nm">' + esc(r.name) + ' <span style="color:var(--ink-3);font-size:11px">' + r.num + '번</span></span>' +
      '<span class="prog">' + r.answered + '/' + total + '</span>' +
      '<span class="sc">' + r.correct + '</span>' +
    '</div>').join('');
}

      (type !== 'choice' ? '<span class="tag" style="background:rgba(255,255,255,.18);color:#fff">' + QTYPES[type].split(' —')[0] + '</span>' : '') +
