function mkMoveChoice(videoIndex, questionIndex, fromIndex, toIndex) {
  const q = mk && mk.videos[videoIndex] && mk.videos[videoIndex].questions[questionIndex];
  if (!q || typeof ChoiceOrderCore === 'undefined') return false;
  const moved = ChoiceOrderCore.move(q, Number(fromIndex), Number(toIndex));
  if (!moved) return false;
  Object.assign(q, moved);
  mkMarkDirty('choice-order:' + videoIndex + ':' + questionIndex);
  renderMake();
  return true;
}

function mkChoiceDragStart(event, videoIndex, questionIndex, choiceIndex) {
  if (!event || !event.dataTransfer) return;
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('application/x-video-quiz-choice', JSON.stringify({ videoIndex, questionIndex, choiceIndex }));
}
function mkChoiceDragOver(event) {
  if (!event) return;
  event.preventDefault();
  if (event.currentTarget && event.currentTarget.classList) event.currentTarget.classList.add('choice-drop-target');
}
function mkChoiceDragLeave(event) {
  if (event && event.currentTarget && event.currentTarget.classList) event.currentTarget.classList.remove('choice-drop-target');
}
function mkChoiceDrop(event, videoIndex, questionIndex, toIndex) {
  if (!event || !event.dataTransfer) return false;
  event.preventDefault();
  if (event.currentTarget && event.currentTarget.classList) event.currentTarget.classList.remove('choice-drop-target');
  let source;
  try { source = JSON.parse(event.dataTransfer.getData('application/x-video-quiz-choice')); } catch (e) { return false; }
  if (!source || Number(source.videoIndex) !== Number(videoIndex) || Number(source.questionIndex) !== Number(questionIndex)) return false;
  return mkMoveChoice(videoIndex, questionIndex, source.choiceIndex, toIndex);
}

function mkSetType(videoIndex, i, type) {
  const q = mk.videos[videoIndex].questions[i];
  q.type = QTYPES[type] ? type : 'choice';
  if (q.type === 'ox') {
    // 이미 써 둔 보기가 있으면 앞 2개를 살리고, 없을 때만 기본 문구를 넣는다
    const cur = (q.choices || []).map(c => String(c)).filter(c => c.trim() !== '');
    q.choices = (cur.length >= 2) ? cur.slice(0, 2) : OX_CHOICES.slice();
    if (q.answer > 1) q.answer = 0;
    q.answers = [];
  } else if (q.type === 'choice' || q.type === 'multi') {
    // O·X 기본 문구 그대로였다면 빈 보기로 되돌린다
    if (!q.choices.length || q.choices.join('') === OX_CHOICES.join('')) q.choices = ['', '', '', ''];
  }
  mkMarkDirty();
  renderMake();
}
function mkToggleMulti(videoIndex, i, j, on) {
  const q = mk.videos[videoIndex].questions[i];
  q.answers = q.answers || [];
  const at = q.answers.indexOf(j);
  if (on && at < 0) q.answers.push(j);
  if (!on && at >= 0) q.answers.splice(at, 1);
}
function mkSetAccept(videoIndex, i, v) {
  mk.videos[videoIndex].questions[i].accept = String(v || '').split('\n').map(s => s.trim()).filter(Boolean);
}

function mkStamp(videoIndex, i) {
  const t = mkCurrentTime();
  if (!mkPlayer || videoIndex !== mk.activeVideo) { toast('먼저 이 영상의 미리보기를 선택하세요'); return; }
  mkSetQuestionTime(videoIndex, i, Math.floor(t));
  toast(fmtTime(t) + ' 지점으로 설정했습니다');
}
function mkStampNew() {
  const t = Math.floor(mkCurrentTime());
  const questions = mk.videos[mk.activeVideo].questions;
  questions.push(blankQuestion(t));
  mkMarkDirty();
  renderMake();
  toast(fmtTime(t) + ' 지점에 문항을 추가했습니다 — 바로 질문을 입력하세요');

/** 새로 만든 문항으로 옮겨 가면서 질문 칸에 커서까지 넣어 준다.
    영상은 왼쪽에 고정되어 있으므로 다시 위로 올라갈 필요가 없다. */
function mkFocusQuestion(videoIndex, i) {
  const state = mk;
  const card = document.getElementById('mk-q-' + videoIndex + '-' + i);
  if (!card) return;
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  card.classList.remove('flash');
  void card.offsetWidth;
  card.classList.add('flash');
  const ta = card.querySelector('textarea');
  if (ta) setTimeout(() => {
    if (mk !== state) return;
    try { ta.focus({ preventScroll: true }); } catch (e) { ta.focus(); }
  }, 320);
}
function mkSeek(videoIndex, i) {
  if (videoIndex !== mk.activeVideo || !mkPlayer || !mkPlayer.seekTo) { toast('먼저 이 영상의 미리보기를 선택하세요'); return; }
  mkPlayer.seekTo(Math.max(0, mk.videos[videoIndex].questions[i].t - 3), true);
  mkPlayer.playVideo();
}
function mkAddQuestion(videoIndex) {
  const questions = mk.videos[videoIndex].questions;
  const last = questions[questions.length - 1];
  const video = mk.videos[videoIndex];
  const suggested = last ? last.t + 30 : video.startSec;
  const end = video.endSec == null ? suggested : video.endSec;
  questions.push(blankQuestion(Math.min(suggested, end)));
  mkMarkDirty();
  renderMake();
  mkFocusQuestion(videoIndex, questions.length - 1);
}
function mkDelQuestion(videoIndex, i) {
  if (!confirm((i + 1) + '번 문항을 삭제할까요?')) return;
  mk.videos[videoIndex].questions.splice(i, 1);
  mkMarkDirty();
  renderMake();
}
function mkMove(videoIndex, i, d) {
  const questions = mk.videos[videoIndex] && mk.videos[videoIndex].questions;
  const j = i + d;
  if (!questions || j < 0 || j >= questions.length) return false;
  return mkMoveQuestion(videoIndex, i, videoIndex, d < 0 ? j : j + 1);
}

function mkQuestionImageMap(videos) {
  const images = {};
  (videos || []).forEach((video, videoIndex) => (video.questions || []).forEach((question, questionIndex) => {
    if (question && question.imgUp && question._img) images['v' + videoIndex + 'q' + questionIndex] = question._img;
  }));
  return images;
}

function mkMoveQuestion(fromVi, fromQi, toVi, toQi) {
  const state = mk;
  if (!state || !state.videos[fromVi] || !state.videos[toVi]) return false;
  const destination = state.videos[toVi].questions || [];
  const targetIndex = Math.max(0, Math.min(Number(toQi) || 0, destination.length));
  if (Number(fromVi) === Number(toVi) &&
      (targetIndex === Number(fromQi) || targetIndex === Number(fromQi) + 1)) return false;
  const result = PlaylistCore.moveQuestion(state.videos, mkQuestionImageMap(state.videos),
    { videoIndex: Number(fromVi), questionIndex: Number(fromQi) },
    { videoIndex: Number(toVi), questionIndex: targetIndex });
  if (!result.moved) return false;
  state.videos = result.videos;
  state.videos.forEach((video, videoIndex) => (video.questions || []).forEach((question, questionIndex) => {
    if (question.imgUp) question._img = result.images['v' + videoIndex + 'q' + questionIndex] || '';
  }));
  state.activeVideo = Math.max(0, Math.min(state.activeVideo, state.videos.length - 1));
  mkMarkDirty('question-move');
  renderMake();
  return true;
}

function mkQuestionDragStart(event, videoIndex, questionIndex) {
  if (!event || !event.dataTransfer) return;
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('application/x-video-quiz-question',
    JSON.stringify({ videoIndex: Number(videoIndex), questionIndex: Number(questionIndex) }));
}

function mkQuestionDragOver(event) {
  if (!event) return;
  event.preventDefault();
  if (event.currentTarget && event.currentTarget.classList) event.currentTarget.classList.add('drop-target');
}

function mkQuestionDragLeave(event) {
  if (event && event.currentTarget && event.currentTarget.classList) event.currentTarget.classList.remove('drop-target');
}

function mkQuestionDrop(event, toVi, toQi) {
  if (!event || !event.dataTransfer) return false;
  event.preventDefault();
  if (event.currentTarget && event.currentTarget.classList) event.currentTarget.classList.remove('drop-target');
  let from;
  try { from = JSON.parse(event.dataTransfer.getData('application/x-video-quiz-question')); } catch (e) { return false; }
  if (!from) return false;
  return mkMoveQuestion(from.videoIndex, from.questionIndex, Number(toVi), Number(toQi));
}

function mkQuestionBubbleKeydown(event, videoIndex, questionIndex) {
  if (!event || event.isComposing) return;
  const key = String(event.key || '');
  let moved = false;
  if (key === 'ArrowUp') {
    event.preventDefault();
    moved = event.altKey
      ? mkMoveQuestion(videoIndex, questionIndex, videoIndex - 1, 9999)
      : mkMoveQuestion(videoIndex, questionIndex, videoIndex, questionIndex - 1);
  } else if (key === 'ArrowDown') {
    event.preventDefault();
    moved = event.altKey
      ? mkMoveQuestion(videoIndex, questionIndex, videoIndex + 1, 9999)
      : mkMoveQuestion(videoIndex, questionIndex, videoIndex, questionIndex + 2);
  }
  return moved;
}
function mkSortQuestions(videoIndex) {
  mk.videos[videoIndex].questions.sort((a, b) => a.t - b.t);
  mkMarkDirty();
  renderMake();
  toast('시각 순으로 정렬했습니다');
}
function mkAddChoice(videoIndex, i) {
  const q = mk.videos[videoIndex].questions[i];
  if (q.choices.length >= 6) return;
  q.choices.push('');
  mkMarkDirty();
  renderMake();
}
function mkDelChoice(videoIndex, i, j) {
  const q = mk.videos[videoIndex].questions[i];
  if (q.choices.length <= 2) return;
  q.choices.splice(j, 1);
  if (q.answer >= q.choices.length) q.answer = q.choices.length - 1;
  else if (q.answer > j) q.answer--;
  // 복수 정답 목록도 지운 보기에 맞춰 당긴다
  q.answers = (q.answers || []).filter(x => x !== j).map(x => (x > j ? x - 1 : x));
  mkMarkDirty();
  renderMake();
}

function mkValidate() {
  if (!mk.title.trim()) return '세트 제목을 입력하세요.';
  if (!Array.isArray(mk.videos) || !mk.videos.length) return '영상을 최소 1개 이상 추가하세요.';
  for (let videoIndex = 0; videoIndex < mk.videos.length; videoIndex++) {
    const video = mk.videos[videoIndex], prefix = '영상 ' + (videoIndex + 1) + ': ';
    if (!video.videoId) return prefix + '유튜브 주소를 올바르게 입력하세요.';
    if (!video.questions.length) return prefix + '문항을 최소 1개 이상 추가하세요.';
    const duration = Number(video.durationSec);
    const coreErrors = PlaylistCore.validateVideo(video,
      Number.isFinite(duration) && duration > 0 ? duration : undefined);
    if (coreErrors.length) {
      const start = Math.max(0, Number(video.startSec) || 0);
      const end = video.endSec == null ? (Number.isFinite(duration) && duration > 0 ? duration : Infinity) : Number(video.endSec);
      if (Number.isFinite(end) && end <= start) return prefix + '종료 시각은 시작 시각보다 뒤여야 합니다.';
      if (Number.isFinite(duration) && duration > 0 && end > duration) return prefix + '종료 시각이 영상 길이를 넘습니다.';
      const outside = video.questions.findIndex(q => Number(q.t) < start || (Number.isFinite(end) && Number(q.t) > end));
      if (outside >= 0) return prefix + (outside + 1) + '번 문항이 재생 구간 밖에 있습니다.';
      return prefix + coreErrors[0];
    }
    for (let i = 0; i < video.questions.length; i++) {
      const q = video.questions[i], n = i + 1, type = qType(q);
      if (!String(q.text || '').trim()) return prefix + n + '번 문항의 질문이 비어 있습니다.';
      if (type === 'long') continue;
      if (type === 'short') {
        if (!(q.accept || []).length) return prefix + n + '번 문항(단답형)에 정답으로 인정할 표현을 한 개 이상 적으세요.';
        continue;
      }
      const filled = (q.choices || []).filter(c => String(c).trim() !== '');
      if (filled.length < 2) return prefix + n + '번 문항의 보기를 ' + (type === 'ox' ? 'O·X 두 개 모두' : '2개 이상') + ' 채우세요.';
      if (type === 'multi') {
        const picked = (q.answers || []).filter(j => String(q.choices[j] || '').trim() !== '');
        if (!picked.length) return prefix + n + '번 문항(복수 정답)의 정답을 하나 이상 체크하세요.';
        if (picked.length === filled.length) return prefix + n + '번 문항(복수 정답)은 보기 전부가 정답입니다. 확인해 주세요.';
      } else if (!String(q.choices[q.answer] || '').trim()) {
        return prefix + n + '번 문항의 정답으로 지정된 보기가 비어 있습니다.';
      }
    }
  }
  return null;
}

function mkPayload() {
  const images = {};
  const ordered = PlaylistCore.normalizeVideos(mk).map((video, videoIndex) => {
    const orderedQuestions = video.questions.slice().sort((a, b) => a.t - b.t);
    const questions = orderedQuestions.map((q, questionIndex) => {
      const type = qType(q);
      const o = { type: type, t: Math.max(0, Number(q.t) || 0), text: q.text.trim() };

      if (type === 'short') {
        o.accept = (q.accept || []).map(s => String(s).trim().slice(0, 100)).filter(Boolean).slice(0, 20);
        o.choices = [];
        o.answer = 0;
      } else if (type === 'long') {
        o.choices = [];
        o.answer = 0;
      } else if (type === 'ox') {
        const cur = (q.choices || []).map(c => String(c).trim()).filter(Boolean);
        o.choices = (cur.length >= 2) ? cur.slice(0, 2) : OX_CHOICES.slice();
        o.answer = Math.min(1, Math.max(0, Number(q.answer) || 0));
      } else {
        // 빈 보기는 빼고, 정답 위치를 그에 맞게 다시 계산한다
        const keep = [], remap = {};
        (q.choices || []).forEach((c, j) => {
          if (String(c).trim() === '') return;
          remap[j] = keep.length;
          keep.push(String(c).trim());
        });
        o.choices = keep;
        o.answer = (remap[q.answer] !== undefined) ? remap[q.answer] : 0;
        if (type === 'multi') {
          o.answers = (q.answers || []).map(j => remap[j]).filter(x => x !== undefined).sort((a, b) => a - b);
        }
      }

      if (q.imgUp && q._img) {
        o.imgUp = true;
        images['v' + videoIndex + 'q' + questionIndex] = q._img;
      } else if (q.imgUrl) o.imgUrl = q.imgUrl;
      if (q.explain && q.explain.trim()) o.explain = q.explain.trim();
      if (q.explainImgUp && q._explainImg) {
        o.explainImgUp = true;
        images['v' + videoIndex + 'q' + questionIndex + 'e'] = q._explainImg;
      } else if (q.explainImgUrl) o.explainImgUrl = q.explainImgUrl;
      if (q.limitSec !== null && q.limitSec !== undefined && !isNaN(q.limitSec)) o.limitSec = Math.max(0, Number(q.limitSec));
      return o;
    });
    return {
      videoId: video.videoId,
      videoUrl: String(video.videoUrl || '').trim(),
      startSec: Math.max(0, Number(video.startSec) || 0),
      endSec: (video.endSec === null || video.endSec === undefined || video.endSec === '')
        ? null : Math.max(0, Number(video.endSec) || 0),
      questions: questions
    };
  });

  const out = {
    title: mk.title.trim(),
    author: (mk.author || '').trim(),
    settings: normSettings(mk.settings),
    videos: ordered,
    createdAt: mk.createdAt || SV_TS,
    updatedAt: SV_TS
  };
  if (mk.archived) out.archived = true;   // 숨김 상태는 편집해도 유지한다
  return { set: out, images: images, ordered: ordered };
}

function mkHandlePermissionLoss(error) {
  const state = mk;
  if (!state) return;
  const exportNow = typeof confirm === 'function' && confirm('권한이 변경되어 저장하지 못했습니다. 현재 편집 내용을 JSON 파일로 내보낼까요?');
  if (exportNow) {
    try {
      const built = mkPayload();
      if (typeof downloadBlob === 'function') downloadBlob(safeFileName((built.set && built.set.title) || '영상퀴즈') + '.복구.json', new Blob([JSON.stringify({ set: built.set, images: built.images }, null, 1)], { type: 'application/json;charset=utf-8' }));
    } catch (e) { console.error(e); }
  }
  if (typeof mkClearDraft === 'function') mkClearDraft(state.id);
  state.readOnly = true;
  if (typeof toast === 'function') toast('권한이 없어 편집을 종료했습니다. 서버의 최신 내용은 변경되지 않았습니다.');
  if (typeof go === 'function') go('sets');
}

function mkSave(forceNew, options) {
  const state = mk;
  if (!state) return;
  const ownerState = teacherState;
  const ownerIdentityMismatch = state.id && state.ownerUid && state.ownerUid !== ownerState.uid && !store.canEditQuizSet;
  if (state.readOnly || !AuthCore.isTeacher(ownerState) ||
      (!state.id && !state.ownerUid) ||
      (state.id && !state.ownerUid && !store.canEditQuizSet) || ownerIdentityMismatch) {
    state.readOnly = true;
    toast('읽기 전용 세트는 원본을 저장할 수 없습니다. 사본을 만들어 주세요.');
    return;
  }
  const err = mkValidate();
  if (err) { toast(err); return; }
  const saveSequence = (Number(state.saveSequence) || 0) + 1;
  state.saveSequence = saveSequence;
  // A save request deliberately holds no payload.  The one in-flight worker
  // builds it only after every older permission check/write has settled, so an
  // old Ctrl+S cannot make its stale payload the final Firestore write.
  state.saveRequested = {
    sequence: saveSequence,
    forceNew: !!forceNew,
    view: options && options.view || null
  };
  mkSetSaveStatus('saving');
  if (state.saveRunning) return state.saveQueue;

  const canWriteNow = () => {
    const currentOwner = teacherState;
    const routeMatches = !state.routeToken || typeof location === 'undefined' || String(location.hash || '') === state.routeToken;
    const ownerMismatch = state.id && state.ownerUid && state.ownerUid !== (currentOwner && currentOwner.uid) && !store.canEditQuizSet;
    return mk === state && routeMatches && !state.readOnly && AuthCore.isTeacher(currentOwner) &&
      !(!state.id && !state.ownerUid) && !(state.id && !state.ownerUid && !store.canEditQuizSet) && !ownerMismatch;
  };
  const stale = request => !canWriteNow() || state.saveRequested !== request;
  const snapshotFromWrite = (data, built, activeVideo) => {
    const sourceVideos = typeof PlaylistCore !== 'undefined' && PlaylistCore.normalizeVideos
      ? PlaylistCore.normalizeVideos({ videos: data.videos || [] }) : (data.videos || []);
    const videos = Array.isArray(sourceVideos) ? sourceVideos.map((video, videoIndex) => Object.assign({}, video, {
      questions: normQuestions(video.questions).map((question, questionIndex) => {
        const q = Object.assign({}, question);
        if (q.imgUp) q._img = built.images['v' + videoIndex + 'q' + questionIndex] || '';
        if (q.explainImgUp) q._explainImg = built.images['v' + videoIndex + 'q' + questionIndex + 'e'] || '';
        return q;
      })
    })) : [];
    return {
      title: String(data.title || ''),
      author: String(data.author || ''),
      settings: JSON.parse(JSON.stringify(data.settings || {})),
      videos: videos,
      activeVideo: Math.max(0, Math.min(Number(activeVideo) || 0, Math.max(0, videos.length - 1)))
    };
  };
  const recordPersistedWrite = (request, snapshot) => {
    if (mk !== state || request.sequence < (Number(state.persistedSaveSequence) || 0)) return false;
    state.persistedSnapshot = JSON.parse(JSON.stringify(snapshot));
    state.persistedSaveSequence = request.sequence;
    return true;
  };
  const finishLatest = (request, id, draftId, isNew, built, data, savedSnapshot) => {
    if (stale(request)) return;
    const view = request.view;
    state.id = id;
    state.pendingSaveId = null;
    state.saved = true;
    state.title = savedSnapshot.title;
    state.author = savedSnapshot.author;
    state.settings = JSON.parse(JSON.stringify(savedSnapshot.settings));
    mkClearDraft(draftId);
    if (draftId !== id) mkClearDraft(id);
    // 저장 결과를 그대로 다시 읽어들여, 정렬·인덱스 재계산이 화면에도 반영되게 한다
    state.videos = JSON.parse(JSON.stringify(savedSnapshot.videos));
    state.activeVideo = savedSnapshot.activeVideo;
    Object.keys(built.images).forEach(i => { imgCache[id + '/' + i] = built.images[i]; });
    const savedRoute = '#/make/' + id;
    if (typeof location !== 'undefined' && location.hash !== savedRoute) history.replaceState(null, '', savedRoute);
    state.routeToken = savedRoute;
    if (typeof mkResetHistory === 'function') mkResetHistory();
    toast(isNew ? '세트를 저장했습니다' : '변경 사항을 저장했습니다');
    mkSetSaveStatus('saved', new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }));
    if (typeof mkShowSaveToast === 'function') mkShowSaveToast('저장 완료');
    // 새 세트도 저장 전 화면 위치와 입력 selection을 되돌린다.
    if (isNew) {
      renderMake();
      if (typeof mkRestoreEditorView === 'function') mkRestoreEditorView(view);
    } else if (typeof mkUpdateHistoryControls === 'function') mkUpdateHistoryControls();
  };
  const reportFailure = e => {
    if (!canWriteNow()) return;
    console.error(e);
    mkSetSaveStatus('failed');
    mkPersistDraft();
    if (String(e && e.code || '').indexOf('permission-denied') >= 0 || /permission-denied|권한/.test(String(e && e.message || ''))) {
      mkHandlePermissionLoss(e);
    } else {
      alert('저장 실패: ' + e.message);
    }
  };

  state.saveRunning = true;
  state.saveQueue = (async () => {
    while (mk === state) {
      const request = state.saveRequested;
      if (!request || request.sequence <= (Number(state.saveProcessedSequence) || 0)) break;
      if (!canWriteNow()) {
        state.saveProcessedSequence = request.sequence;
        break;
      }
      // The request may have waited behind another write.  Validate the
      // current model again immediately before payload creation: the editor
      // can have become invalid after Ctrl+S was queued.
      const queuedValidationError = mkValidate();
      if (queuedValidationError) {
        state.saveProcessedSequence = request.sequence;
        state.saved = false;
        mkPersistDraft();
        mkSetSaveStatus('dirty');
        toast(queuedValidationError);
        break;
      }
      const requestRevision = Number(state.editRevision) || 0;
      const requestActiveVideo = Number(state.activeVideo) || 0;
      const id = request.forceNew ? rid(8) : (state.id || state.pendingSaveId || rid(8));
      const draftId = state.id;
      const isNew = id !== state.id;
      if (isNew && !request.forceNew) state.pendingSaveId = id;
      const built = mkPayload();
      const data = built.set;
      if (isNew) data.createdAt = SV_TS;
      const nImg = Object.keys(built.images).length;
      if (nImg) toast('이미지 ' + nImg + '장과 함께 저장 중…');
      try {
        if (!isNew && state.id && store.canEditQuizSet) {
          const permitted = await store.canEditQuizSet(state.id, teacherState);
          if (!permitted) throw Object.assign(new Error('permission-denied'), { code: 'permission-denied' });
        }
        // A later Ctrl+S can arrive while permission is checked.  Skip this
        // payload before the write and rebuild the current request instead.
        if (stale(request)) {
          state.saveProcessedSequence = request.sequence;
          continue;
        }
        if (isNew || !state.id || !store.canEditQuizSet) await store.saveOwnedQuizSet(id, data, built.images, teacherState);
        else await store.saveQuizSetWithImages(state.id, data, built.images, teacherState);
      } catch (e) {
        state.saveProcessedSequence = request.sequence;
        // A queued newer request must still run after any failed write.
        if (state.saveRequested !== request) continue;
        reportFailure(e);
        break;
      }
      const savedSnapshot = snapshotFromWrite(data, built, requestActiveVideo);
      // A successful server write advances the persisted basis even when an
      // undo/redo made the local UI newer and therefore skips canonical apply.
      // The sequence guard prevents any older completion from regressing it.
      recordPersistedWrite(request, savedSnapshot);
      state.saveProcessedSequence = request.sequence;
      if (state.saveRequested !== request) continue;
      // A synchronous edit made while a write was active is a newer editor
      // revision even when it did not invoke Ctrl+S again.
      if ((Number(state.editRevision) || 0) !== requestRevision) {
        state.saved = false;
        if (typeof location !== 'undefined' && location.hash !== '#/make/' + id) history.replaceState(null, '', '#/make/' + id);
        state.routeToken = '#/make/' + id;
        mkClearDraft(draftId);
        mkPersistDraft();
        mkSetSaveStatus('dirty');
        break;
      }
      finishLatest(request, id, draftId, isNew, built, data, savedSnapshot);
      break;
    }
  })().finally(() => {
    if (mk !== state) return;
    state.saveRunning = false;
    state.saveQueue = null;
    // Requests made after the loop observed its last item start a fresh
    // worker; this keeps the per-editor queue single-flight.
    if (state.saveRequested && state.saveRequested.sequence > (Number(state.saveProcessedSequence) || 0)) mkSave(false);
  });
  return state.saveQueue;
}
function mkSaveAsNew() {
  if (!confirm('현재 내용을 새 세트로 복제 저장합니다. 원본은 그대로 남습니다. 계속할까요?')) return;
  mkSave(true);
}

/* ══════════════════════════════════════════════════════════════════════
   6. ② 교사 재생 화면
   ══════════════════════════════════════════════════════════════════════ */
let pl = null;   // 재생 화면 상태

function plLoadSelectedClassPlan(state, selection) {
  if (!selection) return Promise.resolve(true);
  const authState = teacherState;
  const authGeneration = teacherAuthVersion;
  if (selection.invalid || !AuthCore.isTeacher(authState) || !store ||
      typeof store.getOwnClassPlan !== 'function') {
    return Promise.reject(new Error('선택한 수업계획을 확인할 수 없습니다.'));
  }
  const isCurrent = () => pl === state && AuthCore.isTeacher(teacherState) &&
    teacherState.uid === authState.uid && teacherState.email === authState.email &&
    teacherAuthVersion === authGeneration;
  return Promise.resolve(store.getOwnClassPlan(selection.planId, {
    uid: authState.uid, email: authState.email
  })).then(plan => {
    if (!isCurrent()) return false;
    if (!plan || plan.planId !== selection.planId || plan.revision !== selection.revision ||
        plan.status !== 'planned' || plan.setId !== state.setId ||
        plan.ownerUid !== authState.uid || plan.ownerEmailCanonical !== String(authState.email).toLowerCase()) {
      throw new Error('선택한 수업계획이 변경되었거나 현재 교사의 계획이 아닙니다.');
    }
    state.selectedClassPlan = { ...plan };
    state.classPlanId = plan.planId;
    state.classPlanRevision = plan.revision;
    state.classPlanPersisted = true;
    return true;
  });
}

    setId: setId, set: null,
    videos: [], flatQuestions: [], videoIndex: 0,
    playlistDone: false, transitionUntil: 0, playbackEnded: false,
    loadGeneration: 0, activePlaybackGeneration: 0, expectedVideoId: '',
    sessionId: null, code: null, snapshotVersion: undefined,
    player: null, lastT: 0, fired: [], dueQuestions: [], quizTrigger: null,
    quizTimerGeneration: 0,
    live: { q: -1, openedAt: 0, revealed: false, limitSec: 0 },
    liveGeneration: 0,
    pendingLiveQuestion: -1,
    closeFlight: null,
    closeError: '',
    students: {}, responses: {},
    liveRef: null,
    isStageFullscreen: false,
    stageFallback: false,
    qrOpen: false,
    qrPosition: null,
    qrDrag: null,
    previousVolume: 100,
    ytCancels: [],
    routeClassPlan: routeClassPlan || null
  };

  const fullscreenChange = () => { if (pl === state) plHandleFullscreenChange(); };

  const applyLayout = () => {
    if (pl !== state) return;
    if (typeof plApplyStageLayout === 'function') plApplyStageLayout();
    plClampQrBubble();
  };
  document.addEventListener('fullscreenchange', fullscreenChange);
  document.addEventListener('keydown', stageKeydown);
  window.addEventListener('resize', applyLayout);
  window.addEventListener('orientationchange', applyLayout);
  onCleanup(() => {
    document.removeEventListener('fullscreenchange', fullscreenChange);
    document.removeEventListener('keydown', stageKeydown);
    window.removeEventListener('resize', applyLayout);
    window.removeEventListener('orientationchange', applyLayout);
    (state.ytCancels || []).forEach(cancel => { try { cancel(); } catch (e) {} });
    state.ytCancels = [];
    try { state.player && state.player.destroy(); } catch (e) {}
    state.player = null;
    if (pl !== state) return;
    plCleanupStageFullscreen();
    const ov = document.getElementById('overlay');

    const bo = document.getElementById('board-overlay');
    if (bo) bo.remove();
    const transition = document.getElementById('pl-transition');
    if (transition && transition.remove) transition.remove();
    const completion = document.getElementById('pl-completion');
    if (completion && completion.remove) completion.remove();
    const stage = document.getElementById('pl-stage');
    if (stage) {
      stage.classList.remove('quiz-open');
      stage.classList.remove('rank-open');
    }
    if (pl === state) pl = null;
  });

  APP().innerHTML = topbar() + '<div class="wrap"><div class="empty">퀴즈 세트를 불러오는 중…</div></div>';

  store.getQuizSet(setId).then(async savedSet => {
    if (pl !== state) return;
    const set = normSet(savedSet);
    const flatQuestions = set ? PlaylistCore.flattenQuestions(set.videos) : [];
    if (!set || !flatQuestions.length) {
      APP().innerHTML = topbar() + '<div class="wrap"><div class="card"><div class="empty">' +
        '세트를 찾을 수 없거나 문항이 없습니다.<br>링크가 정확한지 확인해 주세요.<br><br>' +
        '<a class="btn" href="#/make">새 세트 만들기</a></div></div></div>';
      return;
    }
    state.set = set;
    state.videos = set.videos;
    state.flatQuestions = flatQuestions;
    state.videoIndex = 0;
    state.playlistDone = false;
    state.transitionUntil = 0;
    state.playbackEnded = false;
    state.lastT = Math.max(0, Number(set.videos[0].startSec) || 0) - 0.6;
    state.fired = flatQuestions.map(() => false);
    state.dueQuestions = [];
    state.quizTrigger = typeof QuizTriggerCore === 'object' && QuizTriggerCore.create
      ? QuizTriggerCore.create(flatQuestions) : null;
    if (state.routeClassPlan) {
      const selected = await plLoadSelectedClassPlan(state, state.routeClassPlan);
      if (!selected || pl !== state) return;
    }
    renderPlayIntro();
    if (state.routeClassPlan && state.routeClassPlan.mode === 'edit') plOpenClassPlanDialog();
    if (state.routeClassPlan && state.routeClassPlan.mode === 'start') plStartSession();
  }).catch(e => {
    if (pl !== state) return;
    console.error(e);
    APP().innerHTML = topbar() + '<div class="wrap"><div class="card"><div class="empty">불러오기 실패: ' + esc(e.message) + '</div></div></div>';
  });
}

function plOpenClassPlanDialog() {
  const state = pl;
  if (!state || !AuthCore.isTeacher(teacherState)) return false;
  const dialog = $('#pl-plan-dialog');
  const startInput = $('#pl-plan-start');
  const endInput = $('#pl-plan-end');
  if (!dialog || !startInput || !endInput) return false;
  const now = store && typeof store.serverNow === 'function' ? store.serverNow() : serverNow();
  const localValue = millis => {
    const date = new Date(millis);
    return new Date(millis - date.getTimezoneOffset() * 60_000).toISOString().slice(0, 16);
  };
  const selected = state.selectedClassPlan;
  const classInput = $('#pl-plan-class-name');
  if (selected && selected.status === 'planned') {
    if (classInput) classInput.value = selected.className;
    startInput.value = localValue(selected.plannedStartAt);
    endInput.value = localValue(selected.plannedEndAt);
    const expectedInput = $('#pl-plan-expected');
    if (expectedInput) expectedInput.value = String(selected.expectedStudents);
  } else {
    if (!startInput.value) startInput.value = localValue(now);
    if (!endInput.value) endInput.value = localValue(now + 50 * 60_000);
  }
  const warning = $('#pl-plan-warning');
  if (warning && !state.pendingClassPlanReview) {
    warning.textContent = '[현황 확인]을 눌러 겹치는 수업을 확인해 주세요.';
  }
  if (typeof dialog.showModal === 'function') dialog.showModal();
  else dialog.open = true;
  return true;
}

async function plReviewClassPlan() {
  const state = pl;
  const authState = teacherState;
  const authGeneration = typeof teacherAuthVersion === 'number' ? teacherAuthVersion : null;
  if (!state || !AuthCore.isTeacher(authState)) return false;
  const sameContext = () => pl === state && AuthCore.isTeacher(teacherState) &&
    teacherState.uid === authState.uid && teacherState.email === authState.email &&
    (authGeneration === null || teacherAuthVersion === authGeneration);
  const classInput = $('#pl-plan-class-name');
  const startInput = $('#pl-plan-start');
  const endInput = $('#pl-plan-end');
  const expectedInput = $('#pl-plan-expected');
  const warning = $('#pl-plan-warning');
  if (!classInput || !startInput || !endInput || !expectedInput || !warning) return false;
  try {
    const now = store && typeof store.serverNow === 'function' ? store.serverNow() : serverNow();
    const selected = state.selectedClassPlan;
    if (selected && (selected.status !== 'planned' || selected.setId !== state.setId ||
        selected.ownerUid !== authState.uid ||
        selected.ownerEmailCanonical !== String(authState.email).toLowerCase())) {
      throw new Error('선택한 수업계획이 현재 교사의 planned 계획과 일치하지 않습니다.');
    }
    const planId = selected && selected.planId || state.classPlanId ||
      state.pendingClassPlanReview && state.pendingClassPlanReview.privatePlan.planId || rid(20);
    const normalizedPlan = {
      ...ClassPlanningCore.normalizePlan({
        className: classInput.value,
        plannedStartAt: new Date(startInput.value).getTime(),
        plannedEndAt: new Date(endInput.value).getTime(),
        expectedStudents: Number(expectedInput.value)
      }, {
        uid: authState.uid,
        email: authState.email,
        displayName: authState.displayName || authState.name ||
          (typeof teacherUser === 'object' && teacherUser && teacherUser.displayName) ||
          authState.email
      }, { id: state.setId, title: state.set.title }, now),
      planId
    };
    const privatePlan = selected ? {
      ...normalizedPlan,
      planId: selected.planId,
      revision: selected.revision,
      createdAtMs: selected.createdAtMs
    } : normalizedPlan;
    if (privatePlan.plannedStartAt < now - 5 * 60_000) {
      throw new Error('시작 시각은 현재 시각에 가깝거나 미래여야 합니다.');
    }
    let summary;
    let unavailable = false;
    try {
      const plans = await store.listPublicPlans(
        privatePlan.plannedStartAt - 24 * 60 * 60_000,
        privatePlan.plannedEndAt,
        100
      );
      if (!sameContext()) return false;
      const thresholds = typeof store.getClassPlanningThresholds === 'function'
        ? await store.getClassPlanningThresholds()
        : ClassPlanningCore.DEFAULT_THRESHOLDS;
      if (!sameContext()) return false;
      classPlanningThresholds = ClassPlanningCore.normalizeThresholds(thresholds);
      summary = ClassPlanningCore.summarizeWindow(
        Object.values(plans || {}), privatePlan, classPlanningThresholds
      );
      const levelLabel = summary.level === 'crowded' ? '빨강' :
        summary.level === 'caution' ? '노랑' : '초록';
      warning.textContent = levelLabel + ' · 겹치는 수업 ' + summary.overlappingClasses +
        '개 · 예상 동시 참여 ' + summary.expectedConcurrentStudents + '명 · 수업은 진행할 수 있습니다.';
    } catch (queryError) {
      if (!sameContext()) return false;
      unavailable = true;
      summary = {
        overlappingClasses: 0,
        expectedConcurrentStudents: privatePlan.expectedStudents,
        level: 'caution',
        canProceed: true
      };
      warning.textContent = '현황 확인 불가 — 수업은 진행할 수 있습니다';
    }
    warning.className = summary.level === 'green' ? 'notice info' : 'notice';
    state.pendingClassPlanReview = {
      privatePlan: { ...privatePlan, warningLevel: summary.level },
      summary,
      unavailable,
      authGeneration
    };
    const acknowledgment = $('#pl-plan-ack');
    if (acknowledgment) acknowledgment.checked = false;
    return true;
  } catch (error) {
    if (sameContext()) alert(error && error.message ? error.message : String(error));
    return false;
  }
}

async function plConfirmClassPlan(event) {
  if (event && typeof event.preventDefault === 'function') event.preventDefault();
  const state = pl;
  const review = state && state.pendingClassPlanReview;
  const acknowledgment = $('#pl-plan-ack');
  if (!state || !review) {
    alert('먼저 현황 확인을 눌러 수업계획을 검토해 주세요.');
    return false;
  }
  if (!acknowledgment || acknowledgment.checked !== true) {
    alert('경고 확인 후 진행에 체크해 주세요.');
    return false;
  }
  const classInput = $('#pl-plan-class-name');
  const startInput = $('#pl-plan-start');
  const endInput = $('#pl-plan-end');
  const expectedInput = $('#pl-plan-expected');
  if (!classInput || !startInput || !endInput || !expectedInput ||
      classInput.value.trim() !== review.privatePlan.className ||
      new Date(startInput.value).getTime() !== review.privatePlan.plannedStartAt ||
      new Date(endInput.value).getTime() !== review.privatePlan.plannedEndAt ||
      Number(expectedInput.value) !== review.privatePlan.expectedStudents) {
    alert('입력값이 바뀌었습니다. 현황 확인을 다시 눌러 주세요.');
    return false;
  }
  if (!AuthCore.isTeacher(teacherState) ||
      teacherState.uid !== review.privatePlan.ownerUid ||
      teacherState.email.toLowerCase() !== review.privatePlan.ownerEmailCanonical ||
      (review.authGeneration !== null && typeof teacherAuthVersion === 'number' &&
        teacherAuthVersion !== review.authGeneration)) return false;
  const acknowledgedAt = store && typeof store.serverNow === 'function'
    ? store.serverNow() : serverNow();
  const selected = state.selectedClassPlan;
  if (selected) {
    if (!store || typeof store.updateOwnClassPlan !== 'function' ||
        selected.planId !== review.privatePlan.planId || selected.revision !== review.privatePlan.revision ||
        selected.status !== 'planned') {
      alert('선택한 수업계획이 변경되었습니다. 현황판에서 다시 선택해 주세요.');
      return false;
    }
    const updates = {
      className: review.privatePlan.className,
      plannedStartAt: review.privatePlan.plannedStartAt,
      plannedEndAt: review.privatePlan.plannedEndAt,
      expectedStudents: review.privatePlan.expectedStudents,
      warningLevel: review.privatePlan.warningLevel,
      warningAcknowledgedAt: acknowledgedAt
    };
    try {
      const updated = await store.updateOwnClassPlan(selected.planId, selected.revision, updates);
      if (pl !== state || !AuthCore.isTeacher(teacherState) ||
          teacherState.uid !== selected.ownerUid ||
          teacherState.email.toLowerCase() !== selected.ownerEmailCanonical ||
          (review.authGeneration !== null && teacherAuthVersion !== review.authGeneration) ||
          !updated || updated.planId !== selected.planId || updated.setId !== state.setId ||
          updated.status !== 'planned' || updated.revision !== selected.revision + 1 ||
          updated.ownerUid !== selected.ownerUid ||
          updated.ownerEmailCanonical !== selected.ownerEmailCanonical) {
        throw new Error('수업계획이 변경되었거나 현재 교사의 계획이 아닙니다.');
      }
      state.selectedClassPlan = { ...updated };
      state.classPlanId = updated.planId;
      state.classPlanRevision = updated.revision;
      state.classPlanPersisted = true;
      state.reviewedClassPlan = { privatePlan: { ...updated }, publicPlan: null };
      lsSet('vq_last_label', updated.className);
      const selectedDialog = $('#pl-plan-dialog');
      if (selectedDialog && typeof selectedDialog.close === 'function') selectedDialog.close();
      if (typeof toast === 'function') toast('수업계획을 수정했습니다.');
      return true;
    } catch (error) {
      if (pl === state) alert('수업계획 수정 실패: ' + (error && error.message ? error.message : String(error)));
      return false;
    }
  }
  const privatePlan = {
    ...review.privatePlan,
    warningAcknowledgedAt: acknowledgedAt,
    updatedAtMs: acknowledgedAt
  };
  const publicPlan = {
    ...ClassPlanningCore.publicProjection(privatePlan),
    planId: privatePlan.planId,
    revision: privatePlan.revision
  };
  state.reviewedClassPlan = { privatePlan, publicPlan };
  state.classPlanId = privatePlan.planId;
  lsSet('vq_last_label', privatePlan.className);
  const dialog = $('#pl-plan-dialog');
  if (dialog && typeof dialog.close === 'function') dialog.close();
  await plStartSession();
  return true;
}

/** 새 세션(반) 생성 — 반 코드가 겹치지 않을 때까지 재시도 */
function plStartSessionHeartbeat(state, owner, authGeneration, allocationToken) {
  if (!store.renewSessionActivationLease) return null;
  if (typeof state.stopActivationHeartbeat === 'function') {
    state.stopActivationHeartbeat();
  }
  let timerId = null;
  let inFlight = false;
  let stopped = false;
  const isCurrent = () => pl === state && AuthCore.isTeacher(teacherState) &&
    teacherState.uid === owner.uid && teacherState.email === owner.email &&
    (authGeneration === null || teacherAuthVersion === authGeneration);
  const stop = () => {
    if (stopped) return;
    stopped = true;
    if (timerId !== null) clearTimeout(timerId);
    timerId = null;
    state.activationHeartbeatId = null;
    if (state.stopActivationHeartbeat === stop) state.stopActivationHeartbeat = null;
  };
  const schedule = () => {
    if (stopped || !isCurrent()) {
      stop();
      return false;
    }
    timerId = setTimeout(heartbeat, SESSION_HEARTBEAT_MS);
    state.activationHeartbeatId = timerId;
    return true;
  };
  const heartbeat = async () => {
    if (stopped || !isCurrent()) {
      stop();
      return false;
    }
    if (inFlight) return false;
    inFlight = true;
    try {
      const renewed = await store.renewSessionActivationLease(
        state.sessionId, state.code, owner.uid, allocationToken
      );
      if (!isCurrent()) {
        stop();
        return false;
      }
      if (renewed !== true) throw new Error('세션 heartbeat identity가 일치하지 않습니다.');
      state.heartbeatError = '';
      schedule();
      return true;
    } catch (error) {
      if (!isCurrent()) {
        stop();
        return false;
      }
      state.heartbeatError = error && error.message ? error.message : String(error);
      toast('학생 접속 유지에 실패했습니다. ' + Math.round(SESSION_ACTIVATION_LEASE_MS / 1000) +
        '초 안에 접속이 닫힙니다: ' + state.heartbeatError);
      schedule();
      return false;
    } finally {
      inFlight = false;
    }
  };
  state.stopActivationHeartbeat = stop;
  onCleanup(stop);
  schedule();
  return stop;
}

function plSessionStartErrorMessage(error) {
  const code = String(error && error.code || '').toLowerCase();
  const message = String(error && error.message || error || '알 수 없는 오류');
  if (code.includes('resource-exhausted') || /quota exceeded/i.test(message)) {
    return 'Firestore 무료 사용량을 모두 사용했습니다. 무료 한도는 자동으로 초기화됩니다. ' +
      '열려 있는 오래된 진행 화면을 닫고, 잠시 후 또는 다음 날 다시 시도해 주세요.';
  }
  if (message === '사용 가능한 반 코드를 만들지 못했습니다. 다시 시도해 주세요.') {
    return '반 코드 발급에 실패했습니다. 잠시 후 다시 시도해 주세요.';
  }
  return '반 시작 실패: ' + message;
}

function plStartSession() {
  const state = pl;
  if (!state || state.startingSession) return Promise.resolve();
  const authState = teacherState;
  const authGeneration = typeof teacherAuthVersion === 'number' ? teacherAuthVersion : null;
  if (!AuthCore.isTeacher(authState)) return Promise.resolve(null);
  const sameOwnerGeneration = () => AuthCore.isTeacher(teacherState) &&
    teacherState.uid === authState.uid && teacherState.email === authState.email &&
    (authGeneration === null || teacherAuthVersion === authGeneration);
  const planningEnabled = store && typeof store.createClassPlan === 'function';
  if (planningEnabled && !state.classPlanPersisted && !state.reviewedClassPlan) {
    if (typeof plOpenClassPlanDialog === 'function') plOpenClassPlanDialog();
    return Promise.resolve(null);
  }
  if (planningEnabled && !state.classPlanPersisted) {
    state.startingSession = true;
    const reviewed = state.reviewedClassPlan;
    return Promise.resolve().then(() => store.createClassPlan(
      reviewed.privatePlan, reviewed.publicPlan
    )).then(created => {
      if (pl !== state || !sameOwnerGeneration()) return null;
      state.classPlanId = reviewed.privatePlan.planId;
      state.classPlanRevision = created && created.revision || reviewed.privatePlan.revision;
      state.classPlanPersisted = true;
      state.startingSession = false;
      return plStartSession();
    }).catch(error => {
      if (pl === state) {
        console.error(error);
        alert('수업계획 저장 실패: ' + (error && error.message ? error.message : String(error)));
      }
      return null;
    }).finally(() => { if (pl === state) state.startingSession = false; });
  }
  if (planningEnabled && state.classPlanAllocationActivated && !state.classPlanAttached) {
    state.startingSession = true;
    if (!pendingAllocationPatch(state.classPlanSessionId, {
      planId: state.classPlanId,
      planRevision: state.classPlanRevision,
      setId: state.setId,
      attachStatus: 'attaching'
    })) {
      state.startingSession = false;
      alert('세션 복구 정보에 수업계획 연결 상태를 저장하지 못했습니다.');
      return Promise.resolve(null);
    }
    return Promise.resolve().then(() => store.attachPlanToSession(
      state.classPlanId,
      state.classPlanSessionId,
      {
        uid: authState.uid,
        email: authState.email,
        expectedRevision: state.classPlanRevision
      }
    )).then(attached => {
      if (pl !== state || !sameOwnerGeneration()) return null;
      state.classPlanRevision = attached && attached.revision || state.classPlanRevision + 1;
      state.classPlanAttached = true;
      pendingAllocationPatch(state.classPlanSessionId, {
        planRevision: state.classPlanRevision,
        attachStatus: 'attached'
      });
      plStartSessionHeartbeat(
        state, authState, authGeneration, state.classPlanAllocationToken
      );
      renderPlayRun();
      return true;
    }).catch(error => {
      if (pl === state) {
        console.error(error);
        alert('수업계획 연결 실패: ' + (error && error.message ? error.message : String(error)));
      }
      return null;
    }).finally(() => { if (pl === state) state.startingSession = false; });
  }
  state.startingSession = true;
  const legacyLabel = $('#pl-label');
  const inputLabel = legacyLabel && typeof legacyLabel.value === 'string'
    ? legacyLabel.value.trim() : '';
  const selectedLabel = state.selectedClassPlan && typeof state.selectedClassPlan.className === 'string'
    ? state.selectedClassPlan.className.trim() : '';
  const reviewedLabel = state.reviewedClassPlan && state.reviewedClassPlan.privatePlan &&
    typeof state.reviewedClassPlan.privatePlan.className === 'string'
    ? state.reviewedClassPlan.privatePlan.className.trim() : '';
  const label = inputLabel && inputLabel.length <= 80 ? inputLabel :
    (selectedLabel && selectedLabel.length <= 80 ? selectedLabel : reviewedLabel);
  lsSet('vq_last_label', label);
  const sessionId = planningEnabled
    ? (state.classPlanSessionId || (state.classPlanSessionId = rid(12)))
    : rid(12);
  const allocationToken = planningEnabled
    ? (state.classPlanAllocationToken || (state.classPlanAllocationToken = rid(24)))
    : rid(24);
  const pendingCreatedAt = Date.now();
  if (!pendingAllocationRemember({
    sessionId, code: '', ownerUid: authState.uid, ownerEmail: authState.email,
    token: allocationToken, createdAt: pendingCreatedAt,
    recoverAfter: pendingCreatedAt + PENDING_ALLOCATION_RECOVERY_DELAY_MS,
    ...(planningEnabled ? {
      planId: state.classPlanId,
      planRevision: state.classPlanRevision,
      setId: state.setId,
      attachStatus: 'unattached'
    } : {})
  })) {
    state.startingSession = false;
    alert('세션 복구 정보를 이 브라우저에 안전하게 저장하지 못했습니다. 저장소 사용을 허용한 뒤 다시 시도해 주세요.');
    return Promise.resolve(null);
  }
  let allocatedCode = '';

  const loadSnapshot = store.getQuizSetSnapshot
    ? store.getQuizSetSnapshot(state.setId)
    : (store.getImages ? store.getImages(state.setId) : Promise.resolve({}))
      .then(snapshotImages => ({ setSnapshot: state.set, snapshotImages: snapshotImages }));
  let captured = null;
  const abortAllocated = async code => {
    try {
      if (store.abortSessionAllocation) {
        const cleaned = await store.abortSessionAllocation(
          sessionId, code, authState.uid, allocationToken
        );
        if (cleaned !== true) throw new Error('allocation identity가 일치하지 않습니다.');
      } else if (sameOwnerGeneration()) {
        await store.endSession(sessionId);
      } else {
        throw new Error('원래 교사 인증이 없어 정리를 실행할 수 없습니다.');
      }
      pendingAllocationRemove(sessionId, allocationToken);
      return true;
    } catch (cleanupError) {
      console.error(cleanupError);
      toast('할당된 반 세션 정리 실패 — 원래 교사 계정으로 다시 시도해 주세요: ' +
        (cleanupError && cleanupError.message ? cleanupError.message : String(cleanupError)));
      return false;
    }
  };
  return loadSnapshot.then(snapshot => {
    if (pl !== state || !sameOwnerGeneration()) return null;
    const setSnapshot = typeof normSet === 'function'
      ? normSet(snapshot && snapshot.setSnapshot)
      : snapshot && snapshot.setSnapshot;
    if (!setSnapshot) throw new Error('세션 스냅샷을 만들 퀴즈 세트를 찾을 수 없습니다.');
    captured = {
      setSnapshot,
      snapshotImages: snapshot && snapshot.snapshotImages || {}
    };
    return store.startSession(sessionId, {
      setId: state.setId,
      setTitle: setSnapshot.title,
      label: label,
      teacher: setSnapshot.author || '',
      teacherUid: authState.uid,
      teacherEmail: authState.email,
      createdAt: SV_TS,
      status: 'live',
      setSnapshot: setSnapshot,
      snapshotImages: captured.snapshotImages,
      allocationToken: allocationToken
    }, () => rid(6));
  }).then(async code => {
    if (!code) return;
    allocatedCode = code;
    if (!pendingAllocationPatch(sessionId, { code })) {
      await abortAllocated(code);
      throw new Error('세션 복구 정보에 반 코드를 저장하지 못했습니다.');
    }
    const stillOwner = sameOwnerGeneration();
    if (pl !== state || !stillOwner) {
      await abortAllocated(code);
      return;
    }
    const runtimeSet = captured && captured.setSnapshot;
    const runtimeVideos = runtimeSet && Array.isArray(runtimeSet.videos)
      ? runtimeSet.videos : [];
    const runtimeQuestions = typeof PlaylistCore === 'object' && PlaylistCore.flattenQuestions
      ? PlaylistCore.flattenQuestions(runtimeVideos)
      : (state.flatQuestions || []);
    const firstStart = runtimeVideos.length
      ? Math.max(0, Number(runtimeVideos[0].startSec) || 0) : 0;
    Object.assign(state, {
      set: runtimeSet,
      videos: runtimeVideos,
      flatQuestions: runtimeQuestions,
      videoIndex: 0,
      playlistDone: false,
      transitionUntil: 0,
      playbackEnded: false,
      lastT: firstStart - 0.6,
      fired: runtimeQuestions.map(() => false),
      dueQuestions: [],
      quizTrigger: typeof QuizTriggerCore === 'object' && QuizTriggerCore.create
        ? QuizTriggerCore.create(runtimeQuestions) : null,
      quizTimerGeneration: 0,
      pendingLiveQuestion: -1,
      openError: '',
      closeFlight: null,
      closeError: '',
      sessionId: sessionId,
      code: code,
      allocationToken: allocationToken,
      snapshotVersion: 1
    });
    if (typeof imgCache === 'object' && captured && captured.snapshotImages) {
      Object.entries(captured.snapshotImages).forEach(([key, data]) => {
        imgCache[sessionId + '/' + key] = data;
      });
    }
    if (store.activateSessionAllocation) {
      let activated = false;
      try {
        activated = await store.activateSessionAllocation(
          sessionId, code, authState.uid, allocationToken
        );
      } catch (activationError) {
        await abortAllocated(code);
        throw activationError;
      }
      if (activated !== true) {
        await abortAllocated(code);
        throw new Error('생성된 반 세션을 활성화하지 못했습니다.');
      }
      if (planningEnabled) state.classPlanAllocationActivated = true;
    }
    if (pl !== state || !sameOwnerGeneration()) {
      await abortAllocated(code);
      return;
    }
    if (planningEnabled && !state.classPlanAttached) {
      try {
        if (!pendingAllocationPatch(sessionId, {
          planId: state.classPlanId,
          planRevision: state.classPlanRevision,
          setId: state.setId,
          attachStatus: 'attaching'
        })) throw new Error('세션 복구 정보에 수업계획 연결 상태를 저장하지 못했습니다.');
        const attached = await store.attachPlanToSession(
          state.classPlanId,
          sessionId,
          {
            uid: authState.uid,
            email: authState.email,
            expectedRevision: state.classPlanRevision
          }
        );
        if (pl !== state || !sameOwnerGeneration()) return;
        state.classPlanRevision = attached && attached.revision || state.classPlanRevision + 1;
        state.classPlanAttached = true;
        if (!pendingAllocationPatch(sessionId, {
          planRevision: state.classPlanRevision,
          attachStatus: 'attached'
        })) throw new Error('세션 복구 정보에 수업계획 연결 완료를 저장하지 못했습니다.');
      } catch (attachError) {
        throw attachError;
      }
    }
    plStartSessionHeartbeat(state, authState, authGeneration, allocationToken);
    renderPlayRun();
  }).catch(e => {
    if (!allocatedCode) pendingAllocationRemove(sessionId, allocationToken);
    if (pl !== state) return;
    console.error(e);
    const fallbackMessage = e && e.message === '사용 가능한 반 코드를 만들지 못했습니다. 다시 시도해 주세요.'
      ? '반 코드 발급에 실패했습니다. 잠시 후 다시 시도해 주세요.'
      : '반 시작 실패: ' + (e && e.message ? e.message : String(e));
    alert(typeof plSessionStartErrorMessage === 'function'
      ? plSessionStartErrorMessage(e) : fallbackMessage);
  }).finally(() => { if (pl === state) state.startingSession = false; });
}

/** 공개가 끝난 자동 채점 문항은 학생 쓰기와 분리해 세션 소유 교사 권한으로 채점한다. */
function plGradeCurrentResponses(state, requestedQuestionIndex) {
  if (pl !== state || !state.live) return Promise.resolve([]);
  const questionIndex = requestedQuestionIndex === undefined
    ? Number(state.live.q) : Number(requestedQuestionIndex);
  const question = state.flatQuestions && state.flatQuestions[questionIndex];
  if (!question || !isAutoGraded(question)) return Promise.resolve([]);
  const responses = state.responses && state.responses[String(questionIndex)] || {};
  if (!state.gradeWrites) state.gradeWrites = {};
  const writes = [];
  Object.keys(responses).forEach(studentId => {
    const response = responses[studentId];
    if (!response || response.submitted !== true || Object.prototype.hasOwnProperty.call(response, 'ok')) return;
    const key = studentId + ':' + questionIndex + ':' + (Number(response.revision) || 0);
    if (state.gradeWrites[key]) {
      writes.push(state.gradeWrites[key]);
      return;
    }
    const ok = gradeResponse(question, response);
    const writing = Promise.resolve().then(() => {
      if (pl !== state) {
        delete state.gradeWrites[key];
        return false;
      }
      return store.gradeAnswer(
        state.sessionId, studentId, questionIndex, response.revision, ok
      ).then(graded => {
        if (graded !== true) throw new Error('현재 제출 revision을 채점하지 못했습니다.');
        const current = state.responses && state.responses[String(questionIndex)] || {};
        if (pl === state && current[studentId] === response) response.ok = ok;
        return graded;
      });
    }).catch(error => {
      delete state.gradeWrites[key];
      if (pl === state) console.error(error);
      throw error;
    });
    state.gradeWrites[key] = writing;
    writes.push(writing);
  });
  return Promise.all(writes);
}

  if (typeof plRenderTimeline === 'function') plRenderTimeline(true);

  onCleanup(store.subscribeStudents(state.sessionId, students => {
    if (pl !== state) return;
    state.students = students || {};
    plRenderStudents();
    plRenderBoardOverlay();
    plRenderStageControls();
  }, e => { if (pl === state) console.error(e); }));
  onCleanup(store.subscribeResponses(state.sessionId, responseDocs => {
    if (pl !== state) return;
    state.responseDocs = responseDocs || {};
    state.responses = FirestoreCore.responseDocsToQuestionMaps(
      state.responseDocs, state.gradeDocs || {}
    );
    if (state.live && state.live.revealed) {
      plGradeCurrentResponses(state).catch(e => { if (pl === state) console.error(e); });
    }
    plRenderQList();
    plRenderOverlayCounts();
    plRenderStudents();
    plRenderBoardOverlay();
  }, e => { if (pl === state) console.error(e); }));
  onCleanup(store.subscribeGrades(state.sessionId, gradeDocs => {
    if (pl !== state) return;
    state.gradeDocs = gradeDocs || {};
    state.responses = FirestoreCore.responseDocsToQuestionMaps(
      state.responseDocs || {}, state.gradeDocs
    );
    plRenderQList();
    plRenderOverlayCounts();
    plRenderStudents();
    plRenderBoardOverlay();
  }, e => { if (pl === state) console.error(e); }));
  onCleanup(store.subscribeLive(state.sessionId, live => {
    if (pl !== state) return;
    const nextLive = Object.assign(
      { q: -1, openedAt: 0, revealed: false, limitSec: 0 }, live || {}
    );
    const nextToken = String(nextLive.liveToken || '');
    const currentToken = String(state.live && state.live.liveToken || '');
    const identityChanged = nextToken || currentToken
      ? nextToken !== currentToken
      : Number(nextLive.openedAt) !== Number(state.live && state.live.openedAt);
    if (Number(nextLive.q) !== Number(state.live && state.live.q) ||
        identityChanged) {
      state.liveGeneration = (Number(state.liveGeneration) || 0) + 1;
      state.revealRequested = false;
      state.revealRetryAt = 0;
    }
    state.live = nextLive;
    if (state.pendingLiveQuestion === state.live.q) state.pendingLiveQuestion = -1;
    if (state.live.revealed) {
      state.revealRequested = false;
      state.revealRetryAt = 0;
    }
    if (state.live.revealed) {
      plGradeCurrentResponses(state).catch(e => { if (pl === state) console.error(e); });
    }
    plRenderOverlay();
    if (typeof plRenderTimeline === 'function') plRenderTimeline();
    plRenderStageControls();
  }, e => { if (pl === state) console.error(e); }));

  // 플레이어
  const cancelYT = whenYT(() => {
    if (pl !== state || !document.getElementById('pl-player')) return;
    state.loadGeneration++;
    state.activePlaybackGeneration = 0;

  // 타임코드 감시 루프

async function plEnterStageFullscreen() {
  const state = pl;
  const stage = document.getElementById('pl-stage');
  if (!state || !stage) return;
  try {
    if (stage.requestFullscreen) await stage.requestFullscreen();
    else throw new Error('unsupported');
    if (pl !== state) return;
    state.stageFallback = false;
  } catch (e) {
    if (pl !== state) return;
    state.stageFallback = true;
    stage.classList.add('fullscreen-fallback');
    document.body.classList.add('stage-fallback-open');
    toast('브라우저 전체화면을 사용할 수 없어 화면 확장 모드로 열었습니다');
  }
  if (pl !== state) return;
  state.isStageFullscreen = true;
  if (typeof plApplyStageLayout === 'function') plApplyStageLayout();
  plClampQrBubble();
}

async function plExitStageFullscreen() {
  const state = pl;
  try {
    if (document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen();
  } catch (e) {
    console.warn('fullscreen exit', e);
  } finally {
    if (pl === state) plResetStageFullscreenUI();
  }
}

function plResetStageFullscreenUI() {
  const stage = document.getElementById('pl-stage');
  if (stage) stage.classList.remove('fullscreen-fallback');
  document.body.classList.remove('stage-fallback-open');
  if (typeof plClearStageLayout === 'function') plClearStageLayout();
  if (pl) {
    pl.isStageFullscreen = false;
    pl.stageFallback = false;
  }
}

function plCleanupStageFullscreen() {
  const stage = document.getElementById('pl-stage');
  if (stage && document.fullscreenElement === stage && document.exitFullscreen) {
    try {
      const exiting = document.exitFullscreen();
      if (exiting && exiting.catch) exiting.catch(e => console.warn('fullscreen exit', e));
    } catch (e) {
      console.warn('fullscreen exit', e);
    }
  }
  plResetStageFullscreenUI();
}

async function plGoHomeFromStage() {
  const state = pl;
  if (!confirm('전체화면 진행 화면을 나가시겠습니까?\n수업 세션과 학생 응답은 유지됩니다.')) return;
  await plExitStageFullscreen();
  if (pl !== state) return;
}

function plHandleFullscreenChange() {
  const stage = document.getElementById('pl-stage');
  if (document.fullscreenElement === stage) {
    if (pl) pl.isStageFullscreen = true;
    if (typeof plApplyStageLayout === 'function') plApplyStageLayout();
    plClampQrBubble();
    return;
  }
  plResetStageFullscreenUI();
  plClampQrBubble();
}

function plHandleStageKeydown(event) {
  if (!event || event.key !== 'Escape' || !pl || !pl.stageFallback) return;
  event.preventDefault();
  return plExitStageFullscreen();
}

function plToggleMute() {
  if (!pl || !pl.player) return;
  try {
    if (pl.player.isMuted()) {
      pl.player.unMute();
      pl.player.setVolume(Number.isFinite(pl.previousVolume) ? pl.previousVolume : 100);
    } else {
      pl.previousVolume = pl.player.getVolume ? pl.player.getVolume() : 100;
      pl.player.mute();
    }
    plRenderStageControls();
  } catch (e) {
    console.warn('volume', e);
  }
}

function plActivateStageControls() {
  const stage = document.getElementById('pl-stage');
  if (!stage) return;
  stage.classList.add('controls-active');
  if (stage._plControlsTimer) clearTimeout(stage._plControlsTimer);
  stage._plControlsTimer = setTimeout(() => {
    stage.classList.remove('controls-active');
    stage._plControlsTimer = null;
  }, 2400);
}

function plToggleQrBubble() {
  if (!pl) return;
  pl.qrOpen = !pl.qrOpen;
  plRenderQrBubble();
}

function plRenderQrBubble() {
  if (!pl) return;
  let bubble = document.getElementById('pl-qr-bubble');
  if (!pl.qrOpen) {
    if (bubble && bubble.remove) bubble.remove();
    pl.qrDrag = null;
    return;
  }
  const count = document.getElementById('pl-qr-count');
  if (count) count.textContent = '참여 ' + Object.keys(pl.students || {}).length + '명';
  if (bubble) return;

  const stage = document.getElementById('pl-stage');
  if (!stage) return;
  const joinUrl = linkTo('join/' + pl.code);
  bubble = document.createElement('aside');
  bubble.id = 'pl-qr-bubble';
  bubble.setAttribute('role', 'dialog');
  bubble.setAttribute('aria-label', '학생 참여 QR 코드');
  bubble.innerHTML =
    '<div class="pl-qr-head">학생 참여 <button type="button" aria-label="QR 닫기" onclick="plToggleQrBubble()">×</button></div>' +
    '<div id="pl-qr-code"></div>' +
    '<strong class="mono">' + esc(pl.code) + '</strong>' +
    '<div class="pl-qr-url">' + esc(joinUrl.replace(/^https?:\/\//, '')) + '</div>' +
    '<div id="pl-qr-count">참여 ' + Object.keys(pl.students || {}).length + '명</div>';
  stage.appendChild(bubble);

  const head = bubble.querySelector('.pl-qr-head');
  if (head) {
    head.addEventListener('pointerdown', plStartQrDrag);
    head.addEventListener('pointermove', plMoveQrDrag);
    head.addEventListener('pointerup', plEndQrDrag);
    head.addEventListener('pointercancel', plEndQrDrag);
  }
  try {
    if (window.QRCode) {
      new window.QRCode(document.getElementById('pl-qr-code'), {
        text: joinUrl, width: 132, height: 132, correctLevel: window.QRCode.CorrectLevel.M
      });
    }
  } catch (e) {
    console.warn('stage qr', e);
  }
  plClampQrBubble();
}

function plStartQrDrag(event) {
  if (!pl || !event || (event.button != null && event.button !== 0)) return;
  if (event.target && event.target.closest && event.target.closest('button, a, input, select, textarea')) return;
  const bubble = document.getElementById('pl-qr-bubble');
  if (!bubble) return;
  const position = pl.qrPosition || { x: bubble.offsetLeft || 0, y: bubble.offsetTop || 0 };
  pl.qrDrag = {
    pointerId: event.pointerId,
    pointerX: event.clientX,
    pointerY: event.clientY,
    startX: position.x,
    startY: position.y
  };
  if (event.currentTarget && event.currentTarget.setPointerCapture) {
    event.currentTarget.setPointerCapture(event.pointerId);
  }
}

function plMoveQrDrag(event) {
  const drag = pl && pl.qrDrag;
  if (!drag || !event || drag.pointerId !== event.pointerId || !window.TeacherStage) return;
  const bubble = document.getElementById('pl-qr-bubble');
  const stage = document.getElementById('pl-stage');
  if (!bubble || !stage) return;
  pl.qrPosition = window.TeacherStage.clampBubblePosition(
    {
      x: drag.startX + event.clientX - drag.pointerX,
      y: drag.startY + event.clientY - drag.pointerY
    },
    { width: bubble.offsetWidth, height: bubble.offsetHeight },
    { width: stage.clientWidth, height: stage.clientHeight },
    16
  );
  bubble.style.left = pl.qrPosition.x + 'px';
  bubble.style.top = pl.qrPosition.y + 'px';
  bubble.style.right = 'auto';
}

function plEndQrDrag(event) {
  if (!pl || !pl.qrDrag || !event || pl.qrDrag.pointerId !== event.pointerId) return;
  pl.qrDrag = null;
}

function plRenderStageControls() {
  if (!pl) return;
  const mute = document.getElementById('pl-stage-mute');
  if (!mute) return;
  let muted = false;
  try { muted = !!(pl.player && pl.player.isMuted && pl.player.isMuted()); } catch (e) {}
  mute.textContent = muted ? '🔇 음소거 해제' : '🔊 음량';
  mute.title = muted ? '음소거 해제' : '음소거';
  mute.setAttribute('aria-label', mute.title);
}

function plClampQrBubble() {
  const stage = document.getElementById('pl-stage');
  const bubble = document.getElementById('pl-qr-bubble');
  if (!pl || !stage || !bubble || !window.TeacherStage) return;
  const desired = pl.qrPosition || { x: stage.clientWidth - bubble.offsetWidth - 20, y: 20 };
  pl.qrPosition = window.TeacherStage.clampBubblePosition(
    desired,
    { width: bubble.offsetWidth, height: bubble.offsetHeight },
    { width: stage.clientWidth, height: stage.clientHeight },
    16
  );
  bubble.style.left = pl.qrPosition.x + 'px';
  bubble.style.top = pl.qrPosition.y + 'px';
  bubble.style.right = 'auto';
}

function plStagePlayerGeometry(viewportWidth, viewportHeight, reservedHeight) {
  const width = Math.max(0, Number(viewportWidth) || 0);
  const height = Math.max(0, Number(viewportHeight) || 0);
  const reserved = Math.max(0, Number.isFinite(Number(reservedHeight)) ? Number(reservedHeight) : 176);
  const availableWidth = width * .92;
  const availableHeight = Math.max(0, height - reserved);
  const playerWidth = Math.min(availableWidth, availableHeight * 16 / 9);
  return { width: playerWidth, height: playerWidth * 9 / 16 };
}

function plLayoutMode(rect) {
  const width = Math.max(0, Number(rect && rect.width) || 0);
  const height = Math.max(0, Number(rect && rect.height) || 0);
  const defaultBottom = height - Math.min(height, Math.max(0,
    Number.isFinite(Number(rect && rect.safeBottom)) ? Number(rect.safeBottom) : 128
  ));
  const usableTop = Math.min(height, Math.max(0, Number(rect && rect.usableTop) || 0));
  const usableBottom = Math.min(height, Math.max(usableTop,
    Number.isFinite(Number(rect && rect.usableBottom)) ? Number(rect.usableBottom) : defaultBottom
  ));
  const usableHeight = Math.max(0, usableBottom - usableTop);
  const horizontalInset = Math.min(16, width / 2);
  const compact = width < 900 || height < 720;
  return {
    compact,
    ultraCompact: usableHeight < 176,
    safeBottom: Math.max(0, height - usableBottom),
    usableTop,
    usableBottom,
    usableHeight,
    overlayCenterY: usableTop + usableHeight / 2,
    overlayMaxWidth: Math.max(0, Math.min(920, width - horizontalInset * 2)),
    overlayMaxHeight: usableHeight,
    actionVisibleHeight: Math.min(56, usableHeight)
  };
}

function plStageUsableQuizRect(stageRect, timelineRect) {
  const stageTop = Number(stageRect && stageRect.top) || 0;
  const height = Math.max(0, Number(stageRect && stageRect.height) || 0);
  const stageBottom = stageTop + height;
  const inset = Math.min(16, height / 2);
  const timelineTop = Number(timelineRect && timelineRect.top);
  const hasTimelineTop = Number.isFinite(timelineTop) &&
    timelineTop > stageTop + inset && timelineTop <= stageBottom;
  if (!hasTimelineTop) {
    return { top: 0, bottom: height, height, hasTimelineTop: false, fallback: false };
  }
  const bottom = Math.min(stageBottom - inset, timelineTop - 12);
  if (bottom <= stageTop + inset) {
    return { top: 0, bottom: height, height, hasTimelineTop: true, fallback: true };
  }
  const top = inset;
  const localBottom = Math.max(top, bottom - stageTop);
  return { top, bottom: localBottom, height: localBottom - top, hasTimelineTop: true, fallback: false };
}

function plStageTimelineSafeBottom(stageHeight, timeline) {
  const height = Math.max(0, Number(stageHeight) || 0);
  let measuredHeight = 0;
  try {
    const rect = timeline && timeline.getBoundingClientRect ? timeline.getBoundingClientRect() : null;
    measuredHeight = Number(rect && rect.height);
  } catch (e) {}
  if (!Number.isFinite(measuredHeight) || measuredHeight <= 0 || measuredHeight > height) {
    return Math.min(height, 128);
  }
  return Math.min(height, Math.max(128, measuredHeight + 32));
}

function plApplyStageLayout() {
  const stage = document.getElementById('pl-stage');
  if (!stage || !stage.style || typeof window === 'undefined') return null;
  const rect = stage.getBoundingClientRect ? stage.getBoundingClientRect() : {};
  const width = Number(rect.width) || Number(window.innerWidth) || 0;
  const height = Number(rect.height) || Number(window.innerHeight) || 0;
  const timeline = document.getElementById('pl-quiz-timeline');
  const safeBottom = plStageTimelineSafeBottom(height, timeline);
  let timelineRect = null;
  try { timelineRect = timeline && timeline.getBoundingClientRect ? timeline.getBoundingClientRect() : null; }
  catch (e) {}
  const usable = plStageUsableQuizRect(rect, timelineRect);
  const usableTop = usable.hasTimelineTop ? usable.top : 0;
  const usableBottom = usable.hasTimelineTop ? usable.bottom : Math.max(0, height - safeBottom);
  const layout = plLayoutMode({ width, height, usableTop, usableBottom });
  const player = plStagePlayerGeometry(width, height, layout.compact ? 252 : 176);
  stage.style.setProperty('--quiz-max-w', layout.overlayMaxWidth + 'px');
  stage.style.setProperty('--quiz-max-h', layout.overlayMaxHeight + 'px');
  stage.style.setProperty('--quiz-safe-bottom', layout.safeBottom + 'px');
  stage.style.setProperty('--quiz-center-y', layout.overlayCenterY + 'px');
  stage.style.setProperty('--quiz-actions-min-h', layout.actionVisibleHeight + 'px');
  stage.style.setProperty('--pl-layout-compact', layout.compact ? '1' : '0');
  stage.style.setProperty('--pl-player-width', player.width + 'px');
  stage.style.setProperty('--pl-player-height', player.height + 'px');
  if (stage.classList && stage.classList.toggle) stage.classList.toggle('pl-layout-ultra', layout.ultraCompact);
  return layout;
}

function plClearStageLayout() {
  const stage = document.getElementById('pl-stage');
  if (!stage || !stage.style || !stage.style.removeProperty) return;
  ['--quiz-max-w', '--quiz-max-h', '--quiz-safe-bottom', '--quiz-center-y', '--quiz-actions-min-h',
    '--pl-layout-compact', '--pl-player-width', '--pl-player-height']
    .forEach(name => stage.style.removeProperty(name));
  if (stage.classList && stage.classList.remove) stage.classList.remove('pl-layout-ultra');
}

function plApplyStagePlayerGeometry() {
  if (typeof plApplyStageLayout === 'function') return plApplyStageLayout();
  const stage = document.getElementById('pl-stage');
  if (!stage || !stage.style || typeof window === 'undefined') return;
  const reservedHeight = window.innerWidth < 900 ? 252 : 176;
  const size = plStagePlayerGeometry(window.innerWidth, window.innerHeight, reservedHeight);
  stage.style.setProperty('--pl-player-width', size.width + 'px');
  stage.style.setProperty('--pl-player-height', size.height + 'px');
}

function plTimelineDomain() {
  const video = pl && pl.set && pl.set.videos && pl.set.videos[pl.videoIndex];
  if (!video) return { start: 0, end: 1 };
  const start = Math.max(0, Number(video.startSec) || 0);
  const end = plEffectiveEnd(video, pl.player);
  if (!Number.isFinite(end) || end <= start) return null;
  return { start: start, end: end };
}

function plEffectiveEnd(video, player, knownDuration) {
  let duration = Number(knownDuration);
  if (!Number.isFinite(duration) || duration <= 0) {
    try { duration = player && player.getDuration ? Number(player.getDuration()) : NaN; }
    catch (e) { duration = NaN; }
  }
  const configured = video && video.endSec !== null && video.endSec !== undefined && video.endSec !== ''
    ? Number(video.endSec) : NaN;
  if (Number.isFinite(configured) && configured > 0 && Number.isFinite(duration) && duration > 0) {
    return Math.min(configured, duration);
  }
  if (Number.isFinite(configured) && configured > 0) return configured;
  return Number.isFinite(duration) && duration > 0 ? duration : null;
}

function plUpdateTimeline(now, domain) {
  const timeline = document.getElementById('pl-quiz-timeline');
  if (!timeline || !pl) return;
  const range = domain || plTimelineDomain();
  if (!range) return;
  const current = Number(now);
  const safeNow = Number.isFinite(current) ? current : range.start;
  const progress = timeline.querySelector('.pl-timeline-progress');
  if (progress) progress.style.width = (PlaylistCore.timelineRatio(safeNow, range.start, range.end) * 100) + '%';
  const next = pl.flatQuestions.find((question) =>
    question.videoIndex === pl.videoIndex && Number(question.t) > safeNow
  );
  const label = timeline.querySelector('.pl-timeline-next');
  if (label) label.textContent = next
    ? '다음 문제 ' + (next.number || pl.flatQuestions.indexOf(next) + 1) + ' · ' +
      Math.max(0, Math.ceil(Number(next.t) - safeNow)) + '초'
    : '현재 영상의 남은 문제 없음';
}

function plRenderTimeline(force) {
  const timeline = document.getElementById('pl-quiz-timeline');
  if (!timeline || !pl) return;
  const liveQuestion = pl.live && Number.isInteger(pl.live.q) ? pl.live.q : -1;
  const domain = plTimelineDomain();
  if (!domain) {
    if (force && timeline.innerHTML) timeline.innerHTML = '';
    pl.timelineRenderKey = '';
    return false;
  }
  const markerStates = pl.flatQuestions.map((question, index) =>
    question.videoIndex === pl.videoIndex ? (pl.fired[index] ? '1' : '0') : ''
  ).join('');
  const renderKey = [pl.videoIndex, liveQuestion, domain.start, domain.end, markerStates].join(':');
  if (!force && pl.timelineRenderKey === renderKey) return true;
  pl.timelineRenderKey = renderKey;
  const now = (() => {
    try { return pl.player && pl.player.getCurrentTime ? pl.player.getCurrentTime() : domain.start; }
    catch (e) { return domain.start; }
  })();
  const markers = pl.flatQuestions.map((question, index) => ({ question, index }))
    .filter(item => item.question.videoIndex === pl.videoIndex)
    .map(item => {
      const ratio = PlaylistCore.timelineRatio(Number(item.question.t), domain.start, domain.end);
      const left = Math.round(ratio * 10000) / 100;
      const state = item.index === liveQuestion ? 'current' : (pl.fired[item.index] ? 'completed' : 'upcoming');
      const number = item.question.number || item.index + 1;
      return '<span class="pl-timeline-marker ' + state + '" style="left:' + left + '%" ' +
        'title="Question ' + number + ' · ' + fmtTime(Number(item.question.t) - domain.start) + '" ' +
        'aria-label="Question ' + number + '"></span>';
    }).join('');
  const announcement = liveQuestion >= 0
    ? '문제 ' + (pl.flatQuestions[liveQuestion].number || liveQuestion + 1) + ' 표시'
    : '영상 ' + (pl.videoIndex + 1) + ' 퀴즈 타임라인';
  timeline.innerHTML = '<div class="pl-timeline-track">' +
    '<span class="pl-timeline-rail"></span><span class="pl-timeline-progress"></span>' +
    '<div class="pl-timeline-markers">' + markers + '</div></div>' +
    '<span class="pl-timeline-next"></span>' +
    '<span class="pl-timeline-announcement" aria-live="polite">' + announcement + '</span>';
  plUpdateTimeline(now, domain);
  if (typeof plApplyStageLayout === 'function') plApplyStageLayout();
  return true;
}

function plLoadVideo(index, autoplay) {
  if (!pl || !pl.player || !pl.player.loadVideoById) return;
  const video = pl.set && pl.set.videos && pl.set.videos[index];
  if (!video) return;
  const previousVideoIndex = pl.videoIndex;
  if (pl.quizTrigger && pl.quizTrigger.resetVideo) {
    pl.quizTrigger.resetVideo(previousVideoIndex);
    pl.quizTrigger.resetVideo(index);
  }
  pl.videoIndex = index;
  pl.playlistDone = false;
  pl.transitionUntil = 0;
  pl.loadGeneration = (Number(pl.loadGeneration) || 0) + 1;
  pl.activePlaybackGeneration = 0;
  pl.expectedVideoId = video.videoId;
  pl.playerLoading = true;
  pl.playerError = null;
  pl.dueQuestions = [];
  pl.lastT = Math.max(0, Number(video.startSec) || 0) - 0.6;
  if (typeof document !== 'undefined') {
    const transition = document.getElementById('pl-transition');
    if (transition && transition.remove) transition.remove();
    const completion = document.getElementById('pl-completion');
    if (completion && completion.remove) completion.remove();
    const error = document.getElementById('pl-player-error');
    if (error && error.remove) error.remove();
  }
  if (typeof plRenderTimeline === 'function') plRenderTimeline(true);
  pl.player.loadVideoById({
    videoId: video.videoId,
    startSeconds: Math.max(0, Number(video.startSec) || 0)
  });
}

function plAdvanceVideo() {
  if (!pl || !pl.set || !pl.set.videos) return;
  const next = PlaylistCore.nextPlaybackState(pl.set.videos, pl.videoIndex);
  if (next.done) plCompletePlaylist();
  else plLoadVideo(next.videoIndex, true);
}

function plCompletePlaylist() {
  if (!pl || pl.playlistDone) return;
  pl.playlistDone = true;
  pl.transitionUntil = 0;
  try { if (pl.player && pl.player.pauseVideo) pl.player.pauseVideo(); } catch (e) {}
  plRenderCompletion();
}

function plReplayPlaylist() {
  if (!pl) return;
  pl.playlistDone = false;
  pl.transitionUntil = 0;
  pl.fired = pl.fired.map(() => false);
  if (pl.quizTrigger && pl.quizTrigger.reset) pl.quizTrigger.reset();
  plLoadVideo(0, true);
}

function plRenderTransition() {
  if (!pl) return;
  let box = document.getElementById('pl-transition');
  if (!box) {
    box = document.createElement('div');
    box.id = 'pl-transition';
    plStageRoot().appendChild(box);
  }
  const seconds = Math.max(0, Math.ceil((pl.transitionUntil - Date.now()) / 1000));
  const next = pl.set.videos[pl.videoIndex + 1] || {};
  box.innerHTML = '<div class="pl-playback-menu">' +
    '<h2>다음 영상으로 이동합니다</h2>' +
    '<p>' + (next.title ? esc(next.title) + '<br>' : '') + seconds + '초 후 자동으로 시작합니다.</p>' +
  '</div>';
}

function plRenderCompletion() {
  if (!pl) return;
  let box = document.getElementById('pl-completion');
  if (!box) {
    box = document.createElement('div');
    box.id = 'pl-completion';
    plStageRoot().appendChild(box);
  }
  box.innerHTML = '<div class="pl-playback-menu">' +
    '<h2>모든 영상 재생 완료</h2>' +
    '<p>' + esc(pl.set.title) + '의 플레이리스트를 모두 재생했습니다.<br>학생 응답과 순위는 그대로 유지됩니다.</p>' +
    '<div class="ov-actions">' +
      '<button class="btn" onclick="plToggleBoard()">🏆 순위 보기</button>' +
      '<a class="btn" href="#/live/' + esc(pl.sessionId) + '" target="_blank">📊 대시보드</a>' +
      '<button class="btn primary" onclick="plReplayPlaylist()">↺ 처음부터 다시 보기</button>' +
      '<button class="btn ghost" onclick="plEndSession()">진행 종료</button>' +
    '</div>' +
  '</div>';
}

function plRenderPlayerError() {
  if (!pl) return;
  let box = document.getElementById('pl-player-error');
  if (!box) {
    box = document.createElement('div');
    box.id = 'pl-player-error';
    plStageRoot().appendChild(box);
  }
  const hasNext = pl.videoIndex < pl.set.videos.length - 1;
  box.innerHTML = '<div class="pl-playback-menu">' +
    '<h2>영상을 불러오지 못했습니다</h2>' +
    '<p>네트워크 연결이나 영상 공개 상태를 확인한 뒤 다시 시도해 주세요.</p>' +
    '<div class="ov-actions">' +
      '<button class="btn primary" onclick="plRetryVideo()">다시 시도</button>' +
      (hasNext ? '<button class="btn" onclick="plAdvanceVideo()">다음 영상</button>' : '') +
      '<button class="btn ghost" onclick="plEndSession()">진행 종료</button>' +
    '</div>' +
  '</div>';
}

function plRetryVideo() {
  if (!pl) return;
  plLoadVideo(pl.videoIndex, true);
}

function plPlayerEventVideoId(event) {
  const player = event && event.target ? event.target : (pl && pl.player);
  try {
    const data = player && player.getVideoData ? player.getVideoData() : null;
    return data && (data.video_id || data.videoId) ? String(data.video_id || data.videoId) : '';
  } catch (e) { return ''; }
}

function plPlayerEventStatus(event) {
  const player = event && event.target ? event.target : (pl && pl.player);
  const status = { state: null, currentTime: null, duration: null };
  try {
    if (player && player.getPlayerState) status.state = Number(player.getPlayerState());
  } catch (e) {}
  try {
